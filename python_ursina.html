  &lt;main&gt;

    &lt;section class=&quot;card&quot; id=&quot;sec1&quot;&gt;
      &lt;div class=&quot;section-kicker&quot;&gt;01 / REVIEW&lt;/div&gt;
      &lt;h2&gt;지난 시간 복습 (#14)&lt;/h2&gt;
&lt;ul&gt;&lt;li&gt;자전 &lt;span class=&quot;mono-inline&quot;&gt;rotation_z += 1&lt;/span&gt;, 공전 &lt;span class=&quot;mono-inline&quot;&gt;cos/sin&lt;/span&gt; 궤도, 시계 바늘 동기화&lt;/li&gt;&lt;/ul&gt;
    &lt;/section&gt;
    &lt;section class=&quot;card&quot; id=&quot;sec2&quot;&gt;
      &lt;div class=&quot;section-kicker&quot;&gt;02 / GOALS&lt;/div&gt;
      &lt;h2&gt;학습 목표&lt;/h2&gt;
&lt;ul&gt;&lt;li&gt;animate_x 등으로 update 없이 위치 애니메이션 만들기&lt;/li&gt;&lt;li&gt;animate_color / animate_scale / animate_rotation_z 사용하기&lt;/li&gt;&lt;li&gt;duration, loop, delay 옵션으로 재생 다듬기&lt;/li&gt;&lt;li&gt;한 엔티티에 여러 animate를 동시에 걸기&lt;/li&gt;&lt;/ul&gt;
    &lt;/section&gt;
    &lt;section class=&quot;card&quot; id=&quot;sec3&quot;&gt;
      &lt;div class=&quot;section-kicker&quot;&gt;03 / CONCEPTS&lt;/div&gt;
      &lt;h2&gt;핵심 개념 정리&lt;/h2&gt;
&lt;h3&gt;3-1. animate_x — &#x27;어디로, 몇 초에 걸쳐&#x27;만 말하면 끝&lt;/h3&gt;
&lt;p&gt;지금까지 이동은 update에서 매 프레임 좌표를 더했습니다. &lt;span class=&quot;mono-inline&quot;&gt;animate_x(목표값, duration=초)&lt;/span&gt; 는 목표와 시간만 주면 중간 과정을 Ursina가 알아서 채워 줍니다.&lt;/p&gt;
&lt;div class=&quot;code-wrap&quot;&gt;
&lt;div class=&quot;code-top&quot;&gt;&lt;span class=&quot;dot red&quot;&gt;&lt;/span&gt;&lt;span class=&quot;dot white&quot;&gt;&lt;/span&gt;&lt;span class=&quot;fname&quot;&gt;animate_x.py&lt;/span&gt;&lt;/div&gt;
&lt;pre&gt;&lt;code class=&quot;language-python&quot;&gt;e1 = Entity(model=&amp;quot;quad&amp;quot;, position=(-4, 2))
e1.animate_x(4, duration=1, loop=True)   # 1초에 걸쳐 x=4로, 반복&lt;/code&gt;&lt;/pre&gt;
&lt;/div&gt;
&lt;blockquote&gt;💡 animate_y, animate_position((x,y,z), ...) 도 같은 방식입니다.&lt;/blockquote&gt;
&lt;h3&gt;3-2. animate_color — 색이 서서히 물들다&lt;/h3&gt;
&lt;p&gt;색상도 목표 색과 시간만 주면 부드럽게 변합니다.&lt;/p&gt;
&lt;div class=&quot;code-wrap&quot;&gt;
&lt;div class=&quot;code-top&quot;&gt;&lt;span class=&quot;dot red&quot;&gt;&lt;/span&gt;&lt;span class=&quot;dot white&quot;&gt;&lt;/span&gt;&lt;span class=&quot;fname&quot;&gt;animate_color.py&lt;/span&gt;&lt;/div&gt;
&lt;pre&gt;&lt;code class=&quot;language-python&quot;&gt;e2 = Entity(model=&amp;quot;circle&amp;quot;, position=(-4, -2), color=color.green)
e2.animate_color(color.red, duration=1, loop=True)&lt;/code&gt;&lt;/pre&gt;
&lt;/div&gt;
&lt;h3&gt;3-3. animate_scale / animate_rotation — 크기와 회전&lt;/h3&gt;
&lt;p&gt;크기와 회전도 마찬가지. rotation은 축을 골라 animate_rotation_z 처럼 씁니다.&lt;/p&gt;
&lt;div class=&quot;code-wrap&quot;&gt;
&lt;div class=&quot;code-top&quot;&gt;&lt;span class=&quot;dot red&quot;&gt;&lt;/span&gt;&lt;span class=&quot;dot white&quot;&gt;&lt;/span&gt;&lt;span class=&quot;fname&quot;&gt;scale_rot.py&lt;/span&gt;&lt;/div&gt;
&lt;pre&gt;&lt;code class=&quot;language-python&quot;&gt;e3 = Entity(model=&amp;quot;cube&amp;quot;, color=color.orange)
e3.animate_scale(3, duration=2, loop=True)

e4 = Entity(model=&amp;quot;quad&amp;quot;, texture=&amp;quot;brick&amp;quot;)
e4.animate_rotation_z(45, duration=1, loop=True, delay=2)   # 2초 뒤에 시작&lt;/code&gt;&lt;/pre&gt;
&lt;/div&gt;
&lt;blockquote&gt;💡 delay는 &#x27;몇 초 기다렸다가 시작할지&#x27;입니다. 여러 엔티티의 시작 타이밍을 어긋나게 연출할 때 좋아요.&lt;/blockquote&gt;
&lt;h3&gt;3-4. 동시에 여러 개 걸기&lt;/h3&gt;
&lt;p&gt;한 엔티티에 서로 다른 속성의 animate를 동시에 걸면 함께 재생됩니다 — 커지면서 색이 변하는 식으로.&lt;/p&gt;
&lt;div class=&quot;code-wrap&quot;&gt;
&lt;div class=&quot;code-top&quot;&gt;&lt;span class=&quot;dot red&quot;&gt;&lt;/span&gt;&lt;span class=&quot;dot white&quot;&gt;&lt;/span&gt;&lt;span class=&quot;fname&quot;&gt;combo.py&lt;/span&gt;&lt;/div&gt;
&lt;pre&gt;&lt;code class=&quot;language-python&quot;&gt;e3.animate_scale(3, duration=2, loop=True)
e3.animate_color(color.yellow, duration=2, loop=True)   # 동시에 진행!&lt;/code&gt;&lt;/pre&gt;
&lt;/div&gt;
    &lt;/section&gt;
    &lt;section class=&quot;card&quot; id=&quot;sec4&quot;&gt;
      &lt;div class=&quot;section-kicker&quot;&gt;04 / SUMMARY&lt;/div&gt;
      &lt;h2&gt;핵심 정리&lt;/h2&gt;
&lt;ul&gt;&lt;li&gt;&lt;span class=&quot;mono-inline&quot;&gt;animate_x(목표, duration=초)&lt;/span&gt; — update 없이 위치 애니메이션&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;mono-inline&quot;&gt;animate_color(색, ...)&lt;/span&gt; / &lt;span class=&quot;mono-inline&quot;&gt;animate_scale(배율, ...)&lt;/span&gt; / &lt;span class=&quot;mono-inline&quot;&gt;animate_rotation_z(각도, ...)&lt;/span&gt;&lt;/li&gt;&lt;li&gt;공통 옵션: &lt;span class=&quot;mono-inline&quot;&gt;duration&lt;/span&gt;(시간), &lt;span class=&quot;mono-inline&quot;&gt;loop&lt;/span&gt;(반복), &lt;span class=&quot;mono-inline&quot;&gt;delay&lt;/span&gt;(지연 시작)&lt;/li&gt;&lt;li&gt;서로 다른 속성의 animate는 동시에 걸 수 있음&lt;/li&gt;&lt;li&gt;매 프레임 제어가 필요하면 update, &#x27;목표까지 부드럽게&#x27;는 animate&lt;/li&gt;&lt;/ul&gt;
    &lt;/section&gt;
    &lt;section class=&quot;card&quot; id=&quot;sec5&quot;&gt;
      &lt;div class=&quot;section-kicker&quot;&gt;05 / PRACTICE — BASIC&lt;/div&gt;
      &lt;h2&gt;실습 문제 · 기본&lt;/h2&gt;
&lt;ol&gt;&lt;li&gt;quad 하나를 만들어 animate_x로 왼쪽에서 오른쪽으로 1초 동안 이동시키고 loop로 반복하세요.&lt;/li&gt;&lt;li&gt;circle 하나에 animate_color로 초록→빨강 색 변화를 걸어 보세요.&lt;/li&gt;&lt;/ol&gt;
    &lt;/section&gt;
    &lt;section class=&quot;card&quot; id=&quot;sec6&quot;&gt;
      &lt;div class=&quot;section-kicker&quot;&gt;06 / PRACTICE — ADVANCED&lt;/div&gt;
      &lt;h2&gt;실습 문제 · 심화 (힌트 포함)&lt;/h2&gt;
&lt;h3&gt;문제 3. 커지는 큐브&lt;/h3&gt;&lt;p&gt;큐브에 animate_scale(3, duration=2, loop=True)를 걸고, 동시에 색도 변하게 두 animate를 함께 걸어 보세요.&lt;/p&gt;
&lt;blockquote&gt;힌트: 같은 엔티티에 animate_scale과 animate_color를 연달아 호출하면 동시에 재생됩니다.&lt;/blockquote&gt;
&lt;h3&gt;문제 4. delay로 시차 연출&lt;/h3&gt;&lt;p&gt;네 번째 엔티티에 animate_rotation_z를 delay=2로 걸어, 다른 애니메이션들이 먼저 시작하고 2초 뒤 회전이 합류하게 하세요.&lt;/p&gt;
&lt;h3&gt;문제 5. 키를 누르면 그 자리로 이동&lt;/h3&gt;&lt;p&gt;input(key)와 결합해, 스페이스를 누를 때마다 엔티티가 무작위 위치로 &#x27;부드럽게&#x27; 이동하게 만드세요.&lt;/p&gt;
&lt;blockquote&gt;힌트: e.animate_position((random.uniform(-4,4), random.uniform(-3,3), 0), duration=.5)&lt;/blockquote&gt;
&lt;h3&gt;문제 6. (종합) 4중주 무대&lt;/h3&gt;&lt;p&gt;이동·색·크기·회전 네 가지 애니메이션을 각각 다른 엔티티에 걸고, delay를 이용해 순서대로 하나씩 시작되는 오프닝 연출을 만드세요.&lt;/p&gt;
&lt;blockquote&gt;힌트: delay=0, 1, 2, 3 처럼 1초 간격으로 지연을 늘려 줍니다.&lt;/blockquote&gt;
    &lt;/section&gt;
    &lt;section class=&quot;card&quot; id=&quot;sec7&quot;&gt;
      &lt;div class=&quot;section-kicker&quot;&gt;07 / FULL CODE · 정답 확인&lt;/div&gt;
      &lt;h2&gt;종합 예제 코드 — animate 4종 세트&lt;/h2&gt;
&lt;p class=&quot;fullcode-notice&quot;&gt;✍️ 먼저 위 핵심 개념과 실습 문제를 참고해 스스로 코드를 작성해 보세요. 다 작성했거나 막히는 부분을 비교하고 싶을 때 아래를 눌러 전체 코드를 확인합니다.&lt;/p&gt;
&lt;details class=&quot;fullcode&quot;&gt;&lt;summary&gt;&lt;span class=&quot;lock&quot;&gt;🔒&lt;/span&gt;&lt;span&gt;전체 코드 확인하기&lt;/span&gt;&lt;span class=&quot;hint&quot;&gt;SPOILER · CLICK&lt;/span&gt;&lt;/summary&gt;
&lt;div class=&quot;fullcode-body&quot;&gt;
&lt;p&gt;영상의 최종 코드입니다. 이동·색·크기(+색 동시)·회전(지연 시작)을 모두 담았습니다.&lt;/p&gt;
&lt;div class=&quot;code-wrap&quot;&gt;
&lt;div class=&quot;code-top&quot;&gt;&lt;span class=&quot;dot red&quot;&gt;&lt;/span&gt;&lt;span class=&quot;dot white&quot;&gt;&lt;/span&gt;&lt;span class=&quot;fname&quot;&gt;main.py&lt;/span&gt;&lt;/div&gt;
&lt;pre&gt;&lt;code class=&quot;language-python&quot;&gt;from ursina import *

app = Ursina()

e1 = Entity(model=&amp;quot;quad&amp;quot;, position=(-4, 2))
e1.animate_x(4, duration=1, loop=True)

e2 = Entity(model=&amp;quot;circle&amp;quot;, position=(-4, -2), color=color.green)
e2.animate_color(color.red, duration=1, loop=True)

e3 = Entity(model=&amp;quot;cube&amp;quot;, color=color.orange)
e3.animate_scale(3, duration=2, loop=True)
e3.animate_color(color.yellow, duration=2, loop=True)   # 동시에!

e4 = Entity(model=&amp;quot;quad&amp;quot;, position=(4, -2), color=color.cyan, texture=&amp;quot;brick&amp;quot;)
e4.animate_rotation_z(45, duration=1, loop=True, delay=2)  # 2초 뒤 시작

app.run()&lt;/code&gt;&lt;/pre&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/details&gt;

&lt;div class=&quot;quiz-item&quot;&gt;

&lt;button class=&quot;quiz-toggle&quot; onclick=&quot;toggleAnswer(this)&quot;&gt;정답 보기&lt;/button&gt;

    &lt;h1&gt;Animation with Sequence Function&lt;/h1&gt;
    &lt;p class=&quot;sub&quot;&gt;대기 시간과 동작을 순서대로 이어 붙이는 Sequence로, &#x27;1초 쉬고 → 깜빡이고 → 흔들리는&#x27; 식의 시간표 애니메이션을 만드는 자율 학습 페이지입니다.&lt;/p&gt;

      &lt;p class=&quot;demo-caption&quot;&gt;숫자는 &#x27;기다림(초)&#x27;, Func는 &#x27;실행할 동작&#x27; — 순서대로 재생되는 타임라인입니다.&lt;/p&gt;

  &lt;main&gt;

    &lt;section class=&quot;card&quot; id=&quot;sec1&quot;&gt;
      &lt;div class=&quot;section-kicker&quot;&gt;01 / REVIEW&lt;/div&gt;
      &lt;h2&gt;지난 시간 복습 (#15)&lt;/h2&gt;
&lt;ul&gt;&lt;li&gt;&lt;span class=&quot;mono-inline&quot;&gt;animate_x / color / scale / rotation&lt;/span&gt; — 목표·시간만 주는 애니메이션&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;mono-inline&quot;&gt;duration / loop / delay&lt;/span&gt; 옵션&lt;/li&gt;&lt;/ul&gt;
    &lt;/section&gt;
    &lt;section class=&quot;card&quot; id=&quot;sec2&quot;&gt;
      &lt;div class=&quot;section-kicker&quot;&gt;02 / GOALS&lt;/div&gt;
      &lt;h2&gt;학습 목표&lt;/h2&gt;
&lt;ul&gt;&lt;li&gt;Sequence로 대기 시간과 동작을 타임라인처럼 이어 붙이기&lt;/li&gt;&lt;li&gt;Func로 함수를 감싸 &#x27;나중에 실행될 동작&#x27;으로 등록하기&lt;/li&gt;&lt;li&gt;blink, shake, fade_out / fade_in 같은 내장 효과 사용하기&lt;/li&gt;&lt;li&gt;start() / pause()로 시퀀스를 키보드에서 제어하기&lt;/li&gt;&lt;/ul&gt;
    &lt;/section&gt;
    &lt;section class=&quot;card&quot; id=&quot;sec3&quot;&gt;
      &lt;div class=&quot;section-kicker&quot;&gt;03 / CONCEPTS&lt;/div&gt;
      &lt;h2&gt;핵심 개념 정리&lt;/h2&gt;
&lt;h3&gt;3-1. Sequence — 시간표처럼 이어 붙이기&lt;/h3&gt;
&lt;p&gt;&lt;span class=&quot;mono-inline&quot;&gt;Sequence(...)&lt;/span&gt; 의 괄호 안에 재생할 항목을 순서대로 나열합니다. &lt;b&gt;숫자는 그만큼 기다리기(초)&lt;/b&gt;, &lt;span class=&quot;mono-inline&quot;&gt;Func(함수, 인자...)&lt;/span&gt; 는 &lt;b&gt;그 시점에 실행할 동작&lt;/b&gt;입니다.&lt;/p&gt;
&lt;div class=&quot;code-wrap&quot;&gt;
&lt;div class=&quot;code-top&quot;&gt;&lt;span class=&quot;dot red&quot;&gt;&lt;/span&gt;&lt;span class=&quot;dot white&quot;&gt;&lt;/span&gt;&lt;span class=&quot;fname&quot;&gt;sequence.py&lt;/span&gt;&lt;/div&gt;
&lt;pre&gt;&lt;code class=&quot;language-python&quot;&gt;e1 = Entity(model=&amp;quot;circle&amp;quot;)

# 1초 기다렸다가 → e1을 1초 동안 깜빡이기, 계속 반복
s1 = Sequence(1, Func(e1.blink, duration=1), loop=True)
s1.start()&lt;/code&gt;&lt;/pre&gt;
&lt;/div&gt;
&lt;blockquote&gt;💡 Func(e1.blink)처럼 괄호 없이 함수 이름을 넣습니다. Func가 &#x27;나중에 호출해 줄&#x27; 포장지 역할을 해요.&lt;/blockquote&gt;
&lt;h3&gt;3-2. 여러 동작 이어 붙이기 + 내장 효과&lt;/h3&gt;
&lt;p&gt;항목은 몇 개든 이어 붙일 수 있습니다. Ursina 엔티티에는 &lt;span class=&quot;mono-inline&quot;&gt;blink&lt;/span&gt;(깜빡), &lt;span class=&quot;mono-inline&quot;&gt;shake&lt;/span&gt;(흔들림), &lt;span class=&quot;mono-inline&quot;&gt;fade_out&lt;/span&gt;/&lt;span class=&quot;mono-inline&quot;&gt;fade_in&lt;/span&gt;(서서히 사라짐/나타남) 같은 효과가 내장되어 있어 Func와 궁합이 좋습니다.&lt;/p&gt;
&lt;div class=&quot;code-wrap&quot;&gt;
&lt;div class=&quot;code-top&quot;&gt;&lt;span class=&quot;dot red&quot;&gt;&lt;/span&gt;&lt;span class=&quot;dot white&quot;&gt;&lt;/span&gt;&lt;span class=&quot;fname&quot;&gt;chain.py&lt;/span&gt;&lt;/div&gt;
&lt;pre&gt;&lt;code class=&quot;language-python&quot;&gt;# 1초 대기 → 2초 깜빡 → 2초 흔들기, 반복
s2 = Sequence(1, Func(e2.blink, duration=2),
                 Func(e2.shake, duration=2), loop=True)

# 2초 대기 → 2초 페이드아웃 → 2초 대기 → 2초 페이드인, 반복
s3 = Sequence(2, Func(e3.fade_out, duration=2),
              2, Func(e3.fade_in,  duration=2), loop=True)&lt;/code&gt;&lt;/pre&gt;
&lt;/div&gt;
&lt;h3&gt;3-3. start / pause — 재생 제어&lt;/h3&gt;
&lt;p&gt;Sequence는 만들어 두기만 하면 재생되지 않습니다. start()로 시작하고, pause()로 일시정지할 수 있습니다.&lt;/p&gt;
&lt;div class=&quot;code-wrap&quot;&gt;
&lt;div class=&quot;code-top&quot;&gt;&lt;span class=&quot;dot red&quot;&gt;&lt;/span&gt;&lt;span class=&quot;dot white&quot;&gt;&lt;/span&gt;&lt;span class=&quot;fname&quot;&gt;control.py&lt;/span&gt;&lt;/div&gt;
&lt;pre&gt;&lt;code class=&quot;language-python&quot;&gt;s1.start()   # 재생 시작
# s1.pause() # 일시정지&lt;/code&gt;&lt;/pre&gt;
&lt;/div&gt;
&lt;h3&gt;3-4. 키보드로 여러 시퀀스 제어 — 딕셔너리 매핑&lt;/h3&gt;
&lt;p&gt;키 이름을 딕셔너리의 키로, 실행할 메서드를 값으로 짝지어 두면 if문을 줄줄이 쓰지 않아도 됩니다.&lt;/p&gt;
&lt;div class=&quot;code-wrap&quot;&gt;
&lt;div class=&quot;code-top&quot;&gt;&lt;span class=&quot;dot red&quot;&gt;&lt;/span&gt;&lt;span class=&quot;dot white&quot;&gt;&lt;/span&gt;&lt;span class=&quot;fname&quot;&gt;key_control.py&lt;/span&gt;&lt;/div&gt;
&lt;pre&gt;&lt;code class=&quot;language-python&quot;&gt;def input(key):
    actions = {&amp;quot;1&amp;quot;: s1.start, &amp;quot;2&amp;quot;: s1.pause,
               &amp;quot;3&amp;quot;: s2.start, &amp;quot;4&amp;quot;: s2.pause}
    if key in actions:
        actions[key]()   # 해당 키에 짝지어진 메서드 실행&lt;/code&gt;&lt;/pre&gt;
&lt;/div&gt;
&lt;blockquote&gt;💡 딕셔너리 값에도 s1.start 처럼 괄호 없이 넣고, 실행할 때 ()를 붙입니다 — on_click과 같은 원리!&lt;/blockquote&gt;
    &lt;/section&gt;
    &lt;section class=&quot;card&quot; id=&quot;sec4&quot;&gt;
      &lt;div class=&quot;section-kicker&quot;&gt;04 / SUMMARY&lt;/div&gt;
      &lt;h2&gt;핵심 정리&lt;/h2&gt;
&lt;ul&gt;&lt;li&gt;&lt;span class=&quot;mono-inline&quot;&gt;Sequence(1, Func(동작), 2, Func(동작), loop=True)&lt;/span&gt; — 숫자는 대기, Func는 동작&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;mono-inline&quot;&gt;Func(함수, 인자)&lt;/span&gt; — 함수를 &#x27;나중에 실행할 항목&#x27;으로 포장&lt;/li&gt;&lt;li&gt;내장 효과: &lt;span class=&quot;mono-inline&quot;&gt;blink&lt;/span&gt;, &lt;span class=&quot;mono-inline&quot;&gt;shake&lt;/span&gt;, &lt;span class=&quot;mono-inline&quot;&gt;fade_out&lt;/span&gt;, &lt;span class=&quot;mono-inline&quot;&gt;fade_in&lt;/span&gt; (duration 지정 가능)&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;mono-inline&quot;&gt;s.start()&lt;/span&gt; / &lt;span class=&quot;mono-inline&quot;&gt;s.pause()&lt;/span&gt; 로 재생 제어&lt;/li&gt;&lt;li&gt;키 → 메서드 딕셔너리 매핑으로 깔끔한 키보드 제어&lt;/li&gt;&lt;/ul&gt;
    &lt;/section&gt;
    &lt;section class=&quot;card&quot; id=&quot;sec5&quot;&gt;
      &lt;div class=&quot;section-kicker&quot;&gt;05 / PRACTICE — BASIC&lt;/div&gt;
      &lt;h2&gt;실습 문제 · 기본&lt;/h2&gt;
&lt;ol&gt;&lt;li&gt;원 엔티티 하나를 만들고, 1초 기다렸다가 1초간 깜빡이는 Sequence를 만들어 반복 재생하세요.&lt;/li&gt;&lt;li&gt;두 번째 엔티티에 &#x27;깜빡 → 흔들기&#x27;가 이어지는 Sequence를 추가하세요.&lt;/li&gt;&lt;/ol&gt;
    &lt;/section&gt;
    &lt;section class=&quot;card&quot; id=&quot;sec6&quot;&gt;
      &lt;div class=&quot;section-kicker&quot;&gt;06 / PRACTICE — ADVANCED&lt;/div&gt;
      &lt;h2&gt;실습 문제 · 심화 (힌트 포함)&lt;/h2&gt;
&lt;h3&gt;문제 3. 페이드 인·아웃 루프&lt;/h3&gt;&lt;p&gt;fade_out과 fade_in을 대기 시간과 함께 이어 붙여, 서서히 사라졌다 나타나기를 반복하는 엔티티를 만드세요.&lt;/p&gt;
&lt;blockquote&gt;힌트: Sequence(2, Func(e.fade_out, duration=2), 2, Func(e.fade_in, duration=2), loop=True)&lt;/blockquote&gt;
&lt;h3&gt;문제 4. 키보드 재생 제어&lt;/h3&gt;&lt;p&gt;숫자 1/2 키로 시퀀스 하나를 start/pause 할 수 있게 input(key)를 구현하세요.&lt;/p&gt;
&lt;blockquote&gt;힌트: actions 딕셔너리에 키와 메서드를 등록하고 if key in actions: actions[key]() 로 실행합니다.&lt;/blockquote&gt;
&lt;h3&gt;문제 5. 나만의 함수 넣기&lt;/h3&gt;&lt;p&gt;내장 효과 대신 직접 만든 함수(예: 색을 무작위로 바꾸는 함수)를 Func에 넣어 시퀀스에 포함시키세요.&lt;/p&gt;
&lt;blockquote&gt;힌트: def change(): e.color = color.random_color() 를 만들고 Func(change)를 항목으로 넣습니다.&lt;/blockquote&gt;
&lt;h3&gt;문제 6. (종합) 3개 엔티티 무대 연출&lt;/h3&gt;&lt;p&gt;엔티티 3개에 서로 다른 시퀀스를 만들고, 숫자 키 1~6으로 각각 start/pause 하는 &#x27;무대 조명 콘솔&#x27;을 완성하세요.&lt;/p&gt;
    &lt;/section&gt;
    &lt;section class=&quot;card&quot; id=&quot;sec7&quot;&gt;
      &lt;div class=&quot;section-kicker&quot;&gt;07 / FULL CODE · 정답 확인&lt;/div&gt;
      &lt;h2&gt;종합 예제 코드 — 시퀀스 3종 + 키보드 콘솔&lt;/h2&gt;
&lt;p class=&quot;fullcode-notice&quot;&gt;✍️ 먼저 위 핵심 개념과 실습 문제를 참고해 스스로 코드를 작성해 보세요. 다 작성했거나 막히는 부분을 비교하고 싶을 때 아래를 눌러 전체 코드를 확인합니다.&lt;/p&gt;
&lt;details class=&quot;fullcode&quot;&gt;&lt;summary&gt;&lt;span class=&quot;lock&quot;&gt;🔒&lt;/span&gt;&lt;span&gt;전체 코드 확인하기&lt;/span&gt;&lt;span class=&quot;hint&quot;&gt;SPOILER · CLICK&lt;/span&gt;&lt;/summary&gt;
&lt;div class=&quot;fullcode-body&quot;&gt;
&lt;p&gt;영상의 최종 코드입니다. 시퀀스 3개를 만들고 숫자 키 1~6으로 각각 제어합니다.&lt;/p&gt;
&lt;div class=&quot;code-wrap&quot;&gt;
&lt;div class=&quot;code-top&quot;&gt;&lt;span class=&quot;dot red&quot;&gt;&lt;/span&gt;&lt;span class=&quot;dot white&quot;&gt;&lt;/span&gt;&lt;span class=&quot;fname&quot;&gt;main.py&lt;/span&gt;&lt;/div&gt;
&lt;pre&gt;&lt;code class=&quot;language-python&quot;&gt;from ursina import *

def input(key):
    actions = {&amp;quot;1&amp;quot;: s1.start, &amp;quot;2&amp;quot;: s1.pause,
               &amp;quot;3&amp;quot;: s2.start, &amp;quot;4&amp;quot;: s2.pause,
               &amp;quot;5&amp;quot;: s3.start, &amp;quot;6&amp;quot;: s3.pause}
    if key in actions:
        actions[key]()

app = Ursina()

e1 = Entity(model=&amp;quot;circle&amp;quot;)
e2 = Entity(model=&amp;quot;quad&amp;quot;, color=color.orange, position=(3, 0, 0))
e3 = Entity(model=&amp;quot;quad&amp;quot;, color=color.cyan, position=(-3, 0, 0), scale=(1, 2, 1))

s1 = Sequence(1, Func(e1.blink, duration=1), loop=True)
s2 = Sequence(1, Func(e2.blink, duration=2),
                 Func(e2.shake, duration=2), loop=True)
s3 = Sequence(2, Func(e3.fade_out, duration=2),
              2, Func(e3.fade_in,  duration=2), loop=True)

s1.start()
s2.start()
s3.start()

app.run()&lt;/code&gt;&lt;/pre&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/details&gt;
    &lt;/section&gt;
    &lt;section class=&quot;card&quot; id=&quot;sec8&quot;&gt;
      &lt;div class=&quot;section-kicker&quot;&gt;08 / SELF-CHECK QUIZ&lt;/div&gt;
      &lt;h2&gt;자가 점검 퀴즈&lt;/h2&gt;
&lt;div class=&quot;quiz-item&quot;&gt;
&lt;p class=&quot;quiz-q&quot;&gt;1. Sequence 안의 숫자 항목은 무엇을 의미하나요?&lt;/p&gt;
&lt;button class=&quot;quiz-toggle&quot; onclick=&quot;toggleAnswer(this)&quot;&gt;정답 보기&lt;/button&gt;
&lt;div class=&quot;quiz-answer&quot;&gt;그 초만큼 기다리는 &#x27;대기 시간&#x27;입니다.&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;quiz-item&quot;&gt;
&lt;p class=&quot;quiz-q&quot;&gt;2. Func는 왜 필요한가요? Sequence에 e1.blink()를 바로 쓰면 안 되나요?&lt;/p&gt;
&lt;button class=&quot;quiz-toggle&quot; onclick=&quot;toggleAnswer(this)&quot;&gt;정답 보기&lt;/button&gt;
&lt;div class=&quot;quiz-answer&quot;&gt;괄호를 붙이면 그 자리에서 즉시 실행됩니다. Func로 감싸야 &#x27;그 순서가 됐을 때&#x27; 실행할 동작으로 등록됩니다.&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;quiz-item&quot;&gt;
&lt;p class=&quot;quiz-q&quot;&gt;3. 만든 Sequence가 재생되게 하려면 무엇을 호출해야 하나요?&lt;/p&gt;
&lt;button class=&quot;quiz-toggle&quot; onclick=&quot;toggleAnswer(this)&quot;&gt;정답 보기&lt;/button&gt;
&lt;div class=&quot;quiz-answer&quot;&gt;start() — 만들기만 해서는 재생되지 않습니다.&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;quiz-item&quot;&gt;
&lt;p class=&quot;quiz-q&quot;&gt;4. 엔티티를 서서히 사라지게 하는 내장 효과는?&lt;/p&gt;
&lt;button class=&quot;quiz-toggle&quot; onclick=&quot;toggleAnswer(this)&quot;&gt;정답 보기&lt;/button&gt;
&lt;div class=&quot;quiz-answer&quot;&gt;fade_out (반대는 fade_in), duration으로 시간 지정.&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;quiz-item&quot;&gt;
&lt;p class=&quot;quiz-q&quot;&gt;5. 키 6개로 시퀀스 3개를 제어할 때 if문 6개 대신 쓸 수 있는 깔끔한 방법은?&lt;/p&gt;
&lt;button class=&quot;quiz-toggle&quot; onclick=&quot;toggleAnswer(this)&quot;&gt;정답 보기&lt;/button&gt;
&lt;div class=&quot;quiz-answer&quot;&gt;키 문자열 → 메서드를 짝지은 딕셔너리를 만들고 actions[key]() 로 호출합니다.&lt;/div&gt;
&lt;/div&gt;
    &lt;/section&gt;
    &lt;section class=&quot;card&quot; id=&quot;sec9&quot;&gt;
      &lt;div class=&quot;section-kicker&quot;&gt;09 / CHECKLIST&lt;/div&gt;
      &lt;h2&gt;체크리스트&lt;/h2&gt;
&lt;div class=&quot;checklist&quot;&gt;&lt;label class=&quot;check-row&quot;&gt;&lt;input onchange=&quot;this.parentElement.classList.toggle(&#x27;checked&#x27;, this.checked)&quot; type=&quot;checkbox&quot;/&gt;&lt;span&gt;Sequence에 대기와 Func 동작을 순서대로 나열할 수 있다.&lt;/span&gt;&lt;/label&gt;&lt;label class=&quot;check-row&quot;&gt;&lt;input onchange=&quot;this.parentElement.classList.toggle(&#x27;checked&#x27;, this.checked)&quot; type=&quot;checkbox&quot;/&gt;&lt;span&gt;blink / shake / fade 계열 내장 효과를 사용할 수 있다.&lt;/span&gt;&lt;/label&gt;&lt;label class=&quot;check-row&quot;&gt;&lt;input onchange=&quot;this.parentElement.classList.toggle(&#x27;checked&#x27;, this.checked)&quot; type=&quot;checkbox&quot;/&gt;&lt;span&gt;loop=True로 반복 시퀀스를 만들 수 있다.&lt;/span&gt;&lt;/label&gt;&lt;label class=&quot;check-row&quot;&gt;&lt;input onchange=&quot;this.parentElement.classList.toggle(&#x27;checked&#x27;, this.checked)&quot; type=&quot;checkbox&quot;/&gt;&lt;span&gt;start / pause로 재생을 제어할 수 있다.&lt;/span&gt;&lt;/label&gt;&lt;label class=&quot;check-row&quot;&gt;&lt;input onchange=&quot;this.parentElement.classList.toggle(&#x27;checked&#x27;, this.checked)&quot; type=&quot;checkbox&quot;/&gt;&lt;span&gt;딕셔너리 매핑으로 키보드 제어 콘솔을 만들 수 있다.&lt;/span&gt;&lt;/label&gt;&lt;/div&gt;
    &lt;/section&gt;
    &lt;section class=&quot;card&quot; id=&quot;sec10&quot;&gt;
      &lt;div class=&quot;section-kicker&quot;&gt;10 / REFERENCES&lt;/div&gt;
      &lt;h2&gt;참고 자료&lt;/h2&gt;
&lt;ul&gt;&lt;li&gt;&lt;a href=&quot;https://www.ursinaengine.org/api_reference.html&quot; rel=&quot;noopener&quot; target=&quot;_blank&quot;&gt;Ursina API Reference&lt;/a&gt;&lt;/li&gt;&lt;li&gt;&lt;a href=&quot;https://www.ursinaengine.org/api_reference.html#sequence&quot; rel=&quot;noopener&quot; target=&quot;_blank&quot;&gt;Ursina Sequence 문서&lt;/a&gt;&lt;/li&gt;&lt;/ul&gt;
    &lt;/section&gt;

  &lt;/main&gt;
&lt;/div&gt;

    &lt;section class=&quot;card&quot; id=&quot;sec2&quot;&gt;
      &lt;div class=&quot;section-kicker&quot;&gt;02 / GOALS&lt;/div&gt;
      &lt;h2&gt;학습 목표&lt;/h2&gt;
&lt;ul&gt;&lt;li&gt;장애물이 여러 개인 충돌 상황 구성하기&lt;/li&gt;&lt;li&gt;대상별로 intersects()를 따로 호출해 충돌 상대 구분하기&lt;/li&gt;&lt;li&gt;print_on_screen으로 화면에 임시 메시지 띄우기&lt;/li&gt;&lt;li&gt;충돌 상대에 따라 서로 다른 반응 구현하기&lt;/li&gt;&lt;/ul&gt;
    &lt;/section&gt;
    &lt;section class=&quot;card&quot; id=&quot;sec3&quot;&gt;
      &lt;div class=&quot;section-kicker&quot;&gt;03 / CONCEPTS&lt;/div&gt;
      &lt;h2&gt;핵심 개념 정리&lt;/h2&gt;
&lt;h3&gt;3-1. 상황 — 왕복하는 플레이어와 두 장애물&lt;/h3&gt;
&lt;p&gt;양옆에 서로 다른 장애물(공, 큐브)을 두고 플레이어가 좌우로 왕복하게 만듭니다. 문제는: 부딪혔을 때 &#x27;어느 쪽&#x27;인지 어떻게 알까요?&lt;/p&gt;
&lt;div class=&quot;code-wrap&quot;&gt;
&lt;div class=&quot;code-top&quot;&gt;&lt;span class=&quot;dot red&quot;&gt;&lt;/span&gt;&lt;span class=&quot;dot white&quot;&gt;&lt;/span&gt;&lt;span class=&quot;fname&quot;&gt;setup.py&lt;/span&gt;&lt;/div&gt;
&lt;pre&gt;&lt;code class=&quot;language-python&quot;&gt;dx = .05
player = Entity(model=&amp;quot;sphere&amp;quot;, scale=.5, collider=&amp;quot;box&amp;quot;)
ball = Entity(model=&amp;quot;sphere&amp;quot;, color=color.red, scale=2,
              position=(-4, 0, 0), collider=&amp;quot;box&amp;quot;)
cube = duplicate(ball, model=&amp;quot;cube&amp;quot;, color=color.green, x=4)&lt;/code&gt;&lt;/pre&gt;
&lt;/div&gt;
&lt;h3&gt;3-2. 핵심 — 대상별로 intersects() 따로 호출&lt;/h3&gt;
&lt;p&gt;&lt;span class=&quot;mono-inline&quot;&gt;intersects()&lt;/span&gt; 에 특정 엔티티를 넘기면 &#x27;그 대상과의&#x27; 충돌만 검사합니다. 대상마다 따로 검사하면 결과도 따로 나오니, 누구와 부딪혔는지 자연히 구분됩니다.&lt;/p&gt;
&lt;div class=&quot;code-wrap&quot;&gt;
&lt;div class=&quot;code-top&quot;&gt;&lt;span class=&quot;dot red&quot;&gt;&lt;/span&gt;&lt;span class=&quot;dot white&quot;&gt;&lt;/span&gt;&lt;span class=&quot;fname&quot;&gt;distinguish.py&lt;/span&gt;&lt;/div&gt;
&lt;pre&gt;&lt;code class=&quot;language-python&quot;&gt;def update():
    global dx
    player.x += dx

    hit1_info = player.intersects(ball)   # 공과의 충돌만
    hit2_info = player.intersects(cube)   # 큐브와의 충돌만&lt;/code&gt;&lt;/pre&gt;
&lt;/div&gt;
&lt;blockquote&gt;💡 인자 없이 intersects()를 부르면 &#x27;아무거나&#x27;와의 충돌을 검사합니다. 대상을 넘기는 것이 구분의 핵심!&lt;/blockquote&gt;
&lt;h3&gt;3-3. print_on_screen — 화면에 잠깐 뜨는 메시지&lt;/h3&gt;
&lt;p&gt;&lt;span class=&quot;mono-inline&quot;&gt;print_on_screen&lt;/span&gt; 은 터미널이 아니라 게임 화면에 글자를 잠시 띄웠다가 지워 줍니다. 디버깅이나 알림에 편리합니다.&lt;/p&gt;
&lt;div class=&quot;code-wrap&quot;&gt;
&lt;div class=&quot;code-top&quot;&gt;&lt;span class=&quot;dot red&quot;&gt;&lt;/span&gt;&lt;span class=&quot;dot white&quot;&gt;&lt;/span&gt;&lt;span class=&quot;fname&quot;&gt;posc.py&lt;/span&gt;&lt;/div&gt;
&lt;pre&gt;&lt;code class=&quot;language-python&quot;&gt;print_on_screen(&amp;quot;Colliding with ball&amp;quot;, scale=2,
                position=(-.3, .2), origin=(0, 0))&lt;/code&gt;&lt;/pre&gt;
&lt;/div&gt;
&lt;blockquote&gt;💡 position은 Text와 같은 화면 좌표계입니다. 잠시 후 자동으로 사라져요.&lt;/blockquote&gt;
&lt;h3&gt;3-4. 대상별로 다른 반응&lt;/h3&gt;
&lt;p&gt;이제 각 hit_info를 따로 확인해, 부딪힌 상대에 맞는 메시지·동작을 실행하면 됩니다. 둘 다 방향은 뒤집되(반사) 메시지는 다르게!&lt;/p&gt;
&lt;div class=&quot;code-wrap&quot;&gt;
&lt;div class=&quot;code-top&quot;&gt;&lt;span class=&quot;dot red&quot;&gt;&lt;/span&gt;&lt;span class=&quot;dot white&quot;&gt;&lt;/span&gt;&lt;span class=&quot;fname&quot;&gt;react.py&lt;/span&gt;&lt;/div&gt;
&lt;pre&gt;&lt;code class=&quot;language-python&quot;&gt;if hit1_info.hit:
    dx = -dx
    print_on_screen(&amp;quot;Colliding with ball&amp;quot;, ...)

if hit2_info.hit:
    dx = -dx
    print_on_screen(&amp;quot;Colliding with cube&amp;quot;, ...)&lt;/code&gt;&lt;/pre&gt;
&lt;/div&gt;
    &lt;/section&gt;
    &lt;section class=&quot;card&quot; id=&quot;sec4&quot;&gt;
      &lt;div class=&quot;section-kicker&quot;&gt;04 / SUMMARY&lt;/div&gt;
      &lt;h2&gt;핵심 정리&lt;/h2&gt;
&lt;ul&gt;&lt;li&gt;&lt;span class=&quot;mono-inline&quot;&gt;player.intersects(대상)&lt;/span&gt; — 특정 대상과의 충돌만 검사&lt;/li&gt;&lt;li&gt;대상별 hit_info를 따로 받으면 충돌 상대가 구분됨&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;mono-inline&quot;&gt;print_on_screen(글, scale, position, origin)&lt;/span&gt; — 화면 임시 메시지&lt;/li&gt;&lt;li&gt;상대에 따라 메시지·반응을 다르게 분기&lt;/li&gt;&lt;/ul&gt;
    &lt;/section&gt;
    &lt;section class=&quot;card&quot; id=&quot;sec5&quot;&gt;
      &lt;div class=&quot;section-kicker&quot;&gt;05 / PRACTICE — BASIC&lt;/div&gt;
      &lt;h2&gt;실습 문제 · 기본&lt;/h2&gt;
&lt;ol&gt;&lt;li&gt;좌우에 빨간 공과 초록 큐브를 배치하고, 플레이어가 dx로 왕복하며 양쪽에서 반사되게 만드세요.&lt;/li&gt;&lt;li&gt;ball과 cube 각각에 대해 intersects()를 따로 호출해 두 개의 hit_info를 받으세요.&lt;/li&gt;&lt;/ol&gt;
    &lt;/section&gt;
    &lt;section class=&quot;card&quot; id=&quot;sec6&quot;&gt;
      &lt;div class=&quot;section-kicker&quot;&gt;06 / PRACTICE — ADVANCED&lt;/div&gt;
      &lt;h2&gt;실습 문제 · 심화 (힌트 포함)&lt;/h2&gt;
&lt;h3&gt;문제 3. 충돌 상대 표시&lt;/h3&gt;&lt;p&gt;공에 부딪히면 &quot;Colliding with ball&quot;, 큐브면 &quot;Colliding with cube&quot;가 화면에 뜨게 하세요.&lt;/p&gt;
&lt;blockquote&gt;힌트: print_on_screen을 각 if 블록에 넣고 position을 좌우로 다르게 주면 보기 좋습니다.&lt;/blockquote&gt;
&lt;h3&gt;문제 4. 상대별 다른 효과&lt;/h3&gt;&lt;p&gt;공에 부딪히면 플레이어가 커지고(scale +), 큐브에 부딪히면 작아지게(scale −) 만드세요.&lt;/p&gt;
&lt;blockquote&gt;힌트: hit1_info.hit 블록과 hit2_info.hit 블록에 서로 다른 코드를 넣으면 됩니다.&lt;/blockquote&gt;
&lt;h3&gt;문제 5. 세 번째 장애물&lt;/h3&gt;&lt;p&gt;가운데 위쪽에 노란 장애물을 추가하고, w키로 점프하듯 위로 이동했을 때만 부딪히게 확장하세요.&lt;/p&gt;
&lt;blockquote&gt;힌트: hit3_info = player.intersects(노란것) 을 추가하면 됩니다 — 패턴은 동일!&lt;/blockquote&gt;
&lt;h3&gt;문제 6. (종합) 충돌 점수판&lt;/h3&gt;&lt;p&gt;공 충돌은 +1점, 큐브 충돌은 -1점이 되는 점수판(Text)을 만들고, 0점 아래로 내려가면 &#x27;Game Over&#x27;가 뜨게 하세요.&lt;/p&gt;
&lt;blockquote&gt;힌트: #06의 점수 시스템과 이번 차시의 대상 구분을 합치면 됩니다.&lt;/blockquote&gt;
    &lt;/section&gt;
    &lt;section class=&quot;card&quot; id=&quot;sec7&quot;&gt;
      &lt;div class=&quot;section-kicker&quot;&gt;07 / FULL CODE · 정답 확인&lt;/div&gt;
      &lt;h2&gt;종합 예제 코드 — 공이냐 큐브냐&lt;/h2&gt;
&lt;p class=&quot;fullcode-notice&quot;&gt;✍️ 먼저 위 핵심 개념과 실습 문제를 참고해 스스로 코드를 작성해 보세요. 다 작성했거나 막히는 부분을 비교하고 싶을 때 아래를 눌러 전체 코드를 확인합니다.&lt;/p&gt;
&lt;details class=&quot;fullcode&quot;&gt;&lt;summary&gt;&lt;span class=&quot;lock&quot;&gt;🔒&lt;/span&gt;&lt;span&gt;전체 코드 확인하기&lt;/span&gt;&lt;span class=&quot;hint&quot;&gt;SPOILER · CLICK&lt;/span&gt;&lt;/summary&gt;
&lt;div class=&quot;fullcode-body&quot;&gt;
&lt;p&gt;대상별 intersects 검사로 충돌 상대를 구분해 다른 메시지를 띄우는, 영상의 최종 코드입니다.&lt;/p&gt;
&lt;div class=&quot;code-wrap&quot;&gt;
&lt;div class=&quot;code-top&quot;&gt;&lt;span class=&quot;dot red&quot;&gt;&lt;/span&gt;&lt;span class=&quot;dot white&quot;&gt;&lt;/span&gt;&lt;span class=&quot;fname&quot;&gt;main.py&lt;/span&gt;&lt;/div&gt;
&lt;pre&gt;&lt;code class=&quot;language-python&quot;&gt;from ursina import *

def update():
    global dx
    player.x += dx

    hit1_info = player.intersects(ball)   # 공과의 충돌
    hit2_info = player.intersects(cube)   # 큐브와의 충돌

    if hit1_info.hit:
        dx = -dx
        print_on_screen(&amp;quot;Colliding with ball&amp;quot;, scale=2,
                        position=(-.3, .2), origin=(0, 0))

    if hit2_info.hit:
        dx = -dx
        print_on_screen(&amp;quot;Colliding with cube&amp;quot;, scale=2,
                        position=(.3, .2), origin=(0, 0))

app = Ursina()

dx = .05
player = Entity(model=&amp;quot;sphere&amp;quot;, scale=.5, position=(0, 0, 0), collider=&amp;quot;box&amp;quot;)
ball = Entity(model=&amp;quot;sphere&amp;quot;, color=color.red, scale=2,
              position=(-4, 0, 0), collider=&amp;quot;box&amp;quot;)
cube = duplicate(ball, model=&amp;quot;cube&amp;quot;, color=color.green, x=4)

app.run()&lt;/code&gt;&lt;/pre&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/details&gt;

    &lt;section class=&quot;card&quot; id=&quot;sec8&quot;&gt;
      &lt;div class=&quot;section-kicker&quot;&gt;08 / SELF-CHECK QUIZ&lt;/div&gt;
      &lt;h2&gt;자가 점검 퀴즈&lt;/h2&gt;
&lt;div class=&quot;quiz-item&quot;&gt;
&lt;p class=&quot;quiz-q&quot;&gt;1. intersects()에 인자를 넣을 때와 안 넣을 때의 차이는?&lt;/p&gt;
&lt;button class=&quot;quiz-toggle&quot; onclick=&quot;toggleAnswer(this)&quot;&gt;정답 보기&lt;/button&gt;
&lt;div class=&quot;quiz-answer&quot;&gt;인자를 넣으면 그 대상과의 충돌만 검사하고, 안 넣으면 아무 대상과의 충돌이든 검사합니다.&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;quiz-item&quot;&gt;
&lt;p class=&quot;quiz-q&quot;&gt;2. 충돌 상대를 구분하는 이번 차시의 핵심 방법은?&lt;/p&gt;
&lt;button class=&quot;quiz-toggle&quot; onclick=&quot;toggleAnswer(this)&quot;&gt;정답 보기&lt;/button&gt;
&lt;div class=&quot;quiz-answer&quot;&gt;대상별로 intersects(대상)를 따로 호출해 hit_info를 각각 받는 것입니다.&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;quiz-item&quot;&gt;
&lt;p class=&quot;quiz-q&quot;&gt;3. 게임 화면에 잠시 떴다 사라지는 글자를 띄우는 함수는?&lt;/p&gt;
&lt;button class=&quot;quiz-toggle&quot; onclick=&quot;toggleAnswer(this)&quot;&gt;정답 보기&lt;/button&gt;
&lt;div class=&quot;quiz-answer&quot;&gt;print_on_screen()&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;quiz-item&quot;&gt;
&lt;p class=&quot;quiz-q&quot;&gt;4. print_on_screen의 position은 어떤 좌표계를 쓰나요?&lt;/p&gt;
&lt;button class=&quot;quiz-toggle&quot; onclick=&quot;toggleAnswer(this)&quot;&gt;정답 보기&lt;/button&gt;
&lt;div class=&quot;quiz-answer&quot;&gt;Text와 같은 화면(UI) 좌표계입니다.&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;quiz-item&quot;&gt;
&lt;p class=&quot;quiz-q&quot;&gt;5. 공과 큐브 양쪽에서 플레이어가 반사되게 하는 공통 코드는?&lt;/p&gt;
&lt;button class=&quot;quiz-toggle&quot; onclick=&quot;toggleAnswer(this)&quot;&gt;정답 보기&lt;/button&gt;
&lt;div class=&quot;quiz-answer&quot;&gt;dx = -dx — 이동 방향을 뒤집는 반사 패턴입니다.&lt;/div&gt;
&lt;/div&gt;

    });
  }, { rootMargin: &#x27;-30% 0px -60% 0px&#x27; });
  sections.forEach(s =&gt; observer.observe(s));
  function toggleAnswer(btn){
    const ans = btn.nextElementSibling;
    ans.classList.toggle(&#x27;show&#x27;);
    btn.textContent = ans.classList.contains(&#x27;show&#x27;) ? &#x27;정답 숨기기&#x27; : &#x27;정답 보기&#x27;;
  }
&lt;/script&gt;

  });
})();
&lt;/script&gt;

    &lt;p class=&quot;sub&quot;&gt;빨간 배경 바 위에 초록 바를 겹치고, scale_x를 줄였다 늘렸다 하며 게임의 단골 UI인 체력바를 직접 만드는 자율 학습 페이지입니다.&lt;/p&gt;

  &lt;main&gt;

    &lt;section class=&quot;card&quot; id=&quot;sec1&quot;&gt;
      &lt;div class=&quot;section-kicker&quot;&gt;01 / REVIEW&lt;/div&gt;
      &lt;h2&gt;지난 시간 복습 (#17)&lt;/h2&gt;
&lt;ul&gt;&lt;li&gt;대상마다 &lt;span class=&quot;mono-inline&quot;&gt;intersects()&lt;/span&gt;를 따로 호출해 누구와 부딪혔는지 구분하기&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;mono-inline&quot;&gt;print_on_screen&lt;/span&gt;으로 화면에 잠깐 메시지 띄우기&lt;/li&gt;&lt;/ul&gt;
    &lt;/section&gt;
    &lt;section class=&quot;card&quot; id=&quot;sec2&quot;&gt;
      &lt;div class=&quot;section-kicker&quot;&gt;02 / GOALS&lt;/div&gt;
      &lt;h2&gt;학습 목표&lt;/h2&gt;
&lt;ul&gt;&lt;li&gt;origin을 옮겨 &#x27;왼쪽 끝 고정&#x27;으로 줄어드는 바 만들기&lt;/li&gt;&lt;li&gt;빨간 배경 바 + 초록 전면 바의 두 겹 구조 이해하기 (z 순서)&lt;/li&gt;&lt;li&gt;held_keys로 scale_x를 실시간으로 줄이고 늘리기&lt;/li&gt;&lt;li&gt;clamp()로 값이 범위를 벗어나지 않게 막기&lt;/li&gt;&lt;/ul&gt;
    &lt;/section&gt;
    &lt;section class=&quot;card&quot; id=&quot;sec3&quot;&gt;
      &lt;div class=&quot;section-kicker&quot;&gt;03 / CONCEPTS&lt;/div&gt;
      &lt;h2&gt;핵심 개념 정리&lt;/h2&gt;
&lt;h3&gt;3-1. origin — 어디를 기준으로 늘어나고 줄어들까?&lt;/h3&gt;
&lt;p&gt;기본 origin은 가운데(0,0)라서 scale_x를 줄이면 양쪽이 함께 줄어듭니다. &lt;span class=&quot;mono-inline&quot;&gt;origin=(-.5, -.5)&lt;/span&gt; 로 기준점을 왼쪽 아래로 옮기면 &lt;b&gt;왼쪽 끝이 고정된 채&lt;/b&gt; 오른쪽만 줄어드는, 체력바다운 움직임이 됩니다.&lt;/p&gt;
&lt;div class=&quot;code-wrap&quot;&gt;
&lt;div class=&quot;code-top&quot;&gt;&lt;span class=&quot;dot red&quot;&gt;&lt;/span&gt;&lt;span class=&quot;dot white&quot;&gt;&lt;/span&gt;&lt;span class=&quot;fname&quot;&gt;origin.py&lt;/span&gt;&lt;/div&gt;
&lt;pre&gt;&lt;code class=&quot;language-python&quot;&gt;x = 10   # 바의 전체 길이
full_bar = Entity(model=&amp;quot;quad&amp;quot;, origin=(-.5, -.5),
                  position=(-x//2, 0), scale=(x, .5), color=color.red)&lt;/code&gt;&lt;/pre&gt;
&lt;/div&gt;
&lt;blockquote&gt;💡 position=(-x//2, 0) — 길이의 절반만큼 왼쪽으로 밀어 화면 가운데에 오게 하는 계산입니다.&lt;/blockquote&gt;
&lt;h3&gt;3-2. 두 겹 구조 — 배경(빨강) 위에 전면(초록)&lt;/h3&gt;
&lt;p&gt;체력바는 사실 &lt;b&gt;같은 크기의 quad 두 장&lt;/b&gt;입니다. 뒤에 빨간 바를 깔고, 그 위에 초록 바를 겹칩니다. 초록 바에 &lt;span class=&quot;mono-inline&quot;&gt;z = -.1&lt;/span&gt; 을 주면 카메라 쪽으로 살짝 나와 항상 앞에 보입니다.&lt;/p&gt;
&lt;div class=&quot;code-wrap&quot;&gt;
&lt;div class=&quot;code-top&quot;&gt;&lt;span class=&quot;dot red&quot;&gt;&lt;/span&gt;&lt;span class=&quot;dot white&quot;&gt;&lt;/span&gt;&lt;span class=&quot;fname&quot;&gt;layers.py&lt;/span&gt;&lt;/div&gt;
&lt;pre&gt;&lt;code class=&quot;language-python&quot;&gt;class Health_bar(Entity):
    def __init__(self, x):
        super().__init__()
        self.model = &amp;quot;quad&amp;quot;
        self.color = color.green
        self.z = -.1                 # 빨간 바보다 앞에
        self.origin = (-.5, -.5)
        self.position = (-x//2, 0)   # 배경과 같은 위치&lt;/code&gt;&lt;/pre&gt;
&lt;/div&gt;
&lt;h3&gt;3-3. scale_x를 실시간으로 조절&lt;/h3&gt;
&lt;p&gt;클래스 안 update에서 held_keys로 초록 바의 가로 길이를 줄이고 늘립니다. 초록이 줄어든 만큼 뒤의 빨강이 드러나 &#x27;깎인 체력&#x27;처럼 보입니다.&lt;/p&gt;
&lt;div class=&quot;code-wrap&quot;&gt;
&lt;div class=&quot;code-top&quot;&gt;&lt;span class=&quot;dot red&quot;&gt;&lt;/span&gt;&lt;span class=&quot;dot white&quot;&gt;&lt;/span&gt;&lt;span class=&quot;fname&quot;&gt;drain.py&lt;/span&gt;&lt;/div&gt;
&lt;pre&gt;&lt;code class=&quot;language-python&quot;&gt;def update(self):
    self.scale_x -= held_keys[&amp;#x27;left arrow&amp;#x27;]  * time.dt * 5
    self.scale_x += held_keys[&amp;#x27;right arrow&amp;#x27;] * time.dt * 5&lt;/code&gt;&lt;/pre&gt;
&lt;/div&gt;
&lt;h3&gt;3-4. clamp — 범위 밖으로 못 나가게&lt;/h3&gt;
&lt;p&gt;이대로면 체력이 음수가 되거나 최대치를 넘을 수 있습니다. &lt;span class=&quot;mono-inline&quot;&gt;clamp(값, 최소, 최대)&lt;/span&gt; 는 값을 범위 안으로 잘라 줍니다.&lt;/p&gt;
&lt;div class=&quot;code-wrap&quot;&gt;
&lt;div class=&quot;code-top&quot;&gt;&lt;span class=&quot;dot red&quot;&gt;&lt;/span&gt;&lt;span class=&quot;dot white&quot;&gt;&lt;/span&gt;&lt;span class=&quot;fname&quot;&gt;clamp.py&lt;/span&gt;&lt;/div&gt;
&lt;pre&gt;&lt;code class=&quot;language-python&quot;&gt;self.scale_x = clamp(self.scale_x, 0, self.scale_max)&lt;/code&gt;&lt;/pre&gt;
&lt;/div&gt;
&lt;blockquote&gt;💡 scale_max는 __init__에서 self.scale_max = x 로 저장해 둔 &#x27;최대 체력&#x27;입니다.&lt;/blockquote&gt;
    &lt;/section&gt;
    &lt;section class=&quot;card&quot; id=&quot;sec4&quot;&gt;
      &lt;div class=&quot;section-kicker&quot;&gt;04 / SUMMARY&lt;/div&gt;
      &lt;h2&gt;핵심 정리&lt;/h2&gt;
&lt;ul&gt;&lt;li&gt;&lt;span class=&quot;mono-inline&quot;&gt;origin=(-.5, -.5)&lt;/span&gt; → 왼쪽 끝 고정, 오른쪽만 줄어드는 바&lt;/li&gt;&lt;li&gt;빨간 배경 quad + 초록 전면 quad(z=-.1)의 두 겹 구조&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;mono-inline&quot;&gt;scale_x ± held_keys[...] * time.dt * 속도&lt;/span&gt; 로 실시간 증감&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;mono-inline&quot;&gt;clamp(값, 0, 최대)&lt;/span&gt; 로 범위 제한&lt;/li&gt;&lt;li&gt;Entity 상속 클래스(#09)로 체력바를 부품처럼 재사용&lt;/li&gt;&lt;/ul&gt;
    &lt;/section&gt;
    &lt;section class=&quot;card&quot; id=&quot;sec5&quot;&gt;
      &lt;div class=&quot;section-kicker&quot;&gt;05 / PRACTICE — BASIC&lt;/div&gt;
      &lt;h2&gt;실습 문제 · 기본&lt;/h2&gt;
&lt;ol&gt;&lt;li&gt;길이 10짜리 빨간 배경 바를 화면 가운데에 만드세요. (origin과 position 계산 주의)&lt;/li&gt;&lt;li&gt;같은 위치에 초록 바를 겹치고 z=-.1로 앞에 보이게 하세요.&lt;/li&gt;&lt;/ol&gt;
    &lt;/section&gt;
    &lt;section class=&quot;card&quot; id=&quot;sec6&quot;&gt;
      &lt;div class=&quot;section-kicker&quot;&gt;06 / PRACTICE — ADVANCED&lt;/div&gt;
      &lt;h2&gt;실습 문제 · 심화 (힌트 포함)&lt;/h2&gt;
&lt;h3&gt;문제 3. 방향키로 체력 조절&lt;/h3&gt;&lt;p&gt;왼쪽 화살표를 누르는 동안 체력이 줄고, 오른쪽 화살표로 회복되게 update를 구현하세요.&lt;/p&gt;
&lt;blockquote&gt;힌트: held_keys[&#x27;left arrow&#x27;] 와 time.dt를 곱해 scale_x에서 빼고 더합니다.&lt;/blockquote&gt;
&lt;h3&gt;문제 4. clamp로 안전장치&lt;/h3&gt;&lt;p&gt;체력이 0 아래로 내려가거나 최대치를 넘지 않도록 clamp를 추가하세요.&lt;/p&gt;
&lt;blockquote&gt;힌트: scale_max를 __init__에 저장해 두고 clamp(self.scale_x, 0, self.scale_max)&lt;/blockquote&gt;
&lt;h3&gt;문제 5. 위험 경고 색상&lt;/h3&gt;&lt;p&gt;체력이 30% 아래로 떨어지면 초록 바가 노란색 → 10% 아래면 주황색으로 바뀌게 하세요.&lt;/p&gt;
&lt;blockquote&gt;힌트: update에서 self.scale_x / self.scale_max 비율을 계산해 self.color를 바꿉니다.&lt;/blockquote&gt;
&lt;h3&gt;문제 6. (종합) 충돌하면 깎이는 체력&lt;/h3&gt;&lt;p&gt;#08의 이동+충돌을 결합해, 플레이어가 가시(빨간 큐브)에 닿아 있는 동안 체력이 실시간으로 깎이고 0이 되면 &#x27;Game Over&#x27; 텍스트가 나타나게 하세요.&lt;/p&gt;
&lt;blockquote&gt;힌트: 체력바 객체를 전역에서 접근할 수 있게 만들고, 충돌 중일 때 scale_x를 깎습니다.&lt;/blockquote&gt;
    &lt;/section&gt;
    &lt;section class=&quot;card&quot; id=&quot;sec7&quot;&gt;
      &lt;div class=&quot;section-kicker&quot;&gt;07 / FULL CODE · 정답 확인&lt;/div&gt;
      &lt;h2&gt;종합 예제 코드 — 방향키로 조절하는 체력바&lt;/h2&gt;
&lt;p class=&quot;fullcode-notice&quot;&gt;✍️ 먼저 위 핵심 개념과 실습 문제를 참고해 스스로 코드를 작성해 보세요. 다 작성했거나 막히는 부분을 비교하고 싶을 때 아래를 눌러 전체 코드를 확인합니다.&lt;/p&gt;
&lt;details class=&quot;fullcode&quot;&gt;&lt;summary&gt;&lt;span class=&quot;lock&quot;&gt;🔒&lt;/span&gt;&lt;span&gt;전체 코드 확인하기&lt;/span&gt;&lt;span class=&quot;hint&quot;&gt;SPOILER · CLICK&lt;/span&gt;&lt;/summary&gt;
&lt;div class=&quot;fullcode-body&quot;&gt;
&lt;p&gt;배경 바 + Health_bar 클래스 + 방향키 증감 + clamp까지 합친 예시입니다.&lt;/p&gt;
&lt;div class=&quot;code-wrap&quot;&gt;
&lt;div class=&quot;code-top&quot;&gt;&lt;span class=&quot;dot red&quot;&gt;&lt;/span&gt;&lt;span class=&quot;dot white&quot;&gt;&lt;/span&gt;&lt;span class=&quot;fname&quot;&gt;main.py&lt;/span&gt;&lt;/div&gt;
&lt;pre&gt;&lt;code class=&quot;language-python&quot;&gt;from ursina import *

class Health_bar(Entity):
    def __init__(self, x):
        super().__init__()
        self.model = &amp;quot;quad&amp;quot;
        self.color = color.green
        self.z = -.1                     # 배경보다 앞
        self.origin = (-.5, -.5)         # 왼쪽 끝 고정
        self.position = (-x//2, 0)
        self.scale_max = x               # 최대 체력
        self.scale_x = x
        self.scale = (self.scale_x, .5)

    def update(self):
        self.scale_x -= held_keys[&amp;#x27;left arrow&amp;#x27;]  * time.dt * 5
        self.scale_x += held_keys[&amp;#x27;right arrow&amp;#x27;] * time.dt * 5
        self.scale_x = clamp(self.scale_x, 0, self.scale_max)

app = Ursina()

x = 10
full_bar = Entity(model=&amp;quot;quad&amp;quot;, origin=(-.5, -.5),
                  position=(-x//2, 0), scale=(x, .5), color=color.red)
health_bar = Health_bar(x)

app.run()&lt;/code&gt;&lt;/pre&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/details&gt;
    &lt;/section&gt;
    &lt;section class=&quot;card&quot; id=&quot;sec8&quot;&gt;
      &lt;div class=&quot;section-kicker&quot;&gt;08 / SELF-CHECK QUIZ&lt;/div&gt;
      &lt;h2&gt;자가 점검 퀴즈&lt;/h2&gt;
&lt;div class=&quot;quiz-item&quot;&gt;
&lt;p class=&quot;quiz-q&quot;&gt;1. origin=(-.5, -.5)을 주는 이유는 무엇인가요?&lt;/p&gt;
&lt;button class=&quot;quiz-toggle&quot; onclick=&quot;toggleAnswer(this)&quot;&gt;정답 보기&lt;/button&gt;
&lt;div class=&quot;quiz-answer&quot;&gt;기준점을 왼쪽(아래) 끝으로 옮겨서, scale_x가 줄어들 때 왼쪽은 고정되고 오른쪽만 줄어들게 하기 위해서입니다.&lt;/div&gt;
&lt;/div&gt;

    &lt;span class=&quot;eyebrow&quot;&gt;Ursina Engine · Lesson 19&lt;/span&gt;
    &lt;h1&gt;Displaying Instantly Changing Numbers&lt;/h1&gt;
    &lt;p class=&quot;sub&quot;&gt;Button을 상속한 나만의 숫자 표시 위젯을 만들고, 키를 누르는 즉시(꾹 누르면 연속으로) 값이 갱신되는 화면을 만드는 자율 학습 페이지입니다.&lt;/p&gt;

    &lt;div class=&quot;mini-demo&quot;&gt;

      &lt;div class=&quot;counter-demo&quot;&gt;&lt;span&gt;Number:&lt;/span&gt;&lt;span style=&quot;color:var(--coral);&quot;&gt;50&lt;/span&gt;&lt;span style=&quot;color:#7E909F;font-size:13pt;&quot;&gt;( 1 − / 2 + )&lt;/span&gt;&lt;/div&gt;
      &lt;p class=&quot;demo-caption&quot;&gt;키 이벤트가 올 때마다 텍스트를 f-string으로 다시 써서 화면이 즉시 바뀝니다.&lt;/p&gt;

  &lt;main&gt;

    &lt;section class=&quot;card&quot; id=&quot;sec1&quot;&gt;
      &lt;div class=&quot;section-kicker&quot;&gt;01 / REVIEW&lt;/div&gt;
      &lt;h2&gt;지난 시간 복습 (#18)&lt;/h2&gt;
&lt;ul&gt;&lt;li&gt;&lt;span class=&quot;mono-inline&quot;&gt;origin&lt;/span&gt; 이동 + 두 겹 quad로 체력바 구조 만들기&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;mono-inline&quot;&gt;clamp(값, 0, 최대)&lt;/span&gt; 로 범위 제한&lt;/li&gt;&lt;/ul&gt;
    &lt;/section&gt;
    &lt;section class=&quot;card&quot; id=&quot;sec2&quot;&gt;
      &lt;div class=&quot;section-kicker&quot;&gt;02 / GOALS&lt;/div&gt;
      &lt;h2&gt;학습 목표&lt;/h2&gt;
&lt;ul&gt;&lt;li&gt;Button을 상속해 숫자 표시 위젯 클래스 만들기&lt;/li&gt;&lt;li&gt;text_entity로 버튼 글자의 크기·내용 직접 다루기&lt;/li&gt;&lt;li&gt;f-string으로 값이 바뀔 때마다 텍스트 즉시 갱신하기&lt;/li&gt;&lt;li&gt;&#x27;1 hold&#x27; 같은 홀드 이벤트로 꾹 누르면 연속 증감시키기&lt;/li&gt;&lt;/ul&gt;
    &lt;/section&gt;
    &lt;section class=&quot;card&quot; id=&quot;sec3&quot;&gt;
      &lt;div class=&quot;section-kicker&quot;&gt;03 / CONCEPTS&lt;/div&gt;
      &lt;h2&gt;핵심 개념 정리&lt;/h2&gt;
&lt;h3&gt;3-1. Button 상속 — 왜 Text가 아니라 Button?&lt;/h3&gt;
&lt;p&gt;Button은 배경판 + 글자(&lt;span class=&quot;mono-inline&quot;&gt;text_entity&lt;/span&gt;)가 세트라서, 검은 패널 위에 글자를 올리는 위젯을 만들기 좋습니다. #09에서 배운 상속을 Entity 대신 Button에 적용합니다.&lt;/p&gt;
&lt;div class=&quot;code-wrap&quot;&gt;
&lt;div class=&quot;code-top&quot;&gt;&lt;span class=&quot;dot red&quot;&gt;&lt;/span&gt;&lt;span class=&quot;dot white&quot;&gt;&lt;/span&gt;&lt;span class=&quot;fname&quot;&gt;widget.py&lt;/span&gt;&lt;/div&gt;
&lt;pre&gt;&lt;code class=&quot;language-python&quot;&gt;class InstantNumbers(Button):
    def __init__(self, value):
        super().__init__(
            position=(0, 0), origin=(0, 0),
            scale=(Text.size*20, Text.size),   # 글자 크기 기준으로 패널 크기 계산
            color=color.black,
            text=&amp;quot;text&amp;quot;
        )&lt;/code&gt;&lt;/pre&gt;
&lt;/div&gt;
&lt;blockquote&gt;💡 scale에 Text.size를 활용하면 패널이 글자 높이에 딱 맞게 계산됩니다.&lt;/blockquote&gt;
&lt;h3&gt;3-2. text_entity — 버튼 글자를 직접 조작&lt;/h3&gt;
&lt;p&gt;버튼의 글자는 &lt;span class=&quot;mono-inline&quot;&gt;self.text_entity&lt;/span&gt; 라는 별도 엔티티입니다. scale을 키우거나 text를 바꿀 수 있습니다.&lt;/p&gt;
&lt;div class=&quot;code-wrap&quot;&gt;
&lt;div class=&quot;code-top&quot;&gt;&lt;span class=&quot;dot red&quot;&gt;&lt;/span&gt;&lt;span class=&quot;dot white&quot;&gt;&lt;/span&gt;&lt;span class=&quot;fname&quot;&gt;text_entity.py&lt;/span&gt;&lt;/div&gt;
&lt;pre&gt;&lt;code class=&quot;language-python&quot;&gt;self.text_entity.scale *= 5                     # 글자 5배 크게
self.value = value
self.text_entity.text = f&amp;#x27;Number: {self.value}&amp;#x27;  # 초기 표시&lt;/code&gt;&lt;/pre&gt;
&lt;/div&gt;
&lt;h3&gt;3-3. f-string 갱신 패턴 — 값이 바뀌면 다시 쓴다&lt;/h3&gt;
&lt;p&gt;화면 숫자가 &#x27;즉시&#x27; 바뀌는 비결은 단순합니다: 값이 바뀔 때마다 f-string으로 문자열을 새로 만들어 text에 다시 넣는 것.&lt;/p&gt;
&lt;div class=&quot;code-wrap&quot;&gt;
&lt;div class=&quot;code-top&quot;&gt;&lt;span class=&quot;dot red&quot;&gt;&lt;/span&gt;&lt;span class=&quot;dot white&quot;&gt;&lt;/span&gt;&lt;span class=&quot;fname&quot;&gt;refresh.py&lt;/span&gt;&lt;/div&gt;
&lt;pre&gt;&lt;code class=&quot;language-python&quot;&gt;self.value += 1
self.text_entity.text = f&amp;#x27;Number: {self.value}&amp;#x27;   # 이 줄이 갱신의 전부!&lt;/code&gt;&lt;/pre&gt;
&lt;/div&gt;
&lt;h3&gt;3-4. &#x27;1 hold&#x27; — 꾹 누르면 연속으로&lt;/h3&gt;
&lt;p&gt;input(key)는 원래 &#x27;눌린 순간&#x27; 한 번만 옵니다. 그런데 키를 계속 누르고 있으면 &lt;span class=&quot;mono-inline&quot;&gt;&amp;#39;1 hold&amp;#39;&lt;/span&gt; 라는 이름의 이벤트가 반복해서 들어옵니다. 둘을 or로 함께 받으면 &#x27;한 번 콕&#x27;과 &#x27;꾹 연속&#x27; 모두 처리됩니다.&lt;/p&gt;
&lt;div class=&quot;code-wrap&quot;&gt;
&lt;div class=&quot;code-top&quot;&gt;&lt;span class=&quot;dot red&quot;&gt;&lt;/span&gt;&lt;span class=&quot;dot white&quot;&gt;&lt;/span&gt;&lt;span class=&quot;fname&quot;&gt;hold.py&lt;/span&gt;&lt;/div&gt;
&lt;pre&gt;&lt;code class=&quot;language-python&quot;&gt;def input(self, key):
    if key == &amp;#x27;1&amp;#x27; or key == &amp;#x27;1 hold&amp;#x27;:
        self.value -= 1
    if key == &amp;#x27;2&amp;#x27; or key == &amp;#x27;2 hold&amp;#x27;:
        self.value += 1&lt;/code&gt;&lt;/pre&gt;
&lt;/div&gt;
&lt;blockquote&gt;💡 held_keys(#07)와 비슷해 보이지만, hold 이벤트는 input 쪽에서 일정 간격으로 반복 발생한다는 점이 다릅니다.&lt;/blockquote&gt;
    &lt;/section&gt;
    &lt;section class=&quot;card&quot; id=&quot;sec4&quot;&gt;
      &lt;div class=&quot;section-kicker&quot;&gt;04 / SUMMARY&lt;/div&gt;
      &lt;h2&gt;핵심 정리&lt;/h2&gt;
&lt;ul&gt;&lt;li&gt;&lt;span class=&quot;mono-inline&quot;&gt;class InstantNumbers(Button):&lt;/span&gt; — Button 상속 위젯&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;mono-inline&quot;&gt;self.text_entity&lt;/span&gt; 로 버튼 글자의 scale / text 조작&lt;/li&gt;&lt;li&gt;갱신 패턴: 값 변경 → &lt;span class=&quot;mono-inline&quot;&gt;text = f&amp;#39;Number: {value}&amp;#39;&lt;/span&gt; 다시 쓰기&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;mono-inline&quot;&gt;key == &amp;#39;1&amp;#39; or key == &amp;#39;1 hold&amp;#39;&lt;/span&gt; — 단발 + 홀드 연속 입력&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;mono-inline&quot;&gt;clamp&lt;/span&gt; 로 값 범위 제한 (#18 복습)&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;mono-inline&quot;&gt;window.color = color.black&lt;/span&gt; — 배경색 변경&lt;/li&gt;&lt;/ul&gt;
    &lt;/section&gt;
    &lt;section class=&quot;card&quot; id=&quot;sec5&quot;&gt;
      &lt;div class=&quot;section-kicker&quot;&gt;05 / PRACTICE — BASIC&lt;/div&gt;
      &lt;h2&gt;실습 문제 · 기본&lt;/h2&gt;
&lt;ol&gt;&lt;li&gt;Button을 상속한 위젯 클래스를 만들어 &#x27;Number: 50&#x27;이 화면 가운데 표시되게 하세요.&lt;/li&gt;&lt;li&gt;글자가 너무 작다면 text_entity.scale로 키워 보세요.&lt;/li&gt;&lt;/ol&gt;
    &lt;/section&gt;
    &lt;section class=&quot;card&quot; id=&quot;sec6&quot;&gt;
      &lt;div class=&quot;section-kicker&quot;&gt;06 / PRACTICE — ADVANCED&lt;/div&gt;
      &lt;h2&gt;실습 문제 · 심화 (힌트 포함)&lt;/h2&gt;
&lt;h3&gt;문제 3. 키로 즉시 증감&lt;/h3&gt;&lt;p&gt;1키로 값이 1 줄고, 2키로 1 늘어나며, 그 즉시 화면 숫자가 바뀌게 input을 구현하세요.&lt;/p&gt;
&lt;blockquote&gt;힌트: 값을 바꾼 &#x27;직후&#x27; f-string으로 text_entity.text를 다시 씁니다.&lt;/blockquote&gt;
&lt;h3&gt;문제 4. 꾹 누르면 연속 증감&lt;/h3&gt;&lt;p&gt;키를 꾹 누르고 있으면 숫자가 다다다닥 연속으로 변하게 만드세요.&lt;/p&gt;
&lt;blockquote&gt;힌트: key == &#x27;1&#x27; or key == &#x27;1 hold&#x27; 처럼 hold 이벤트를 함께 받습니다.&lt;/blockquote&gt;
&lt;h3&gt;문제 5. 범위 제한 + 색 경고&lt;/h3&gt;&lt;p&gt;값이 0~100을 벗어나지 않게 clamp를 넣고, 0 또는 100에 도달하면 글자색이 빨갛게 바뀌게 하세요.&lt;/p&gt;
&lt;blockquote&gt;힌트: self.text_entity.color = color.red — 경계가 아니면 다시 흰색으로.&lt;/blockquote&gt;
&lt;h3&gt;문제 6. (종합) 점수판 위젯 재사용&lt;/h3&gt;&lt;p&gt;위젯 클래스에 위치·라벨을 인자로 받게 개조해서(예: InstantNumbers(50, y=.3, label=&#x27;HP&#x27;)), 화면에 HP와 MP 두 개의 독립적인 숫자판을 띄우세요.&lt;/p&gt;
&lt;blockquote&gt;힌트: __init__(self, value, y=0, label=&#x27;Number&#x27;) 로 받아 position과 f-string에 활용합니다.&lt;/blockquote&gt;
    &lt;/section&gt;
    &lt;section class=&quot;card&quot; id=&quot;sec7&quot;&gt;
      &lt;div class=&quot;section-kicker&quot;&gt;07 / FULL CODE · 정답 확인&lt;/div&gt;
      &lt;h2&gt;종합 예제 코드 — 즉시 갱신 숫자판&lt;/h2&gt;
&lt;p class=&quot;fullcode-notice&quot;&gt;✍️ 먼저 위 핵심 개념과 실습 문제를 참고해 스스로 코드를 작성해 보세요. 다 작성했거나 막히는 부분을 비교하고 싶을 때 아래를 눌러 전체 코드를 확인합니다.&lt;/p&gt;
&lt;details class=&quot;fullcode&quot;&gt;&lt;summary&gt;&lt;span class=&quot;lock&quot;&gt;🔒&lt;/span&gt;&lt;span&gt;전체 코드 확인하기&lt;/span&gt;&lt;span class=&quot;hint&quot;&gt;SPOILER · CLICK&lt;/span&gt;&lt;/summary&gt;
&lt;div class=&quot;fullcode-body&quot;&gt;
&lt;p&gt;Button 상속 위젯 + 홀드 연속 입력 + clamp까지 합친 예시입니다.&lt;/p&gt;
&lt;div class=&quot;code-wrap&quot;&gt;
&lt;div class=&quot;code-top&quot;&gt;&lt;span class=&quot;dot red&quot;&gt;&lt;/span&gt;&lt;span class=&quot;dot white&quot;&gt;&lt;/span&gt;&lt;span class=&quot;fname&quot;&gt;main.py&lt;/span&gt;&lt;/div&gt;
&lt;pre&gt;&lt;code class=&quot;language-python&quot;&gt;from ursina import *

class InstantNumbers(Button):
    def __init__(self, value):
        super().__init__(
            position=(0, 0),
            origin=(0, 0),
            scale=(Text.size*20, Text.size),
            color=color.black,
            text=&amp;quot;text&amp;quot;
        )
        self.text_entity.scale *= 5
        self.value = value
        self.text_entity.text = f&amp;#x27;Number: {self.value}&amp;#x27;

    def input(self, key):
        if key == &amp;#x27;1&amp;#x27; or key == &amp;#x27;1 hold&amp;#x27;:
            self.value -= 1
        if key == &amp;#x27;2&amp;#x27; or key == &amp;#x27;2 hold&amp;#x27;:
            self.value += 1
        self.value = clamp(self.value, 0, 100)
        self.text_entity.text = f&amp;#x27;Number: {self.value}&amp;#x27;

app = Ursina()
window.color = color.black

n = InstantNumbers(50)

app.run()&lt;/code&gt;&lt;/pre&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/details&gt;
    &lt;/section&gt;
    &lt;section class=&quot;card&quot; id=&quot;sec8&quot;&gt;
      &lt;div class=&quot;section-kicker&quot;&gt;08 / SELF-CHECK QUIZ&lt;/div&gt;
      &lt;h2&gt;자가 점검 퀴즈&lt;/h2&gt;
&lt;div class=&quot;quiz-item&quot;&gt;
&lt;p class=&quot;quiz-q&quot;&gt;1. 이 위젯이 Text가 아니라 Button을 상속한 이유는?&lt;/p&gt;
&lt;button class=&quot;quiz-toggle&quot; onclick=&quot;toggleAnswer(this)&quot;&gt;정답 보기&lt;/button&gt;
&lt;div class=&quot;quiz-answer&quot;&gt;Button은 배경 패널과 글자(text_entity)가 세트라서, 패널 위 숫자판 형태를 만들기 쉽기 때문입니다.&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;quiz-item&quot;&gt;
&lt;p class=&quot;quiz-q&quot;&gt;2. 버튼의 글자를 직접 다루려면 어떤 속성에 접근하나요?&lt;/p&gt;
&lt;button class=&quot;quiz-toggle&quot; onclick=&quot;toggleAnswer(this)&quot;&gt;정답 보기&lt;/button&gt;
&lt;div class=&quot;quiz-answer&quot;&gt;self.text_entity — 글자의 scale, text, color 등을 바꿀 수 있습니다.&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;quiz-item&quot;&gt;
&lt;p class=&quot;quiz-q&quot;&gt;3. 화면 숫자를 &#x27;즉시&#x27; 갱신하는 패턴은?&lt;/p&gt;
&lt;button class=&quot;quiz-toggle&quot; onclick=&quot;toggleAnswer(this)&quot;&gt;정답 보기&lt;/button&gt;
&lt;div class=&quot;quiz-answer&quot;&gt;값을 바꾼 직후 f-string으로 문자열을 새로 만들어 text_entity.text에 다시 넣는 것입니다.&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;quiz-item&quot;&gt;
&lt;p class=&quot;quiz-q&quot;&gt;4. 키를 꾹 누르고 있을 때 input으로 반복해서 들어오는 이벤트 이름은?&lt;/p&gt;
&lt;button class=&quot;quiz-toggle&quot; onclick=&quot;toggleAnswer(this)&quot;&gt;정답 보기&lt;/button&gt;
&lt;div class=&quot;quiz-answer&quot;&gt;&#x27;1 hold&#x27; 처럼 키 이름 뒤에 &#x27; hold&#x27;가 붙은 이벤트입니다.&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;quiz-item&quot;&gt;
&lt;p class=&quot;quiz-q&quot;&gt;5. 값이 0~100을 벗어나지 않게 하는 함수는?&lt;/p&gt;
&lt;button class=&quot;quiz-toggle&quot; onclick=&quot;toggleAnswer(this)&quot;&gt;정답 보기&lt;/button&gt;
&lt;div class=&quot;quiz-answer&quot;&gt;clamp(self.value, 0, 100)&lt;/div&gt;
&lt;/div&gt;
    &lt;/section&gt;
    &lt;section class=&quot;card&quot; id=&quot;sec9&quot;&gt;
      &lt;div class=&quot;section-kicker&quot;&gt;09 / CHECKLIST&lt;/div&gt;
      &lt;h2&gt;체크리스트&lt;/h2&gt;
&lt;div class=&quot;checklist&quot;&gt;&lt;label class=&quot;check-row&quot;&gt;&lt;input onchange=&quot;this.parentElement.classList.toggle(&#x27;checked&#x27;, this.checked)&quot; type=&quot;checkbox&quot;/&gt;&lt;span&gt;Button을 상속한 위젯 클래스를 만들 수 있다.&lt;/span&gt;&lt;/label&gt;&lt;label class=&quot;check-row&quot;&gt;&lt;input onchange=&quot;this.parentElement.classList.toggle(&#x27;checked&#x27;, this.checked)&quot; type=&quot;checkbox&quot;/&gt;&lt;span&gt;text_entity로 글자 크기와 내용을 조작할 수 있다.&lt;/span&gt;&lt;/label&gt;&lt;label class=&quot;check-row&quot;&gt;&lt;input onchange=&quot;this.parentElement.classList.toggle(&#x27;checked&#x27;, this.checked)&quot; type=&quot;checkbox&quot;/&gt;&lt;span&gt;f-string 갱신 패턴으로 숫자를 즉시 바꿀 수 있다.&lt;/span&gt;&lt;/label&gt;&lt;label class=&quot;check-row&quot;&gt;&lt;input onchange=&quot;this.parentElement.classList.toggle(&#x27;checked&#x27;, this.checked)&quot; type=&quot;checkbox&quot;/&gt;&lt;span&gt;hold 이벤트로 꾹 누름 연속 입력을 처리할 수 있다.&lt;/span&gt;&lt;/label&gt;&lt;label class=&quot;check-row&quot;&gt;&lt;input onchange=&quot;this.parentElement.classList.toggle(&#x27;checked&#x27;, this.checked)&quot; type=&quot;checkbox&quot;/&gt;&lt;span&gt;clamp와 결합해 안전한 숫자판 위젯을 완성할 수 있다.&lt;/span&gt;&lt;/label&gt;&lt;/div&gt;

      &lt;div class=&quot;section-kicker&quot;&gt;02 / GOALS&lt;/div&gt;
      &lt;h2&gt;학습 목표&lt;/h2&gt;
&lt;ul&gt;&lt;li&gt;파티클(입자) 하나를 클래스로 정의하기 — 위치·속도·수명&lt;/li&gt;&lt;li&gt;parent=camera.ui로 마우스 좌표계에 입자 붙이기&lt;/li&gt;&lt;li&gt;무작위 속도와 축소량으로 자연스러운 흩어짐 만들기&lt;/li&gt;&lt;li&gt;작아지면 destroy로 스스로 사라지는 수명 관리 배우기&lt;/li&gt;&lt;li&gt;투명 전체 버튼으로 &#x27;화면 아무 데나 클릭&#x27; 감지하기&lt;/li&gt;&lt;/ul&gt;
    &lt;/section&gt;
    &lt;section class=&quot;card&quot; id=&quot;sec3&quot;&gt;
      &lt;div class=&quot;section-kicker&quot;&gt;03 / CONCEPTS&lt;/div&gt;
      &lt;h2&gt;핵심 개념 정리&lt;/h2&gt;
&lt;h3&gt;3-1. 파티클 = 아주 작은 Entity + 자기만의 물리&lt;/h3&gt;
&lt;p&gt;스파크 입자 하나하나가 &lt;span class=&quot;mono-inline&quot;&gt;Entity&lt;/span&gt; 상속 클래스의 객체입니다. 태어날 때(__init__) 위치와 &lt;b&gt;무작위 속도(dx, dy)·축소량(ds)&lt;/b&gt;을 뽑아 갖습니다.&lt;/p&gt;
&lt;div class=&quot;code-wrap&quot;&gt;
&lt;div class=&quot;code-top&quot;&gt;&lt;span class=&quot;dot red&quot;&gt;&lt;/span&gt;&lt;span class=&quot;dot white&quot;&gt;&lt;/span&gt;&lt;span class=&quot;fname&quot;&gt;spark_init.py&lt;/span&gt;&lt;/div&gt;
&lt;pre&gt;&lt;code class=&quot;language-python&quot;&gt;class Sparks(Entity):
    def __init__(self, x, y):
        super().__init__()
        self.parent = camera.ui        # 마우스와 같은 화면 좌표계
        self.model = &amp;quot;circle&amp;quot;
        self.color = color.white
        self.scale = .012
        self.x = x
        self.y = y
        self.dx = random.randint(-2, 2) / 1000   # 무작위 x 속도
        self.dy = random.randint(-2, 2) / 1000   # 무작위 y 속도
        self.ds = random.randint(1, 3) / 5000    # 무작위 축소량&lt;/code&gt;&lt;/pre&gt;
&lt;/div&gt;
&lt;blockquote&gt;💡 parent=camera.ui — 화면(UI) 좌표계에 붙이면 mouse.x / mouse.y와 좌표가 딱 맞습니다.&lt;/blockquote&gt;
&lt;h3&gt;3-2. 수명 관리 — 작아지면 스스로 사라진다&lt;/h3&gt;
&lt;p&gt;update에서 매 프레임 이동하고 조금씩 작아지다가, 일정 크기보다 작아지면 destroy(self)로 자신을 제거합니다.&lt;/p&gt;
&lt;div class=&quot;code-wrap&quot;&gt;
&lt;div class=&quot;code-top&quot;&gt;&lt;span class=&quot;dot red&quot;&gt;&lt;/span&gt;&lt;span class=&quot;dot white&quot;&gt;&lt;/span&gt;&lt;span class=&quot;fname&quot;&gt;spark_update.py&lt;/span&gt;&lt;/div&gt;
&lt;pre&gt;&lt;code class=&quot;language-python&quot;&gt;def update(self):
    self.x += self.dx
    self.y += self.dy
    self.scale -= self.ds
    if self.scale &amp;lt;= .005:
        destroy(self)          # 스스로 소멸!&lt;/code&gt;&lt;/pre&gt;
&lt;/div&gt;
&lt;blockquote&gt;💡 객체가 자신을 destroy하는 것이 어색해 보여도 괜찮습니다 — 파티클 시스템의 표준 패턴입니다.&lt;/blockquote&gt;
&lt;h3&gt;3-3. 한 번에 여러 개 태어나기&lt;/h3&gt;
&lt;p&gt;클릭 순간 &lt;span class=&quot;mono-inline&quot;&gt;mouse.x, mouse.y&lt;/span&gt; 위치에서 입자 9개를 한꺼번에 만듭니다. 각자 무작위 속도를 가졌으니 사방으로 흩어집니다.&lt;/p&gt;
&lt;div class=&quot;code-wrap&quot;&gt;
&lt;div class=&quot;code-top&quot;&gt;&lt;span class=&quot;dot red&quot;&gt;&lt;/span&gt;&lt;span class=&quot;dot white&quot;&gt;&lt;/span&gt;&lt;span class=&quot;fname&quot;&gt;burst.py&lt;/span&gt;&lt;/div&gt;
&lt;pre&gt;&lt;code class=&quot;language-python&quot;&gt;def CreateSparks():
    num = 9
    e = [None] * num
    for i in range(num):
        e[i] = Sparks(mouse.x, mouse.y)   # 같은 곳에서 태어나 제각각 흩어짐&lt;/code&gt;&lt;/pre&gt;
&lt;/div&gt;
&lt;h3&gt;3-4. 투명 전체 버튼 — 화면 아무 데나 클릭 감지&lt;/h3&gt;
&lt;p&gt;화면 전체를 덮는 &lt;b&gt;투명한&lt;/b&gt; 버튼을 깔아 두면 어디를 클릭해도 on_click이 울립니다. &lt;span class=&quot;mono-inline&quot;&gt;color.rgb(255,255,255,0)&lt;/span&gt; 의 마지막 0이 투명도(alpha)입니다.&lt;/p&gt;
&lt;div class=&quot;code-wrap&quot;&gt;
&lt;div class=&quot;code-top&quot;&gt;&lt;span class=&quot;dot red&quot;&gt;&lt;/span&gt;&lt;span class=&quot;dot white&quot;&gt;&lt;/span&gt;&lt;span class=&quot;fname&quot;&gt;screen_btn.py&lt;/span&gt;&lt;/div&gt;
&lt;pre&gt;&lt;code class=&quot;language-python&quot;&gt;B = Button(text=&amp;#x27;&amp;#x27;, color=color.rgb(255, 255, 255, 0), scale=2)
B.on_click = CreateSparks&lt;/code&gt;&lt;/pre&gt;
&lt;/div&gt;
    &lt;/section&gt;
    &lt;section class=&quot;card&quot; id=&quot;sec4&quot;&gt;
      &lt;div class=&quot;section-kicker&quot;&gt;04 / SUMMARY&lt;/div&gt;
      &lt;h2&gt;핵심 정리&lt;/h2&gt;
&lt;ul&gt;&lt;li&gt;파티클 = Entity 상속 + __init__에서 무작위 dx/dy/ds 부여&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;mono-inline&quot;&gt;parent=camera.ui&lt;/span&gt; → mouse 좌표계와 일치&lt;/li&gt;&lt;li&gt;update: 이동 + 축소, &lt;span class=&quot;mono-inline&quot;&gt;scale &lt;= .005&lt;/span&gt; 이면 &lt;span class=&quot;mono-inline&quot;&gt;destroy(self)&lt;/span&gt;&lt;/li&gt;&lt;li&gt;클릭 1번 → for문으로 입자 9개 동시 생성 → 사방으로 흩어짐&lt;/li&gt;&lt;li&gt;투명 전체 버튼(&lt;span class=&quot;mono-inline&quot;&gt;alpha=0&lt;/span&gt;) + on_click = 화면 클릭 감지&lt;/li&gt;&lt;/ul&gt;
    &lt;/section&gt;
    &lt;section class=&quot;card&quot; id=&quot;sec5&quot;&gt;
      &lt;div class=&quot;section-kicker&quot;&gt;05 / PRACTICE — BASIC&lt;/div&gt;
      &lt;h2&gt;실습 문제 · 기본&lt;/h2&gt;
&lt;ol&gt;&lt;li&gt;Entity를 상속한 Sparks 클래스를 만들어, 화면 중앙에 작은 흰 원 하나가 나타나게 하세요.&lt;/li&gt;&lt;li&gt;__init__에서 무작위 dx, dy를 뽑고 update에서 그만큼 매 프레임 이동시키세요.&lt;/li&gt;&lt;/ol&gt;
    &lt;/section&gt;
    &lt;section class=&quot;card&quot; id=&quot;sec6&quot;&gt;
      &lt;div class=&quot;section-kicker&quot;&gt;06 / PRACTICE — ADVANCED&lt;/div&gt;
      &lt;h2&gt;실습 문제 · 심화 (힌트 포함)&lt;/h2&gt;
&lt;h3&gt;문제 3. 수명 추가&lt;/h3&gt;&lt;p&gt;입자가 점점 작아지다가 일정 크기 이하가 되면 스스로 사라지게 만드세요.&lt;/p&gt;
&lt;blockquote&gt;힌트: ds(축소량)를 __init__에서 뽑고, update에서 scale에서 빼다가 destroy(self)&lt;/blockquote&gt;
&lt;h3&gt;문제 4. 클릭 지점에서 터지기&lt;/h3&gt;&lt;p&gt;투명 전체 버튼을 깔고, 클릭한 위치(mouse.x, mouse.y)에서 입자 9개가 태어나게 CreateSparks 함수를 완성하세요.&lt;/p&gt;
&lt;blockquote&gt;힌트: B = Button(text=&#x27;&#x27;, color=color.rgb(255,255,255,0), scale=2); B.on_click = CreateSparks&lt;/blockquote&gt;
&lt;h3&gt;문제 5. 불꽃 색 입히기&lt;/h3&gt;&lt;p&gt;입자가 태어날 때 흰색·노랑·주황 중 무작위 색을 갖게 해서 진짜 불꽃처럼 만들어 보세요.&lt;/p&gt;
&lt;blockquote&gt;힌트: random.choice([color.white, color.yellow, color.orange])&lt;/blockquote&gt;
&lt;h3&gt;문제 6. (종합) 폭죽 놀이&lt;/h3&gt;&lt;p&gt;클릭할 때마다 입자 개수를 20개로 늘리고, 입자마다 크기도 무작위로 다르게 해서 화려한 폭죽을 완성하세요. 배경을 검게(window.color) 하면 더 예쁩니다!&lt;/p&gt;
    &lt;/section&gt;
    &lt;section class=&quot;card&quot; id=&quot;sec7&quot;&gt;
      &lt;div class=&quot;section-kicker&quot;&gt;07 / FULL CODE · 정답 확인&lt;/div&gt;
      &lt;h2&gt;종합 예제 코드 — 클릭 스파크&lt;/h2&gt;
&lt;p class=&quot;fullcode-notice&quot;&gt;✍️ 먼저 위 핵심 개념과 실습 문제를 참고해 스스로 코드를 작성해 보세요. 다 작성했거나 막히는 부분을 비교하고 싶을 때 아래를 눌러 전체 코드를 확인합니다.&lt;/p&gt;
&lt;details class=&quot;fullcode&quot;&gt;&lt;summary&gt;&lt;span class=&quot;lock&quot;&gt;🔒&lt;/span&gt;&lt;span&gt;전체 코드 확인하기&lt;/span&gt;&lt;span class=&quot;hint&quot;&gt;SPOILER · CLICK&lt;/span&gt;&lt;/summary&gt;
&lt;div class=&quot;fullcode-body&quot;&gt;
&lt;p&gt;파티클 클래스 + 9개 동시 생성 + 투명 전체 버튼을 합친 예시입니다.&lt;/p&gt;
&lt;div class=&quot;code-wrap&quot;&gt;
&lt;div class=&quot;code-top&quot;&gt;&lt;span class=&quot;dot red&quot;&gt;&lt;/span&gt;&lt;span class=&quot;dot white&quot;&gt;&lt;/span&gt;&lt;span class=&quot;fname&quot;&gt;main.py&lt;/span&gt;&lt;/div&gt;
&lt;pre&gt;&lt;code class=&quot;language-python&quot;&gt;from ursina import *
import random

class Sparks(Entity):
    def __init__(self, x, y):
        super().__init__()
        self.parent = camera.ui
        self.model = &amp;quot;circle&amp;quot;
        self.color = color.white
        self.scale = .012
        self.x = x
        self.y = y
        self.dx = random.randint(-2, 2) / 1000
        self.dy = random.randint(-2, 2) / 1000
        self.ds = random.randint(1, 3) / 5000

    def update(self):
        self.x += self.dx
        self.y += self.dy
        self.scale -= self.ds
        if self.scale &amp;lt;= .005:
            destroy(self)

def CreateSparks():
    num = 9
    e = [None] * num
    for i in range(num):
        e[i] = Sparks(mouse.x, mouse.y)

app = Ursina()

B = Button(text=&amp;#x27;&amp;#x27;, color=color.rgb(255, 255, 255, 0), scale=2)  # 투명 전체 버튼
B.on_click = CreateSparks

app.run()&lt;/code&gt;&lt;/pre&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/details&gt;
    &lt;/section&gt;
    &lt;section class=&quot;card&quot; id=&quot;sec8&quot;&gt;
      &lt;div class=&quot;section-kicker&quot;&gt;08 / SELF-CHECK QUIZ&lt;/div&gt;
      &lt;h2&gt;자가 점검 퀴즈&lt;/h2&gt;
&lt;div class=&quot;quiz-item&quot;&gt;
&lt;p class=&quot;quiz-q&quot;&gt;1. 입자에 parent=camera.ui를 주는 이유는?&lt;/p&gt;
&lt;button class=&quot;quiz-toggle&quot; onclick=&quot;toggleAnswer(this)&quot;&gt;정답 보기&lt;/button&gt;
&lt;div class=&quot;quiz-answer&quot;&gt;화면(UI) 좌표계에 붙여서 mouse.x / mouse.y 좌표와 일치시키기 위해서입니다.&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;quiz-item&quot;&gt;
&lt;p class=&quot;quiz-q&quot;&gt;2. 입자들이 같은 곳에서 태어나는데 사방으로 흩어지는 이유는?&lt;/p&gt;
&lt;button class=&quot;quiz-toggle&quot; onclick=&quot;toggleAnswer(this)&quot;&gt;정답 보기&lt;/button&gt;
&lt;div class=&quot;quiz-answer&quot;&gt;각 입자가 __init__에서 서로 다른 무작위 속도(dx, dy)를 뽑아 갖기 때문입니다.&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;quiz-item&quot;&gt;
&lt;p class=&quot;quiz-q&quot;&gt;3. 입자의 수명은 어떻게 끝나나요?&lt;/p&gt;
&lt;button class=&quot;quiz-toggle&quot; onclick=&quot;toggleAnswer(this)&quot;&gt;정답 보기&lt;/button&gt;
&lt;div class=&quot;quiz-answer&quot;&gt;매 프레임 scale이 ds만큼 줄다가 .005 이하가 되면 destroy(self)로 스스로 사라집니다.&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;quiz-item&quot;&gt;
&lt;p class=&quot;quiz-q&quot;&gt;4. 화면 어디를 클릭해도 반응하게 만든 방법은?&lt;/p&gt;
&lt;button class=&quot;quiz-toggle&quot; onclick=&quot;toggleAnswer(this)&quot;&gt;정답 보기&lt;/button&gt;
&lt;div class=&quot;quiz-answer&quot;&gt;화면 전체를 덮는 투명 버튼(alpha=0)을 깔고 on_click에 함수를 연결했습니다.&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;quiz-item&quot;&gt;
&lt;p class=&quot;quiz-q&quot;&gt;5. color.rgb(255, 255, 255, 0)에서 마지막 0의 의미는?&lt;/p&gt;
&lt;button class=&quot;quiz-toggle&quot; onclick=&quot;toggleAnswer(this)&quot;&gt;정답 보기&lt;/button&gt;
&lt;div class=&quot;quiz-answer&quot;&gt;투명도(alpha) — 0이면 완전히 투명해서 보이지 않지만 클릭은 받습니다.&lt;/div&gt;
&lt;/div&gt;
    &lt;/section&gt;
    &lt;section class=&quot;card&quot; id=&quot;sec9&quot;&gt;
      &lt;div class=&quot;section-kicker&quot;&gt;09 / CHECKLIST&lt;/div&gt;
      &lt;h2&gt;체크리스트&lt;/h2&gt;
&lt;div class=&quot;checklist&quot;&gt;&lt;label class=&quot;check-row&quot;&gt;&lt;input onchange=&quot;this.parentElement.classList.toggle(&#x27;checked&#x27;, this.checked)&quot; type=&quot;checkbox&quot;/&gt;&lt;span&gt;파티클을 Entity 상속 클래스로 정의할 수 있다.&lt;/span&gt;&lt;/label&gt;&lt;label class=&quot;check-row&quot;&gt;&lt;input onchange=&quot;this.parentElement.classList.toggle(&#x27;checked&#x27;, this.checked)&quot; type=&quot;checkbox&quot;/&gt;&lt;span&gt;무작위 속도·축소량으로 자연스러운 흩어짐을 만들 수 있다.&lt;/span&gt;&lt;/label&gt;&lt;label class=&quot;check-row&quot;&gt;&lt;input onchange=&quot;this.parentElement.classList.toggle(&#x27;checked&#x27;, this.checked)&quot; type=&quot;checkbox&quot;/&gt;&lt;span&gt;scale 기준으로 destroy(self) 수명 관리를 할 수 있다.&lt;/span&gt;&lt;/label&gt;&lt;label class=&quot;check-row&quot;&gt;&lt;input onchange=&quot;this.parentElement.classList.toggle(&#x27;checked&#x27;, this.checked)&quot; type=&quot;checkbox&quot;/&gt;&lt;span&gt;mouse 좌표에서 입자를 여러 개 동시 생성할 수 있다.&lt;/span&gt;&lt;/label&gt;&lt;label class=&quot;check-row&quot;&gt;&lt;input onchange=&quot;this.parentElement.classList.toggle(&#x27;checked&#x27;, this.checked)&quot; type=&quot;checkbox&quot;/&gt;&lt;span&gt;투명 전체 버튼으로 화면 클릭을 감지할 수 있다.&lt;/span&gt;&lt;/label&gt;&lt;/div&gt;
    &lt;/section&gt;
    &lt;section class=&quot;card&quot; id=&quot;sec10&quot;&gt;
      &lt;div class=&quot;section-kicker&quot;&gt;10 / REFERENCES&lt;/div&gt;
      &lt;h2&gt;참고 자료&lt;/h2&gt;
&lt;ul&gt;&lt;li&gt;&lt;a href=&quot;https://www.ursinaengine.org/api_reference.html&quot; rel=&quot;noopener&quot; target=&quot;_blank&quot;&gt;Ursina API Reference&lt;/a&gt;&lt;/li&gt;&lt;li&gt;&lt;a href=&quot;https://www.ursinaengine.org/api_reference.html#mouse&quot; rel=&quot;noopener&quot; target=&quot;_blank&quot;&gt;Ursina Mouse 문서&lt;/a&gt;&lt;/li&gt;&lt;/ul&gt;

&lt;style&gt;

  @media (max-width:880px){ .layout{grid-template-columns:1fr;} nav.toc{position:static !important; order:2;} }

  main{ display:flex; flex-direction:column; gap:28px; }

  .quiz-q{ font-size:16pt; font-weight:500; margin-bottom:10px; }
  .quiz-toggle{ font-family:var(--font-mono); font-size:14pt; background:var(--navy-deep); color:#9FE6D4; border:none; border-radius:7px; padding:7px 14px; cursor:pointer; }

  .check-row{ display:flex; align-items:flex-start; gap:12px; padding:12px 14px; border:1px solid var(--border); border-radius:10px; cursor:pointer; background:#FBFDFE; transition:background .15s; }

  .mono-inline{ font-family:var(--font-mono); }
  footer{ max-width:1180px; margin:0 auto; padding:0 24px 60px; color:var(--ink-soft); font-size:14pt; }
  footer hr{ border:none; border-top:1px solid var(--border); margin:0 0 20px; }

  /* --- 전체 코드 접이식 --- */
  details.fullcode{ margin-top:14px; }
  details.fullcode &gt; summary{
    list-style:none; cursor:pointer; user-select:none;
    display:flex; align-items:center; gap:12px;
    background:linear-gradient(160deg, var(--navy-deep) 0%, var(--navy-deep-2) 100%);
    color:#EAF1F6; border-radius:12px; padding:16px 20px;
    font-family:var(--font-head); font-weight:600; font-size:16pt;
    border:1px solid rgba(255,255,255,0.12);
    transition:filter .15s ease;
  }
  details.fullcode &gt; summary:hover{ filter:brightness(1.15); }
  details.fullcode &gt; summary::-webkit-details-marker{ display:none; }
  details.fullcode &gt; summary .lock{ font-size:18pt; }
  details.fullcode &gt; summary .hint{
    margin-left:auto; font-family:var(--font-mono); font-size:12pt; font-weight:500;
    color:var(--coral); background:rgba(226,86,43,0.14);
    border:1px solid rgba(226,86,43,0.4); padding:4px 12px; border-radius:999px;
    white-space:nowrap;
  }
  details.fullcode[open] &gt; summary{ border-radius:12px 12px 0 0; }
  details.fullcode[open] &gt; summary .hint{ color:var(--teal); background:rgba(31,140,118,0.16); border-color:rgba(31,140,118,0.45); }
  details.fullcode &gt; .fullcode-body{
    border:1px solid var(--border); border-top:none; border-radius:0 0 12px 12px;
    padding:6px 18px 14px; background:var(--surface);
  }
  .fullcode-notice{
    margin:14px 0 0; padding:14px 18px; background:var(--teal-soft);
    border-left:4px solid var(--teal); border-radius:8px;
    font-size:15pt; color:#123D33;
  }



  /* 히어로 미니 데모 (차시별) */
  .mini-demo{ background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.14); border-radius:14px; padding:20px 22px; max-width:600px; }
  .mini-demo .demo-label{ font-family:var(--font-mono); font-size:14pt; color:#9FB6C4; margin-bottom:14px; display:flex; justify-content:space-between; }
  .demo-caption{ margin-top:12px; font-size:14pt; color:#8FA4B2; }
  .keycaps{ display:flex; gap:10px; }
  .keycap{ width:52px; height:52px; border-radius:9px; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.25); border-bottom-width:4px; display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-size:16pt; color:#EAF1F6; }
  @keyframes presskey{ 0%,100%{ transform:translateY(0); background:rgba(255,255,255,0.08);} 50%{ transform:translateY(3px); background:var(--coral);} }
  .keycap:nth-child(1){ animation:presskey 2.4s infinite 0s; }
  .keycap:nth-child(2){ animation:presskey 2.4s infinite .6s; }
  .keycap:nth-child(3){ animation:presskey 2.4s infinite 1.2s; }
  .keycap:nth-child(4){ animation:presskey 2.4s infinite 1.8s; }
  .demo-stage{ position:relative; height:70px; border:1px dashed rgba(255,255,255,0.25); border-radius:10px; overflow:hidden; }
  .demo-box{ position:absolute; top:17px; width:36px; height:36px; border-radius:7px; background:var(--coral); box-shadow:0 6px 18px rgba(0,0,0,.35); }
  @keyframes slide-lr{ 0%,100%{ left:8px; } 50%{ left:calc(100% - 44px); } }
  .anim-slide{ animation:slide-lr 4s ease-in-out infinite; }
  .demo-wall{ position:absolute; right:8px; top:12px; width:16px; height:46px; border-radius:5px; background:#3A6EA5; }
  @keyframes bump{ 0%,100%{ left:8px; background:var(--coral);} 45%{ left:calc(100% - 66px); background:var(--coral);} 50%{ left:calc(100% - 66px); background:#E8C547; } 55%{ left:calc(100% - 66px); background:var(--coral);} }
  .anim-bump{ animation:bump 4s ease-in-out infinite; }
  .class-diagram{ display:flex; align-items:center; gap:14px; font-family:var(--font-mono); font-size:13pt; color:#EAF1F6; }
  .class-node{ border:1px solid rgba(255,255,255,0.3); border-radius:9px; padding:9px 14px; background:rgba(255,255,255,0.06); }
  .class-node.blueprint{ border-color:var(--coral); color:var(--coral); }
  .class-arrow{ color:#7E909F; font-size:16pt; }
  @keyframes popin{ 0%,20%{ opacity:0; transform:scale(.7);} 40%,100%{ opacity:1; transform:scale(1);} }
  .class-node.obj1{ animation:popin 4s infinite; } .class-node.obj2{ animation:popin 4s infinite 1s; } .class-node.obj3{ animation:popin 4s infinite 2s; }
  .demo-btn{ display:inline-flex; align-items:center; justify-content:center; font-family:var(--font-head); font-weight:600; font-size:15pt; color:#EAF1F6; background:var(--teal); border-radius:10px; padding:12px 26px; box-shadow:0 6px 0 #14614f; }
  @keyframes clickbtn{ 0%,70%,100%{ transform:translateY(0); box-shadow:0 6px 0 #14614f;} 78%,86%{ transform:translateY(5px); box-shadow:0 1px 0 #14614f;} }
  .demo-btn{ animation:clickbtn 3s infinite; }
  .cursor-dot{ font-size:20pt; margin-left:14px; }
  .film{ display:flex; gap:8px; }
  .film .cell{ width:56px; height:56px; border-radius:8px; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.22); display:flex; align-items:center; justify-content:center; font-size:20pt; }
  .seq-track{ display:flex; align-items:center; gap:14px; font-family:var(--font-mono); font-size:12pt; color:#9FB6C4; }
  .seq-step{ width:46px; height:46px; border-radius:9px; display:flex; align-items:center; justify-content:center; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.22); font-size:17pt; }
  @keyframes seqfire{ 0%,100%{ background:rgba(255,255,255,0.08); transform:scale(1);} 12%{ background:var(--coral); transform:scale(1.12);} 24%{ background:rgba(255,255,255,0.08);} }
  .seq-step:nth-child(1){ animation:seqfire 3.6s infinite 0s; }
  .seq-step:nth-child(3){ animation:seqfire 3.6s infinite 1.2s; }
  .seq-step:nth-child(5){ animation:seqfire 3.6s infinite 2.4s; }
  .seq-wait{ color:#7E909F; }
  .chain{ position:relative; height:66px; }
  .chain .seg{ position:absolute; top:20px; width:22px; height:22px; border-radius:50%; background:var(--teal); }
  @keyframes wave{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-16px);} }
  .chain .seg:nth-child(1){ left:6%;  animation:wave 2s infinite 0s;   background:var(--coral); width:28px; height:28px; top:17px; }
  .chain .seg:nth-child(2){ left:16%; animation:wave 2s infinite .12s; }
  .chain .seg:nth-child(3){ left:25%; animation:wave 2s infinite .24s; }
  .chain .seg:nth-child(4){ left:34%; animation:wave 2s infinite .36s; }
  .chain .seg:nth-child(5){ left:43%; animation:wave 2s infinite .48s; }
  .chain .seg:nth-child(6){ left:52%; animation:wave 2s infinite .6s; }
  .chain .seg:nth-child(7){ left:61%; animation:wave 2s infinite .72s; }
  .chain .seg:nth-child(8){ left:70%; animation:wave 2s infinite .84s; }
  .hp-wrap{ position:relative; height:34px; border-radius:8px; background:#B33A2B; overflow:hidden; border:1px solid rgba(255,255,255,0.25); }
  .hp-fill{ position:absolute; inset:0; background:#3DBB8D; transform-origin:left center; }
  @keyframes hpdrain{ 0%,15%{ transform:scaleX(1);} 55%{ transform:scaleX(.28);} 75%{ transform:scaleX(.6);} 100%{ transform:scaleX(1);} }
  .hp-fill{ animation:hpdrain 4.5s ease-in-out infinite; }
  .counter-demo{ font-family:var(--font-mono); font-size:24pt; color:#EAF1F6; background:#000; border:1px solid rgba(255,255,255,0.2); border-radius:10px; padding:14px 22px; display:inline-flex; gap:12px; align-items:center; }
  @keyframes tick{ 0%{content:&quot;48&quot;;} }
  .anim-multi{ display:flex; gap:26px; align-items:center; height:70px; }
  .am{ width:34px; height:34px; border-radius:7px; background:var(--coral); }
  @keyframes am-x{ 0%,100%{ transform:translateX(0);} 50%{ transform:translateX(46px);} }
  @keyframes am-c{ 0%,100%{ background:var(--teal);} 50%{ background:var(--coral);} }
  @keyframes am-s{ 0%,100%{ transform:scale(.7);} 50%{ transform:scale(1.25);} }
  @keyframes am-r{ 0%{ transform:rotate(0);} 100%{ transform:rotate(360deg);} }
  .am1{ animation:am-x 2.2s ease-in-out infinite; }
  .am2{ border-radius:50%; animation:am-c 2.2s infinite; }
  .am3{ animation:am-s 2.6s ease-in-out infinite; background:#E8C547; }
  .am4{ animation:am-r 3s linear infinite; background:#3A6EA5; }
  .fx-stage{ position:relative; height:86px; border:1px dashed rgba(255,255,255,0.25); border-radius:10px; overflow:hidden; }
  .spark{ position:absolute; left:50%; top:55%; width:9px; height:9px; border-radius:50%; background:#fff; }
  @keyframes sp{ 0%{ transform:translate(0,0) scale(1); opacity:1;} 100%{ transform:translate(var(--tx), var(--ty)) scale(.1); opacity:0;} }
  .spark:nth-child(1){ --tx:-46px; --ty:-30px; animation:sp 1.6s ease-out infinite; }
  .spark:nth-child(2){ --tx:38px; --ty:-40px; animation:sp 1.6s ease-out infinite .1s; }
  .spark:nth-child(3){ --tx:-24px; --ty:26px; animation:sp 1.6s ease-out infinite .2s; }
  .spark:nth-child(4){ --tx:52px; --ty:14px; animation:sp 1.6s ease-out infinite .05s; }
  .spark:nth-child(5){ --tx:8px; --ty:-48px; animation:sp 1.6s ease-out infinite .15s; }
  .spark:nth-child(6){ --tx:-52px; --ty:6px; animation:sp 1.6s ease-out infinite .25s; }
  .bubble{ position:absolute; bottom:-14px; width:12px; height:12px; border-radius:50%; border:1.5px solid rgba(255,255,255,.8); background:rgba(255,255,255,.12); }
  @keyframes bub{ 0%{ transform:translateY(0) translateX(0); opacity:1;} 100%{ transform:translateY(-92px) translateX(var(--bx)); opacity:0;} }
  .bubble:nth-child(1){ left:18%; --bx:6px;  animation:bub 2.4s linear infinite 0s; }
  .bubble:nth-child(2){ left:32%; --bx:-8px; animation:bub 2.4s linear infinite .5s; width:9px; height:9px; }
  .bubble:nth-child(3){ left:48%; --bx:10px; animation:bub 2.4s linear infinite 1s; }
  .bubble:nth-child(4){ left:63%; --bx:-6px; animation:bub 2.4s linear infinite 1.5s; width:15px; height:15px; }
  .bubble:nth-child(5){ left:78%; --bx:4px;  animation:bub 2.4s linear infinite 2s; width:10px; height:10px; }
  @keyframes framelight{ 0%,100%{ background:rgba(255,255,255,0.08);} 12%{ background:var(--coral);} 24%{ background:rgba(255,255,255,0.08);} }

  .film .cell:nth-child(2){ animation:framelight 2.8s infinite .35s; }
  .film .cell:nth-child(3){ animation:framelight 2.8s infinite .7s; }
  .film .cell:nth-child(4){ animation:framelight 2.8s infinite 1.05s; }
  .film .cell:nth-child(5){ animation:framelight 2.8s infinite 1.4s; }
  /* 19: OBJ 모델 회전 */
  .obj-stage{ display:flex; align-items:center; justify-content:center; height:80px; border:1px dashed rgba(255,255,255,0.25); border-radius:10px; perspective:300px; }

  @keyframes objspin{ from{ transform:rotateY(0);} to{ transform:rotateY(360deg);} }
  /* 20: 공전 */
  .orbit-stage{ position:relative; height:110px; }
  .orbit-center{ position:absolute; left:50%; top:50%; width:10px; height:10px; margin:-5px; border-radius:50%; background:var(--coral); }
  .orbit-ring{ position:absolute; left:50%; top:50%; width:80px; height:80px; margin:-40px; border:1px dashed rgba(255,255,255,0.3); border-radius:50%; }
  .orbit-arm{ position:absolute; left:50%; top:50%; width:0; height:0; animation:orbitrot 5s linear infinite; }
  .orbit-sat{ position:absolute; left:-7px; top:-47px; width:14px; height:26px; border-radius:4px; background:#57C7FF; }
  @keyframes orbitrot{ from{ transform:rotate(0);} to{ transform:rotate(360deg);} }
