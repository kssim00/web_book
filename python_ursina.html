    &lt;section class=&quot;card&quot; id=&quot;sec1&quot;&gt;
      &lt;div class=&quot;section-kicker&quot;&gt;01 / REVIEW&lt;/div&gt;
      &lt;h2&gt;지난 시간 복습 (#20)&lt;/h2&gt;
&lt;ul&gt;&lt;li&gt;파티클 클래스: 무작위 dx/dy/ds + update 이동·축소&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;mono-inline&quot;&gt;destroy(self)&lt;/span&gt; 수명 관리, 투명 전체 버튼 클릭 감지&lt;/li&gt;&lt;/ul&gt;
    &lt;/section&gt;
    &lt;section class=&quot;card&quot; id=&quot;sec2&quot;&gt;
      &lt;div class=&quot;section-kicker&quot;&gt;02 / GOALS&lt;/div&gt;
      &lt;h2&gt;학습 목표&lt;/h2&gt;
&lt;ul&gt;&lt;li&gt;스파크 코드를 변형해 &#x27;위로만 떠오르는&#x27; 움직임 만들기&lt;/li&gt;&lt;li&gt;시작 위치(x0, y0)를 기억해 두는 이유 이해하기&lt;/li&gt;&lt;li&gt;destroy 대신 리셋(재사용) 패턴으로 무한 반복 입자 만들기&lt;/li&gt;&lt;li&gt;두 패턴(소멸 vs 재사용)의 장단점 비교하기&lt;/li&gt;&lt;/ul&gt;
    &lt;/section&gt;
    &lt;section class=&quot;card&quot; id=&quot;sec3&quot;&gt;
      &lt;div class=&quot;section-kicker&quot;&gt;03 / CONCEPTS&lt;/div&gt;
      &lt;h2&gt;핵심 개념 정리&lt;/h2&gt;
&lt;h3&gt;3-1. 스파크와 무엇이 다른가 — 방향&lt;/h3&gt;
&lt;p&gt;버블은 사방이 아니라 &lt;b&gt;위로만&lt;/b&gt; 올라갑니다. 비결은 y 증가량의 난수 범위: &lt;span class=&quot;mono-inline&quot;&gt;random.randint(0, 2)&lt;/span&gt; 는 음수가 없어 아래로는 절대 내려가지 않습니다. x는 (-2, 2)로 살랑살랑 좌우 흔들림만 줍니다.&lt;/p&gt;
&lt;div class=&quot;code-wrap&quot;&gt;
&lt;div class=&quot;code-top&quot;&gt;&lt;span class=&quot;dot red&quot;&gt;&lt;/span&gt;&lt;span class=&quot;dot white&quot;&gt;&lt;/span&gt;&lt;span class=&quot;fname&quot;&gt;bubble_move.py&lt;/span&gt;&lt;/div&gt;
&lt;pre&gt;&lt;code class=&quot;language-python&quot;&gt;def update(self):
    self.x += random.randint(-2, 2) / 1000   # 좌우로 살랑살랑
    self.y += random.randint(0, 2) / 500     # 위로만! (0 이상)
    self.scale -= .00015&lt;/code&gt;&lt;/pre&gt;
&lt;/div&gt;
&lt;blockquote&gt;💡 스파크는 태어날 때 속도를 &#x27;한 번&#x27; 뽑았지만, 버블은 매 프레임 새로 뽑아 더 몽글몽글한 흔들림을 만듭니다.&lt;/blockquote&gt;
&lt;h3&gt;3-2. 시작 위치를 기억하기 — x0, y0&lt;/h3&gt;
&lt;p&gt;곧 배울 리셋 패턴을 위해, 태어난 위치를 x0, y0에 따로 저장해 둡니다. x는 계속 변하지만 x0는 변하지 않는 &#x27;고향 주소&#x27;입니다.&lt;/p&gt;
&lt;div class=&quot;code-wrap&quot;&gt;
&lt;div class=&quot;code-top&quot;&gt;&lt;span class=&quot;dot red&quot;&gt;&lt;/span&gt;&lt;span class=&quot;dot white&quot;&gt;&lt;/span&gt;&lt;span class=&quot;fname&quot;&gt;bubble_init.py&lt;/span&gt;&lt;/div&gt;
&lt;pre&gt;&lt;code class=&quot;language-python&quot;&gt;class Bubbles(Entity):
    def __init__(self, x, y):
        super().__init__()
        self.parent = camera.ui
        self.model = &amp;quot;circle&amp;quot;
        self.color = color.white
        self.scale = .012
        self.x0 = x      # 고향 주소 (변하지 않음)
        self.y0 = y
        self.x = x       # 현재 위치 (계속 변함)
        self.y = y&lt;/code&gt;&lt;/pre&gt;
&lt;/div&gt;
&lt;h3&gt;3-3. destroy 대신 리셋 — 재사용 패턴&lt;/h3&gt;
&lt;p&gt;스파크는 작아지면 destroy로 사라졌습니다. 버블은 &lt;b&gt;시작점으로 돌아가 크기를 되돌립니다&lt;/b&gt;. 같은 객체가 무한히 다시 떠오르죠 — 만들고 부수기를 반복하지 않아 효율적입니다.&lt;/p&gt;
&lt;div class=&quot;code-wrap&quot;&gt;
&lt;div class=&quot;code-top&quot;&gt;&lt;span class=&quot;dot red&quot;&gt;&lt;/span&gt;&lt;span class=&quot;dot white&quot;&gt;&lt;/span&gt;&lt;span class=&quot;fname&quot;&gt;reset.py&lt;/span&gt;&lt;/div&gt;
&lt;pre&gt;&lt;code class=&quot;language-python&quot;&gt;if self.scale &amp;lt;= .005:
    self.x = self.x0        # 고향으로!
    self.y = self.y0
    self.scale = .012       # 크기도 처음처럼&lt;/code&gt;&lt;/pre&gt;
&lt;/div&gt;
&lt;blockquote&gt;💡 게임에서 총알·입자처럼 수없이 생겼다 사라지는 것들은 이렇게 &#x27;재사용(오브젝트 풀링)&#x27;하는 게 정석입니다.&lt;/blockquote&gt;
&lt;h3&gt;3-4. 클릭한 곳에서 버블 10개&lt;/h3&gt;
&lt;p&gt;구조는 스파크와 동일합니다 — 투명 전체 버튼 + on_click + for문 생성. 이번엔 한 번 만들면 영원히 떠오릅니다.&lt;/p&gt;
&lt;div class=&quot;code-wrap&quot;&gt;
&lt;div class=&quot;code-top&quot;&gt;&lt;span class=&quot;dot red&quot;&gt;&lt;/span&gt;&lt;span class=&quot;dot white&quot;&gt;&lt;/span&gt;&lt;span class=&quot;fname&quot;&gt;create.py&lt;/span&gt;&lt;/div&gt;
&lt;pre&gt;&lt;code class=&quot;language-python&quot;&gt;def CreateBubbles():
    num = 10
    e = [None] * num
    for i in range(num):
        e[i] = Bubbles(mouse.x, mouse.y)&lt;/code&gt;&lt;/pre&gt;
&lt;/div&gt;
    &lt;/section&gt;
    &lt;section class=&quot;card&quot; id=&quot;sec4&quot;&gt;
      &lt;div class=&quot;section-kicker&quot;&gt;04 / SUMMARY&lt;/div&gt;
      &lt;h2&gt;핵심 정리&lt;/h2&gt;
&lt;ul&gt;&lt;li&gt;위로만: &lt;span class=&quot;mono-inline&quot;&gt;random.randint(0, 2)&lt;/span&gt; — 난수 범위로 방향 통제&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;mono-inline&quot;&gt;x0, y0&lt;/span&gt; 에 시작 위치 저장 (현재 위치와 분리)&lt;/li&gt;&lt;li&gt;리셋 패턴: 작아지면 &lt;span class=&quot;mono-inline&quot;&gt;x=x0; y=y0; scale=.012&lt;/span&gt; — destroy 없이 재사용&lt;/li&gt;&lt;li&gt;소멸(스파크) vs 재사용(버블) — 일회성 효과냐 지속 효과냐로 선택&lt;/li&gt;&lt;li&gt;생성 구조는 동일: 투명 버튼 + on_click + for문&lt;/li&gt;&lt;/ul&gt;
    &lt;/section&gt;
    &lt;section class=&quot;card&quot; id=&quot;sec5&quot;&gt;
      &lt;div class=&quot;section-kicker&quot;&gt;05 / PRACTICE — BASIC&lt;/div&gt;
      &lt;h2&gt;실습 문제 · 기본&lt;/h2&gt;
&lt;ol&gt;&lt;li&gt;#20의 Sparks를 복사해 Bubbles로 이름을 바꾸고, y 난수 범위를 고쳐 위로만 떠오르게 하세요.&lt;/li&gt;&lt;li&gt;x는 매 프레임 (-2, 2) 난수로 좌우 흔들림을 주세요.&lt;/li&gt;&lt;/ol&gt;
    &lt;/section&gt;
    &lt;section class=&quot;card&quot; id=&quot;sec6&quot;&gt;
      &lt;div class=&quot;section-kicker&quot;&gt;06 / PRACTICE — ADVANCED&lt;/div&gt;
      &lt;h2&gt;실습 문제 · 심화 (힌트 포함)&lt;/h2&gt;
&lt;h3&gt;문제 3. 리셋 패턴으로 바꾸기&lt;/h3&gt;&lt;p&gt;destroy(self) 부분을 시작점 복귀 + 크기 복원으로 바꿔, 버블이 무한히 다시 떠오르게 하세요.&lt;/p&gt;
&lt;blockquote&gt;힌트: __init__에서 self.x0, self.y0에 시작 위치를 저장해 둬야 합니다.&lt;/blockquote&gt;
&lt;h3&gt;문제 4. 버블답게 꾸미기&lt;/h3&gt;&lt;p&gt;버블 크기를 저마다 무작위로 다르게 하고, 살짝 투명하게(color.rgba) 만들어 보세요.&lt;/p&gt;
&lt;blockquote&gt;힌트: scale=random.uniform(.008, .02), color=color.rgba(255,255,255,150)&lt;/blockquote&gt;
&lt;h3&gt;문제 5. 어항 만들기&lt;/h3&gt;&lt;p&gt;클릭 없이도 프로그램 시작과 동시에 화면 아래쪽 여러 위치에서 버블들이 계속 떠오르는 &#x27;어항&#x27;을 만드세요.&lt;/p&gt;
&lt;blockquote&gt;힌트: app.run() 전에 for문으로 Bubbles(random.uniform(-.5,.5), -.5)를 여러 개 만들어 둡니다.&lt;/blockquote&gt;
&lt;h3&gt;문제 6. (종합) 스파크 vs 버블 통합&lt;/h3&gt;&lt;p&gt;왼쪽 클릭은 스파크(소멸형), 오른쪽 클릭은 버블(재사용형)이 터지는 프로그램을 만들어 두 패턴을 한 화면에서 비교하세요.&lt;/p&gt;
&lt;blockquote&gt;힌트: input(key)에서 &#x27;left mouse down&#x27;과 &#x27;right mouse down&#x27;을 구분합니다.&lt;/blockquote&gt;
    &lt;/section&gt;
    &lt;section class=&quot;card&quot; id=&quot;sec7&quot;&gt;
      &lt;div class=&quot;section-kicker&quot;&gt;07 / FULL CODE · 정답 확인&lt;/div&gt;
      &lt;h2&gt;종합 예제 코드 — 떠오르는 버블&lt;/h2&gt;
&lt;p class=&quot;fullcode-notice&quot;&gt;✍️ 먼저 위 핵심 개념과 실습 문제를 참고해 스스로 코드를 작성해 보세요. 다 작성했거나 막히는 부분을 비교하고 싶을 때 아래를 눌러 전체 코드를 확인합니다.&lt;/p&gt;
&lt;details class=&quot;fullcode&quot;&gt;&lt;summary&gt;&lt;span class=&quot;lock&quot;&gt;🔒&lt;/span&gt;&lt;span&gt;전체 코드 확인하기&lt;/span&gt;&lt;span class=&quot;hint&quot;&gt;SPOILER · CLICK&lt;/span&gt;&lt;/summary&gt;
&lt;div class=&quot;fullcode-body&quot;&gt;
&lt;p&gt;위로만 떠오르는 움직임 + 리셋 재사용 패턴 + 클릭 생성을 합친 예시입니다.&lt;/p&gt;
&lt;div class=&quot;code-wrap&quot;&gt;
&lt;div class=&quot;code-top&quot;&gt;&lt;span class=&quot;dot red&quot;&gt;&lt;/span&gt;&lt;span class=&quot;dot white&quot;&gt;&lt;/span&gt;&lt;span class=&quot;fname&quot;&gt;main.py&lt;/span&gt;&lt;/div&gt;
&lt;pre&gt;&lt;code class=&quot;language-python&quot;&gt;from ursina import *
import random

class Bubbles(Entity):
    def __init__(self, x, y):
        super().__init__()
        self.parent = camera.ui
        self.model = &amp;quot;circle&amp;quot;
        self.color = color.white
        self.scale = .012
        self.x0 = x               # 시작 위치 기억
        self.y0 = y
        self.x = x
        self.y = y

    def update(self):
        self.x += random.randint(-2, 2) / 1000   # 좌우 흔들림
        self.y += random.randint(0, 2) / 500     # 위로만 상승
        self.scale -= .00015
        if self.scale &amp;lt;= .005:
            self.x = self.x0      # destroy 대신 리셋!
            self.y = self.y0
            self.scale = .012

def CreateBubbles():
    num = 10
    e = [None] * num
    for i in range(num):
        e[i] = Bubbles(mouse.x, mouse.y)

app = Ursina()

B = Button(text=&amp;#x27;&amp;#x27;, color=color.rgb(255, 255, 255, 0), scale=2)
B.on_click = CreateBubbles

app.run()&lt;/code&gt;&lt;/pre&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/details&gt;
    &lt;/section&gt;
    &lt;section class=&quot;card&quot; id=&quot;sec8&quot;&gt;
      &lt;div class=&quot;section-kicker&quot;&gt;08 / SELF-CHECK QUIZ&lt;/div&gt;
      &lt;h2&gt;자가 점검 퀴즈&lt;/h2&gt;
&lt;div class=&quot;quiz-item&quot;&gt;
&lt;p class=&quot;quiz-q&quot;&gt;1. 버블이 아래로는 절대 내려가지 않는 이유는?&lt;/p&gt;
&lt;button class=&quot;quiz-toggle&quot; onclick=&quot;toggleAnswer(this)&quot;&gt;정답 보기&lt;/button&gt;
&lt;div class=&quot;quiz-answer&quot;&gt;y 증가량의 난수 범위가 random.randint(0, 2)로 0 이상이라 음수(하강)가 나오지 않기 때문입니다.&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;quiz-item&quot;&gt;
&lt;p class=&quot;quiz-q&quot;&gt;2. x0, y0을 따로 저장해 두는 이유는?&lt;/p&gt;
&lt;button class=&quot;quiz-toggle&quot; onclick=&quot;toggleAnswer(this)&quot;&gt;정답 보기&lt;/button&gt;
&lt;div class=&quot;quiz-answer&quot;&gt;리셋할 때 돌아갈 &#x27;시작 위치&#x27;가 필요한데, x와 y는 매 프레임 변하므로 원본을 보존해 둬야 합니다.&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;quiz-item&quot;&gt;
&lt;p class=&quot;quiz-q&quot;&gt;3. destroy 대신 리셋을 쓰면 어떤 장점이 있나요?&lt;/p&gt;

    &lt;p class=&quot;sub&quot;&gt;texture_offset을 매 프레임 밀어 배경이 끝없이 흐르게 만들고, 애니메이션 캐릭터와 합쳐 &#x27;날아가는&#x27; 연출을 완성하는 자율 학습 페이지입니다.&lt;/p&gt;

  &lt;main&gt;

    &lt;section class=&quot;card&quot; id=&quot;sec1&quot;&gt;
      &lt;div class=&quot;section-kicker&quot;&gt;01 / REVIEW&lt;/div&gt;
      &lt;h2&gt;지난 시간 복습 (#21)&lt;/h2&gt;
&lt;ul&gt;&lt;li&gt;파티클 클래스: 무작위 이동 + 축소, 작아지면 &lt;span class=&quot;mono-inline&quot;&gt;destroy(self)&lt;/span&gt; 또는 시작값으로 리셋&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;mono-inline&quot;&gt;mouse.x, mouse.y&lt;/span&gt; 위치에 여러 개 생성하는 이펙트 패턴&lt;/li&gt;&lt;/ul&gt;
    &lt;/section&gt;
    &lt;section class=&quot;card&quot; id=&quot;sec2&quot;&gt;
      &lt;div class=&quot;section-kicker&quot;&gt;02 / GOALS&lt;/div&gt;
      &lt;h2&gt;학습 목표&lt;/h2&gt;
&lt;ul&gt;&lt;li&gt;texture_offset의 의미와 원리 이해하기&lt;/li&gt;&lt;li&gt;update에서 offset을 누적해 배경을 무한 스크롤시키기&lt;/li&gt;&lt;li&gt;Animation 캐릭터와 결합해 &#x27;이동하는 것처럼&#x27; 보이는 연출 만들기&lt;/li&gt;&lt;/ul&gt;
    &lt;/section&gt;
    &lt;section class=&quot;card&quot; id=&quot;sec3&quot;&gt;
      &lt;div class=&quot;section-kicker&quot;&gt;03 / CONCEPTS&lt;/div&gt;
      &lt;h2&gt;핵심 개념 정리&lt;/h2&gt;
&lt;h3&gt;3-1. 원리 — 캐릭터 대신 배경을 움직인다&lt;/h3&gt;
&lt;p&gt;캐릭터를 계속 오른쪽으로 옮기면 금방 화면 밖으로 나가 버립니다. 반대로 캐릭터는 제자리에 두고 배경 텍스처만 왼쪽으로 흘리면, 끝없이 이동하는 듯한 장면을 만들 수 있습니다. 러닝게임·플래피버드의 기본 기법!&lt;/p&gt;
&lt;h3&gt;3-2. texture_offset — 텍스처를 미는 손잡이&lt;/h3&gt;
&lt;p&gt;모든 텍스처에는 &lt;span class=&quot;mono-inline&quot;&gt;texture_offset&lt;/span&gt; 이라는 (x, y) 밀림값이 있습니다. x를 키우면 그림이 옆으로 밀리고, 반복(타일링)되는 텍스처라면 끊김 없이 이어집니다.&lt;/p&gt;
&lt;div class=&quot;code-wrap&quot;&gt;
&lt;div class=&quot;code-top&quot;&gt;&lt;span class=&quot;dot red&quot;&gt;&lt;/span&gt;&lt;span class=&quot;dot white&quot;&gt;&lt;/span&gt;&lt;span class=&quot;fname&quot;&gt;offset.py&lt;/span&gt;&lt;/div&gt;
&lt;pre&gt;&lt;code class=&quot;language-python&quot;&gt;bg = Entity(model=&amp;quot;quad&amp;quot;, scale=(20, 10), texture=&amp;quot;assets/bg.png&amp;quot;, z=.1)

# 오프셋 지정 — 두 방법 모두 같은 뜻
bg.texture_offset = (0.5, 0)
setattr(bg, &amp;quot;texture_offset&amp;quot;, (0.5, 0))&lt;/code&gt;&lt;/pre&gt;
&lt;/div&gt;
&lt;blockquote&gt;💡 영상에서는 setattr(객체, &quot;속성이름&quot;, 값) 형태를 소개합니다. 속성 이름을 문자열로 다룰 수 있는 파이썬 기본 함수예요.&lt;/blockquote&gt;
&lt;h3&gt;3-3. 무한 스크롤 — offset 누적&lt;/h3&gt;
&lt;p&gt;전역 변수 offset을 매 프레임 조금씩 키워 texture_offset에 넣으면 배경이 계속 흐릅니다. time.dt를 곱해 속도를 일정하게 유지합니다.&lt;/p&gt;
&lt;div class=&quot;code-wrap&quot;&gt;
&lt;div class=&quot;code-top&quot;&gt;&lt;span class=&quot;dot red&quot;&gt;&lt;/span&gt;&lt;span class=&quot;dot white&quot;&gt;&lt;/span&gt;&lt;span class=&quot;fname&quot;&gt;rolling.py&lt;/span&gt;&lt;/div&gt;
&lt;pre&gt;&lt;code class=&quot;language-python&quot;&gt;def update():
    global offset
    offset += time.dt * .3          # 흐르는 속도
    setattr(bg, &amp;quot;texture_offset&amp;quot;, (offset, 0))&lt;/code&gt;&lt;/pre&gt;
&lt;/div&gt;
&lt;blockquote&gt;💡 offset은 계속 커져도 됩니다 — 텍스처는 1을 넘어가면 자동으로 반복되니까요.&lt;/blockquote&gt;
&lt;h3&gt;3-4. 캐릭터 얹기 — Animation과 합체&lt;/h3&gt;
&lt;p&gt;#11에서 배운 &lt;span class=&quot;mono-inline&quot;&gt;Animation&lt;/span&gt; 으로 날갯짓하는 새를 배경 앞(z가 더 작은 쪽)에 두면, 새는 제자리인데 배경이 흘러 &#x27;날아가는&#x27; 것처럼 보입니다.&lt;/p&gt;
&lt;div class=&quot;code-wrap&quot;&gt;
&lt;div class=&quot;code-top&quot;&gt;&lt;span class=&quot;dot red&quot;&gt;&lt;/span&gt;&lt;span class=&quot;dot white&quot;&gt;&lt;/span&gt;&lt;span class=&quot;fname&quot;&gt;bird.py&lt;/span&gt;&lt;/div&gt;
&lt;pre&gt;&lt;code class=&quot;language-python&quot;&gt;bird = Animation(&amp;quot;assets/bird&amp;quot;, scale=(1.3, .8), y=1.5)&lt;/code&gt;&lt;/pre&gt;
&lt;/div&gt;
    &lt;/section&gt;
    &lt;section class=&quot;card&quot; id=&quot;sec4&quot;&gt;
      &lt;div class=&quot;section-kicker&quot;&gt;04 / SUMMARY&lt;/div&gt;
      &lt;h2&gt;핵심 정리&lt;/h2&gt;
&lt;ul&gt;&lt;li&gt;이동 연출 = 캐릭터 고정 + 배경 스크롤&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;mono-inline&quot;&gt;texture_offset = (x, y)&lt;/span&gt; — 텍스처 밀림값, 1을 넘으면 자동 반복&lt;/li&gt;&lt;li&gt;update에서 &lt;span class=&quot;mono-inline&quot;&gt;offset += time.dt * 속도&lt;/span&gt; 누적 → 무한 스크롤&lt;/li&gt;&lt;li&gt;Animation 캐릭터를 배경 앞에 얹어 완성&lt;/li&gt;&lt;/ul&gt;
    &lt;/section&gt;
    &lt;section class=&quot;card&quot; id=&quot;sec5&quot;&gt;
      &lt;div class=&quot;section-kicker&quot;&gt;05 / PRACTICE — BASIC&lt;/div&gt;
      &lt;h2&gt;실습 문제 · 기본&lt;/h2&gt;
&lt;ol&gt;&lt;li&gt;가로로 긴 배경 quad를 만들고, texture_offset을 (0.3, 0), (0.7, 0)으로 직접 바꿔 보며 그림이 어떻게 밀리는지 관찰하세요.&lt;/li&gt;&lt;li&gt;update에서 offset을 누적시켜 배경이 계속 흐르게 만드세요.&lt;/li&gt;&lt;/ol&gt;
    &lt;/section&gt;
    &lt;section class=&quot;card&quot; id=&quot;sec6&quot;&gt;
      &lt;div class=&quot;section-kicker&quot;&gt;06 / PRACTICE — ADVANCED&lt;/div&gt;
      &lt;h2&gt;실습 문제 · 심화 (힌트 포함)&lt;/h2&gt;
&lt;h3&gt;문제 3. 속도 조절&lt;/h3&gt;&lt;p&gt;배경 흐르는 속도를 위/아래 방향키로 실시간 조절할 수 있게 만드세요.&lt;/p&gt;
&lt;blockquote&gt;힌트: speed 전역 변수를 두고 offset += time.dt * speed 로 바꾼 뒤, input에서 speed를 증감합니다.&lt;/blockquote&gt;
&lt;h3&gt;문제 4. 새 얹기&lt;/h3&gt;&lt;p&gt;Animation으로 날갯짓하는 캐릭터를 배경 앞에 배치해 &#x27;나는&#x27; 연출을 완성하세요.&lt;/p&gt;
&lt;blockquote&gt;힌트: 배경 z=.1, 캐릭터는 기본(z=0)이면 캐릭터가 앞에 보입니다.&lt;/blockquote&gt;
&lt;h3&gt;문제 5. 2단 배경(패럴랙스)&lt;/h3&gt;&lt;p&gt;배경을 두 장(먼 산, 가까운 들판)으로 나누고 서로 다른 속도로 흘려 원근감을 만드세요. 먼 배경일수록 느리게!&lt;/p&gt;
&lt;blockquote&gt;힌트: offset 변수를 두 개 두고 누적 속도를 다르게 합니다 (예: .1과 .3).&lt;/blockquote&gt;
&lt;h3&gt;문제 6. (종합) 러닝게임 한 장면&lt;/h3&gt;&lt;p&gt;흐르는 배경 + 날갯짓 캐릭터 + w/s로 캐릭터 상하 이동까지 합쳐 러닝게임의 한 장면을 만드세요.&lt;/p&gt;
    &lt;/section&gt;
    &lt;section class=&quot;card&quot; id=&quot;sec7&quot;&gt;
      &lt;div class=&quot;section-kicker&quot;&gt;07 / FULL CODE · 정답 확인&lt;/div&gt;
      &lt;h2&gt;종합 예제 코드 — 흐르는 배경 위의 새&lt;/h2&gt;
&lt;p class=&quot;fullcode-notice&quot;&gt;✍️ 먼저 위 핵심 개념과 실습 문제를 참고해 스스로 코드를 작성해 보세요. 다 작성했거나 막히는 부분을 비교하고 싶을 때 아래를 눌러 전체 코드를 확인합니다.&lt;/p&gt;
&lt;details class=&quot;fullcode&quot;&gt;&lt;summary&gt;&lt;span class=&quot;lock&quot;&gt;🔒&lt;/span&gt;&lt;span&gt;전체 코드 확인하기&lt;/span&gt;&lt;span class=&quot;hint&quot;&gt;SPOILER · CLICK&lt;/span&gt;&lt;/summary&gt;
&lt;div class=&quot;fullcode-body&quot;&gt;
&lt;p&gt;texture_offset 누적으로 배경을 무한 스크롤시키고 Animation 새를 얹은, 영상의 최종 코드입니다.&lt;/p&gt;
&lt;div class=&quot;code-wrap&quot;&gt;
&lt;div class=&quot;code-top&quot;&gt;&lt;span class=&quot;dot red&quot;&gt;&lt;/span&gt;&lt;span class=&quot;dot white&quot;&gt;&lt;/span&gt;&lt;span class=&quot;fname&quot;&gt;main.py&lt;/span&gt;&lt;/div&gt;
&lt;pre&gt;&lt;code class=&quot;language-python&quot;&gt;from ursina import *

def update():
    global offset
    offset += time.dt * .3
    setattr(bg, &amp;quot;texture_offset&amp;quot;, (offset, 0))

app = Ursina()

offset = 0
bg = Entity(model=&amp;quot;quad&amp;quot;, scale=(20, 10), texture=&amp;quot;assets/bg.png&amp;quot;, z=.1)
bird = Animation(&amp;quot;assets/bird&amp;quot;, scale=(1.3, .8), y=1.5)

app.run()&lt;/code&gt;&lt;/pre&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/details&gt;
    &lt;/section&gt;
    &lt;section class=&quot;card&quot; id=&quot;sec8&quot;&gt;
      &lt;div class=&quot;section-kicker&quot;&gt;08 / SELF-CHECK QUIZ&lt;/div&gt;
      &lt;h2&gt;자가 점검 퀴즈&lt;/h2&gt;
&lt;div class=&quot;quiz-item&quot;&gt;
&lt;p class=&quot;quiz-q&quot;&gt;1. 캐릭터가 끝없이 이동하는 것처럼 보이게 하는 핵심 아이디어는?&lt;/p&gt;
&lt;button class=&quot;quiz-toggle&quot; onclick=&quot;toggleAnswer(this)&quot;&gt;정답 보기&lt;/button&gt;
&lt;div class=&quot;quiz-answer&quot;&gt;캐릭터는 제자리에 두고 배경 텍스처를 반대 방향으로 계속 흘리는 것입니다.&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;quiz-item&quot;&gt;
&lt;p class=&quot;quiz-q&quot;&gt;2. 텍스처를 옆으로 밀어내는 속성 이름은?&lt;/p&gt;
&lt;button class=&quot;quiz-toggle&quot; onclick=&quot;toggleAnswer(this)&quot;&gt;정답 보기&lt;/button&gt;
&lt;div class=&quot;quiz-answer&quot;&gt;texture_offset — (x, y) 형태의 밀림값입니다.&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;quiz-item&quot;&gt;
&lt;p class=&quot;quiz-q&quot;&gt;3. offset이 1을 넘어가면 어떻게 되나요?&lt;/p&gt;
&lt;button class=&quot;quiz-toggle&quot; onclick=&quot;toggleAnswer(this)&quot;&gt;정답 보기&lt;/button&gt;
&lt;div class=&quot;quiz-answer&quot;&gt;텍스처가 자동으로 반복(타일링)되어 끊김 없이 이어집니다.&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;quiz-item&quot;&gt;
&lt;p class=&quot;quiz-q&quot;&gt;4. setattr(bg, &quot;texture_offset&quot;, (offset, 0)) 은 무엇을 하는 코드인가요?&lt;/p&gt;
&lt;button class=&quot;quiz-toggle&quot; onclick=&quot;toggleAnswer(this)&quot;&gt;정답 보기&lt;/button&gt;
&lt;div class=&quot;quiz-answer&quot;&gt;bg.texture_offset = (offset, 0) 과 같은 뜻 — 속성 이름을 문자열로 지정해 값을 넣는 파이썬 기본 함수입니다.&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;quiz-item&quot;&gt;
&lt;p class=&quot;quiz-q&quot;&gt;5. 원근감 있는 배경(패럴랙스)을 만들려면?&lt;/p&gt;
&lt;button class=&quot;quiz-toggle&quot; onclick=&quot;toggleAnswer(this)&quot;&gt;정답 보기&lt;/button&gt;
&lt;div class=&quot;quiz-answer&quot;&gt;배경을 여러 장으로 나눠 먼 배경일수록 느린 속도로 흘립니다.&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;checklist&quot;&gt;&lt;label class=&quot;check-row&quot;&gt;&lt;input onchange=&quot;this.parentElement.classList.toggle(&#x27;checked&#x27;, this.checked)&quot; type=&quot;checkbox&quot;/&gt;&lt;span&gt;배경 스크롤 연출의 원리를 설명할 수 있다.&lt;/span&gt;&lt;/label&gt;&lt;label class=&quot;check-row&quot;&gt;&lt;input onchange=&quot;this.parentElement.classList.toggle(&#x27;checked&#x27;, this.checked)&quot; type=&quot;checkbox&quot;/&gt;&lt;span&gt;texture_offset으로 텍스처를 밀 수 있다.&lt;/span&gt;&lt;/label&gt;&lt;label class=&quot;check-row&quot;&gt;&lt;input onchange=&quot;this.parentElement.classList.toggle(&#x27;checked&#x27;, this.checked)&quot; type=&quot;checkbox&quot;/&gt;&lt;span&gt;update에서 offset을 누적해 무한 스크롤을 만들 수 있다.&lt;/span&gt;&lt;/label&gt;&lt;label class=&quot;check-row&quot;&gt;&lt;input onchange=&quot;this.parentElement.classList.toggle(&#x27;checked&#x27;, this.checked)&quot; type=&quot;checkbox&quot;/&gt;&lt;span&gt;Animation 캐릭터와 배경을 결합할 수 있다.&lt;/span&gt;&lt;/label&gt;&lt;label class=&quot;check-row&quot;&gt;&lt;input onchange=&quot;this.parentElement.classList.toggle(&#x27;checked&#x27;, this.checked)&quot; type=&quot;checkbox&quot;/&gt;&lt;span&gt;속도가 다른 다층 배경(패럴랙스)을 만들 수 있다.&lt;/span&gt;&lt;/label&gt;&lt;/div&gt;

      &lt;h2&gt;지난 시간 복습 (#22)&lt;/h2&gt;
&lt;ul&gt;&lt;li&gt;&lt;span class=&quot;mono-inline&quot;&gt;texture_offset&lt;/span&gt; 누적으로 무한 스크롤 배경&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;mono-inline&quot;&gt;setattr(객체, &amp;quot;속성&amp;quot;, 값)&lt;/span&gt; — 속성 이름을 문자열로 지정&lt;/li&gt;&lt;/ul&gt;
    &lt;/section&gt;

      &lt;div class=&quot;section-kicker&quot;&gt;02 / GOALS&lt;/div&gt;
      &lt;h2&gt;학습 목표&lt;/h2&gt;
&lt;ul&gt;&lt;li&gt;add_script()로 엔티티에 SmoothFollow 스크립트 붙이기&lt;/li&gt;&lt;li&gt;target과 offset으로 누구를, 어느 간격으로 따라갈지 정하기&lt;/li&gt;&lt;li&gt;&#x27;앞 마디를 따라가는&#x27; 연쇄 구조를 for문으로 만들기&lt;/li&gt;&lt;li&gt;머리를 움직여 몸 전체가 물결치듯 따라오는 용 완성하기&lt;/li&gt;&lt;/ul&gt;
    &lt;/section&gt;
    &lt;section class=&quot;card&quot; id=&quot;sec3&quot;&gt;
      &lt;div class=&quot;section-kicker&quot;&gt;03 / CONCEPTS&lt;/div&gt;
      &lt;h2&gt;핵심 개념 정리&lt;/h2&gt;
&lt;h3&gt;3-1. add_script — 엔티티에 능력 붙이기&lt;/h3&gt;
&lt;p&gt;Ursina에는 엔티티에 붙일 수 있는 기성 스크립트들이 있습니다. &lt;span class=&quot;mono-inline&quot;&gt;SmoothFollow&lt;/span&gt; 는 &quot;목표(target)를 부드럽게 따라가는&quot; 능력입니다.&lt;/p&gt;
&lt;div class=&quot;code-wrap&quot;&gt;
&lt;div class=&quot;code-top&quot;&gt;&lt;span class=&quot;dot red&quot;&gt;&lt;/span&gt;&lt;span class=&quot;dot white&quot;&gt;&lt;/span&gt;&lt;span class=&quot;fname&quot;&gt;follow.py&lt;/span&gt;&lt;/div&gt;
&lt;pre&gt;&lt;code class=&quot;language-python&quot;&gt;player = Entity(model=&amp;quot;quad&amp;quot;, x=-4.5, texture=&amp;quot;assets/dragon_head.png&amp;quot;)

body = Entity(model=&amp;quot;circle&amp;quot;, scale=.2, color=color.green)
body.add_script(SmoothFollow(target=player, offset=(.3, 0, 0)))&lt;/code&gt;&lt;/pre&gt;
&lt;/div&gt;
&lt;blockquote&gt;💡 offset은 목표로부터 유지할 간격입니다. (.3, 0, 0)이면 목표의 오른쪽 0.3 위치를 따라갑니다.&lt;/blockquote&gt;
&lt;h3&gt;3-2. 연쇄 따라가기 — 용의 몸통 원리&lt;/h3&gt;
&lt;p&gt;핵심 아이디어: 첫 마디는 머리를, 두 번째 마디는 첫 마디를, 세 번째는 두 번째를… 각자 &#x27;바로 앞&#x27;만 따라가면 전체가 자연스럽게 출렁이는 사슬이 됩니다.&lt;/p&gt;
&lt;div class=&quot;code-wrap&quot;&gt;
&lt;div class=&quot;code-top&quot;&gt;&lt;span class=&quot;dot red&quot;&gt;&lt;/span&gt;&lt;span class=&quot;dot white&quot;&gt;&lt;/span&gt;&lt;span class=&quot;fname&quot;&gt;chain_idea.py&lt;/span&gt;&lt;/div&gt;
&lt;pre&gt;&lt;code class=&quot;language-python&quot;&gt;e[0].add_script(SmoothFollow(target=player, offset=(.3, 0, 0)))
e[1].add_script(SmoothFollow(target=e[0],   offset=(.2, 0, 0)))
e[2].add_script(SmoothFollow(target=e[1],   offset=(.2, 0, 0)))
# ... 50개를 손으로? 아니죠 — for문!&lt;/code&gt;&lt;/pre&gt;
&lt;/div&gt;
&lt;blockquote&gt;💡 target=e[i-1] — &#x27;바로 앞 마디&#x27;를 가리키는 인덱스 계산이 이 차시의 핵심 한 줄입니다.&lt;/blockquote&gt;
&lt;h3&gt;3-3. for문으로 마디 50개 만들기&lt;/h3&gt;
&lt;p&gt;&lt;span class=&quot;mono-inline&quot;&gt;[None]*50&lt;/span&gt; 으로 빈 자리를 만들어 두고, for문에서 마디를 생성하며 앞 마디를 target으로 연결합니다.&lt;/p&gt;
&lt;div class=&quot;code-wrap&quot;&gt;
&lt;div class=&quot;code-top&quot;&gt;&lt;span class=&quot;dot red&quot;&gt;&lt;/span&gt;&lt;span class=&quot;dot white&quot;&gt;&lt;/span&gt;&lt;span class=&quot;fname&quot;&gt;chain_loop.py&lt;/span&gt;&lt;/div&gt;
&lt;pre&gt;&lt;code class=&quot;language-python&quot;&gt;e = [None] * 50

e[0] = Entity(model=&amp;quot;circle&amp;quot;, scale=.2, color=color.green)
e[0].add_script(SmoothFollow(target=player, offset=(.3, 0, 0)))

for i in range(1, 50):
    e[i] = Entity(model=&amp;quot;circle&amp;quot;, scale=.2, color=color.green)
    e[i].add_script(SmoothFollow(target=e[i-1], offset=(.2, 0, 0)))&lt;/code&gt;&lt;/pre&gt;
&lt;/div&gt;
&lt;h3&gt;3-4. 머리 움직이기 — 몸통은 저절로&lt;/h3&gt;
&lt;p&gt;이제 머리만 움직이면 됩니다. #04에서 배운 반사 패턴으로 위아래로 왕복시키면, 몸통 전체가 물결치며 따라옵니다.&lt;/p&gt;
&lt;div class=&quot;code-wrap&quot;&gt;
&lt;div class=&quot;code-top&quot;&gt;&lt;span class=&quot;dot red&quot;&gt;&lt;/span&gt;&lt;span class=&quot;dot white&quot;&gt;&lt;/span&gt;&lt;span class=&quot;fname&quot;&gt;head_move.py&lt;/span&gt;&lt;/div&gt;
&lt;pre&gt;&lt;code class=&quot;language-python&quot;&gt;dy = .08

def update():
    global dy
    player.y += dy * time.dt * 10
    if abs(player.y) &amp;gt;= 2:
        dy = -dy&lt;/code&gt;&lt;/pre&gt;
&lt;/div&gt;
&lt;blockquote&gt;💡 머리에 dragon_head 이미지가 없다면 model=&#x27;circle&#x27;에 색만 다르게 줘도 충분합니다.&lt;/blockquote&gt;
    &lt;/section&gt;
    &lt;section class=&quot;card&quot; id=&quot;sec4&quot;&gt;
      &lt;div class=&quot;section-kicker&quot;&gt;04 / SUMMARY&lt;/div&gt;
      &lt;h2&gt;핵심 정리&lt;/h2&gt;
&lt;ul&gt;&lt;li&gt;&lt;span class=&quot;mono-inline&quot;&gt;entity.add_script(SmoothFollow(target=..., offset=...))&lt;/span&gt; — 부드러운 추적&lt;/li&gt;&lt;li&gt;offset = 목표와 유지할 간격 (x, y, z)&lt;/li&gt;&lt;li&gt;연쇄 구조: &lt;span class=&quot;mono-inline&quot;&gt;target=e[i-1]&lt;/span&gt; — 각 마디는 바로 앞 마디만 따라감&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;mono-inline&quot;&gt;[None]*n&lt;/span&gt; + for문으로 마디 대량 생성&lt;/li&gt;&lt;li&gt;머리 하나만 움직이면 몸통 전체가 물결치듯 따라옴&lt;/li&gt;&lt;/ul&gt;
    &lt;/section&gt;
    &lt;section class=&quot;card&quot; id=&quot;sec5&quot;&gt;
      &lt;div class=&quot;section-kicker&quot;&gt;05 / PRACTICE — BASIC&lt;/div&gt;
      &lt;h2&gt;실습 문제 · 기본&lt;/h2&gt;
&lt;ol&gt;&lt;li&gt;엔티티 두 개를 만들고, 두 번째가 SmoothFollow로 첫 번째를 따라오게 하세요.&lt;/li&gt;&lt;li&gt;offset 값을 바꿔 보며 따라오는 간격이 어떻게 달라지는지 관찰하세요.&lt;/li&gt;&lt;/ol&gt;
    &lt;/section&gt;
    &lt;section class=&quot;card&quot; id=&quot;sec6&quot;&gt;
      &lt;div class=&quot;section-kicker&quot;&gt;06 / PRACTICE — ADVANCED&lt;/div&gt;
      &lt;h2&gt;실습 문제 · 심화 (힌트 포함)&lt;/h2&gt;
&lt;h3&gt;문제 3. 마디 10개 사슬&lt;/h3&gt;&lt;p&gt;for문으로 마디 10개를 만들어, 각 마디가 바로 앞 마디를 따라가는 사슬을 완성하세요.&lt;/p&gt;
&lt;blockquote&gt;힌트: e = [None]*10, range(1, 10), target=e[i-1] 세 가지가 핵심입니다.&lt;/blockquote&gt;
&lt;h3&gt;문제 4. 머리 왕복 운동&lt;/h3&gt;&lt;p&gt;머리를 위아래로 왕복시켜 몸통이 물결치게 만드세요. (경계 반사 패턴)&lt;/p&gt;
&lt;blockquote&gt;힌트: dy 변수를 두고 abs(player.y) &gt;= 2 일 때 dy = -dy 로 뒤집습니다.&lt;/blockquote&gt;
&lt;h3&gt;문제 5. 점점 작아지는 꼬리&lt;/h3&gt;&lt;p&gt;마디가 뒤로 갈수록 scale이 조금씩 작아지게 해서 진짜 용 꼬리처럼 만들어 보세요.&lt;/p&gt;
&lt;blockquote&gt;힌트: for문 안에서 scale=.2 - i*0.002 처럼 i를 활용합니다.&lt;/blockquote&gt;
&lt;h3&gt;문제 6. (종합) 키보드로 조종하는 용&lt;/h3&gt;&lt;p&gt;#07의 held_keys로 머리를 WASD 조종하게 바꾸고, 스페이스를 누르면 몸통 색이 한 번에 바뀌는 나만의 용을 완성하세요.&lt;/p&gt;
&lt;blockquote&gt;힌트: 색 변경은 for문으로 e 리스트를 순회하며 각 마디의 color를 바꿉니다.&lt;/blockquote&gt;
    &lt;/section&gt;
    &lt;section class=&quot;card&quot; id=&quot;sec7&quot;&gt;
      &lt;div class=&quot;section-kicker&quot;&gt;07 / FULL CODE · 정답 확인&lt;/div&gt;
      &lt;h2&gt;종합 예제 코드 — 하늘을 나는 용&lt;/h2&gt;
&lt;p class=&quot;fullcode-notice&quot;&gt;✍️ 먼저 위 핵심 개념과 실습 문제를 참고해 스스로 코드를 작성해 보세요. 다 작성했거나 막히는 부분을 비교하고 싶을 때 아래를 눌러 전체 코드를 확인합니다.&lt;/p&gt;
&lt;details class=&quot;fullcode&quot;&gt;&lt;summary&gt;&lt;span class=&quot;lock&quot;&gt;🔒&lt;/span&gt;&lt;span&gt;전체 코드 확인하기&lt;/span&gt;&lt;span class=&quot;hint&quot;&gt;SPOILER · CLICK&lt;/span&gt;&lt;/summary&gt;
&lt;div class=&quot;fullcode-body&quot;&gt;
&lt;p&gt;용 머리 + 몸통 마디 50개 + 위아래 왕복 운동을 합친 예시입니다.&lt;/p&gt;
&lt;div class=&quot;code-wrap&quot;&gt;
&lt;div class=&quot;code-top&quot;&gt;&lt;span class=&quot;dot red&quot;&gt;&lt;/span&gt;&lt;span class=&quot;dot white&quot;&gt;&lt;/span&gt;&lt;span class=&quot;fname&quot;&gt;main.py&lt;/span&gt;&lt;/div&gt;
&lt;pre&gt;&lt;code class=&quot;language-python&quot;&gt;from ursina import *

app = Ursina()

player = Entity(model=&amp;quot;quad&amp;quot;, scale=1, x=-4.5,
                texture=&amp;quot;assets/dragon_head.png&amp;quot;)   # 이미지가 없으면 model=&amp;quot;circle&amp;quot;로!
e = [None] * 50

e[0] = Entity(model=&amp;quot;circle&amp;quot;, scale=.2, color=color.green)
e[0].add_script(SmoothFollow(target=player, offset=(.3, 0, 0)))

for i in range(1, 50):
    e[i] = Entity(model=&amp;quot;circle&amp;quot;, scale=.2, color=color.green)
    e[i].add_script(SmoothFollow(target=e[i-1], offset=(.2, 0, 0)))

dy = .08

def update():
    global dy
    player.y += dy * time.dt * 10
    if abs(player.y) &amp;gt;= 2:
        dy = -dy

app.run()&lt;/code&gt;&lt;/pre&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/details&gt;
    &lt;/section&gt;
    &lt;section class=&quot;card&quot; id=&quot;sec8&quot;&gt;
      &lt;div class=&quot;section-kicker&quot;&gt;08 / SELF-CHECK QUIZ&lt;/div&gt;
      &lt;h2&gt;자가 점검 퀴즈&lt;/h2&gt;
&lt;div class=&quot;quiz-item&quot;&gt;
&lt;p class=&quot;quiz-q&quot;&gt;1. 엔티티에 SmoothFollow 능력을 붙이는 메서드는?&lt;/p&gt;
&lt;button class=&quot;quiz-toggle&quot; onclick=&quot;toggleAnswer(this)&quot;&gt;정답 보기&lt;/button&gt;
&lt;div class=&quot;quiz-answer&quot;&gt;add_script() — entity.add_script(SmoothFollow(...))&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;quiz-item&quot;&gt;
&lt;p class=&quot;quiz-q&quot;&gt;2. SmoothFollow의 target과 offset은 각각 무엇을 정하나요?&lt;/p&gt;
&lt;button class=&quot;quiz-toggle&quot; onclick=&quot;toggleAnswer(this)&quot;&gt;정답 보기&lt;/button&gt;
&lt;div class=&quot;quiz-answer&quot;&gt;target은 따라갈 대상, offset은 그 대상과 유지할 간격(x, y, z)입니다.&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;quiz-item&quot;&gt;
&lt;p class=&quot;quiz-q&quot;&gt;3. 몸통 마디들이 사슬처럼 이어지게 하는 핵심 코드는?&lt;/p&gt;
&lt;button class=&quot;quiz-toggle&quot; onclick=&quot;toggleAnswer(this)&quot;&gt;정답 보기&lt;/button&gt;
&lt;div class=&quot;quiz-answer&quot;&gt;target=e[i-1] — 각 마디가 &#x27;바로 앞 마디&#x27;를 따라가도록 연결합니다.&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;quiz-item&quot;&gt;
&lt;p class=&quot;quiz-q&quot;&gt;4. 마디 50개를 만들기 전에 e = [None]*50 을 쓰는 이유는?&lt;/p&gt;
&lt;button class=&quot;quiz-toggle&quot; onclick=&quot;toggleAnswer(this)&quot;&gt;정답 보기&lt;/button&gt;
&lt;div class=&quot;quiz-answer&quot;&gt;50칸짜리 빈 리스트를 미리 만들어 두고 e[i]에 하나씩 채워 넣기 위해서입니다.&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;quiz-item&quot;&gt;
&lt;p class=&quot;quiz-q&quot;&gt;5. 머리만 움직였는데 몸 전체가 물결치는 이유는?&lt;/p&gt;
&lt;button class=&quot;quiz-toggle&quot; onclick=&quot;toggleAnswer(this)&quot;&gt;정답 보기&lt;/button&gt;
&lt;div class=&quot;quiz-answer&quot;&gt;각 마디가 앞 마디를 &#x27;부드럽게(지연되며)&#x27; 따라가므로, 움직임이 한 마디씩 늦게 전달되어 파도처럼 보입니다.&lt;/div&gt;
&lt;/div&gt;
    &lt;/section&gt;
    &lt;section class=&quot;card&quot; id=&quot;sec9&quot;&gt;
      &lt;div class=&quot;section-kicker&quot;&gt;09 / CHECKLIST&lt;/div&gt;
      &lt;h2&gt;체크리스트&lt;/h2&gt;
&lt;div class=&quot;checklist&quot;&gt;&lt;label class=&quot;check-row&quot;&gt;&lt;input onchange=&quot;this.parentElement.classList.toggle(&#x27;checked&#x27;, this.checked)&quot; type=&quot;checkbox&quot;/&gt;&lt;span&gt;add_script로 SmoothFollow를 붙일 수 있다.&lt;/span&gt;&lt;/label&gt;&lt;label class=&quot;check-row&quot;&gt;&lt;input onchange=&quot;this.parentElement.classList.toggle(&#x27;checked&#x27;, this.checked)&quot; type=&quot;checkbox&quot;/&gt;&lt;span&gt;target / offset의 역할을 설명할 수 있다.&lt;/span&gt;&lt;/label&gt;&lt;label class=&quot;check-row&quot;&gt;&lt;input onchange=&quot;this.parentElement.classList.toggle(&#x27;checked&#x27;, this.checked)&quot; type=&quot;checkbox&quot;/&gt;&lt;span&gt;for문과 e[i-1]로 연쇄 추적 사슬을 만들 수 있다.&lt;/span&gt;&lt;/label&gt;&lt;label class=&quot;check-row&quot;&gt;&lt;input onchange=&quot;this.parentElement.classList.toggle(&#x27;checked&#x27;, this.checked)&quot; type=&quot;checkbox&quot;/&gt;&lt;span&gt;머리의 왕복 운동으로 몸통 물결을 만들 수 있다.&lt;/span&gt;&lt;/label&gt;&lt;label class=&quot;check-row&quot;&gt;&lt;input onchange=&quot;this.parentElement.classList.toggle(&#x27;checked&#x27;, this.checked)&quot; type=&quot;checkbox&quot;/&gt;&lt;span&gt;마디 수·간격·크기를 바꿔 나만의 용을 꾸밀 수 있다.&lt;/span&gt;&lt;/label&gt;&lt;/div&gt;
    &lt;/section&gt;
    &lt;section class=&quot;card&quot; id=&quot;sec10&quot;&gt;
      &lt;div class=&quot;section-kicker&quot;&gt;10 / REFERENCES&lt;/div&gt;
      &lt;h2&gt;참고 자료&lt;/h2&gt;
&lt;ul&gt;&lt;li&gt;&lt;a href=&quot;https://www.ursinaengine.org/api_reference.html&quot; rel=&quot;noopener&quot; target=&quot;_blank&quot;&gt;Ursina API Reference&lt;/a&gt;&lt;/li&gt;&lt;li&gt;&lt;a href=&quot;https://www.ursinaengine.org/api_reference.html#smoothfollow&quot; rel=&quot;noopener&quot; target=&quot;_blank&quot;&gt;Ursina SmoothFollow 문서&lt;/a&gt;&lt;/li&gt;&lt;/ul&gt;
    &lt;/section&gt;

  &lt;/main&gt;
&lt;/div&gt;

    &lt;section class=&quot;card&quot; id=&quot;sec1&quot;&gt;
      &lt;div class=&quot;section-kicker&quot;&gt;01 / REVIEW&lt;/div&gt;
      &lt;h2&gt;지난 시간 복습 (#23)&lt;/h2&gt;
&lt;ul&gt;&lt;li&gt;&lt;span class=&quot;mono-inline&quot;&gt;add_script(SmoothFollow(target, offset))&lt;/span&gt; 로 부드러운 추적&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;mono-inline&quot;&gt;target=e[i-1]&lt;/span&gt; 연쇄 구조로 용 몸통 만들기&lt;/li&gt;&lt;/ul&gt;
    &lt;/section&gt;
    &lt;section class=&quot;card&quot; id=&quot;sec2&quot;&gt;
      &lt;div class=&quot;section-kicker&quot;&gt;02 / GOALS&lt;/div&gt;
      &lt;h2&gt;학습 목표&lt;/h2&gt;
&lt;ul&gt;&lt;li&gt;.obj 모델 파일을 Entity의 model 인자로 불러오기&lt;/li&gt;&lt;li&gt;모델에 texture로 이미지 텍스처 입히기&lt;/li&gt;&lt;li&gt;quad 배경들을 z값으로 겹쳐 장면 구성하기&lt;/li&gt;&lt;li&gt;모델을 회전시켜 3D임을 확인하기&lt;/li&gt;&lt;/ul&gt;
    &lt;/section&gt;
    &lt;section class=&quot;card&quot; id=&quot;sec3&quot;&gt;
      &lt;div class=&quot;section-kicker&quot;&gt;03 / CONCEPTS&lt;/div&gt;
      &lt;h2&gt;핵심 개념 정리&lt;/h2&gt;
&lt;h3&gt;3-1. OBJ 파일이란?&lt;/h3&gt;
&lt;p&gt;Blender 같은 3D 프로그램에서 만든 모델을 저장하는 대표적인 파일 형식입니다. Ursina는 .obj를 바로 읽을 수 있어서, 기본 도형이 아닌 나만의 모델로 게임을 꾸밀 수 있습니다. 모델 파일은 프로젝트 폴더 안(예: models/)에 두세요.&lt;/p&gt;
&lt;h3&gt;3-2. 모델 불러오기 — model에 파일 경로&lt;/h3&gt;
&lt;p&gt;기본 도형 이름 대신 파일 경로를 적으면 끝입니다. 다만 .obj에는 색·그림 정보가 없는 경우가 많아서 &lt;span class=&quot;mono-inline&quot;&gt;texture&lt;/span&gt; 를 함께 지정해야 제대로 보입니다.&lt;/p&gt;
&lt;div class=&quot;code-wrap&quot;&gt;
&lt;div class=&quot;code-top&quot;&gt;&lt;span class=&quot;dot red&quot;&gt;&lt;/span&gt;&lt;span class=&quot;dot white&quot;&gt;&lt;/span&gt;&lt;span class=&quot;fname&quot;&gt;load_obj.py&lt;/span&gt;&lt;/div&gt;
&lt;pre&gt;&lt;code class=&quot;language-python&quot;&gt;e = Entity(
    model=&amp;quot;models/MushroomPatch.obj&amp;quot;,   # 도형 이름 대신 파일 경로
    texture=&amp;quot;assets/mushroom.png&amp;quot;,       # 모델에 입힐 그림
    scale=2, y=-1
)&lt;/code&gt;&lt;/pre&gt;
&lt;/div&gt;
&lt;blockquote&gt;💡 텍스처 없이 불러오면 회색 덩어리로 보입니다. 모델과 짝이 맞는 텍스처 파일을 함께 받아 두세요.&lt;/blockquote&gt;
&lt;h3&gt;3-3. 배경 레이어 — quad 두 장 겹치기&lt;/h3&gt;
&lt;p&gt;넓은 &lt;span class=&quot;mono-inline&quot;&gt;quad&lt;/span&gt; 에 배경 그림을 입혀 깔고, &lt;span class=&quot;mono-inline&quot;&gt;z&lt;/span&gt; 값으로 앞뒤 순서를 정합니다. z가 작을수록(음수) 카메라 쪽, 클수록 뒤쪽입니다.&lt;/p&gt;
&lt;div class=&quot;code-wrap&quot;&gt;
&lt;div class=&quot;code-top&quot;&gt;&lt;span class=&quot;dot red&quot;&gt;&lt;/span&gt;&lt;span class=&quot;dot white&quot;&gt;&lt;/span&gt;&lt;span class=&quot;fname&quot;&gt;background.py&lt;/span&gt;&lt;/div&gt;
&lt;pre&gt;&lt;code class=&quot;language-python&quot;&gt;Entity(model=&amp;quot;quad&amp;quot;, scale=(20, 10), texture=&amp;quot;assets/blue_sky.png&amp;quot;)
Entity(model=&amp;quot;quad&amp;quot;, scale=(20, 10), texture=&amp;quot;assets/grassland.png&amp;quot;, z=-.01)&lt;/code&gt;&lt;/pre&gt;
&lt;/div&gt;
&lt;blockquote&gt;💡 z를 아주 조금(-.01)만 당겨도 앞뒤가 갈립니다. 모델은 그보다 더 앞(z=-.1)에 두면 배경 위에 서 있는 것처럼 보여요.&lt;/blockquote&gt;
&lt;h3&gt;3-4. 회전시켜 3D 확인하기&lt;/h3&gt;
&lt;p&gt;quad 그림과 달리 진짜 3D 모델은 돌려 보면 입체감이 드러납니다. update에서 천천히 돌려 보세요.&lt;/p&gt;
&lt;div class=&quot;code-wrap&quot;&gt;
&lt;div class=&quot;code-top&quot;&gt;&lt;span class=&quot;dot red&quot;&gt;&lt;/span&gt;&lt;span class=&quot;dot white&quot;&gt;&lt;/span&gt;&lt;span class=&quot;fname&quot;&gt;spin.py&lt;/span&gt;&lt;/div&gt;
&lt;pre&gt;&lt;code class=&quot;language-python&quot;&gt;def update():
    e.rotation_y += 100 * time.dt   # 초당 100도 회전&lt;/code&gt;&lt;/pre&gt;
&lt;/div&gt;
    &lt;/section&gt;
    &lt;section class=&quot;card&quot; id=&quot;sec4&quot;&gt;
      &lt;div class=&quot;section-kicker&quot;&gt;04 / SUMMARY&lt;/div&gt;
      &lt;h2&gt;핵심 정리&lt;/h2&gt;
&lt;ul&gt;&lt;li&gt;&lt;span class=&quot;mono-inline&quot;&gt;model=&amp;quot;경로/파일.obj&amp;quot;&lt;/span&gt; — 외부 3D 모델 로드&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;mono-inline&quot;&gt;texture=&amp;quot;...&amp;quot;&lt;/span&gt; 를 함께 지정해야 색·그림이 입혀짐&lt;/li&gt;&lt;li&gt;quad + z값 레이어로 배경 구성 (z 작을수록 앞)&lt;/li&gt;&lt;li&gt;rotation_y 회전으로 모델의 입체감 확인&lt;/li&gt;&lt;/ul&gt;
    &lt;/section&gt;
    &lt;section class=&quot;card&quot; id=&quot;sec5&quot;&gt;
      &lt;div class=&quot;section-kicker&quot;&gt;05 / PRACTICE — BASIC&lt;/div&gt;
      &lt;h2&gt;실습 문제 · 기본&lt;/h2&gt;
&lt;ol&gt;&lt;li&gt;무료 .obj 모델을 하나 구해(또는 수업 자료 사용) 화면에 불러오세요. 텍스처까지 입혀야 완성입니다.&lt;/li&gt;&lt;li&gt;하늘 quad와 땅 quad 두 장을 z값으로 겹쳐 배경을 만들고, 그 앞에 모델을 배치하세요.&lt;/li&gt;&lt;/ol&gt;
    &lt;/section&gt;
    &lt;section class=&quot;card&quot; id=&quot;sec6&quot;&gt;
      &lt;div class=&quot;section-kicker&quot;&gt;06 / PRACTICE — ADVANCED&lt;/div&gt;
      &lt;h2&gt;실습 문제 · 심화 (힌트 포함)&lt;/h2&gt;
&lt;h3&gt;문제 3. 자동 회전 전시대&lt;/h3&gt;&lt;p&gt;모델이 초당 100도로 천천히 도는 &#x27;전시대&#x27;를 만드세요.&lt;/p&gt;
&lt;blockquote&gt;힌트: update에서 e.rotation_y += 100 * time.dt&lt;/blockquote&gt;
&lt;h3&gt;문제 4. 모델 여러 개 배치&lt;/h3&gt;&lt;p&gt;duplicate()로 같은 모델을 3~4개 복제해 서로 다른 위치·크기로 숲처럼 배치하세요.&lt;/p&gt;
&lt;blockquote&gt;힌트: duplicate(e, x=2, scale=1.5) 처럼 복제하면서 속성을 바꿀 수 있습니다.&lt;/blockquote&gt;
&lt;h3&gt;문제 5. 키보드로 모델 돌려보기&lt;/h3&gt;&lt;p&gt;좌/우 방향키를 누르는 동안 모델이 그 방향으로 회전하게 만드세요.&lt;/p&gt;
&lt;blockquote&gt;힌트: held_keys[&#x27;left arrow&#x27;] 와 held_keys[&#x27;right arrow&#x27;] 의 차를 회전량에 곱하세요.&lt;/blockquote&gt;
&lt;h3&gt;문제 6. (종합) 미니 디오라마&lt;/h3&gt;&lt;p&gt;배경 2장 + 모델 여러 개 + 자동 회전 + 키보드 조작을 모두 합쳐, 작은 3D 전시 장면을 완성하세요.&lt;/p&gt;
    &lt;/section&gt;
    &lt;section class=&quot;card&quot; id=&quot;sec7&quot;&gt;
      &lt;div class=&quot;section-kicker&quot;&gt;07 / FULL CODE · 정답 확인&lt;/div&gt;
      &lt;h2&gt;종합 예제 코드 — OBJ 모델 + 배경 장면&lt;/h2&gt;
&lt;p class=&quot;fullcode-notice&quot;&gt;✍️ 먼저 위 핵심 개념과 실습 문제를 참고해 스스로 코드를 작성해 보세요. 다 작성했거나 막히는 부분을 비교하고 싶을 때 아래를 눌러 전체 코드를 확인합니다.&lt;/p&gt;
&lt;details class=&quot;fullcode&quot;&gt;&lt;summary&gt;&lt;span class=&quot;lock&quot;&gt;🔒&lt;/span&gt;&lt;span&gt;전체 코드 확인하기&lt;/span&gt;&lt;span class=&quot;hint&quot;&gt;SPOILER · CLICK&lt;/span&gt;&lt;/summary&gt;
&lt;div class=&quot;fullcode-body&quot;&gt;
&lt;p&gt;배경 두 장 위에 .obj 모델을 올리고 회전시키는, 영상의 최종 코드를 정리한 예시입니다.&lt;/p&gt;
&lt;div class=&quot;code-wrap&quot;&gt;
&lt;div class=&quot;code-top&quot;&gt;&lt;span class=&quot;dot red&quot;&gt;&lt;/span&gt;&lt;span class=&quot;dot white&quot;&gt;&lt;/span&gt;&lt;span class=&quot;fname&quot;&gt;main.py&lt;/span&gt;&lt;/div&gt;
&lt;pre&gt;&lt;code class=&quot;language-python&quot;&gt;from ursina import *

def update():
    e.rotation_y += 100 * time.dt

app = Ursina()

# Background — z가 클수록 뒤로
Entity(model=&amp;quot;quad&amp;quot;, scale=(20, 10), texture=&amp;quot;assets/blue_sky.png&amp;quot;)
Entity(model=&amp;quot;quad&amp;quot;, scale=(20, 10), texture=&amp;quot;assets/grassland.png&amp;quot;, z=-.01)

# 외부 3D 모델 (모델 + 텍스처는 한 세트)
e = Entity(model=&amp;quot;models/MushroomPatch.obj&amp;quot;,
           texture=&amp;quot;assets/mushroom.png&amp;quot;,
           scale=2, y=-1, z=-.1)

app.run()&lt;/code&gt;&lt;/pre&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/details&gt;
    &lt;/section&gt;
    &lt;section class=&quot;card&quot; id=&quot;sec8&quot;&gt;
      &lt;div class=&quot;section-kicker&quot;&gt;08 / SELF-CHECK QUIZ&lt;/div&gt;
      &lt;h2&gt;자가 점검 퀴즈&lt;/h2&gt;
&lt;div class=&quot;quiz-item&quot;&gt;
&lt;p class=&quot;quiz-q&quot;&gt;1. 기본 도형 대신 외부 3D 모델을 쓰려면 model 인자에 무엇을 적나요?&lt;/p&gt;
&lt;button class=&quot;quiz-toggle&quot; onclick=&quot;toggleAnswer(this)&quot;&gt;정답 보기&lt;/button&gt;
&lt;div class=&quot;quiz-answer&quot;&gt;모델 파일의 경로 — 예: model=&quot;models/MushroomPatch.obj&quot;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;quiz-item&quot;&gt;
&lt;p class=&quot;quiz-q&quot;&gt;2. .obj 모델을 불러왔는데 회색 덩어리로 보입니다. 무엇이 빠졌을까요?&lt;/p&gt;
&lt;button class=&quot;quiz-toggle&quot; onclick=&quot;toggleAnswer(this)&quot;&gt;정답 보기&lt;/button&gt;
&lt;div class=&quot;quiz-answer&quot;&gt;texture — .obj에는 그림 정보가 없는 경우가 많아 texture를 함께 지정해야 합니다.&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;quiz-item&quot;&gt;
&lt;p class=&quot;quiz-q&quot;&gt;3. quad 배경 두 장의 앞뒤 순서는 무엇으로 정하나요?&lt;/p&gt;
&lt;button class=&quot;quiz-toggle&quot; onclick=&quot;toggleAnswer(this)&quot;&gt;정답 보기&lt;/button&gt;
&lt;div class=&quot;quiz-answer&quot;&gt;z값 — 작을수록(음수) 카메라 쪽(앞), 클수록 뒤입니다.&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;quiz-item&quot;&gt;
&lt;p class=&quot;quiz-q&quot;&gt;4. 모델이 진짜 3D인지 확인하는 가장 쉬운 방법은?&lt;/p&gt;
&lt;button class=&quot;quiz-toggle&quot; onclick=&quot;toggleAnswer(this)&quot;&gt;정답 보기&lt;/button&gt;
&lt;div class=&quot;quiz-answer&quot;&gt;update에서 rotation_y 등을 회전시켜 보면 입체감이 드러납니다.&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;quiz-item&quot;&gt;
&lt;p class=&quot;quiz-q&quot;&gt;5. OBJ 파일은 주로 어떤 프로그램에서 만들어 내보내나요?&lt;/p&gt;
&lt;button class=&quot;quiz-toggle&quot; onclick=&quot;toggleAnswer(this)&quot;&gt;정답 보기&lt;/button&gt;
&lt;div class=&quot;quiz-answer&quot;&gt;Blender 같은 3D 모델링 프로그램입니다.&lt;/div&gt;
&lt;/div&gt;
    &lt;/section&gt;
    &lt;section class=&quot;card&quot; id=&quot;sec9&quot;&gt;
      &lt;div class=&quot;section-kicker&quot;&gt;09 / CHECKLIST&lt;/div&gt;
      &lt;h2&gt;체크리스트&lt;/h2&gt;
&lt;div class=&quot;checklist&quot;&gt;&lt;label class=&quot;check-row&quot;&gt;&lt;input onchange=&quot;this.parentElement.classList.toggle(&#x27;checked&#x27;, this.checked)&quot; type=&quot;checkbox&quot;/&gt;&lt;span&gt;.obj 모델을 model 경로로 불러올 수 있다.&lt;/span&gt;&lt;/label&gt;&lt;label class=&quot;check-row&quot;&gt;&lt;input onchange=&quot;this.parentElement.classList.toggle(&#x27;checked&#x27;, this.checked)&quot; type=&quot;checkbox&quot;/&gt;&lt;span&gt;모델에 texture를 입힐 수 있다.&lt;/span&gt;&lt;/label&gt;&lt;label class=&quot;check-row&quot;&gt;&lt;input onchange=&quot;this.parentElement.classList.toggle(&#x27;checked&#x27;, this.checked)&quot; type=&quot;checkbox&quot;/&gt;&lt;span&gt;quad와 z값으로 배경 레이어를 구성할 수 있다.&lt;/span&gt;&lt;/label&gt;&lt;label class=&quot;check-row&quot;&gt;&lt;input onchange=&quot;this.parentElement.classList.toggle(&#x27;checked&#x27;, this.checked)&quot; type=&quot;checkbox&quot;/&gt;&lt;span&gt;모델을 회전시키는 코드를 쓸 수 있다.&lt;/span&gt;&lt;/label&gt;&lt;label class=&quot;check-row&quot;&gt;&lt;input onchange=&quot;this.parentElement.classList.toggle(&#x27;checked&#x27;, this.checked)&quot; type=&quot;checkbox&quot;/&gt;&lt;span&gt;배경 + 모델을 조합한 장면을 만들 수 있다.&lt;/span&gt;&lt;/label&gt;&lt;/div&gt;
    &lt;/section&gt;

    &lt;section class=&quot;card&quot; id=&quot;sec1&quot;&gt;
      &lt;div class=&quot;section-kicker&quot;&gt;01 / REVIEW&lt;/div&gt;
      &lt;h2&gt;지난 시간 복습 (#24)&lt;/h2&gt;
&lt;ul&gt;&lt;li&gt;&lt;span class=&quot;mono-inline&quot;&gt;model=&amp;quot;파일.obj&amp;quot;&lt;/span&gt; + &lt;span class=&quot;mono-inline&quot;&gt;texture&lt;/span&gt; 로 외부 3D 모델 로드&lt;/li&gt;&lt;li&gt;quad 배경 레이어와 z값 겹침 순서&lt;/li&gt;&lt;/ul&gt;
    &lt;/section&gt;
    &lt;section class=&quot;card&quot; id=&quot;sec2&quot;&gt;
      &lt;div class=&quot;section-kicker&quot;&gt;02 / GOALS&lt;/div&gt;
      &lt;h2&gt;학습 목표&lt;/h2&gt;
&lt;ul&gt;&lt;li&gt;PointLight로 장면에 점 조명 추가하기&lt;/li&gt;&lt;li&gt;조명의 위치와 색이 모델에 주는 효과 관찰하기&lt;/li&gt;&lt;li&gt;duplicate로 조명 복제하기&lt;/li&gt;&lt;li&gt;color.black으로 조명을 &#x27;끄고&#x27;, 키 입력으로 조명 전환하기&lt;/li&gt;&lt;/ul&gt;
    &lt;/section&gt;
    &lt;section class=&quot;card&quot; id=&quot;sec3&quot;&gt;
      &lt;div class=&quot;section-kicker&quot;&gt;03 / CONCEPTS&lt;/div&gt;
      &lt;h2&gt;핵심 개념 정리&lt;/h2&gt;
&lt;h3&gt;3-1. PointLight — 전구 같은 점 조명&lt;/h3&gt;
&lt;p&gt;&lt;span class=&quot;mono-inline&quot;&gt;PointLight&lt;/span&gt; 는 한 점에서 사방으로 빛을 내는 전구입니다. 위치(y 등)와 색을 정해 주면, 근처 3D 모델 표면이 그 색으로 물듭니다.&lt;/p&gt;
&lt;div class=&quot;code-wrap&quot;&gt;
&lt;div class=&quot;code-top&quot;&gt;&lt;span class=&quot;dot red&quot;&gt;&lt;/span&gt;&lt;span class=&quot;dot white&quot;&gt;&lt;/span&gt;&lt;span class=&quot;fname&quot;&gt;pointlight.py&lt;/span&gt;&lt;/div&gt;
&lt;pre&gt;&lt;code class=&quot;language-python&quot;&gt;L1 = PointLight(y=-2, color=color.red)   # 아래쪽의 빨간 전구&lt;/code&gt;&lt;/pre&gt;
&lt;/div&gt;
&lt;blockquote&gt;💡 조명 효과는 .obj 같은 입체 모델에서 잘 보입니다. 지난 시간의 모델을 가져와 실험하세요!&lt;/blockquote&gt;
&lt;h3&gt;3-2. 조명도 duplicate가 된다&lt;/h3&gt;
&lt;p&gt;엔티티처럼 조명도 duplicate로 복제하면서 위치·색만 바꿀 수 있습니다. 서로 다른 색의 조명 두 개가 위아래에서 비추면 재미있는 효과가 납니다.&lt;/p&gt;
&lt;div class=&quot;code-wrap&quot;&gt;
&lt;div class=&quot;code-top&quot;&gt;&lt;span class=&quot;dot red&quot;&gt;&lt;/span&gt;&lt;span class=&quot;dot white&quot;&gt;&lt;/span&gt;&lt;span class=&quot;fname&quot;&gt;two_lights.py&lt;/span&gt;&lt;/div&gt;
&lt;pre&gt;&lt;code class=&quot;language-python&quot;&gt;L2 = duplicate(L1, y=2, color=color.green)   # 위쪽의 초록 전구&lt;/code&gt;&lt;/pre&gt;
&lt;/div&gt;
&lt;h3&gt;3-3. 모델 여러 개로 무대 만들기&lt;/h3&gt;
&lt;p&gt;조명 효과를 잘 보려면 비출 대상이 여럿 있는 것이 좋습니다. duplicate로 모델을 사방에 배치하세요.&lt;/p&gt;
&lt;div class=&quot;code-wrap&quot;&gt;
&lt;div class=&quot;code-top&quot;&gt;&lt;span class=&quot;dot red&quot;&gt;&lt;/span&gt;&lt;span class=&quot;dot white&quot;&gt;&lt;/span&gt;&lt;span class=&quot;fname&quot;&gt;stage.py&lt;/span&gt;&lt;/div&gt;
&lt;pre&gt;&lt;code class=&quot;language-python&quot;&gt;mushroom1 = Entity(model=&amp;quot;assets/pumpkin.obj&amp;quot;)
mushroom2 = duplicate(mushroom1, y=-1)
mushroom3 = duplicate(mushroom1, x=-2)
mushroom4 = duplicate(mushroom1, x=2)&lt;/code&gt;&lt;/pre&gt;
&lt;/div&gt;
&lt;h3&gt;3-4. 조명 끄기 = color.black&lt;/h3&gt;
&lt;p&gt;조명을 없애는 대신 색을 검정으로 바꾸면 &#x27;꺼진&#x27; 효과가 납니다. 검정 빛 = 빛 없음! &lt;span class=&quot;mono-inline&quot;&gt;input(key)&lt;/span&gt; 와 묶으면 스위치가 됩니다.&lt;/p&gt;
&lt;div class=&quot;code-wrap&quot;&gt;
&lt;div class=&quot;code-top&quot;&gt;&lt;span class=&quot;dot red&quot;&gt;&lt;/span&gt;&lt;span class=&quot;dot white&quot;&gt;&lt;/span&gt;&lt;span class=&quot;fname&quot;&gt;switch.py&lt;/span&gt;&lt;/div&gt;
&lt;pre&gt;&lt;code class=&quot;language-python&quot;&gt;def input(key):
    if key == &amp;quot;1&amp;quot;:            # 켜기
        L1.color = color.red
        L2.color = color.green
    if key == &amp;quot;2&amp;quot;:            # 끄기
        L1.color = color.black
        L2.color = color.black&lt;/code&gt;&lt;/pre&gt;
&lt;/div&gt;
&lt;blockquote&gt;💡 빛의 삼원색을 떠올리세요 — 검정은 빛이 하나도 없는 상태입니다.&lt;/blockquote&gt;
    &lt;/section&gt;
    &lt;section class=&quot;card&quot; id=&quot;sec4&quot;&gt;
      &lt;div class=&quot;section-kicker&quot;&gt;04 / SUMMARY&lt;/div&gt;
      &lt;h2&gt;핵심 정리&lt;/h2&gt;
&lt;ul&gt;&lt;li&gt;&lt;span class=&quot;mono-inline&quot;&gt;PointLight(y=..., color=...)&lt;/span&gt; — 전구형 점 조명&lt;/li&gt;&lt;li&gt;조명 색이 모델 표면에 물듦 (입체 모델에서 뚜렷)&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;mono-inline&quot;&gt;duplicate&lt;/span&gt; 로 조명·모델 모두 복제 가능&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;mono-inline&quot;&gt;color.black&lt;/span&gt; = 조명 끄기, input(key)로 스위치 구현&lt;/li&gt;&lt;/ul&gt;
    &lt;/section&gt;
    &lt;section class=&quot;card&quot; id=&quot;sec5&quot;&gt;
      &lt;div class=&quot;section-kicker&quot;&gt;05 / PRACTICE — BASIC&lt;/div&gt;
      &lt;h2&gt;실습 문제 · 기본&lt;/h2&gt;
&lt;ol&gt;&lt;li&gt;.obj 모델 하나를 불러오고 PointLight(y=-2, color=color.red)를 추가해 색 변화를 관찰하세요.&lt;/li&gt;&lt;li&gt;duplicate로 초록 조명을 위쪽(y=2)에 하나 더 만들어 위아래 다른 색으로 비추세요.&lt;/li&gt;&lt;/ol&gt;
    &lt;/section&gt;
    &lt;section class=&quot;card&quot; id=&quot;sec6&quot;&gt;
      &lt;div class=&quot;section-kicker&quot;&gt;06 / PRACTICE — ADVANCED&lt;/div&gt;
      &lt;h2&gt;실습 문제 · 심화 (힌트 포함)&lt;/h2&gt;
&lt;h3&gt;문제 3. 조명 스위치&lt;/h3&gt;&lt;p&gt;1키로 두 조명을 켜고, 2키로 (검정으로 바꿔) 끄는 스위치를 만드세요.&lt;/p&gt;
&lt;blockquote&gt;힌트: input(key)에서 key==&quot;1&quot; / &quot;2&quot; 를 비교해 color를 바꿉니다.&lt;/blockquote&gt;
&lt;h3&gt;문제 4. 무대 완성&lt;/h3&gt;&lt;p&gt;모델을 duplicate로 4개 배치하고 두 조명이 동시에 비추는 무대를 만드세요. 조명과 가까운 모델과 먼 모델의 밝기를 비교하세요.&lt;/p&gt;
&lt;blockquote&gt;힌트: 개념 3-3의 배치 코드를 참고하세요.&lt;/blockquote&gt;
&lt;h3&gt;문제 5. 디스코 조명&lt;/h3&gt;&lt;p&gt;스페이스바를 누를 때마다 두 조명의 색이 무작위로 바뀌는 디스코 효과를 만드세요.&lt;/p&gt;
&lt;blockquote&gt;힌트: color.random_color()를 두 조명에 각각 대입합니다.&lt;/blockquote&gt;
&lt;h3&gt;문제 6. (종합) 움직이는 조명&lt;/h3&gt;&lt;p&gt;#14의 공전 코드를 응용해, 조명 하나가 모델 주위를 빙글빙글 돌며 비추는 장면을 만드세요.&lt;/p&gt;
&lt;blockquote&gt;힌트: update에서 L1.x, L1.y를 cos/sin으로 갱신하면 조명도 궤도를 돕니다.&lt;/blockquote&gt;
    &lt;/section&gt;
    &lt;section class=&quot;card&quot; id=&quot;sec7&quot;&gt;
      &lt;div class=&quot;section-kicker&quot;&gt;07 / FULL CODE · 정답 확인&lt;/div&gt;
      &lt;h2&gt;종합 예제 코드 — 두 조명과 스위치&lt;/h2&gt;
&lt;p class=&quot;fullcode-notice&quot;&gt;✍️ 먼저 위 핵심 개념과 실습 문제를 참고해 스스로 코드를 작성해 보세요. 다 작성했거나 막히는 부분을 비교하고 싶을 때 아래를 눌러 전체 코드를 확인합니다.&lt;/p&gt;
&lt;details class=&quot;fullcode&quot;&gt;&lt;summary&gt;&lt;span class=&quot;lock&quot;&gt;🔒&lt;/span&gt;&lt;span&gt;전체 코드 확인하기&lt;/span&gt;&lt;span class=&quot;hint&quot;&gt;SPOILER · CLICK&lt;/span&gt;&lt;/summary&gt;
&lt;div class=&quot;fullcode-body&quot;&gt;
&lt;p&gt;모델 4개 무대에 빨강·초록 조명을 배치하고 키로 켜고 끄는, 영상의 최종 코드입니다.&lt;/p&gt;
&lt;div class=&quot;code-wrap&quot;&gt;
&lt;div class=&quot;code-top&quot;&gt;&lt;span class=&quot;dot red&quot;&gt;&lt;/span&gt;&lt;span class=&quot;dot white&quot;&gt;&lt;/span&gt;&lt;span class=&quot;fname&quot;&gt;main.py&lt;/span&gt;&lt;/div&gt;
&lt;pre&gt;&lt;code class=&quot;language-python&quot;&gt;from ursina import *

def input(key):
    if key == &amp;quot;1&amp;quot;:                 # 조명 켜기
        L1.color = color.red
        L2.color = color.green
    if key == &amp;quot;2&amp;quot;:                 # 조명 끄기 (검정 = 빛 없음)
        L1.color = color.black
        L2.color = color.black

app = Ursina()

mushroom1 = Entity(model=&amp;quot;assets/pumpkin.obj&amp;quot;)
mushroom2 = duplicate(mushroom1, y=-1)
mushroom3 = duplicate(mushroom1, x=-2)
mushroom4 = duplicate(mushroom1, x=2)

L1 = PointLight(y=-2, color=color.red)
L2 = duplicate(L1, y=2, color=color.green)

app.run()&lt;/code&gt;&lt;/pre&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/details&gt;
    &lt;/section&gt;
    &lt;section class=&quot;card&quot; id=&quot;sec8&quot;&gt;
      &lt;div class=&quot;section-kicker&quot;&gt;08 / SELF-CHECK QUIZ&lt;/div&gt;
      &lt;h2&gt;자가 점검 퀴즈&lt;/h2&gt;
&lt;div class=&quot;quiz-item&quot;&gt;
&lt;p class=&quot;quiz-q&quot;&gt;1. 한 점에서 사방으로 빛을 내는 Ursina의 조명 클래스는?&lt;/p&gt;
&lt;button class=&quot;quiz-toggle&quot; onclick=&quot;toggleAnswer(this)&quot;&gt;정답 보기&lt;/button&gt;
&lt;div class=&quot;quiz-answer&quot;&gt;PointLight&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;quiz-item&quot;&gt;
&lt;p class=&quot;quiz-q&quot;&gt;2. 조명의 효과가 가장 뚜렷하게 보이는 대상은?&lt;/p&gt;
&lt;button class=&quot;quiz-toggle&quot; onclick=&quot;toggleAnswer(this)&quot;&gt;정답 보기&lt;/button&gt;
&lt;div class=&quot;quiz-answer&quot;&gt;입체감 있는 3D 모델(.obj 등) — 평면 quad보다 표면 음영이 잘 드러납니다.&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;quiz-item&quot;&gt;
&lt;p class=&quot;quiz-q&quot;&gt;3. 조명을 &#x27;끄는&#x27; 가장 간단한 방법은?&lt;/p&gt;
&lt;button class=&quot;quiz-toggle&quot; onclick=&quot;toggleAnswer(this)&quot;&gt;정답 보기&lt;/button&gt;
&lt;div class=&quot;quiz-answer&quot;&gt;color를 color.black으로 바꿉니다. 검정 빛 = 빛 없음.&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;quiz-item&quot;&gt;
&lt;p class=&quot;quiz-q&quot;&gt;4. 같은 설정의 조명을 위치·색만 바꿔 하나 더 만들려면?&lt;/p&gt;
&lt;button class=&quot;quiz-toggle&quot; onclick=&quot;toggleAnswer(this)&quot;&gt;정답 보기&lt;/button&gt;

  });
  const tocLinks = document.querySelectorAll(&#x27;nav.toc a&#x27;);
  const sections = document.querySelectorAll(&#x27;section.card&#x27;);
  const observer = new IntersectionObserver((entries) =&gt; {
    entries.forEach(entry =&gt; {
      if (entry.isIntersecting) {
        tocLinks.forEach(l =&gt; l.classList.remove(&#x27;active&#x27;));
        const match = document.querySelector(`nav.toc a[href=&quot;#${entry.target.id}&quot;]`);
        if (match) match.classList.add(&#x27;active&#x27;);
      }
    });
  }, { rootMargin: &#x27;-30% 0px -60% 0px&#x27; });
  sections.forEach(s =&gt; observer.observe(s));
  function toggleAnswer(btn){
    const ans = btn.nextElementSibling;
    ans.classList.toggle(&#x27;show&#x27;);
    btn.textContent = ans.classList.contains(&#x27;show&#x27;) ? &#x27;정답 숨기기&#x27; : &#x27;정답 보기&#x27;;

<script>
// 상단 탭 줄 열고 닫기 (기본 숨김, 학습지를 고르면 다시 숨김)
document.getElementById('barToggle').addEventListener('click', function(){
  var collapsed = document.body.classList.toggle('bar-collapsed');
  if(!collapsed){ var t=document.querySelector('.tab.active'); if(t) t.scrollIntoView({block:'nearest', inline:'center'}); }
});
document.querySelectorAll('.tab').forEach(function(t){
  t.addEventListener('click', function(){ document.body.classList.add('bar-collapsed'); });
});
function showLesson(idx){
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active', i===idx));
  document.querySelectorAll('iframe.lesson').forEach((f,i)=>f.classList.toggle('active', i===idx));
  try{ history.replaceState(null,'','#lesson-'+(idx+1).toString().padStart(2,'0')); }catch(e){}
}
// URL 해시로 특정 학습지 바로 열기 (#lesson-03 등)
(function(){
  const m = location.hash.match(/lesson-0?(\d+)/);
  if(m){ const idx = parseInt(m[1],10)-1; if(idx>=0 && idx<25) showLesson(idx); }
})();
// 탭이 화면보다 넘칠 때 마우스 휠(세로 스크롤)로도 좌우 이동 가능하게
(function(){
  const nav = document.querySelector('nav.tabs');
  if(!nav) return;
  nav.addEventListener('wheel', function(e){
    if (e.deltaY === 0) return;
    nav.scrollLeft += e.deltaY;
    e.preventDefault();
  }, { passive:false });
})();
</script>
