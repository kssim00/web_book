<h2>Ursina란?</h2>
<p>파이썬 코드 몇 줄만으로 3D 화면을 띄우고 오브젝트를 움직일 수 있는 오픈소스 게임 엔진입니다.</p>
<ul>
<li>무료 · 오픈소스, 파이썬 문법을 그대로 사용</li>
<li>복잡한 3D 그래픽 설정 없이 <span class=&quot;mono-inline&quot;>Entity</span> 한 줄로 바로 화면에 물체 표시</li>
</ul>

<p>아래 4줄이 모든 Ursina 프로그램의 기본 뼈대입니다. 실행하면 빈 3D 창이 뜹니다.</p>
<div class=&quot;code-wrap&quot;>

    bar.style.width = scrolled + '%';
  });

  const tocLinks = document.querySelectorAll('nav.toc a');
  tocLinks.forEach(link => {
    link.addEventListener('click', function(e){
      e.preventDefault();
      const target = document.getElementById(this.getAttribute('href').slice(1));
      if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  });
  const sections = document.querySelectorAll('section.card');
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        tocLinks.forEach(l => l.classList.remove('active'));
        const match = document.querySelector(`nav.toc a[href=&quot;#${entry.target.id}&quot;]`);
        if (match) match.classList.add('active');
      }
    });
  }, { rootMargin: '-30% 0px -60% 0px' });
  sections.forEach(s => observer.observe(s));
</script>

<div class=&quot;code-top&quot;><span class=&quot;dot red&quot;></span><span class=&quot;dot white&quot;></span><span class=&quot;fname&quot;>random_color.py</span></div>
<pre><code class=&quot;language-python&quot;>cube = Entity(model='cube', color=color.random_color())</code></pre>
</div>
<p>→ 큐브를 여러 개 만들 때 색을 랜덤하게 주는 효과로 많이 사용됩니다.</p>
<h3>4-4. 색상 적용 예시</h3>
<div class=&quot;code-wrap&quot;>
<div class=&quot;code-top&quot;><span class=&quot;dot red&quot;></span><span class=&quot;dot white&quot;></span><span class=&quot;fname&quot;>colored_shapes.py</span></div>
<pre><code class=&quot;language-python&quot;>from ursina import *

app = Ursina()

cube = Entity(model='cube', color=color.orange, position=(-2, 0, 0))
sphere = Entity(model='sphere', color=color.lime, position=(0, 0, 0))
plane = Entity(model='plane', color=color.azure, position=(2, 0, 0), scale=2)

app.run()</code></pre>
</div>
</section>
<section class=&quot;card&quot; id=&quot;sec5&quot;>
<div class=&quot;section-kicker&quot;>05 / TEXT</div>
<h2>텍스트 (Text)</h2>
<p>화면에 글자를 띄우고 싶을 때는 <span class=&quot;mono-inline&quot;>Entity</span> 대신 <b>Text</b> 클래스를 사용합니다.</p>
<h3>5-1. 기본 사용법</h3>
<div class=&quot;code-wrap&quot;>
<div class=&quot;code-top&quot;><span class=&quot;dot red&quot;></span><span class=&quot;dot white&quot;></span><span class=&quot;fname&quot;>text_basic.py</span></div>
<pre><code class=&quot;language-python&quot;>info = Text(text='Hello Ursina!')</code></pre>
</div>
<ul>
<li>Text는 기본적으로 <b>카메라의 UI(camera.ui)</b> 에 붙어서 화면에 고정된 2D 텍스트로 보입니다.</li>
<li>3D 좌표(world space)가 아니라 <b>화면 좌표계(UI 좌표계)</b> 를 사용합니다 (대략 -0.5 ~ 0.5 범위).</li>
</ul>
<h3>5-2. 주요 속성</h3>
<table>
<tr><th>속성</th><th>설명</th></tr>
<tr><td>text=''</td><td>출력할 문자열</td></tr>
<tr><td>position=(x, y)</td><td>화면 상의 위치 (UI 좌표계)</td></tr>
<tr><td>scale=</td><td>글자 크기</td></tr>
<tr><td>color=</td><td>글자 색상</td></tr>
<tr><td>origin=(x, y)</td><td>텍스트 기준점 (정렬 기준)</td></tr>
</table>
<h3>5-3. 예시</h3>
<div class=&quot;code-wrap&quot;>
<div class=&quot;code-top&quot;><span class=&quot;dot red&quot;></span><span class=&quot;dot white&quot;></span><span class=&quot;fname&quot;>text_example.py</span></div>
<pre><code class=&quot;language-python&quot;>from ursina import *

app = Ursina()

title = Text(
    text='Ursina Shapes &amp;amp; Colors',
    position=(-0.4, 0.45),
    scale=2,
    color=color.yellow
)

app.run()</code></pre>
</div>
<blockquote>💡 Text는 줄바꿈도 가능합니다: <span class=&quot;mono-inline&quot;>Text(text='1번째 줄\n2번째 줄')</span></blockquote>
</section>

<section class=&quot;card&quot; id=&quot;sec7&quot;>
<div class=&quot;section-kicker&quot;>06 / SUMMARY</div>
<h2>핵심 정리</h2>
<ul>
<li><span class=&quot;mono-inline&quot;>Entity(model='도형이름', color=색상, position=(x,y,z))</span> → 도형 생성 기본 패턴</li>
<li><span class=&quot;mono-inline&quot;>color.이름</span> (정의된 색) 또는 <span class=&quot;mono-inline&quot;>color.rgb()</span>, <span class=&quot;mono-inline&quot;>color.random_color()</span> 로 색 지정</li>
<li><span class=&quot;mono-inline&quot;>Text(text='문자열', position=(x,y))</span> → 화면에 글자 출력 (UI 좌표계 사용)</li>
<li>도형은 3D 월드 좌표계, 텍스트는 기본적으로 2D 화면(UI) 좌표계라는 점이 가장 큰 차이</li>
</ul>

<li>(도전) <span class=&quot;mono-inline&quot;>for</span>문을 사용해서 큐브 5개를 가로로 일정 간격으로 배치하고, 각각 다른 색을 자동으로 입혀보세요.</li>

        if (match) match.classList.add('active');
      }
    });
  }, { rootMargin: '-30% 0px -60% 0px' });
  sections.forEach(s => observer.observe(s));

  function toggleAnswer(btn){

    ans.classList.toggle('show');
    btn.textContent = ans.classList.contains('show') ? '정답 숨기기' : '정답 보기';

  // shapes color-cycle demo
  (function(){

  })();

  // text typewriter demo
  (function(){
    const texts = ['Ursina Shapes &amp; Colors', 'Hello Ursina!', &quot;Text(text='...')&quot;];
    let ti = 0, ci = 0, deleting = false;
    const el = document.getElementById('typeText');
    function step(){
      const current = texts[ti];
      if(!deleting){
        ci++;
        el.textContent = current.slice(0, ci);
        if(ci >= current.length){ deleting = true; setTimeout(step, 1300); return; }
      } else {
        ci--;
        el.textContent = current.slice(0, ci);
        if(ci <= 0){ deleting = false; ti = (ti+1) % texts.length; }
      }
      setTimeout(step, deleting ? 45 : 85);
    }
    step();
  })();

<section class=&quot;card&quot; id=&quot;sec3&quot;>
<div class=&quot;section-kicker&quot;>03 / CONCEPTS</div>
<h2>핵심 개념 정리</h2>
<h3>3-1. 🚀 Movement (이동)</h3>
<p>엔티티의 위치 속성을 직접 더하거나 빼서 이동시킵니다.</p>
<div class=&quot;code-wrap&quot;>
<div class=&quot;code-top&quot;><span class=&quot;dot red&quot;></span><span class=&quot;dot white&quot;></span><span class=&quot;fname&quot;>move_basic.py</span></div>
<pre><code class=&quot;language-python&quot;>entity.x += 1   # 오른쪽으로 이동
entity.y -= 1   # 아래쪽으로 이동
entity.z += 1   # 앞쪽으로 이동 (3D 깊이 방향)</code></pre>
</div>
<p><span class=&quot;mono-inline&quot;>held_keys['키이름']</span>은 해당 키가 <b>눌려 있는 동안</b> 1(True), 떼면 0(False)을 반환합니다. <span class=&quot;mono-inline&quot;>update()</span> 함수 안에서 매 프레임마다 검사하면 키를 누르고 있는 동안 계속 움직입니다.</p>
<div class=&quot;code-wrap&quot;>
<div class=&quot;code-top&quot;><span class=&quot;dot red&quot;></span><span class=&quot;dot white&quot;></span><span class=&quot;fname&quot;>held_keys.py</span></div>
<pre><code class=&quot;language-python&quot;>def update():
    if held_keys['right_arrow']:
        cube.x += 0.05</code></pre>
</div>
<blockquote>⚠️ 주의: 0.05처럼 고정된 값을 더하면, 컴퓨터 성능(프레임 수)에 따라 속도가 달라질 수 있습니다. 이를 해결하는 방법이 아래 time.dt입니다.</blockquote>
<h3>3-2. ⏱ time.dt — 프레임 독립적인 이동</h3>
<p><span class=&quot;mono-inline&quot;>time.dt</span>는 &quot;바로 전 프레임과 현재 프레임 사이에 걸린 시간(초)&quot;입니다. 이동량에 time.dt를 곱하면, 컴퓨터 성능과 무관하게 <b>초당 일정한 속도</b>로 움직입니다.</p>
<div class=&quot;code-wrap&quot;>
<div class=&quot;code-top&quot;><span class=&quot;dot red&quot;></span><span class=&quot;dot white&quot;></span><span class=&quot;fname&quot;>time_dt.py</span></div>
<pre><code class=&quot;language-python&quot;>def update():
    if held_keys['right_arrow']:
        cube.x += 5 * time.dt   # 초당 5 유닛씩 이동</code></pre>
</div>
<table>
<tr><th>방식</th><th>장점</th><th>단점</th></tr>
<tr><td>cube.x += 0.05</td><td>코드가 단순</td><td>프레임 수에 따라 속도가 달라짐</td></tr>
<tr><td>cube.x += 5 * time.dt</td><td>어떤 컴퓨터에서도 속도 동일</td><td>숫자(속도값) 설계가 약간 더 필요</td></tr>
</table>
<h3>3-3. 🔄 Rotations (회전)</h3>
<div class=&quot;code-wrap&quot;>
<div class=&quot;code-top&quot;><span class=&quot;dot red&quot;></span><span class=&quot;dot white&quot;></span><span class=&quot;fname&quot;>rotate.py</span></div>
<pre><code class=&quot;language-python&quot;>cube.rotation_x += 1   # X축 기준 회전 (위/아래로 구르는 느낌)
cube.rotation_y += 1   # Y축 기준 회전 (제자리에서 도는 느낌)
cube.rotation_z += 1   # Z축 기준 회전 (시계방향/반시계방향)</code></pre>
</div>
<ul>
<li>회전값의 단위는 <b>도(degree)</b> 입니다 (0~360).</li>
<li><span class=&quot;mono-inline&quot;>cube.rotation = (x, y, z)</span> 처럼 한 번에 세 축을 모두 지정할 수도 있습니다.</li>
</ul>
<h3>3-4. 🎨 More Colors (색상 확장)</h3>
<div class=&quot;code-wrap&quot;>
<div class=&quot;code-top&quot;><span class=&quot;dot red&quot;></span><span class=&quot;dot white&quot;></span><span class=&quot;fname&quot;>more_colors.py</span></div>
<pre><code class=&quot;language-python&quot;>color.rgb(r, g, b)         # 0~255 범위의 RGB 직접 지정
color.rgba(r, g, b, a)      # a(투명도)까지 지정, a가 작을수록 투명
color.random_color()        # 무작위 색상</code></pre>
</div>
<p>색을 부드럽게 바꾸고 싶다면 <span class=&quot;mono-inline&quot;>lerp()</span>(보간)를 활용할 수 있습니다.</p>
<div class=&quot;code-wrap&quot;>
<div class=&quot;code-top&quot;><span class=&quot;dot red&quot;></span><span class=&quot;dot white&quot;></span><span class=&quot;fname&quot;>lerp.py</span></div>
<pre><code class=&quot;language-python&quot;>cube.color = lerp(color.red, color.blue, 0.5)  # 빨강과 파랑의 중간색</code></pre>
</div>
<div class=&quot;code-wrap&quot;>
<div class=&quot;code-top&quot;><span class=&quot;dot red&quot;></span><span class=&quot;dot white&quot;></span><span class=&quot;fname&quot;>input_color.py</span></div>
<pre><code class=&quot;language-python&quot;>def input(key):
    if key == 'c':
        cube.color = color.random_color()</code></pre>
</div>
<blockquote>💡 update()는 <b>매 프레임마다</b> 호출되고, input(key)는 <b>키를 누르는 순간 한 번</b>만 호출됩니다.</blockquote>
<table>
<tr><th>함수</th><th>호출 시점</th><th>주 용도</th></tr>
<tr><td>update()</td><td>매 프레임 (계속)</td><td>이동, 회전처럼 지속적인 동작</td></tr>
<tr><td>input(key)</td><td>키를 누르는 순간 1회</td><td>색 변경, 점프 등 한 번만 일어나는 동작</td></tr>
</table>
</section>


<section class=&quot;card&quot; id=&quot;sec6&quot;>
<div class=&quot;section-kicker&quot;>04 / SUMMARY</div>
<h2>핵심 정리</h2>
<ul>
<li>이동: <span class=&quot;mono-inline&quot;>entity.x/y/z += 값</span> (가능하면 <span class=&quot;mono-inline&quot;>값 * time.dt</span> 형태로)</li>
<li>회전: <span class=&quot;mono-inline&quot;>entity.rotation_x/y/z += 값</span> 또는 <span class=&quot;mono-inline&quot;>entity.rotation = (x,y,z)</span></li>
<li><span class=&quot;mono-inline&quot;>update()</span> = 매 프레임 반복 동작, <span class=&quot;mono-inline&quot;>input(key)</span> = 키 입력 1회 이벤트</li>
<li>색상: <span class=&quot;mono-inline&quot;>color.rgb()</span>, <span class=&quot;mono-inline&quot;>color.rgba()</span>, <span class=&quot;mono-inline&quot;>color.random_color()</span>, <span class=&quot;mono-inline&quot;>lerp()</span>로 보간</li>
</ul>
</section>
<section class=&quot;card&quot; id=&quot;sec7&quot;>
<div class=&quot;section-kicker&quot;>05 / PRACTICE — BASIC</div>
<h2>실습 문제 · 기본</h2>
<ol>
<li>화살표 키를 이용해 정육면체가 상하좌우로 움직이도록 코드를 작성하세요.</li>
<li>스페이스바를 누르면 정육면체가 Z축을 기준으로 회전하도록 구현하세요.</li>
<li>c 키를 누를 때마다 정육면체의 색이 랜덤하게 바뀌도록 구현하세요.</li>
</ol>
</section>
<section class=&quot;card&quot; id=&quot;sec8&quot;>
<div class=&quot;section-kicker&quot;>06 / PRACTICE — ADVANCED</div>
<h2>실습 문제 · 심화 (힌트 포함)</h2>
<h3>문제 4. 프레임 독립적인 이동으로 바꾸기</h3>
<p>위 1번 코드를 time.dt를 사용한 버전으로 수정하세요. 속도는 초당 4유닛으로 설정합니다.</p>
<blockquote>힌트: <span class=&quot;mono-inline&quot;>cube.x += 4 * time.dt</span></blockquote>
<h3>문제 5. 두 가지 키로 회전 방향 다르게 하기</h3>
<p>q 키를 누르면 Y축 기준 반시계 방향으로, e 키를 누르면 시계 방향으로 회전하도록 만드세요.</p>
<div class=&quot;code-wrap&quot;>
<div class=&quot;code-top&quot;><span class=&quot;dot red&quot;></span><span class=&quot;dot white&quot;></span><span class=&quot;fname&quot;>hint_5.py</span></div>
<pre><code class=&quot;language-python&quot;>def update():
    if held_keys['q']:
        cube.rotation_y -= 100 * time.dt
    if held_keys['e']:
        cube.rotation_y += 100 * time.dt</code></pre>
</div>
<h3>문제 6. 이동 속도를 두 배로 빠르게 하는 키 추가</h3>
<p>shift 키를 누른 상태에서는 이동 속도가 2배가 되도록 구현하세요.</p>
<blockquote>힌트: <span class=&quot;mono-inline&quot;>speed = 10 if held_keys['shift'] else 5</span> 형태로 update() 맨 위에서 속도를 미리 계산해두면 편리합니다.</blockquote>
<h3>문제 7. 색상 보간(lerp) 애니메이션</h3>
<p>정육면체의 색이 시간이 지날수록 빨강 → 파랑으로 천천히 변하도록 구현하세요. (<span class=&quot;mono-inline&quot;>lerp(color.red, color.blue, t)</span>에서 t 값을 0에서 1까지 서서히 증가시켜보세요.)</p>
<h3>문제 8. (종합 응용) 나만의 미니 컨트롤러 만들기</h3>
<p>다음 조건을 모두 만족하는 하나의 프로그램을 작성하세요.</p>
<ul>
<li>방향키로 이동 (time.dt 적용)</li>
<li>스페이스바로 Y축 회전</li>
<li>r 키를 누르면 즉시 색이 랜덤하게 바뀜</li>
<li>화면 상단에 조작법 안내 텍스트 표시</li>

<script>
  if (window.hljs) { hljs.highlightAll(); }

  const bar = document.getElementById('progressBar');
  window.addEventListener('scroll', () => {
    const h = document.documentElement;
    const scrolled = (h.scrollTop) / (h.scrollHeight - h.clientHeight) * 100;
    bar.style.width = scrolled + '%';
  });

  const tocLinks = document.querySelectorAll('nav.toc a');
  tocLinks.forEach(link => {
    link.addEventListener('click', function(e){
      e.preventDefault();
      const target = document.getElementById(this.getAttribute('href').slice(1));
      if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  });
  const sections = document.querySelectorAll('section.card');
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        tocLinks.forEach(l => l.classList.remove('active'));
        const match = document.querySelector(`nav.toc a[href=&quot;#${entry.target.id}&quot;]`);
        if (match) match.classList.add('active');
      }
    });
  }, { rootMargin: '-30% 0px -60% 0px' });
  sections.forEach(s => observer.observe(s));

  function toggleAnswer(btn){
    const ans = btn.nextElementSibling;
    ans.classList.toggle('show');
    btn.textContent = ans.classList.contains('show') ? '정답 숨기기' : '정답 보기';
  }

  // movement + rotation + color demo (auto-playing, simulates held_keys / input)
  (function(){
    const track = document.querySelector('.demo-track');
    const cubeEl = document.getElementById('demoCube');
    const xValEl = document.getElementById('xVal');
    const keyLeft = document.getElementById('keyLeft');
    const keyRight = document.getElementById('keyRight');
    const keySpace = document.getElementById('keySpace');
    const keyC = document.getElementById('keyC');

    let x = 0, speed = 70, rot = 0;
    let last = performance.now();
    const palette = ['#E2562B','#1F8C76','#3A6EA5','#C9A227','#8E44AD'];

    function frame(now){
      const dt = Math.min((now - last) / 1000, 0.05);
      last = now;
      const trackWidth = track.clientWidth - cubeEl.clientWidth - 14;

      x += speed * dt;
      if (x > trackWidth) { x = trackWidth; speed *= -1; }
      if (x < 0) { x = 0; speed *= -1; }

      rot += dt * 110;
      cubeEl.style.transform = `translateX(${x}px) rotate(${rot}deg)`;

      const simulated = ((x / trackWidth) * 6 - 3).toFixed(2);
      xValEl.textContent = `x = ${simulated}`;

      keyRight.classList.toggle('lit', speed > 0);
      keyLeft.classList.toggle('lit', speed < 0);
      keySpace.classList.add('lit'); // 항상 회전 중

      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);

    setInterval(() => {
      cubeEl.style.background = palette[Math.floor(Math.random() * palette.length)];
      keyC.classList.add('lit');
      setTimeout(() => keyC.classList.remove('lit'), 220);
    }, 1700);
  })();
</script>

<section class=&quot;card&quot; id=&quot;sec1&quot;>
<div class=&quot;section-kicker&quot;>01 / REVIEW</div>
<h2>지난 시간 복습 (#03)</h2>
<ul>
<li><code style=&quot;font-family:var(--font-mono)&quot;>entity.x/y/z += 값</code> 으로 이동, <code style=&quot;font-family:var(--font-mono)&quot;>time.dt</code>를 곱해 프레임 독립적인 속도 구현</li>
<li><code style=&quot;font-family:var(--font-mono)&quot;>entity.rotation_x/y/z</code> 로 회전</li>
<li><code style=&quot;font-family:var(--font-mono)&quot;>update()</code>(매 프레임) vs <code style=&quot;font-family:var(--font-mono)&quot;>input(key)</code>(키 입력 1회) 차이</li>
</ul>
<p>이번 시간은 키보드 입력이 아니라, <b>큐브가 스스로 움직이다가 정해진 범위에서 방향을 바꾸는</b> 자동 제어를 다룹니다.</p>
</section>
<section class=&quot;card&quot; id=&quot;sec2&quot;>
<div class=&quot;section-kicker&quot;>02 / GOALS</div>
<h2>학습 목표</h2>
<ol>
<li>큐브가 화면 밖으로 벗어나지 않도록 경계를 설정하는 방법 이해하기</li>
<li>경계에 닿으면 방향을 반전시켜 <b>튕기는(bounce) 효과</b> 구현하기</li>
<li>여러 개의 오브젝트를 <b>서로 다른 축</b>으로 동시에 제어하기</li>
<li><b>프레임(시간) 카운트</b>를 이용해 일정 간격마다 방향을 전환하는 방법 배우기</li>
<li>이동뿐 아니라 <b>회전 방향</b>도 같은 방식으로 전환해보기</li>
</ol>
</section>
<section class=&quot;card&quot; id=&quot;sec3&quot;>
<div class=&quot;section-kicker&quot;>03 / CONCEPTS</div>
<h2>핵심 개념 정리 (영상 흐름 그대로)</h2>
<h3>3-1. 기본 설정</h3>
<div class=&quot;code-wrap&quot;>
<div class=&quot;code-top&quot;><span class=&quot;dot red&quot;></span><span class=&quot;dot white&quot;></span><span class=&quot;fname&quot;>basic_setup.py</span></div>
<pre><code class=&quot;language-python&quot;>from ursina import *

app = Ursina()

cube = Entity(model='cube', color=color.red)

app.run()</code></pre>
</div>
<ul>
<li><code style=&quot;font-family:var(--font-mono)&quot;>from ursina import *</code> : 모듈 불러오기</li>
<li><code style=&quot;font-family:var(--font-mono)&quot;>app = Ursina()</code> : 앱 생성</li>
<li><code style=&quot;font-family:var(--font-mono)&quot;>Entity(model='cube', color=color.red)</code> : 빨간색 큐브 생성</li>
<li><code style=&quot;font-family:var(--font-mono)&quot;>app.run()</code> : 실행 → 화면에 빨간 큐브 표시</li>
</ul>
<h3>3-2. 이동 기능 추가 (자동 이동)</h3>
<p><code style=&quot;font-family:var(--font-mono)&quot;>update()</code> 함수는 매 프레임마다 자동으로 호출됩니다. 키 입력 없이도 아래처럼 작성하면 큐브가 계속 오른쪽으로 이동합니다.</p>
<div class=&quot;code-wrap&quot;>
<div class=&quot;code-top&quot;><span class=&quot;dot red&quot;></span><span class=&quot;dot white&quot;></span><span class=&quot;fname&quot;>move.py</span></div>
<pre><code class=&quot;language-python&quot;>def update():
    cube.x += time.dt</code></pre>
</div>
<p class=&quot;soft&quot;><code style=&quot;font-family:var(--font-mono)&quot;>time.dt</code> : 이전 프레임과 현재 프레임 사이의 시간(초) → 프레임 속도와 무관하게 일정한 속도로 이동</p>
<h3>3-3. 경계 설정 — 가장 단순한 방식: 순간이동(teleport)</h3>
<p>큐브가 화면 밖으로 사라지지 않도록, x좌표가 일정 값을 넘으면 반대편으로 즉시 이동시키는 방식입니다.</p>
<div class=&quot;code-wrap&quot;>
<div class=&quot;code-top&quot;><span class=&quot;dot red&quot;></span><span class=&quot;dot white&quot;></span><span class=&quot;fname&quot;>teleport.py</span></div>
<pre><code class=&quot;language-python&quot;>def update():
    cube.x += time.dt
    if cube.x &amp;gt; 3:
        cube.x = -3</code></pre>
</div>
<blockquote>x좌표가 3을 넘는 순간 -3으로 &quot;점프&quot;하듯 되돌아갑니다. (자연스럽진 않지만 가장 이해하기 쉬운 방식)</blockquote>
<h3>3-4. 반사(Bounce) 효과 — 속도(speed) 변수로 자연스럽게 튕기기</h3>
<p>순간이동 대신, <b>속도 변수의 방향(+/-)을 뒤집는</b> 방식이 훨씬 자연스럽습니다.</p>
<div class=&quot;code-wrap&quot;>
<div class=&quot;code-top&quot;><span class=&quot;dot red&quot;></span><span class=&quot;dot white&quot;></span><span class=&quot;fname&quot;>bounce.py</span></div>
<pre><code class=&quot;language-python&quot;>speed = 1

def update():
    global speed
    cube.x += time.dt * speed

    if cube.x &amp;gt; 3:
        speed *= -1
    if cube.x &amp;lt; -3:
        speed *= -1</code></pre>
</div>
<table>
<tr><th>방식</th><th>동작</th><th>자연스러움</th></tr>
<tr><td>순간이동 (cube.x = -3)</td><td>경계에서 즉시 반대편으로 이동</td><td>뚝 끊기는 느낌</td></tr>
<tr><td>반사 (speed *= -1)</td><td>경계에서 방향만 반대로, 속도는 유지</td><td>공이 튕기듯 자연스러움</td></tr>
</table>
<blockquote>💡 함수 안에서 바깥의 변수(speed)를 수정하려면 <code style=&quot;font-family:var(--font-mono)&quot;>global speed</code> 선언이 필요합니다.</blockquote>
<h3>3-5. Z축 적용 — 원근 효과</h3>
<p>같은 원리를 z축에 적용하면, 큐브가 카메라 쪽으로 가까워지고 멀어지는 것처럼 보입니다 (실제로는 z축 이동이지만, 화면상으로는 커지고 작아지는 원근 효과로 보입니다).</p>
<div class=&quot;code-wrap&quot;>
<div class=&quot;code-top&quot;><span class=&quot;dot red&quot;></span><span class=&quot;dot white&quot;></span><span class=&quot;fname&quot;>z_axis.py</span></div>
<pre><code class=&quot;language-python&quot;>speed_z = 1

def update():
    global speed_z
    cube.z += time.dt * speed_z
    if abs(cube.z) &amp;gt; 3:
        speed_z *= -1</code></pre>
</div>
<h3>3-6. 다중 큐브 추가 — 서로 다른 축으로 움직이기</h3>
<p>두 번째 큐브를 만들어 <b>y축</b>으로 움직이게 하면, 화면에서 빨간 큐브는 좌우로, 흰 큐브는 상하로 각각 튕기며 움직입니다.</p>
<div class=&quot;code-wrap&quot;>
<div class=&quot;code-top&quot;><span class=&quot;dot red&quot;></span><span class=&quot;dot white&quot;></span><span class=&quot;fname&quot;>multi_cube.py</span></div>
<pre><code class=&quot;language-python&quot;>cube2 = Entity(model='cube', color=color.white, x=2)
speed2 = 1

def update():
    global speed, speed2
    cube.x += time.dt * speed
    if abs(cube.x) &amp;gt; 3:
        speed *= -1

    cube2.y += time.dt * speed2
    if abs(cube2.y) &amp;gt; 3:
        speed2 *= -1</code></pre>
</div>
<blockquote>💡 <code style=&quot;font-family:var(--font-mono)&quot;>if abs(cube.x) &amp;gt; 3:</code> 은 <code style=&quot;font-family:var(--font-mono)&quot;>if cube.x &amp;gt; 3 or cube.x &amp;lt; -3:</code> 과 같은 의미입니다. 절댓값을 쓰면 양쪽 경계를 한 줄로 처리할 수 있습니다.</blockquote>
<h3>3-7. 시간(프레임) 기반 경계 제어</h3>
<p>지금까지는 <b>위치(x, y, z 좌표)</b>를 기준으로 방향을 바꿨습니다. 이번엔 <b>흐른 프레임 수</b>를 기준으로 방향을 바꾸는 방식입니다.</p>
<div class=&quot;code-wrap&quot;>
<div class=&quot;code-top&quot;><span class=&quot;dot red&quot;></span><span class=&quot;dot white&quot;></span><span class=&quot;fname&quot;>frame_based.py</span></div>
<pre><code class=&quot;language-python&quot;>m = 0
num_frames = 200

def update():
    global m
    m += 1
    n = m % num_frames   # 0 ~ 199 사이를 반복

    if n &amp;lt; num_frames // 2:
        cube.x += time.dt   # 처음 100프레임: 오른쪽 이동
    else:
        cube.x -= time.dt   # 다음 100프레임: 왼쪽 이동</code></pre>
</div>
<ul>
<li><code style=&quot;font-family:var(--font-mono)&quot;>m</code> : 지금까지 지난 프레임 수를 누적 (계속 증가)</li>
<li><code style=&quot;font-family:var(--font-mono)&quot;>n = m % num_frames</code> : m을 200으로 나눈 나머지 → 항상 0~199 사이 값으로 &quot;리셋&quot;됨</li>
<li><code style=&quot;font-family:var(--font-mono)&quot;>n &amp;lt; 100</code> 이면 오른쪽, 아니면 왼쪽으로 이동 → 100프레임마다 방향이 바뀜</li>
</ul>
<table>
<tr><th>제어 방식</th><th>기준</th><th>특징</th></tr>
<tr><td>위치 기반</td><td>좌표값</td><td>이동 속도에 따라 방향 전환 시점이 달라짐</td></tr>
<tr><td>프레임 기반</td><td>흐른 시간(프레임 수)</td><td>속도와 무관하게 항상 같은 박자로 방향 전환</td></tr>
</table>
<h3>3-8. 회전(Rotation) 제어</h3>
<p>이동에 썼던 프레임 기반 로직을 회전에도 그대로 적용할 수 있습니다.</p>
<div class=&quot;code-wrap&quot;>
<div class=&quot;code-top&quot;><span class=&quot;dot red&quot;></span><span class=&quot;dot white&quot;></span><span class=&quot;fname&quot;>rotation_switch.py</span></div>
<pre><code class=&quot;language-python&quot;>def update():
    global m
    m += 1
    n = m % num_frames

    if n &amp;lt; num_frames // 2:
        cube.rotation_z += time.dt * 100   # 시계 방향
    else:
        cube.rotation_z -= time.dt * 100   # 반시계 방향</code></pre>
</div>
<p>→ 큐브가 100프레임 동안 시계 방향으로 돌다가, 다음 100프레임 동안 반시계 방향으로 도는 식으로 <b>회전 방향이 번갈아 바뀝니다</b>.</p>
</section>

<section class=&quot;card&quot; id=&quot;sec5&quot;>
<div class=&quot;section-kicker&quot;>04 / SUMMARY</div>
<h2>핵심 정리</h2>
<ul>
<li>경계는 <b>순간이동</b>(<code style=&quot;font-family:var(--font-mono)&quot;>cube.x = -3</code>) 또는 <b>반사</b>(<code style=&quot;font-family:var(--font-mono)&quot;>speed *= -1</code>) 두 가지 방식으로 구현 가능 — 반사가 더 자연스러움</li>
<li><code style=&quot;font-family:var(--font-mono)&quot;>global</code> 키워드로 함수 안에서 바깥 변수를 수정할 수 있음 (speed, m 등)</li>
<li><code style=&quot;font-family:var(--font-mono)&quot;>abs(값) &amp;gt; 한계</code> 로 양쪽 경계를 한 줄로 처리 가능</li>
<li>여러 오브젝트는 <b>서로 다른 속도 변수</b>를 따로 두면 독립적으로 제어 가능</li>
<li>위치 기반 제어 외에 <b>프레임 카운트 기반 제어</b>(<code style=&quot;font-family:var(--font-mono)&quot;>m % num_frames</code>)로도 일정 박자의 방향 전환을 만들 수 있음</li>
<li>같은 원리(반전/프레임 기반)를 이동뿐 아니라 <b>회전</b>에도 동일하게 적용할 수 있음</li>
</ul>
</section>
<section class=&quot;card&quot; id=&quot;sec6&quot;>
<div class=&quot;section-kicker&quot;>05 / PRACTICE — BASIC</div>
<h2>실습 문제 · 기본</h2>
<ol>
<li>큐브가 x축 -3 ~ 3 범위를 넘으면 반대편으로 순간이동(teleport)하도록 구현하세요.</li>
<li>1번 코드를 <code style=&quot;font-family:var(--font-mono)&quot;>speed</code> 변수와 <code style=&quot;font-family:var(--font-mono)&quot;>*= -1</code>을 이용한 <b>반사(bounce)</b> 방식으로 바꿔보세요.</li>
</ol>
</section>
<section class=&quot;card&quot; id=&quot;sec7&quot;>
<div class=&quot;section-kicker&quot;>06 / PRACTICE — ADVANCED</div>
<h2>실습 문제 · 심화 (힌트 포함)</h2>
<h3>문제 3. z축 원근 효과 만들기</h3>
<p>큐브가 z축으로 -3~3 범위에서 튕기도록 만들어, 카메라 쪽으로 가까워지고 멀어지는 원근 효과를 구현하세요.</p>
<h3>문제 4. 두 번째 큐브 추가하기</h3>
<p>흰색 큐브를 하나 더 만들어 y축 -3~3 범위에서 튕기도록 만들고, 빨간 큐브(x축)와 동시에 화면에서 움직이는지 확인하세요.</p>
<blockquote>힌트: 두 큐브의 속도 변수(speed, speed2)를 반드시 따로 선언해야 서로 영향을 주지 않습니다.</blockquote>
<h3>문제 5. 속도를 다르게 주어 리듬 어긋나게 하기</h3>
<p>빨간 큐브는 <code style=&quot;font-family:var(--font-mono)&quot;>speed = 1</code>, 흰 큐브는 <code style=&quot;font-family:var(--font-mono)&quot;>speed2 = 2.5</code>로 설정해서, 두 큐브가 튕기는 박자가 서로 다르게 보이도록 만들어보세요.</p>
<h3>문제 6. 프레임 기반 좌우 이동 구현하기</h3>
<p><code style=&quot;font-family:var(--font-mono)&quot;>m</code>, <code style=&quot;font-family:var(--font-mono)&quot;>num_frames = 200</code>을 이용해, 큐브가 100프레임은 오른쪽으로 100프레임은 왼쪽으로 움직이도록 구현하세요. (좌표 비교가 아니라 프레임 수만으로 방향을 바꿔야 합니다.)</p>
<h3>문제 7. 회전 방향도 프레임 기반으로 전환하기</h3>
<p>6번에서 만든 프레임 기반 로직을 그대로 활용해, 큐브의 <code style=&quot;font-family:var(--font-mono)&quot;>rotation_z</code>도 100프레임마다 회전 방향이 바뀌도록 구현하세요.</p>
<h3>문제 8. (종합 응용) 모든 것을 합치기</h3>
<p>다음 조건을 모두 만족하는 하나의 프로그램을 작성하세요.</p>
<ul>
<li>빨간 큐브: x축으로 위치 기반 반사 이동</li>
<li>흰 큐브: y축으로 위치 기반 반사 이동 (속도는 빨간 큐브와 다르게)</li>
<li>빨간 큐브: 프레임 기반으로 회전 방향이 100프레임마다 전환</li>
<li>(도전) num_frames 값을 바꿔서 회전 전환 박자를 더 빠르게/느리게 만들어보고, 결과가 어떻게 달라지는지 관찰해보세요.</li>
</ul>
</section><section class=&quot;card&quot; id=&quot;sec4&quot;>
<div class=&quot;section-kicker&quot;>07 / FULL CODE · 정답 확인</div>
<h2>전체 종합 예제 코드</h2><p class=&quot;fullcode-notice&quot;>✍️ 먼저 위 핵심 개념과 실습 문제를 참고해 스스로 코드를 작성해 보세요. 다 작성했거나 막히는 부분을 비교하고 싶을 때 아래를 눌러 전체 코드를 확인합니다.</p><details class=&quot;fullcode&quot;><summary><span class=&quot;lock&quot;>🔒</span><span>전체 코드 확인하기</span><span class=&quot;hint&quot;>SPOILER · CLICK</span></summary><div class=&quot;fullcode-body&quot;>
<p>영상에서 다룬 모든 단계를 하나로 합친 코드입니다.</p>
<div class=&quot;code-wrap&quot;>
<div class=&quot;code-top&quot;><span class=&quot;dot red&quot;></span><span class=&quot;dot white&quot;></span><span class=&quot;fname&quot;>main.py</span></div>
<pre><code class=&quot;language-python&quot;>from ursina import *

app = Ursina()

# 빨간 큐브: x축으로 튕기며 이동 + 회전 방향 전환
cube = Entity(model='cube', color=color.red)
speed = 1

# 흰 큐브: y축으로 튕기며 이동
cube2 = Entity(model='cube', color=color.white, x=2)
speed2 = 1

m = 0
num_frames = 200

def update():
    global speed, speed2, m

    # 1) 빨간 큐브: 위치 기반 반사(bounce)
    cube.x += time.dt * speed
    if abs(cube.x) &amp;gt; 3:
        speed *= -1

    # 2) 흰 큐브: 위치 기반 반사(bounce), y축
    cube2.y += time.dt * speed2
    if abs(cube2.y) &amp;gt; 3:
        speed2 *= -1

    # 3) 프레임 기반 회전 방향 전환
    m += 1
    n = m % num_frames
    if n &amp;lt; num_frames // 2:
        cube.rotation_z += time.dt * 100
    else:
        cube.rotation_z -= time.dt * 100

app.run()</code></pre>

    const cubeEl = document.getElementById('demoCube');
    const xValEl = document.getElementById('xVal');
    let x = 0, speed = 60; // px per second-ish
    let last = performance.now();

    function frame(now){
      const dt = Math.min((now - last) / 1000, 0.05);
      last = now;
      const trackWidth = track.clientWidth - cubeEl.clientWidth - 14;
      x += speed * dt;
      if (x > trackWidth) { x = trackWidth; speed *= -1; }
      if (x < 0) { x = 0; speed *= -1; }

<section class=&quot;card&quot; id=&quot;sec1&quot;>
<div class=&quot;section-kicker&quot;>01 / REVIEW</div>
<h2>지난 시간 복습 (#04)</h2>
<ul>
<li>경계는 순간이동(<span class=&quot;mono-inline&quot;>cube.x = -3</span>) 또는 반사(<span class=&quot;mono-inline&quot;>speed *= -1</span>)로 구현</li>
<li><span class=&quot;mono-inline&quot;>global</span> 키워드, <span class=&quot;mono-inline&quot;>abs()</span>를 이용한 양쪽 경계 처리, 프레임 카운트 기반 제어</li>
</ul>
<p>이번 시간은 오브젝트가 아니라 <b>&quot;보는 눈&quot; 자체, 즉 카메라</b>를 다루는 단계입니다.</p>
</section>
<section class=&quot;card&quot; id=&quot;sec2&quot;>
<div class=&quot;section-kicker&quot;>02 / GOALS</div>
<h2>학습 목표</h2>
<ol>
<li>카메라를 추가해 게임 장면을 다양한 시점에서 관찰하기</li>
<li>카메라 속성을 조정해 <b>줌, 회전, 위치 이동</b>을 구현하기</li>
<li><span class=&quot;mono-inline&quot;>look_at()</span>으로 카메라가 특정 대상을 자동으로 바라보게 만들기</li>
<li>캐릭터를 따라다니는 <b>3인칭 추적 카메라</b> 만들어보기</li>
</ol>
</section>
<section class=&quot;card&quot; id=&quot;sec3&quot;>
<div class=&quot;section-kicker&quot;>03 / CONCEPTS</div>
<h2>핵심 개념 정리</h2>
<h3>3-1. 기본 카메라 이해하기</h3>
<p>사실 지금까지 만든 모든 예제에는 이미 카메라가 있었습니다. <span class=&quot;mono-inline&quot;>Ursina()</span>를 실행하면 기본 <span class=&quot;mono-inline&quot;>camera</span> 객체가 자동으로 생성되어, 따로 만들지 않아도 화면에 장면이 보였던 것입니다.</p>
<div class=&quot;code-wrap&quot;>
<div class=&quot;code-top&quot;><span class=&quot;dot red&quot;></span><span class=&quot;dot white&quot;></span><span class=&quot;fname&quot;>default_camera.py</span></div>
<pre><code class=&quot;language-python&quot;>from ursina import *

app = Ursina()
cube = Entity(model='cube', color=color.green)
app.run()   # camera가 이미 자동으로 cube를 비추고 있음</code></pre>
</div>
<h3>3-2. EditorCamera() — 마우스로 자유롭게 둘러보기</h3>
<div class=&quot;code-wrap&quot;>
<div class=&quot;code-top&quot;><span class=&quot;dot red&quot;></span><span class=&quot;dot white&quot;></span><span class=&quot;fname&quot;>editor_camera.py</span></div>
<pre><code class=&quot;language-python&quot;>from ursina import *

app = Ursina()

cube = Entity(model='cube', color=color.green)
camera = EditorCamera()   # 자유롭게 움직일 수 있는 카메라 추가

app.run()</code></pre>
</div>
<table>
<tr><th>조작</th><th>동작</th></tr>
<tr><td>마우스 오른쪽 버튼 + 드래그</td><td>카메라가 대상 주위를 회전(궤도 운동)</td></tr>
<tr><td>마우스 휠 스크롤</td><td>줌인 / 줌아웃</td></tr>
</table>
<h3>3-3. camera.position / camera.rotation — 직접 제어하기</h3>
<div class=&quot;code-wrap&quot;>
<div class=&quot;code-top&quot;><span class=&quot;dot red&quot;></span><span class=&quot;dot white&quot;></span><span class=&quot;fname&quot;>manual_control.py</span></div>
<pre><code class=&quot;language-python&quot;>def update():
    speed = 5
    if held_keys['w']:
        camera.z += speed * time.dt
    if held_keys['s']:
        camera.z -= speed * time.dt
    if held_keys['a']:
        camera.x -= speed * time.dt
    if held_keys['d']:
        camera.x += speed * time.dt</code></pre>
</div>
<p><span class=&quot;mono-inline&quot;>camera.rotation_x/y/z</span> 로 카메라의 회전도 직접 조작할 수 있습니다.</p>
<h3>3-4. camera.fov — 줌인 / 줌아웃</h3>
<p><span class=&quot;mono-inline&quot;>fov</span>(시야각, field of view)는 카메라가 한 번에 볼 수 있는 각도입니다. 값이 <b>작아지면 줌인</b>(좁고 가깝게), <b>커지면 줌아웃</b>(넓고 멀게) 됩니다.</p>
<div class=&quot;code-wrap&quot;>
<div class=&quot;code-top&quot;><span class=&quot;dot red&quot;></span><span class=&quot;dot white&quot;></span><span class=&quot;fname&quot;>fov_zoom.py</span></div>
<pre><code class=&quot;language-python&quot;>def update():
    if held_keys['e']:
        camera.fov -= 20 * time.dt   # 줌인
    if held_keys['q']:
        camera.fov += 20 * time.dt   # 줌아웃
    camera.fov = clamp(camera.fov, 10, 80)   # 너무 작거나 크지 않게 제한</code></pre>
</div>
<h3>3-5. camera.look_at() — 특정 대상 바라보기</h3>
<div class=&quot;code-wrap&quot;>
<div class=&quot;code-top&quot;><span class=&quot;dot red&quot;></span><span class=&quot;dot white&quot;></span><span class=&quot;fname&quot;>look_at.py</span></div>
<pre><code class=&quot;language-python&quot;>cube = Entity(model='cube', color=color.green, position=(3, 0, 0))

camera.position = (0, 5, -10)
camera.look_at(cube)   # 카메라가 cube를 향하도록 자동으로 회전</code></pre>
</div>
<h3>3-6. camera.parent — 캐릭터를 따라가는 3인칭 카메라</h3>
<div class=&quot;code-wrap&quot;>
<div class=&quot;code-top&quot;><span class=&quot;dot red&quot;></span><span class=&quot;dot white&quot;></span><span class=&quot;fname&quot;>follow_camera.py</span></div>
<pre><code class=&quot;language-python&quot;>player = Entity(model='cube', color=color.azure)

camera.parent = player          # 카메라를 player의 자식으로 만들기
camera.position = (0, 5, -10)   # player 기준 상대 위치
camera.rotation_x = 25

def update():
    if held_keys['d']:
        player.x += 5 * time.dt
    if held_keys['a']:
        player.x -= 5 * time.dt</code></pre>
</div>
<blockquote>💡 <span class=&quot;mono-inline&quot;>camera.parent = player</span> 로 설정하면, 카메라의 위치/회전이 항상 player를 기준으로 한 &quot;상대 위치&quot;가 되어, player가 움직이면 카메라도 같은 만큼 따라 움직입니다.</blockquote>
</section>

<section class=&quot;card&quot; id=&quot;sec5&quot;>
<div class=&quot;section-kicker&quot;>04 / SUMMARY</div>
<h2>핵심 정리</h2>
<ul>
<li>Ursina를 실행하면 <span class=&quot;mono-inline&quot;>camera</span>가 자동으로 생성되어 있음</li>
<li><span class=&quot;mono-inline&quot;>EditorCamera()</span> : 마우스 우클릭+드래그(회전), 휠(줌) 로 자유롭게 둘러볼 수 있는 카메라</li>
<li><span class=&quot;mono-inline&quot;>camera.position / rotation_x,y,z</span> : 카메라를 직접 제어</li>
<li><span class=&quot;mono-inline&quot;>camera.fov</span> : 줌인(작게) / 줌아웃(크게)</li>
<li><span class=&quot;mono-inline&quot;>camera.look_at(대상)</span> : 특정 대상을 자동으로 바라보게 함</li>
<li><span class=&quot;mono-inline&quot;>camera.parent = 캐릭터</span> : 캐릭터를 따라가는 3인칭 카메라 구현</li>
</ul>
</section>
<section class=&quot;card&quot; id=&quot;sec6&quot;>
<div class=&quot;section-kicker&quot;>05 / PRACTICE — BASIC</div>
<h2>실습 문제 · 기본</h2>
<ol>
<li>카메라를 앞뒤로 움직일 수 있도록 구현하세요.</li>
<li>카메라를 회전시켜 큐브를 다양한 각도에서 관찰하세요.</li>
</ol>
</section>
<section class=&quot;card&quot; id=&quot;sec7&quot;>
<div class=&quot;section-kicker&quot;>06 / PRACTICE — ADVANCED</div>
<h2>실습 문제 · 심화 (힌트 포함)</h2>
<h3>문제 3. 4방향 카메라 이동 + time.dt 적용</h3>
<p>w/a/s/d 키 모두를 사용해 카메라를 4방향으로 이동시키고, <span class=&quot;mono-inline&quot;>time.dt</span>를 적용해 어떤 컴퓨터에서도 같은 속도로 움직이게 만드세요.</p>
<h3>문제 4. FOV로 줌인 / 줌아웃 + 범위 제한</h3>
<p>q/e 키로 <span class=&quot;mono-inline&quot;>camera.fov</span>를 조절해 줌인/줌아웃을 구현하세요. <span class=&quot;mono-inline&quot;>clamp()</span>를 이용해 fov가 10~80 범위를 벗어나지 않도록 제한해보세요.</p>
<h3>문제 5. look_at()으로 항상 큐브 바라보기</h3>
<p><span class=&quot;mono-inline&quot;>camera.look_at()</span>을 이용해 카메라가 항상 큐브를 바라보도록 만들고, 큐브 위치를 바꿔도 카메라가 따라서 방향을 바꾸는지 확인하세요.</p>
<h3>문제 6. 3인칭 추적 카메라 만들기</h3>
<p><span class=&quot;mono-inline&quot;>camera.parent = player</span>를 이용해 추적 카메라를 만들고, 플레이어를 좌우로 이동시켰을 때 카메라도 함께 따라가는지 확인하세요.</p>
<blockquote>힌트: camera.position은 player를 기준으로 한 &quot;상대 위치&quot;라는 점을 기억하세요.</blockquote>
<h3>문제 7. (종합) 모든 기능 합치기</h3>
<p>플레이어를 따라가는 카메라 + q/e 키로 FOV 줌이 모두 동작하는 미니 데모를 만들어보세요.</p>
</section><section class=&quot;card&quot; id=&quot;sec4&quot;>
<div class=&quot;section-kicker&quot;>07 / FULL CODE · 정답 확인</div>
<h2>종합 예제 코드 — 추적 카메라 + FOV 줌</h2><p class=&quot;fullcode-notice&quot;>✍️ 먼저 위 핵심 개념과 실습 문제를 참고해 스스로 코드를 작성해 보세요. 다 작성했거나 막히는 부분을 비교하고 싶을 때 아래를 눌러 전체 코드를 확인합니다.</p><details class=&quot;fullcode&quot;><summary><span class=&quot;lock&quot;>🔒</span><span>전체 코드 확인하기</span><span class=&quot;hint&quot;>SPOILER · CLICK</span></summary><div class=&quot;fullcode-body&quot;>
<div class=&quot;code-wrap&quot;>
<div class=&quot;code-top&quot;><span class=&quot;dot red&quot;></span><span class=&quot;dot white&quot;></span><span class=&quot;fname&quot;>main.py</span></div>
<pre><code class=&quot;language-python&quot;>from ursina import *

app = Ursina()

player = Entity(model='cube', color=color.azure)

camera.parent = player
camera.position = (0, 5, -10)
camera.rotation_x = 25

def update():
    speed = 5
    if held_keys['d']:
        player.x += speed * time.dt
    if held_keys['a']:
        player.x -= speed * time.dt

    if held_keys['e']:
        camera.fov -= 20 * time.dt
    if held_keys['q']:
        camera.fov += 20 * time.dt
    camera.fov = clamp(camera.fov, 10, 80)

app.run()</code></pre>
</div>
</div></details></section>
<section class=&quot;card&quot; id=&quot;sec8&quot;>
<div class=&quot;section-kicker&quot;>08 / SELF-CHECK QUIZ</div>

<div class=&quot;checklist&quot;>

<h3>3-1. Collider 추가하기</h3>
<p>엔티티가 충돌을 감지하려면 먼저 <b>충돌체(collider)</b>가 있어야 합니다.</p>
<div class=&quot;code-wrap&quot;>
<div class=&quot;code-top&quot;><span class=&quot;dot red&quot;></span><span class=&quot;dot white&quot;></span><span class=&quot;fname&quot;>colliders.py</span></div>

sphere = Entity(model='sphere', collider='sphere')</code></pre>

<table>
<tr><th>collider 값</th><th>형태</th><th>적합한 모델</th></tr>
<tr><td>'box'</td><td>직육면체 형태</td><td>cube, plane 등 각진 모델</td></tr>
<tr><td>'sphere'</td><td>구 형태</td><td>sphere 등 둥근 모델</td></tr>
<tr><td>'mesh'</td><td>모델의 실제 모양 그대로</td><td>정밀한 충돌이 필요할 때 (연산량 ↑)</td></tr>
</table>
<h3>3-2. intersects()로 충돌 확인하기</h3>
<div class=&quot;code-wrap&quot;>
<div class=&quot;code-top&quot;><span class=&quot;dot red&quot;></span><span class=&quot;dot white&quot;></span><span class=&quot;fname&quot;>intersects.py</span></div>
<pre><code class=&quot;language-python&quot;>hit_info = cube1.intersects(cube2)
if hit_info.hit:
    print('충돌했다!')</code></pre>
</div>
<p><span class=&quot;mono-inline&quot;>intersects()</span>는 <b>HitInfo</b>라는 정보 객체를 돌려주며, 그 안의 <span class=&quot;mono-inline&quot;>.hit</span> 속성이 충돌 여부(True/False)를 담고 있습니다.</p>
<h3>3-3. 충돌 시 색상 변경하기</h3>
<div class=&quot;code-wrap&quot;>
<div class=&quot;code-top&quot;><span class=&quot;dot red&quot;></span><span class=&quot;dot white&quot;></span><span class=&quot;fname&quot;>color_on_hit.py</span></div>
<pre><code class=&quot;language-python&quot;>from ursina import *

app = Ursina()

cube1 = Entity(model='cube', color=color.red, collider='box', position=(-3, 0, 0))
cube2 = Entity(model='cube', color=color.blue, collider='box', position=(1, 0, 0))

def update():
    cube1.x += time.dt
    if cube1.intersects(cube2).hit:
        cube1.color = color.yellow
    else:
        cube1.color = color.red

app.run()</code></pre>
</div>
<h3>3-4. 충돌 시 이동 막기</h3>
<p>이동을 적용한 뒤 충돌을 확인해서, 충돌했다면 그 이동을 &quot;취소&quot;하는 방식으로 벽처럼 멈추는 효과를 만들 수 있습니다.</p>
<div class=&quot;code-wrap&quot;>
<div class=&quot;code-top&quot;><span class=&quot;dot red&quot;></span><span class=&quot;dot white&quot;></span><span class=&quot;fname&quot;>stop_on_hit.py</span></div>
<pre><code class=&quot;language-python&quot;>def update():
    cube1.x += time.dt
    if cube1.intersects(cube2).hit:
        cube1.x -= time.dt   # 충돌했으면 방금 이동을 취소(되돌리기)</code></pre>
</div>
<h3>3-5. 여러 오브젝트와의 충돌 확인하기</h3>
<p>장애물이 여러 개라면, 리스트로 만들어 <span class=&quot;mono-inline&quot;>for</span>문으로 하나씩 검사합니다.</p>
<div class=&quot;code-wrap&quot;>
<div class=&quot;code-top&quot;><span class=&quot;dot red&quot;></span><span class=&quot;dot white&quot;></span><span class=&quot;fname&quot;>multi_collision.py</span></div>
<pre><code class=&quot;language-python&quot;>player = Entity(model='cube', color=color.azure, collider='box')
obstacles = [Entity(model='cube', color=color.gray, collider='box', position=(x, 0, 0))
             for x in (2, 4, 6)]

def update():
    player.x += time.dt
    for obs in obstacles:
        if player.intersects(obs).hit:
            player.color = color.yellow</code></pre>
</div>
<h3>3-6. 충돌한 오브젝트 제거하기 — 코인 모으기</h3>
<p><span class=&quot;mono-inline&quot;>destroy()</span> 함수로 충돌한 오브젝트를 화면에서 완전히 제거할 수 있습니다. 점수 시스템과 결합하면 &quot;코인 모으기&quot; 같은 미니게임을 만들 수 있습니다.</p>
<div class=&quot;code-wrap&quot;>
<div class=&quot;code-top&quot;><span class=&quot;dot red&quot;></span><span class=&quot;dot white&quot;></span><span class=&quot;fname&quot;>collect_coin.py</span></div>
<pre><code class=&quot;language-python&quot;># 핵심 패턴: 충돌 감지 → destroy()로 제거 → 점수 갱신
if player.intersects(coin).hit:
    destroy(coin)                       # 충돌한 오브젝트를 화면에서 제거
    score += 1
    score_text.text = f'Score: {score}' # 점수 텍스트 갱신</code></pre>
</div>
<blockquote>💡 실제 코드에서는 <span class=&quot;mono-inline&quot;>collected</span> 같은 플래그(flag) 변수를 함께 두어, 이미 사라진 코인과의 충돌을 다시 처리하지 않도록 막아야 합니다. 어떻게 구현할지 스스로 생각해 보세요!</blockquote>
</section>

<h2>핵심 정리</h2>
<ul>
<li><span class=&quot;mono-inline&quot;>collider='box' / 'sphere' / 'mesh'</span> 로 충돌체 추가</li>
<li><span class=&quot;mono-inline&quot;>a.intersects(b).hit</span> 로 두 엔티티의 충돌 여부(True/False) 확인</li>
<li>이동을 적용한 뒤 충돌 시 되돌리는 방식으로 &quot;막힘&quot; 효과 구현 가능</li>
<li>여러 오브젝트는 리스트 + <span class=&quot;mono-inline&quot;>for</span>문으로 한꺼번에 검사</li>
<li><span class=&quot;mono-inline&quot;>destroy()</span> + 플래그 변수로 &quot;한 번만 처리되는 충돌&quot;(코인 먹기 등) 구현</li>

</section><section class=&quot;card&quot; id=&quot;sec4&quot;>
<div class=&quot;section-kicker&quot;>07 / FULL CODE · 정답 확인</div>
<h2>종합 예제 코드 — 코인 + 장애물 미니게임</h2><p class=&quot;fullcode-notice&quot;>✍️ 먼저 위 핵심 개념과 실습 문제를 참고해 스스로 코드를 작성해 보세요. 다 작성했거나 막히는 부분을 비교하고 싶을 때 아래를 눌러 전체 코드를 확인합니다.</p><details class=&quot;fullcode&quot;><summary><span class=&quot;lock&quot;>🔒</span><span>전체 코드 확인하기</span><span class=&quot;hint&quot;>SPOILER · CLICK</span></summary><div class=&quot;fullcode-body&quot;>
<div class=&quot;code-wrap&quot;>
<div class=&quot;code-top&quot;><span class=&quot;dot red&quot;></span><span class=&quot;dot white&quot;></span><span class=&quot;fname&quot;>main.py</span></div>
<pre><code class=&quot;language-python&quot;>from ursina import *

app = Ursina()

player = Entity(model='cube', color=color.azure, collider='box')

coin = Entity(model='sphere', color=color.gold, collider='sphere', position=(3, 0, 0))
wall = Entity(model='cube', color=color.gray, collider='box', position=(6, 0, 0))

collected = False
score = 0
score_text = Text(text='Score: 0', position=(-0.85, 0.45))

def update():
    global score, collected

    player.x += time.dt

    # 코인 먹기
    if not collected and player.intersects(coin).hit:
        destroy(coin)
        collected = True
        score += 1
        score_text.text = f'Score: {score}'

    # 벽에 닿으면 멈추기
    if player.intersects(wall).hit:
        player.x -= time.dt

app.run()</code></pre>

<script>

  const tocLinks = document.querySelectorAll('nav.toc a');
  tocLinks.forEach(link => {

      const target = document.getElementById(this.getAttribute('href').slice(1));
      if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  });
  const sections = document.querySelectorAll('section.card');
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        tocLinks.forEach(l => l.classList.remove('active'));
        const match = document.querySelector(`nav.toc a[href=&quot;#${entry.target.id}&quot;]`);
        if (match) match.classList.add('active');
      }
    });
  }, { rootMargin: '-30% 0px -60% 0px' });
  sections.forEach(s => observer.observe(s));

  function toggleAnswer(btn){
    const ans = btn.nextElementSibling;
    ans.classList.toggle('show');
    btn.textContent = ans.classList.contains('show') ? '정답 숨기기' : '정답 보기';
  }

  // collision demo: cube1 moves toward cube2, turns yellow on overlap, resets
  (function(){
    const track = document.querySelector('.demo-track');
    const c1 = document.getElementById('cube1');
    const c2 = document.getElementById('cube2');
    const hitVal = document.getElementById('hitVal');

    let x1 = 0, speed = 60, paused = false, last = performance.now();

    function frame(now){
      const dt = Math.min((now - last) / 1000, 0.05);
      last = now;

      if(!paused){
        x1 += speed * dt;
        c1.style.transform = `translateX(${x1}px)`;

        const r1 = c1.getBoundingClientRect();
        const r2 = c2.getBoundingClientRect();
        const overlap = !(r1.right < r2.left || r1.left > r2.right);

        hitVal.textContent = overlap ? 'True' : 'False';
        hitVal.style.color = overlap ? '#FFD166' : 'var(--coral)';

        if(overlap){
          c1.style.background = '#E8C547';
          paused = true;
          setTimeout(() => {
            x1 = 0;
            c1.style.transform = 'translateX(0px)';
            c1.style.background = '#E2562B';
            paused = false;
          }, 850);
        }
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  })();

<ul><li><span class=&quot;mono-inline&quot;>collider=&amp;#39;box&amp;#39;</span> 로 충돌체 추가</li><li><span class=&quot;mono-inline&quot;>a.intersects(b).hit</span> 으로 충돌 여부 확인</li><li><span class=&quot;mono-inline&quot;>destroy()</span> 로 오브젝트 제거 + 점수 시스템</li></ul>
    </section>
    <section class=&quot;card&quot; id=&quot;sec2&quot;>
      <div class=&quot;section-kicker&quot;>02 / GOALS</div>
      <h2>학습 목표</h2>
<ul><li>held_keys로 키를 누르고 있는 동안 오브젝트를 계속 움직이기</li><li>input(key) 함수로 키를 한 번 눌렀을 때의 이벤트 처리하기</li><li>update()와 input()의 역할 차이를 이해하고 상황에 맞게 골라 쓰기</li></ul>
    </section>
    <section class=&quot;card&quot; id=&quot;sec3&quot;>
      <div class=&quot;section-kicker&quot;>03 / CONCEPTS</div>
      <h2>핵심 개념 정리</h2>
<h3>3-1. held_keys — 키를 누르고 있는 동안</h3>
<p><span class=&quot;mono-inline&quot;>held_keys[&amp;#39;키&amp;#39;]</span> 는 해당 키가 눌려 있으면 1, 아니면 0을 돌려줍니다. 매 프레임 실행되는 <span class=&quot;mono-inline&quot;>update()</span> 안에서 읽으면 &quot;누르고 있는 동안 계속&quot; 반응하게 만들 수 있습니다.</p>
<div class=&quot;code-wrap&quot;>
<div class=&quot;code-top&quot;><span class=&quot;dot red&quot;></span><span class=&quot;dot white&quot;></span><span class=&quot;fname&quot;>held_keys.py</span></div>
<pre><code class=&quot;language-python&quot;>def update():
    # d키가 눌려 있는 동안 1 * time.dt * 5 만큼 매 프레임 오른쪽으로 이동
    cube.x += held_keys[&amp;#x27;d&amp;#x27;] * time.dt * 5</code></pre>
</div>
<blockquote>💡 곱셈 트릭: 키가 안 눌리면 0이 곱해져 이동량이 0이 됩니다. if문 없이 한 줄로 끝!</blockquote>
<h3>3-2. if문과 함께 쓰기</h3>
<p>0/1 값이므로 if문 조건으로도 자연스럽게 쓸 수 있습니다. 여러 동작을 묶을 때 편리합니다.</p>
<div class=&quot;code-wrap&quot;>
<div class=&quot;code-top&quot;><span class=&quot;dot red&quot;></span><span class=&quot;dot white&quot;></span><span class=&quot;fname&quot;>held_if.py</span></div>
<pre><code class=&quot;language-python&quot;>def update():
    if held_keys[&amp;#x27;w&amp;#x27;]:
        cube.y += 4 * time.dt   # 위로</code></pre>
</div>
<blockquote>💡 4방향(WASD) 이동은 이 패턴을 반복하면 됩니다. 나머지 세 방향은 실습 문제에서 직접!</blockquote>
<h3>3-3. input(key) — 키를 '한 번' 눌렀을 때</h3>
<p>이름을 정확히 <span class=&quot;mono-inline&quot;>input</span> 으로 지은 함수를 만들면, 키가 눌리는 '순간'마다 Ursina가 자동으로 호출해 줍니다. 꾹 눌러도 한 번만 실행됩니다.</p>
<div class=&quot;code-wrap&quot;>
<div class=&quot;code-top&quot;><span class=&quot;dot red&quot;></span><span class=&quot;dot white&quot;></span><span class=&quot;fname&quot;>input_key.py</span></div>
<pre><code class=&quot;language-python&quot;>def input(key):
    if key == &amp;#x27;space&amp;#x27;:
        cube.color = color.random_color()  # 스페이스를 누른 순간 색 변경</code></pre>
</div>
<blockquote>💡 키 이름은 'a', 'space', 'left mouse down' 처럼 문자열로 들어옵니다. print(key)로 직접 확인해 보세요.</blockquote>
<h3>3-4. update vs input — 언제 무엇을 쓸까?</h3>
<p>둘 다 Ursina가 자동으로 호출하지만 성격이 다릅니다.</p>
<table>
<tr><th></th><th>update()</th><th>input(key)</th></tr>
<tr><td>호출 시점</td><td>매 프레임 (초당 수십 번)</td><td>키/마우스 이벤트가 발생한 순간</td></tr>
<tr><td>어울리는 일</td><td>이동, 회전 등 연속 동작</td><td>점프, 색 변경, 발사 등 단발 동작</td></tr>
<tr><td>짝꿍 도구</td><td>held_keys, time.dt</td><td>key 매개변수 비교</td></tr>
</table>
    </section>
    <section class=&quot;card&quot; id=&quot;sec4&quot;>
      <div class=&quot;section-kicker&quot;>04 / SUMMARY</div>
      <h2>핵심 정리</h2>
<ul><li><span class=&quot;mono-inline&quot;>held_keys[&amp;#39;키&amp;#39;]</span> → 누르는 동안 1, 아니면 0 (update와 함께)</li><li><span class=&quot;mono-inline&quot;>이동량 * time.dt</span> 를 곱해 프레임 속도와 무관하게 일정한 속도 유지</li><li><span class=&quot;mono-inline&quot;>def input(key):</span> → 키가 눌린 '순간' 한 번 호출</li><li>연속 동작은 update + held_keys, 단발 동작은 input(key)</li></ul>
    </section>
    <section class=&quot;card&quot; id=&quot;sec5&quot;>
      <div class=&quot;section-kicker&quot;>05 / PRACTICE — BASIC</div>
      <h2>실습 문제 · 기본</h2>
<ol><li>a / d 키로 큐브를 좌우로 움직이도록 구현하세요. (held_keys 사용)</li><li>w / s 키로 위아래 이동도 추가해 4방향(WASD) 이동을 완성하세요.</li></ol>
    </section>
    <section class=&quot;card&quot; id=&quot;sec6&quot;>
      <div class=&quot;section-kicker&quot;>06 / PRACTICE — ADVANCED</div>
      <h2>실습 문제 · 심화 (힌트 포함)</h2>
<h3>문제 3. 스페이스바로 색 바꾸기</h3><p>input(key)를 사용해 스페이스바를 누를 때마다 큐브 색이 무작위로 바뀌게 만드세요.</p>
<blockquote>힌트: key == 'space' 를 비교하고 color.random_color()를 사용합니다.</blockquote>
<h3>문제 4. r키로 45도씩 회전</h3><p>r키를 한 번 누를 때마다 큐브가 y축으로 정확히 45도씩 회전하게 만드세요. held_keys로 만들면 어떻게 달라지는지도 비교해 보세요.</p>
<blockquote>힌트: '한 번에 45도'는 input(key)가 적합합니다. cube.rotation_y += 45</blockquote>
<h3>문제 5. Shift 대시(빠르게 이동)</h3><p>left shift 키를 누르고 있는 동안에는 이동 속도가 두 배가 되도록 만드세요.</p>
<blockquote>힌트: speed = 5 를 기본으로 두고, held_keys['left shift'] 가 1이면 speed를 10으로 바꿔 계산하세요.</blockquote>

      <h2>종합 예제 코드 — WASD 이동 + 단발 이벤트</h2>
<p class=&quot;fullcode-notice&quot;>✍️ 먼저 위 핵심 개념과 실습 문제를 참고해 스스로 코드를 작성해 보세요. 다 작성했거나 막히는 부분을 비교하고 싶을 때 아래를 눌러 전체 코드를 확인합니다.</p>
<details class=&quot;fullcode&quot;><summary><span class=&quot;lock&quot;>🔒</span><span>전체 코드 확인하기</span><span class=&quot;hint&quot;>SPOILER · CLICK</span></summary>
<div class=&quot;fullcode-body&quot;>
<p>held_keys로 4방향 이동을, input(key)로 색 변경과 회전을 처리한 예시입니다.</p>
<div class=&quot;code-wrap&quot;>
<div class=&quot;code-top&quot;><span class=&quot;dot red&quot;></span><span class=&quot;dot white&quot;></span><span class=&quot;fname&quot;>main.py</span></div>
<pre><code class=&quot;language-python&quot;>from ursina import *

app = Ursina()

cube = Entity(model=&amp;#x27;cube&amp;#x27;, color=color.orange, texture=&amp;#x27;white_cube&amp;#x27;)
guide = Text(text=&amp;#x27;WASD: move | SPACE: color | R: rotate&amp;#x27;, position=(-0.6, 0.45))

speed = 5

def update():
    cube.x += held_keys[&amp;#x27;d&amp;#x27;] * time.dt * speed
    cube.x -= held_keys[&amp;#x27;a&amp;#x27;] * time.dt * speed
    cube.y += held_keys[&amp;#x27;w&amp;#x27;] * time.dt * speed
    cube.y -= held_keys[&amp;#x27;s&amp;#x27;] * time.dt * speed

def input(key):
    if key == &amp;#x27;space&amp;#x27;:
        cube.color = color.random_color()
    if key == &amp;#x27;r&amp;#x27;:
        cube.rotation_y += 45

app.run()</code></pre>

      <h2>학습 목표</h2>
<ul><li>키보드로 조작하는 플레이어와 장애물에 collider 붙이기</li><li>이동과 충돌 검사를 update() 안에서 함께 처리하기</li><li>충돌 시 색상 변경, 그리고 벽을 통과하지 못하게 막는 로직 구현하기</li></ul>

    <section class=&quot;card&quot; id=&quot;sec3&quot;>
      <div class=&quot;section-kicker&quot;>03 / CONCEPTS</div>
      <h2>핵심 개념 정리</h2>
<h3>3-1. 플레이어와 벽 준비 — 둘 다 collider 필수</h3>
<p>충돌을 검사할 두 엔티티 모두에 <span class=&quot;mono-inline&quot;>collider</span> 가 있어야 합니다. 하나라도 없으면 <span class=&quot;mono-inline&quot;>.hit</span> 은 항상 False입니다.</p>
<div class=&quot;code-wrap&quot;>
<div class=&quot;code-top&quot;><span class=&quot;dot red&quot;></span><span class=&quot;dot white&quot;></span><span class=&quot;fname&quot;>setup.py</span></div>
<pre><code class=&quot;language-python&quot;>player = Entity(model=&amp;#x27;cube&amp;#x27;, color=color.azure, collider=&amp;#x27;box&amp;#x27;)
wall   = Entity(model=&amp;#x27;cube&amp;#x27;, color=color.gray, collider=&amp;#x27;box&amp;#x27;,
                position=(3, 0, 0), scale_y=2)</code></pre>
</div>
<h3>3-2. 이동과 충돌 검사를 한 update 안에서</h3>
<p>이번 차시의 핵심 구조입니다. ① 키 입력으로 먼저 움직이고 → ② 곧바로 충돌을 검사합니다.</p>
<div class=&quot;code-wrap&quot;>
<div class=&quot;code-top&quot;><span class=&quot;dot red&quot;></span><span class=&quot;dot white&quot;></span><span class=&quot;fname&quot;>move_check.py</span></div>
<pre><code class=&quot;language-python&quot;>def update():
    player.x += held_keys[&amp;#x27;d&amp;#x27;] * time.dt * 4   # ① 이동
    player.x -= held_keys[&amp;#x27;a&amp;#x27;] * time.dt * 4

    if player.intersects(wall).hit:            # ② 충돌 검사
        ...  # 여기서 반응을 구현</code></pre>
</div>
<blockquote>💡 이동 → 검사 순서가 중요합니다. 움직인 '다음' 겹쳤는지 확인해야 하니까요.</blockquote>
<h3>3-3. 반응 1 — 충돌하면 색 바꾸기</h3>
<p>가장 눈에 잘 보이는 반응입니다. 충돌 중일 때와 아닐 때의 색을 나눠 주면 상태를 즉시 확인할 수 있습니다.</p>
<div class=&quot;code-wrap&quot;>
<div class=&quot;code-top&quot;><span class=&quot;dot red&quot;></span><span class=&quot;dot white&quot;></span><span class=&quot;fname&quot;>color_react.py</span></div>
<pre><code class=&quot;language-python&quot;>if player.intersects(wall).hit:
    player.color = color.red
else:
    player.color = color.azure</code></pre>
</div>
<h3>3-4. 반응 2 — 벽 통과 막기 (이동 취소 패턴)</h3>
<p>벽에 겹쳤다면, 방금 한 이동을 그대로 되돌리면(빼면) 됩니다. 밀고 들어가려 해도 제자리에 머무는 효과가 납니다.</p>
<div class=&quot;code-wrap&quot;>
<div class=&quot;code-top&quot;><span class=&quot;dot red&quot;></span><span class=&quot;dot white&quot;></span><span class=&quot;fname&quot;>block.py</span></div>
<pre><code class=&quot;language-python&quot;>if player.intersects(wall).hit:
    player.x -= held_keys[&amp;#x27;d&amp;#x27;] * time.dt * 4   # 방금 이동을 취소
    player.x += held_keys[&amp;#x27;a&amp;#x27;] * time.dt * 4</code></pre>
</div>
<blockquote>💡 &quot;이동량을 그대로 반대로&quot; — 어느 방향으로 얼마나 움직였는지와 똑같은 양을 되돌리는 것이 포인트입니다.</blockquote>
    </section>

<ul><li>충돌을 검사할 두 엔티티 모두에 collider가 있어야 함</li><li>update 안에서 ① 이동 → ② intersects().hit 검사 순서로 처리</li><li>충돌 중 여부에 따라 색을 바꾸면 상태를 시각적으로 확인 가능</li><li>벽 막기 = 방금 한 이동을 그대로 되돌리는(취소하는) 패턴</li></ul>
    </section>

      <h2>실습 문제 · 심화 (힌트 포함)</h2>
<h3>문제 3. 벽 통과 막기</h3><p>색 변경 대신, 플레이어가 벽을 밀고 지나갈 수 없도록 이동 취소 패턴을 구현하세요.</p>
<blockquote>힌트: 충돌했을 때 방금 더한 이동량과 똑같은 값을 다시 빼 주면 됩니다.</blockquote>
<h3>문제 4. 4방향 이동 + 사방의 벽</h3><p>WASD 4방향 이동으로 확장하고, 상하좌우 네 개의 벽으로 둘러싸인 '방'을 만들어 어느 방향으로도 빠져나갈 수 없게 하세요.</p>
<blockquote>힌트: 벽 4개를 리스트에 담고 for문으로 각각 intersects()를 검사하면 코드가 짧아집니다.</blockquote>
<h3>문제 5. 충돌 횟수 세기</h3><p>벽에 '새로 닿을 때마다' 1씩 올라가는 카운터를 Text로 표시하세요. 계속 붙어 있는 동안 숫자가 마구 올라가면 안 됩니다.</p>
<blockquote>힌트: 지난 차시(#06)의 플래그 변수 패턴을 떠올리세요 — 떨어졌다가 다시 닿을 때만 증가.</blockquote>
<h3>문제 6. (종합) 미로 통로 만들기</h3><p>벽 여러 개로 좁은 통로를 만들고, 플레이어가 통로를 따라 움직여 반대편 골인 지점(초록 큐브)에 닿으면 'Goal!' 텍스트가 나타나는 미니게임을 만드세요.</p>

    <section class=&quot;card&quot; id=&quot;sec7&quot;>
      <div class=&quot;section-kicker&quot;>07 / FULL CODE · 정답 확인</div>
      <h2>종합 예제 코드 — 벽에 막히는 플레이어</h2>
<p class=&quot;fullcode-notice&quot;>✍️ 먼저 위 핵심 개념과 실습 문제를 참고해 스스로 코드를 작성해 보세요. 다 작성했거나 막히는 부분을 비교하고 싶을 때 아래를 눌러 전체 코드를 확인합니다.</p>
<details class=&quot;fullcode&quot;><summary><span class=&quot;lock&quot;>🔒</span><span>전체 코드 확인하기</span><span class=&quot;hint&quot;>SPOILER · CLICK</span></summary>
<div class=&quot;fullcode-body&quot;>
<p>좌우 이동 + 충돌 시 색 변경 + 벽 통과 막기를 모두 합친 예시입니다.</p>
<div class=&quot;code-wrap&quot;>
<div class=&quot;code-top&quot;><span class=&quot;dot red&quot;></span><span class=&quot;dot white&quot;></span><span class=&quot;fname&quot;>main.py</span></div>
<pre><code class=&quot;language-python&quot;>from ursina import *

app = Ursina()

player = Entity(model=&amp;#x27;cube&amp;#x27;, color=color.azure, collider=&amp;#x27;box&amp;#x27;)
wall   = Entity(model=&amp;#x27;cube&amp;#x27;, color=color.gray, collider=&amp;#x27;box&amp;#x27;,
                position=(3, 0, 0), scale_y=2)

speed = 4

def update():
    # ① 이동
    move = (held_keys[&amp;#x27;d&amp;#x27;] - held_keys[&amp;#x27;a&amp;#x27;]) * time.dt * speed
    player.x += move

    # ② 충돌 검사와 반응
    if player.intersects(wall).hit:
        player.color = color.red
        player.x -= move          # 방금 이동 취소 → 벽 통과 불가
    else:
        player.color = color.azure

app.run()</code></pre>
</div>
</div></details>

<h3>3-1. 왜 클래스가 필요할까?</h3>
<p>지금까지는 엔티티를 만들 때마다 모델, 색, collider를 일일이 적고, 이동 코드도 전역 update에 몰아넣었습니다. 오브젝트가 늘어나면 코드가 뒤엉키죠. 클래스는 &quot;이 오브젝트의 설정과 행동&quot;을 하나의 설계도로 묶어 줍니다.</p>
<h3>3-2. Entity 상속 — 클래스 뼈대</h3>
<p><span class=&quot;mono-inline&quot;>class Player(Entity):</span> 처럼 Entity를 괄호 안에 넣으면 Entity의 모든 능력(model, color, position…)을 물려받습니다. <span class=&quot;mono-inline&quot;>super().__init__()</span> 안에 기존에 Entity()에 넘기던 인자를 그대로 적습니다.</p>

<pre><code class=&quot;language-python&quot;>class Player(Entity):
    def __init__(self):
        super().__init__(
            model=&amp;#x27;cube&amp;#x27;,
            color=color.orange,

        )</code></pre>
</div>
<blockquote>💡 super()는 부모(Entity)를 뜻합니다. &quot;부모의 초기 설정을 먼저 실행해 줘&quot;라는 의미입니다.</blockquote>
<h3>3-3. 클래스 안의 update(self) — 자동으로 호출된다</h3>
<p>클래스 안에 update 메서드를 정의하면, 그 클래스로 만든 모든 객체에서 매 프레임 자동 실행됩니다. 전역 update 함수가 필요 없어집니다.</p>
<div class=&quot;code-wrap&quot;>
<div class=&quot;code-top&quot;><span class=&quot;dot red&quot;></span><span class=&quot;dot white&quot;></span><span class=&quot;fname&quot;>class_update.py</span></div>
<pre><code class=&quot;language-python&quot;>class Player(Entity):
    ...
    def update(self):
        self.x += held_keys[&amp;#x27;d&amp;#x27;] * time.dt * 4
        self.x -= held_keys[&amp;#x27;a&amp;#x27;] * time.dt * 4</code></pre>
</div>
<blockquote>💡 클래스 안에서는 cube.x 대신 self.x — '나 자신'의 속성을 다룹니다.</blockquote>
<h3>3-4. 클래스 안의 input(self, key)</h3>
<p>입력 이벤트도 클래스 안으로 옮길 수 있습니다. 매개변수에 self가 하나 더 붙는 것만 다릅니다.</p>
<div class=&quot;code-wrap&quot;>
<div class=&quot;code-top&quot;><span class=&quot;dot red&quot;></span><span class=&quot;dot white&quot;></span><span class=&quot;fname&quot;>class_input.py</span></div>
<pre><code class=&quot;language-python&quot;>class Player(Entity):
    ...
    def input(self, key):
        if key == &amp;#x27;space&amp;#x27;:
            self.color = color.random_color()</code></pre>
</div>
<h3>3-5. 객체 만들기 — 설계도에서 인스턴스로</h3>
<p>클래스를 다 만들었다면 함수 부르듯 호출해서 객체(인스턴스)를 만듭니다. 여러 개를 만들면 각자 독립적으로 움직입니다.</p>
<div class=&quot;code-wrap&quot;>
<div class=&quot;code-top&quot;><span class=&quot;dot red&quot;></span><span class=&quot;dot white&quot;></span><span class=&quot;fname&quot;>instances.py</span></div>
<pre><code class=&quot;language-python&quot;>player = Player()               # 객체 1개 생성
# p2 = Player(); p2.x = 2      # 위치만 다른 두 번째 객체</code></pre>
</div>
<blockquote>💡 같은 클래스로 만든 객체들은 능력은 같지만 서로 다른 존재입니다. 한 객체의 색을 바꿔도 다른 객체는 그대로!</blockquote>
    </section>
    <section class=&quot;card&quot; id=&quot;sec4&quot;>
      <div class=&quot;section-kicker&quot;>04 / SUMMARY</div>
      <h2>핵심 정리</h2>
<ul><li><span class=&quot;mono-inline&quot;>class 이름(Entity):</span> 으로 Entity를 상속한 클래스 정의</li><li><span class=&quot;mono-inline&quot;>super().__init__(model=..., color=...)</span> 에 기본 설정을 모아두기</li><li>클래스 안의 update(self) / input(self, key) 는 Ursina가 자동 호출</li><li>클래스 안에서는 self.x, self.color 처럼 self로 자신을 가리킴</li><li>클래스 하나로 독립적인 객체를 여러 개 만들 수 있음</li></ul>
    </section>
    <section class=&quot;card&quot; id=&quot;sec5&quot;>
      <div class=&quot;section-kicker&quot;>05 / PRACTICE — BASIC</div>
      <h2>실습 문제 · 기본</h2>
<ol><li>Entity를 상속한 Player 클래스를 만들고, __init__에서 큐브 모델과 주황색을 설정한 뒤 객체 하나를 화면에 띄우세요.</li><li>Player 클래스 안에 update(self)를 추가해 a / d 키로 좌우 이동하게 만드세요.</li></ol>
    </section>
    <section class=&quot;card&quot; id=&quot;sec6&quot;>
      <div class=&quot;section-kicker&quot;>06 / PRACTICE — ADVANCED</div>
      <h2>실습 문제 · 심화 (힌트 포함)</h2>
<h3>문제 3. 클래스 안으로 input 옮기기</h3><p>스페이스바를 누르면 색이 무작위로 바뀌는 기능을 input(self, key) 메서드로 구현하세요.</p>
<blockquote>힌트: 전역 input과 거의 같지만 def input(self, key): 로 self가 추가되고, cube 대신 self를 씁니다.</blockquote>
<h3>문제 4. 생성 위치를 받는 클래스</h3><p>Player(x=2) 처럼 만들 때 위치를 정할 수 있도록 __init__을 고쳐 보세요.</p>
<blockquote>힌트: def __init__(self, x=0): 으로 받고 super().__init__(..., x=x) 로 전달합니다.</blockquote>
<h3>문제 5. 객체 두 개, 서로 다른 조작키</h3><p>같은 클래스로 객체 두 개를 만들되, 하나는 a/d로, 다른 하나는 j/l로 움직이게 하세요.</p>
<blockquote>힌트: __init__에서 keys=('a','d') 처럼 키 쌍을 받아 self.keys에 저장하고 update에서 사용하세요.</blockquote>
<h3>문제 6. (종합) Enemy 클래스 추가</h3><p>스스로 좌우로 왕복하는 Enemy 클래스를 새로 만들고, Player가 Enemy와 충돌하면 Player가 빨간색이 되는 프로그램을 완성하세요.</p>
<blockquote>힌트: Enemy의 update(self)에 #04에서 배운 반사(방향 뒤집기) 패턴을 넣으면 됩니다.</blockquote>
    </section>
    <section class=&quot;card&quot; id=&quot;sec7&quot;>
      <div class=&quot;section-kicker&quot;>07 / FULL CODE · 정답 확인</div>
      <h2>종합 예제 코드 — Player 클래스로 캡슐화</h2>
<p class=&quot;fullcode-notice&quot;>✍️ 먼저 위 핵심 개념과 실습 문제를 참고해 스스로 코드를 작성해 보세요. 다 작성했거나 막히는 부분을 비교하고 싶을 때 아래를 눌러 전체 코드를 확인합니다.</p>
<details class=&quot;fullcode&quot;><summary><span class=&quot;lock&quot;>🔒</span><span>전체 코드 확인하기</span><span class=&quot;hint&quot;>SPOILER · CLICK</span></summary>
<div class=&quot;fullcode-body&quot;>
<p>설정 + 이동 + 입력을 모두 클래스 안에 담고, 객체를 만들어 실행하는 예시입니다.</p>
<div class=&quot;code-wrap&quot;>
<div class=&quot;code-top&quot;><span class=&quot;dot red&quot;></span><span class=&quot;dot white&quot;></span><span class=&quot;fname&quot;>main.py</span></div>
<pre><code class=&quot;language-python&quot;>from ursina import *

app = Ursina()

class Player(Entity):
    def __init__(self, x=0):
        super().__init__(
            model=&amp;#x27;cube&amp;#x27;,
            color=color.orange,
            collider=&amp;#x27;box&amp;#x27;,
            x=x
        )
        self.speed = 4

    def update(self):
        self.x += held_keys[&amp;#x27;d&amp;#x27;] * time.dt * self.speed
        self.x -= held_keys[&amp;#x27;a&amp;#x27;] * time.dt * self.speed

    def input(self, key):
        if key == &amp;#x27;space&amp;#x27;:
            self.color = color.random_color()

player = Player()

app.run()</code></pre>
</div>
</div></details>
    </section>
    <section class=&quot;card&quot; id=&quot;sec8&quot;>
      <div class=&quot;section-kicker&quot;>08 / SELF-CHECK QUIZ</div>
      <h2>자가 점검 퀴즈</h2>
<div class=&quot;quiz-item&quot;>
<p class=&quot;quiz-q&quot;>1. Entity의 능력을 물려받는 클래스를 만들 때 클래스 선언은 어떻게 쓰나요?</p>
<button class=&quot;quiz-toggle&quot; onclick=&quot;toggleAnswer(this)&quot;>정답 보기</button>
<div class=&quot;quiz-answer&quot;>class Player(Entity): — 괄호 안에 부모 클래스인 Entity를 적습니다.</div>
</div>
<div class=&quot;quiz-item&quot;>
<p class=&quot;quiz-q&quot;>2. __init__ 안에서 super().__init__()은 어떤 역할을 하나요?</p>
<button class=&quot;quiz-toggle&quot; onclick=&quot;toggleAnswer(this)&quot;>정답 보기</button>
<div class=&quot;quiz-answer&quot;>부모(Entity)의 초기 설정을 실행합니다. model, color 등 기존 Entity() 인자를 이곳에 넘깁니다.</div>
</div>
<div class=&quot;quiz-item&quot;>
<p class=&quot;quiz-q&quot;>3. 클래스 안의 update 메서드는 언제 실행되나요?</p>
<button class=&quot;quiz-toggle&quot; onclick=&quot;toggleAnswer(this)&quot;>정답 보기</button>
<div class=&quot;quiz-answer&quot;>그 클래스로 만든 객체가 존재하는 동안 매 프레임 자동으로 호출됩니다.</div>
</div>
<div class=&quot;quiz-item&quot;>
<p class=&quot;quiz-q&quot;>4. 클래스 안에서 자신의 x좌표를 바꾸려면 어떻게 쓰나요?</p>
<button class=&quot;quiz-toggle&quot; onclick=&quot;toggleAnswer(this)&quot;>정답 보기</button>
<div class=&quot;quiz-answer&quot;>self.x += ... — self가 객체 자신을 가리킵니다.</div>
</div>
<div class=&quot;quiz-item&quot;>
<p class=&quot;quiz-q&quot;>5. 클래스와 객체의 관계를 한 문장으로 설명하면?</p>
<button class=&quot;quiz-toggle&quot; onclick=&quot;toggleAnswer(this)&quot;>정답 보기</button>
<div class=&quot;quiz-answer&quot;>클래스는 설계도, 객체(인스턴스)는 그 설계도로 찍어낸 실제 존재입니다. 하나의 클래스로 여러 객체를 만들 수 있습니다.</div>
</div>

    <section class=&quot;card&quot; id=&quot;sec3&quot;>
      <div class=&quot;section-kicker&quot;>03 / CONCEPTS</div>
      <h2>핵심 개념 정리</h2>
<h3>3-1. Button 만들기 — UI 좌표계</h3>
<p><span class=&quot;mono-inline&quot;>Button</span> 은 화면에 고정되는 UI 요소입니다. Text처럼 화면 좌표(가로 -0.5 ~ 0.5)를 쓰고, <span class=&quot;mono-inline&quot;>scale</span> 로 크기를 정합니다.</p>
<div class=&quot;code-wrap&quot;>
<div class=&quot;code-top&quot;><span class=&quot;dot red&quot;></span><span class=&quot;dot white&quot;></span><span class=&quot;fname&quot;>button.py</span></div>
<pre><code class=&quot;language-python&quot;>b = Button(
    text=&amp;#x27;Click me&amp;#x27;,
    color=color.azure,
    scale=(0.25, 0.1),   # 가로, 세로 (화면 비율)
    position=(0, 0)      # 화면 중앙
)</code></pre>
</div>
<blockquote>💡 scale을 지정하지 않으면 버튼이 화면을 가득 채울 만큼 커질 수 있어요. 꼭 지정!</blockquote>
<h3>3-2. on_click — 클릭하면 함수 실행</h3>
<p>버튼의 <span class=&quot;mono-inline&quot;>on_click</span> 속성에 함수 이름을 연결하면(괄호 없이!) 클릭 순간 그 함수가 실행됩니다.</p>
<div class=&quot;code-wrap&quot;>
<div class=&quot;code-top&quot;><span class=&quot;dot red&quot;></span><span class=&quot;dot white&quot;></span><span class=&quot;fname&quot;>on_click.py</span></div>
<pre><code class=&quot;language-python&quot;>def change_color():
    cube.color = color.random_color()

b.on_click = change_color   # 괄호 없이 이름만 연결</code></pre>
</div>
<blockquote>💡 b.on_click = change_color() 처럼 괄호를 붙이면 '지금 즉시' 실행되어 버립니다. 이름만 넘기세요.</blockquote>
<h3>3-3. Tooltip — 마우스를 올리면 설명 표시</h3>
<p>버튼에 마우스를 올렸을 때 나타나는 말풍선입니다.</p>
<div class=&quot;code-wrap&quot;>
<div class=&quot;code-top&quot;><span class=&quot;dot red&quot;></span><span class=&quot;dot white&quot;></span><span class=&quot;fname&quot;>tooltip.py</span></div>
<pre><code class=&quot;language-python&quot;>b.tooltip = Tooltip(&amp;#x27;누르면 큐브 색이 바뀝니다&amp;#x27;)</code></pre>
</div>
<h3>3-4. 3D 오브젝트 클릭 — mouse.hovered_entity</h3>
<p>버튼이 아닌 3D 오브젝트도 클릭할 수 있습니다. 조건은 두 가지: ① 오브젝트에 <span class=&quot;mono-inline&quot;>collider</span> 가 있을 것, ② <span class=&quot;mono-inline&quot;>input</span> 에서 마우스 클릭과 <span class=&quot;mono-inline&quot;>mouse.hovered_entity</span> (지금 마우스가 가리키는 엔티티)를 확인할 것.</p>
<div class=&quot;code-wrap&quot;>
<div class=&quot;code-top&quot;><span class=&quot;dot red&quot;></span><span class=&quot;dot white&quot;></span><span class=&quot;fname&quot;>click_entity.py</span></div>
<pre><code class=&quot;language-python&quot;>def input(key):
    if key == &amp;#x27;left mouse down&amp;#x27; and mouse.hovered_entity == cube:
        cube.color = color.random_color()</code></pre>
</div>
<blockquote>💡 collider가 없는 엔티티는 마우스가 '가리킬' 수 없습니다 — hovered_entity에 잡히지 않아요.</blockquote>
<h3>3-5. 엔티티 자체의 on_click</h3>
<p>collider가 있는 엔티티라면 버튼처럼 on_click을 바로 연결할 수도 있습니다. 취향에 맞는 방식을 골라 쓰세요.</p>
<div class=&quot;code-wrap&quot;>
<div class=&quot;code-top&quot;><span class=&quot;dot red&quot;></span><span class=&quot;dot white&quot;></span><span class=&quot;fname&quot;>entity_onclick.py</span></div>
<pre><code class=&quot;language-python&quot;>cube.on_click = change_color</code></pre>
</div>
    </section>

      <h2>핵심 정리</h2>
<ul><li><span class=&quot;mono-inline&quot;>Button(text=..., scale=..., position=...)</span> — 화면 좌표계 UI 버튼</li><li><span class=&quot;mono-inline&quot;>b.on_click = 함수이름</span> — 괄호 없이 연결, 클릭 순간 실행</li><li><span class=&quot;mono-inline&quot;>b.tooltip = Tooltip(&amp;#39;...&amp;#39;)</span> — 호버 설명</li><li>3D 오브젝트 클릭 = collider + <span class=&quot;mono-inline&quot;>mouse.hovered_entity</span> 확인</li><li>collider 있는 엔티티는 entity.on_click도 사용 가능</li></ul>

<ol><li>화면 중앙에 'Color!' 버튼을 만들고, 클릭하면 옆의 큐브 색이 무작위로 바뀌게 하세요.</li><li>그 버튼에 Tooltip을 달아 기능 설명이 뜨게 하세요.</li></ol>

      <div class=&quot;section-kicker&quot;>06 / PRACTICE — ADVANCED</div>
      <h2>실습 문제 · 심화 (힌트 포함)</h2>
<h3>문제 3. 카운터 버튼</h3><p>클릭할 때마다 숫자가 1씩 올라가는 버튼을 만드세요. 버튼의 text 자체가 숫자로 바뀌면 더 좋습니다.</p>
<blockquote>힌트: count 변수를 global로 선언하고, b.text = str(count) 로 갱신합니다.</blockquote>
<h3>문제 4. 큐브를 직접 클릭해서 없애기</h3><p>큐브 3개를 나란히 놓고, 마우스로 클릭한 큐브만 destroy()로 사라지게 하세요.</p>
<blockquote>힌트: 각 큐브에 collider를 주고, input에서 mouse.hovered_entity를 destroy()에 넘기면 됩니다.</blockquote>
<h3>문제 5. 색상 팔레트 버튼</h3><p>빨강·초록·파랑 버튼 3개를 아래쪽에 나란히 만들고, 누른 버튼의 색으로 큐브가 바뀌게 하세요.</p>
<blockquote>힌트: 함수 3개를 만들거나, lambda를 써서 b.on_click = lambda: setattr(cube, 'color', color.red) 처럼 연결할 수 있습니다.</blockquote>
<h3>문제 6. (종합) 두더지 잡기 미니게임</h3><p>무작위 위치에 나타나는 큐브를 클릭하면 사라지고 점수가 1 오르며, 곧바로 새 위치에 다시 나타나는 게임을 만드세요. 점수는 Text로 표시!</p>
<blockquote>힌트: 클릭 처리에서 destroy() 대신 cube.position = (random.uniform(-3,3), random.uniform(-2,2), 0) 로 위치만 옮기면 더 간단합니다.</blockquote>
    </section>
    <section class=&quot;card&quot; id=&quot;sec7&quot;>
      <div class=&quot;section-kicker&quot;>07 / FULL CODE · 정답 확인</div>
      <h2>종합 예제 코드 — 버튼 + 큐브 직접 클릭</h2>
<p class=&quot;fullcode-notice&quot;>✍️ 먼저 위 핵심 개념과 실습 문제를 참고해 스스로 코드를 작성해 보세요. 다 작성했거나 막히는 부분을 비교하고 싶을 때 아래를 눌러 전체 코드를 확인합니다.</p>
<details class=&quot;fullcode&quot;><summary><span class=&quot;lock&quot;>🔒</span><span>전체 코드 확인하기</span><span class=&quot;hint&quot;>SPOILER · CLICK</span></summary>
<div class=&quot;fullcode-body&quot;>

<script>
  if (window.hljs) { hljs.highlightAll(); }
  const bar = document.getElementById('progressBar');
  window.addEventListener('scroll', () => {
    const h = document.documentElement;
    bar.style.width = (h.scrollTop) / (h.scrollHeight - h.clientHeight) * 100 + '%';
  });
  const tocLinks = document.querySelectorAll('nav.toc a');
  tocLinks.forEach(link => {
    link.addEventListener('click', function(e){
      e.preventDefault();
      const target = document.getElementById(this.getAttribute('href').slice(1));
      if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  });
  const sections = document.querySelectorAll('section.card');
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        tocLinks.forEach(l => l.classList.remove('active'));
        const match = document.querySelector(`nav.toc a[href=&quot;#${entry.target.id}&quot;]`);
        if (match) match.classList.add('active');
      }
    });
  }, { rootMargin: '-30% 0px -60% 0px' });
  sections.forEach(s => observer.observe(s));
  function toggleAnswer(btn){
    const ans = btn.nextElementSibling;
    ans.classList.toggle('show');
    btn.textContent = ans.classList.contains('show') ? '정답 숨기기' : '정답 보기';
  }
</script>

    <section class=&quot;card&quot; id=&quot;sec3&quot;>
      <div class=&quot;section-kicker&quot;>03 / CONCEPTS</div>
      <h2>핵심 개념 정리</h2>
<h3>3-1. 이미지 시퀀스란?</h3>
<p><span class=&quot;mono-inline&quot;>run_1.png, run_2.png, run_3.png ...</span> 처럼 살짝씩 다른 그림을 연속 번호로 저장해 두고 빠르게 교체하면 움직이는 것처럼 보입니다. 영화·애니메이션과 같은 원리입니다. 이미지 파일들은 파이썬 파일과 같은 폴더(또는 하위 폴더)에 둡니다.</p>
<h3>3-2. Animation 클래스 — 한 줄로 애니메이션</h3>
<p>Ursina의 <span class=&quot;mono-inline&quot;>Animation</span> 은 이름이 같은 패턴의 이미지들을 자동으로 모두 찾아 순서대로 재생해 줍니다. Entity처럼 position, scale도 지정할 수 있습니다.</p>
<div class=&quot;code-wrap&quot;>
<div class=&quot;code-top&quot;><span class=&quot;dot red&quot;></span><span class=&quot;dot white&quot;></span><span class=&quot;fname&quot;>animation.py</span></div>
<pre><code class=&quot;language-python&quot;>anim = Animation(
    &amp;#x27;run&amp;#x27;,          # run_1.png, run_2.png ... 를 자동으로 로드
    fps=8,          # 초당 8프레임 재생
    loop=True       # 끝나면 처음부터 반복
)</code></pre>
</div>
<blockquote>💡 파일 이름의 공통 부분만 적으면 됩니다. 확장자와 번호는 Ursina가 알아서 찾아요.</blockquote>
<h3>3-3. 재생 제어 — fps와 loop</h3>
<p>fps 숫자를 키우면 빨라지고 줄이면 느려집니다. loop=False면 한 번만 재생하고 마지막 프레임에서 멈춥니다.</p>
<div class=&quot;code-wrap&quot;>
<div class=&quot;code-top&quot;><span class=&quot;dot red&quot;></span><span class=&quot;dot white&quot;></span><span class=&quot;fname&quot;>control.py</span></div>
<pre><code class=&quot;language-python&quot;>anim.fps = 16        # 두 배 빠르게
# anim.loop = False  # 반복 없이 1회만</code></pre>
</div>
<h3>3-4. 수동 방식 — update에서 texture 직접 바꾸기</h3>
<p>원리를 이해하기 위해 직접 만들어 볼 수도 있습니다. 프레임 목록을 두고, 일정 시간이 지날 때마다 다음 texture로 교체하는 타이머 패턴입니다.</p>
<div class=&quot;code-wrap&quot;>
<div class=&quot;code-top&quot;><span class=&quot;dot red&quot;></span><span class=&quot;dot white&quot;></span><span class=&quot;fname&quot;>manual.py</span></div>
<pre><code class=&quot;language-python&quot;>frames = [&amp;#x27;run_1&amp;#x27;, &amp;#x27;run_2&amp;#x27;, &amp;#x27;run_3&amp;#x27;]   # texture 이름 목록
i = 0
timer = 0

def update():
    global i, timer
    timer += time.dt
    if timer &amp;gt; 1/8:              # 1/8초마다 (= 8fps)
        timer = 0
        i = (i + 1) % len(frames)   # 0→1→2→0→... 순환
        sprite.texture = frames[i]</code></pre>
</div>
<blockquote>💡 % (나머지 연산)로 인덱스를 순환시키는 것이 핵심 패턴입니다. 마지막 다음은 다시 처음!</blockquote>
    </section>

      <h2>실습 문제 · 심화 (힌트 포함)</h2>
<h3>문제 3. 키보드로 재생 속도 조절</h3><p>위/아래 방향키를 누를 때마다 fps가 2씩 늘거나 줄어들게 만드세요. (최소 1 이상 유지)</p>
<blockquote>힌트: input(key)에서 key == 'up arrow' 를 확인하고 anim.fps += 2 를 실행합니다.</blockquote>
<h3>문제 4. 움직이면서 재생하기</h3><p>#07의 held_keys를 이용해, 애니메이션이 a/d 키로 좌우로 이동하게 하세요. 걷는 캐릭터처럼 보이나요?</p>
<blockquote>힌트: Animation도 Entity의 일종이라 anim.x += ... 가 그대로 통합니다.</blockquote>
<h3>문제 5. 수동 방식 직접 구현</h3><p>Animation 클래스를 쓰지 않고, update + 타이머 + texture 교체로 같은 애니메이션을 직접 만들어 보세요.</p>
<blockquote>힌트: 개념 3-4의 타이머 패턴을 그대로 따라가되, 프레임 이름 목록은 자신의 파일에 맞게 바꿉니다.</blockquote>
<h3>문제 6. (종합) 걷기/정지 상태 전환</h3><p>키를 누르는 동안에만 애니메이션이 재생되고(걷기), 키를 떼면 첫 프레임에서 멈추는(정지) 캐릭터를 만드세요.</p>
<blockquote>힌트: 수동 방식에서 held_keys['d'] 가 눌린 동안에만 타이머를 누적시키면 됩니다.</blockquote>
    </section>
    <section class=&quot;card&quot; id=&quot;sec7&quot;>
      <div class=&quot;section-kicker&quot;>07 / FULL CODE · 정답 확인</div>
      <h2>종합 예제 코드 — Animation 재생 + 속도 조절</h2>
<p class=&quot;fullcode-notice&quot;>✍️ 먼저 위 핵심 개념과 실습 문제를 참고해 스스로 코드를 작성해 보세요. 다 작성했거나 막히는 부분을 비교하고 싶을 때 아래를 눌러 전체 코드를 확인합니다.</p>
<details class=&quot;fullcode&quot;><summary><span class=&quot;lock&quot;>🔒</span><span>전체 코드 확인하기</span><span class=&quot;hint&quot;>SPOILER · CLICK</span></summary>
<div class=&quot;fullcode-body&quot;>
<p>Animation 클래스로 시퀀스를 재생하고, 방향키로 fps를 조절하는 예시입니다.</p>
<div class=&quot;code-wrap&quot;>
<div class=&quot;code-top&quot;><span class=&quot;dot red&quot;></span><span class=&quot;dot white&quot;></span><span class=&quot;fname&quot;>main.py</span></div>
<pre><code class=&quot;language-python&quot;>from ursina import *

app = Ursina()

# run_1.png, run_2.png ... 를 자동으로 불러와 재생
anim = Animation(&amp;#x27;run&amp;#x27;, fps=8, loop=True, scale=3)

info = Text(text=&amp;#x27;fps: 8  (up/down arrow)&amp;#x27;, position=(-0.6, 0.45))

def input(key):
    if key == &amp;#x27;up arrow&amp;#x27;:
        anim.fps += 2
    if key == &amp;#x27;down arrow&amp;#x27; and anim.fps &amp;gt; 2:
        anim.fps -= 2
    info.text = f&amp;#x27;fps: {anim.fps}  (up/down arrow)&amp;#x27;

def update():
    # 좌우 이동 — 걷는 것처럼!
    anim.x += (held_keys[&amp;#x27;d&amp;#x27;] - held_keys[&amp;#x27;a&amp;#x27;]) * time.dt * 3

app.run()</code></pre>
</div>
</div></details>
