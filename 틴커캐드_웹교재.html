<!DOCTYPE html>

<meta charset="UTF-8">

<style>
  :root{
    --primary:#ff7043;
    --primary-dark:#e8602e;
    --bg:#fff8f3;
    --card-bg:#ffffff;
    --text:#4a3b34;
    --muted:#9c8a82;
    --accent:#ffe4d1;
    --shadow:0 4px 16px rgba(120,70,40,0.10);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  ::-webkit-scrollbar{width:6px;height:6px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:transparent;}
  ::-webkit-scrollbar-thumb:hover{background:rgba(0,0,0,0.15);}
  *{scrollbar-width:none;}
  body{
    font-family:'Noto Sans KR',"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",sans-serif;
    background:var(--bg);
    color:var(--text);
  }

  #main{max-width:min(1200px, calc(100vw - 32px));margin:0 auto;padding:34px 24px 60px;}
  h2{color:var(--primary-dark);}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:22px;margin-top:18px;}
  .card{
    position:relative;
    background:var(--card-bg);border-radius:18px;box-shadow:var(--shadow);
    overflow:hidden;cursor:pointer;transition:transform .15s ease;
  }
  .card:hover{transform:translateY(-5px);}
  .card img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:#f3e3d8;filter:saturate(0.65) contrast(0.95);transition:filter .2s ease;}
  .card:hover img{filter:saturate(1) contrast(1);}
  .card .card-body{padding:13px 15px;}
  .card .card-title{font-weight:bold;font-size:15px;color:var(--text);}
  .card .card-sub{font-size:12px;color:var(--muted);margin-top:3px;}
  .card-complete-btn{
    position:absolute;top:8px;right:8px;z-index:5;
    width:32px;height:32px;border-radius:50%;
    background:rgba(255,255,255,0.92);border:2px solid var(--primary);
    display:flex;align-items:center;justify-content:center;
    font-size:16px;line-height:1;cursor:pointer;
    box-shadow:0 2px 6px rgba(120,70,40,0.25);
    transition:transform .15s ease,background .15s ease,border-color .15s ease;
  }
  .card-complete-btn:hover{transform:scale(1.18);}
  .card-complete-btn.done{
    background:var(--primary);border-color:var(--primary-dark);color:#fff;
  }

  /* 홈 탭 (커리큘럼 / 자료실) */
  .home-tabs{display:flex;gap:8px;margin:14px 0 22px;}
  .home-tab{
    background:#fff;color:var(--muted);padding:8px 16px;border-radius:20px;
    font-size:13.5px;font-weight:bold;border:1px solid var(--accent);cursor:pointer;
    transition:background .15s ease,color .15s ease;
  }
  .home-tab.active{background:var(--primary);color:#fff;border-color:var(--primary);}
  .home-tab:not(.active):hover{background:var(--accent);}

  /* 자료실 카드 (이미지 커버 대신 아이콘) */
  .card-icon{
    aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;
    font-size:44px;background:linear-gradient(135deg,var(--accent),#fff);
  }
  .card.card-game .card-sub{color:var(--primary-dark);}

  .intro-banner{font-size:14px;color:var(--muted);margin-bottom:6px;}

  @media (max-width:700px){
    #main{padding:20px;}
  }
</style>
</head>

// ── 미션 완료 표시 저장 (학생별 로컬 저장, study_home과 동일한 이름 규칙 공유)
function _tinkercadStudentName(){
  try { return sessionStorage.getItem('__currentStudent__') || ''; } catch(e){ return ''; }
}
function _tinkercadDoneKey(){
  var n = _tinkercadStudentName();
  return (n ? n + '::' : '') + 'tinkercad_missions_done';
}
function getTinkercadDone(){
  try { return JSON.parse(localStorage.getItem(_tinkercadDoneKey()) || '[]'); }
  catch(e){ return []; }
}
function setTinkercadDone(list){
  try { localStorage.setItem(_tinkercadDoneKey(), JSON.stringify(list)); }
  catch(e){}
}

let _homeTab = 'curriculum';

function switchHomeTab(tab){
  _homeTab = tab;
  showHome();
}

function showHome(){
  const doneList = getTinkercadDone();
  let html = '<h2 style="margin-top:0;">📚 오늘은 무엇을 만들어 볼까요?</h2>';
  html += '<div class="home-tabs">'
    + '<div class="home-tab' + (_homeTab === 'curriculum' ? ' active' : '') + '" onclick="switchHomeTab(\'curriculum\')">📖 커리큘럼</div>'
    + '<div class="home-tab' + (_homeTab === 'game' ? ' active' : '') + '" onclick="switchHomeTab(\'game\')">📁 자료실</div>'
    + '</div>';

  if (_homeTab === 'curriculum'){
    html += '<div class="intro-banner">작품을 눌러서 만드는 방법을 하나씩 따라가 볼까요? 별 버튼을 누르면 완료 표시!</div>';
    html += '<div class="grid">';
    LESSONS.forEach(function(u, i){
      const key = 'l' + i;
      const isDone = doneList.indexOf(key) > -1;
      html += '<div class="card" onclick="window.open(\'' + u.file + '\',\'_blank\')">'
        + '<span class="card-complete-btn' + (isDone ? ' done' : '') + '" data-key="' + key + '" title="미션 완료 표시">' + (isDone ? '✓' : '⭐') + '</span>'
        + '<img src="' + u.cover + '" alt="' + escapeHtml(u.title) + '">'
        + '<div class="card-body">'
        + '<div class="card-title">' + escapeHtml(u.title) + '</div>'
        + '<div class="card-sub">' + escapeHtml(u.tag) + '</div>'
        + '</div></div>';
    });
    html += '</div>';
  } else {
    html += '<div class="intro-banner">추가 실습과 자료예요. 카드를 누르면 새 탭에서 열려요. 별 버튼을 누르면 완료 표시!</div>';
    html += '<div class="grid">';
    GAMES.forEach(function(w, i){
      const key = 'g' + i;
      const isDone = doneList.indexOf(key) > -1;
      html += '<div class="card card-game" onclick="window.open(\'' + w.file + '\',\'_blank\')">'
        + '<span class="card-complete-btn' + (isDone ? ' done' : '') + '" data-key="' + key + '" title="미션 완료 표시">' + (isDone ? '✓' : '⭐') + '</span>'
        + '<div class="card-icon">' + w.icon + '</div>'
        + '<div class="card-body">'
        + '<div class="card-title">' + escapeHtml(w.title) + '</div>'
        + '<div class="card-sub">' + escapeHtml(w.tag || '추가 자료') + '</div>'
        + '</div></div>';
    });
    html += '</div>';
  }

  main.innerHTML = html;
  main.scrollTop = 0;
  bindTinkercadCompleteButtons();
}

// ── 카드 완료 버튼(⭐) 바인딩 + 처리
function bindTinkercadCompleteButtons(){
  document.querySelectorAll('.card-complete-btn').forEach(function(btn){
    btn.onclick = function(e){
      e.stopPropagation();
      e.preventDefault();
      completeTinkercadMission(this);
    };
  });
}

function completeTinkercadMission(btnEl){
  const key = btnEl.dataset.key;
  const isGame = key.charAt(0) === 'g';
  const idx = parseInt(key.slice(1), 10);
  const title = isGame ? ((GAMES[idx] || {}).title || '') : ((LESSONS[idx] || {}).title || '');

  const doneList = getTinkercadDone();
  const already = doneList.indexOf(key) > -1;
  if (!already){
    doneList.push(key);
    setTinkercadDone(doneList);
    btnEl.classList.add('done');
    btnEl.textContent = '✓';
  }

  burstConfettiLocal(btnEl);

  if (!already){
    try {
      if (window.parent && window.parent !== window){
        window.parent.postMessage({ type:'tinkercad-mission-complete', title: title }, '*');
      }
    } catch(e){}
  }
}

// ── 작은 폭죽 애니메이션 (버튼 클릭 위치에서 터짐)
function burstConfettiLocal(originEl){
  if (!originEl || !originEl.getBoundingClientRect) return;
  const rect = originEl.getBoundingClientRect();
  const colors = ['#FF6B6B','#FCC419','#4DABF7','#38D9A9','#9775FA','#FF922B'];
  for (let k = 0; k < 16; k++){
    const p = document.createElement('div');
    const col = colors[k % colors.length];
    p.style.cssText = 'position:fixed;left:' + (rect.left + rect.width / 2) + 'px;top:' + (rect.top + rect.height / 2) + 'px;'
      + 'width:8px;height:8px;border-radius:2px;background:' + col + ';pointer-events:none;z-index:9999;';
    document.body.appendChild(p);
    const ang = Math.random() * Math.PI * 2;
    const dist = 40 + Math.random() * 70;
    const dx = Math.cos(ang) * dist;
    const dy = Math.sin(ang) * dist - 20;
    const dur = 600 + Math.random() * 400;
    if (p.animate){
      p.animate([
        { transform:'translate(0,0) rotate(0deg)', opacity:1 },
        { transform:'translate(' + dx + 'px,' + dy + 'px) rotate(' + (Math.random() * 360) + 'deg)', opacity:0 }
      ], { duration: dur, easing:'cubic-bezier(.2,.8,.3,1)' });
    }
    setTimeout((function(el){ return function(){ el.remove(); }; })(p), dur + 60);
  }
}

showHome();
</script>
