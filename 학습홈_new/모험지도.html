<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>코딩 탐험 지도</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="favicon-180.png">
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f8ec;font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#23401a}
.page{max-width:1080px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
h1{font-size:24px;margin:0}
.who{display:flex;align-items:center;gap:10px;font-size:15px}
.chip{background:#fff;border:2px solid #cfe0bd;border-radius:999px;padding:6px 14px;font-weight:700}
.chip.star{border-color:#f2c94c;color:#8a6200}
button{font:inherit;cursor:pointer}
.ghost{background:#fff;border:2px solid #cfe0bd;border-radius:999px;padding:6px 14px;color:#4a6b3c;font-weight:700}
.ghost:hover{border-color:#3b6d11}
.mapbox{border-radius:20px;overflow:hidden;border:3px solid #3b6d11;background:#cfe8b0;line-height:0}
svg{width:100%;height:auto;display:block}
.node{cursor:pointer}
.node circle.base{stroke:#fff;stroke-width:5}
.node.done circle.base{fill:#2f9e6e}
.node.current circle.base{fill:#f5b921}
.node.locked circle.base{fill:#a9b3a2}
.node text.num{font-size:24px;font-weight:800;fill:#fff;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.node.current text.num{fill:#5a3d00}
.node .ring{fill:none;stroke:#f5b921;stroke-width:4;opacity:0}
.node.current .ring{animation:pulse 1.6s ease-out infinite}
.node.selected circle.base{stroke:#1d4ed8}
@keyframes pulse{0%{r:30;opacity:.9}100%{r:48;opacity:0}}
.lbl{font-size:17px;font-weight:800;fill:#23401a;text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:5;stroke-linejoin:round;pointer-events:none}
.lbl.small{font-size:14px;font-weight:700}
.lbl.sea{fill:#0c447c}
.place{cursor:pointer}
.place:hover .roof{filter:brightness(1.1)}
#hero .bob{animation:bob 1s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.card{margin-top:12px;background:#fff;border:2px solid #cfe0bd;border-radius:18px;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.card h2{font-size:20px;margin:0 0 4px}
.card p{margin:0;font-size:15px;color:#4a6b3c}
.state{display:inline-block;font-size:13px;font-weight:700;border-radius:999px;padding:3px 10px;margin-left:8px;vertical-align:2px}
.state.done{background:#dff5ea;color:#0f6e56}
.state.current{background:#fdf0c8;color:#7a5600}
.state.locked{background:#e9ece6;color:#5f665a}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:999px;padding:12px 22px;font-size:16px;font-weight:800}
.btn.play{background:#1d4ed8;color:#fff}
.btn.go{background:#fff;color:#3b6d11;border:2px solid #3b6d11}
.btn.ok{background:#2f9e6e;color:#fff}
.btn:disabled{background:#e3e7df;color:#98a093;border-color:#e3e7df;cursor:not-allowed}
footer{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:13px;color:#6b7f5f;gap:8px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#23401a;color:#fff;padding:12px 22px;border-radius:999px;font-size:15px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .25s}
.toast.show{opacity:1}
.modal{position:fixed;inset:0;background:rgba(20,40,15,.6);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal.show{display:flex}
.modal .box{background:#eef6e6;border-radius:20px;width:min(840px,100%);height:min(680px,100%);display:flex;flex-direction:column;overflow:hidden}
.modal .top{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;font-weight:800;font-size:16px;background:#fff}
.modal iframe{flex:1;border:0;width:100%}
</style>
</head>
<body>
<div class="page">
<header>
  <h1>코딩 탐험 지도</h1>
  <div class="who">
    <span class="chip">탐험가 김코딩</span>
    <span class="chip star">★ <span id="stars">0</span></span>
    <button class="ghost" id="teacherBtn">교사용</button>
  </div>
</header>

<div class="mapbox">
<svg id="map" viewBox="0 0 1000 560" role="img" aria-label="엔트리 숲 탐험 지도">
  <rect width="1000" height="560" fill="#cfe8b0"/>
  <ellipse cx="230" cy="250" rx="210" ry="90" fill="#bfe09a"/>
  <ellipse cx="560" cy="470" rx="230" ry="80" fill="#bfe09a"/>
  <ellipse cx="560" cy="170" rx="170" ry="70" fill="#c6e4a4"/>

  <path d="M800 0 C770 80 830 140 795 220 C765 300 835 360 800 440 C785 490 810 530 800 560 L1000 560 L1000 0 Z" fill="#f3e2b3"/>
  <path d="M828 0 C800 80 858 140 824 220 C795 300 862 360 828 440 C814 490 838 530 828 560 L1000 560 L1000 0 Z" fill="#8fd0ef"/>
  <path d="M870 330 q12 -10 24 0 t24 0 M890 430 q12 -10 24 0 t24 0 M880 60 q12 -10 24 0 t24 0" fill="none" stroke="#e8f6fd" stroke-width="4" stroke-linecap="round"/>

  <g>
    <ellipse cx="925" cy="165" rx="62" ry="16" fill="#e9d8a6"/>
    <polygon points="875,165 925,80 975,165" fill="#a9816b"/>
    <polygon points="908,108 925,80 942,108 933,116 925,106 917,116" fill="#e8593c"/>
    <text class="lbl small sea" x="925" y="200">파이썬 화산섬</text>
  </g>
  <text class="lbl sea" x="915" y="270">스크래치 바다</text>
  <text class="lbl small sea" x="915" y="294">숲을 다 탐험하면 열려요</text>

  <g id="trees"></g>
  <g id="roads"></g>

  <g class="place" data-msg="AI 튜터는 곧 연결될 예정이에요.">
    <rect x="118" y="112" width="104" height="64" rx="6" fill="#f6e7c8" stroke="#8a6b3a" stroke-width="3"/>
    <polygon class="roof" points="106,116 170,66 234,116" fill="#c96f4a" stroke="#8a4a2e" stroke-width="3" stroke-linejoin="round"/>
    <rect x="158" y="136" width="24" height="40" rx="4" fill="#8a6b3a"/>
    <rect x="128" y="130" width="20" height="18" rx="3" fill="#bfe3f5" stroke="#8a6b3a" stroke-width="2"/>
    <rect x="192" y="130" width="20" height="18" rx="3" fill="#bfe3f5" stroke="#8a6b3a" stroke-width="2"/>
    <text class="lbl small" x="170" y="200">COS Pro 오두막</text>
  </g>

  <g class="place" data-msg="COS 시험연습은 곧 연결될 예정이에요.">
    <rect x="408" y="70" width="64" height="104" fill="#d9d2e9" stroke="#5b4d8a" stroke-width="3"/>
    <path class="roof" d="M400 70 h16 v-14 h14 v14 h20 v-14 h14 v14 h16 v12 h-80 z" fill="#b9add9" stroke="#5b4d8a" stroke-width="3" stroke-linejoin="round"/>
    <rect x="428" y="134" width="24" height="40" rx="12" fill="#5b4d8a"/>
    <rect x="431" y="96" width="18" height="22" rx="9" fill="#fff3c4" stroke="#5b4d8a" stroke-width="2"/>
    <line x1="440" y1="56" x2="440" y2="26" stroke="#5b4d8a" stroke-width="3"/>
    <polygon points="440,26 468,35 440,44" fill="#e8593c"/>
    <text class="lbl small" x="440" y="198">COS 시험의 탑</text>
  </g>

  <g id="nodes"></g>
  <g id="fx"></g>
  <g id="hero"><g class="bob">
    <ellipse cx="0" cy="2" rx="16" ry="5" fill="#000" opacity=".15"/>
    <rect x="-13" y="-32" width="26" height="30" rx="10" fill="#3b82f6"/>
    <rect x="-19" y="-28" width="8" height="18" rx="4" fill="#8a6b3a"/>
    <circle cx="0" cy="-44" r="15" fill="#ffe0b8"/>
    <circle cx="-5" cy="-44" r="2.2" fill="#3a2a1a"/><circle cx="6" cy="-44" r="2.2" fill="#3a2a1a"/>
    <path d="M-4 -37 q4.5 4 9 0" fill="none" stroke="#3a2a1a" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="0" cy="-55" rx="21" ry="5" fill="#6b8f3a"/>
    <path d="M-13 -55 a13 12 0 0 1 26 0 z" fill="#7fa648"/>
  </g></g>
</svg>
</div>

<div class="card">
  <div>
    <h2><span id="mTitle"></span><span class="state" id="mState"></span></h2>
    <p id="mDesc"></p>
  </div>
  <div class="btns">
    <button class="btn play" id="playBtn">▶ 미리 해보기</button>
    <button class="btn go" id="goBtn">미션 시작</button>
    <button class="btn ok" id="okBtn">✓ 완료</button>
  </div>
</div>

<footer>
  <span>초록 = 완료 · 노랑 = 지금 할 미션 · 회색 = 잠김</span>
  <button class="ghost" id="resetBtn">시안 처음부터 다시 보기</button>
</footer>
</div>

<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="box">
  <div class="top"><span id="modalTitle"></span><button class="ghost" id="closeBtn">닫기 ✕</button></div>
  <iframe id="frame" title="미리 해보기"></iframe>
</div></div>

<script>
(() => {
const NS = 'http://www.w3.org/2000/svg';
const M = [
  {title:'달리기 시합', desc:'클릭할 때마다 고양이가 달려요. 강아지보다 먼저 도착해 볼까요?', file:'2_미리해보기/미리해보기_01_달리기시합.html', x:120, y:455},
  {title:'바닷속 꽃게잡기', desc:'마우스를 따라 움직이는 꽃게를 만들어요. 쫓아오는 골대를 피해요.', file:'2_미리해보기/미리해보기_02_꽃게잡기.html', x:262, y:345},
  {title:'신비한 물약', desc:'물약을 클릭하면 꼬마 마법사가 커지고 작아져요.', file:'2_미리해보기/미리해보기_03_신비한물약.html', x:405, y:440},
  {title:'어떤 모자가 어울릴까', desc:'모자를 클릭해서 선생님께 씌워 줘요.', file:'2_미리해보기/미리해보기_04_모자고르기.html', x:540, y:320},
  {title:'준비 중', desc:'다음 미션은 준비 중이에요.', soon:true, x:668, y:415},
  {title:'준비 중', desc:'다음 미션은 준비 중이에요.', soon:true, x:745, y:262}
];
const KEY = 'studyhome_new_demo_progress';
const $ = id => document.getElementById(id);
const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
let progress = 0, selected = 0, walking = false;
try { progress = Math.min(4, Math.max(0, parseInt(localStorage.getItem(KEY), 10) || 0)); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, String(progress)); } catch (e) {} };

const TREES = [[40,60],[85,300],[35,400],[60,520],[200,520],[310,250],[330,520],[300,90],[340,150],[250,60],[480,520],[610,520],[520,60],[590,100],[640,200],[700,90],[760,140],[620,300],[470,250],[740,500],[760,360],[30,200],[560,230],[90,90],[230,430]];
TREES.forEach(t => {
  const g = el('g', {transform:'translate(' + t[0] + ',' + t[1] + ')'}, $('trees'));
  el('rect', {x:-4, y:-4, width:8, height:16, fill:'#8a6b3a'}, g);
  el('polygon', {points:'-20,0 0,-30 20,0', fill:'#4c9a4a'}, g);
  el('polygon', {points:'-15,-16 0,-42 15,-16', fill:'#5fb05c'}, g);
});

const ctrl = i => {
  const a = M[i], b = M[i + 1], mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
  const dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy), s = (i % 2 ? -1 : 1) * 26;
  return {x: mx - dy / len * s, y: my + dx / len * s};
};
const segD = i => { const a = M[i], b = M[i + 1], c = ctrl(i); return 'M' + a.x + ' ' + a.y + ' Q' + c.x + ' ' + c.y + ' ' + b.x + ' ' + b.y; };
const bez = (i, t) => { const a = M[i], b = M[i + 1], c = ctrl(i), u = 1 - t; return {x: u*u*a.x + 2*u*t*c.x + t*t*b.x, y: u*u*a.y + 2*u*t*c.y + t*t*b.y}; };
let d = '';
for (let i = 0; i < M.length - 1; i++) d += segD(i) + ' ';
d += 'M745 262 Q790 235 836 228';
el('path', {d, fill:'none', stroke:'#b99a62', 'stroke-width':30, 'stroke-linecap':'round'}, $('roads'));
el('path', {d, fill:'none', stroke:'#ecd9a8', 'stroke-width':24, 'stroke-linecap':'round'}, $('roads'));
el('path', {d, fill:'none', stroke:'#fff', 'stroke-width':3, 'stroke-dasharray':'2 14', 'stroke-linecap':'round', opacity:.8}, $('roads'));
el('rect', {x:826, y:214, width:44, height:26, rx:4, fill:'#a9816b', stroke:'#7a5a44', 'stroke-width':3}, $('roads'));

const nodes = M.map((m, i) => {
  const g = el('g', {class:'node', transform:'translate(' + m.x + ',' + m.y + ')', tabindex:0}, $('nodes'));
  el('circle', {class:'ring', r:30}, g);
  el('circle', {class:'base', r:28}, g);
  const t = el('text', {class:'num', y:1}, g); t.textContent = i + 1;
  const l = el('text', {class:'lbl', y:56}, g); l.textContent = m.title;
  g.addEventListener('click', () => pick(i));
  g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(i); } });
  return {g, t};
});
const stateOf = i => i < progress ? 'done' : (i === progress ? 'current' : 'locked');
const heroTo = (x, y) => $('hero').setAttribute('transform', 'translate(' + x + ',' + (y - 30) + ')');

function render() {
  nodes.forEach((n, i) => {
    const s = stateOf(i);
    n.g.setAttribute('class', 'node ' + s + (i === selected ? ' selected' : ''));
    n.t.textContent = s === 'done' ? '✓' : i + 1;
  });
  $('stars').textContent = progress;
  const m = M[selected], s = stateOf(selected);
  $('mTitle').textContent = m.soon ? '다음 미션' : '미션 ' + (selected + 1) + '. ' + m.title;
  $('mDesc').textContent = m.desc;
  const st = $('mState');
  st.className = 'state ' + (m.soon ? 'locked' : s);
  st.textContent = m.soon ? '준비 중' : (s === 'done' ? '완료' : s === 'current' ? '지금 여기' : '잠김');
  const open = !m.soon && s !== 'locked';
  $('playBtn').disabled = !open; $('goBtn').disabled = !open;
  $('okBtn').disabled = walking || m.soon || s !== 'current';
}
function pick(i) {
  if (walking) return;
  if (stateOf(i) === 'locked' && !M[i].soon) { toast('앞의 미션을 먼저 끝내야 열려요.'); return; }
  if (M[i].soon && i > progress) { toast('아직 준비 중인 미션이에요.'); return; }
  selected = i; render();
}
let toastTimer;
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2000); }

function burst(x, y) {
  const parts = [];
  for (let k = 0; k < 14; k++) {
    const a = Math.PI * 2 * k / 14, c = el('circle', {r:5, fill:['#f5b921','#2f9e6e','#1d4ed8','#e8593c'][k % 4]}, $('fx'));
    parts.push({c, a, v: 60 + (k % 3) * 25});
  }
  const t0 = performance.now();
  (function step(now) {
    const t = Math.min(1, (now - t0) / 700);
    parts.forEach(p => { p.c.setAttribute('cx', x + Math.cos(p.a) * p.v * t); p.c.setAttribute('cy', y + Math.sin(p.a) * p.v * t + 60 * t * t); p.c.setAttribute('opacity', 1 - t); });
    if (t < 1) requestAnimationFrame(step); else parts.forEach(p => p.c.remove());
  })(t0);
}
function walk(i, done) {
  const t0 = performance.now(), dur = 1500;
  (function step(now) {
    const t = Math.min(1, (now - t0) / dur), e = t < .5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2) / 2, p = bez(i, e);
    heroTo(p.x, p.y - Math.abs(Math.sin(t * Math.PI * 5)) * 10);
    if (t < 1) requestAnimationFrame(step); else done();
  })(t0);
}
function complete() {
  if (walking || selected !== progress || M[selected].soon) return;
  const from = progress;
  progress++; save(); walking = true; render();
  burst(M[from].x, M[from].y);
  setTimeout(() => walk(from, () => {
    walking = false; selected = from + 1; render();
    toast(M[selected].soon ? '여기까지 완료! 다음 미션은 준비 중이에요.' : '다음 미션이 열렸어요!');
  }), 350);
}
$('okBtn').addEventListener('click', complete);
$('playBtn').addEventListener('click', () => {
  const m = M[selected];
  $('modalTitle').textContent = '미리 해보기 · ' + m.title;
  $('frame').src = m.file; $('modal').classList.add('show');
});
const closeModal = () => { $('modal').classList.remove('show'); $('frame').src = 'about:blank'; };
$('closeBtn').addEventListener('click', closeModal);
$('modal').addEventListener('click', e => { if (e.target === $('modal')) closeModal(); });
$('goBtn').addEventListener('click', () => toast('여기에 미션 교재(학습지)가 연결될 예정이에요.'));
$('teacherBtn').addEventListener('click', () => toast('교사용 공간은 다음 단계에서 만들 예정이에요.'));
document.querySelectorAll('.place').forEach(p => p.addEventListener('click', () => toast(p.getAttribute('data-msg'))));
$('resetBtn').addEventListener('click', () => { if (walking) return; progress = 0; selected = 0; save(); heroTo(M[0].x, M[0].y); render(); });

selected = Math.min(progress, M.length - 1);
heroTo(M[selected].x, M[selected].y);
render();
})();
</script>
</body>
</html>
