<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스크래치 미션지 시안</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#eff5f8;font-family:Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#14232c;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
/* 시안 고르기 줄 (시안에만 있음) */
.pick{background:#14232c;color:#cfe0e8;font-size:13px;font-weight:700;display:flex;gap:6px;align-items:center;justify-content:center;padding:8px 12px;flex-wrap:wrap}
.pick button{color:#cfe0e8;border-radius:999px;padding:5px 12px;box-shadow:inset 0 0 0 1.5px #44606e}
.pick button.on{background:#fff;color:#14232c;box-shadow:none}
.topbar{max-width:680px;margin:0 auto;padding:26px 18px 0;display:flex;align-items:center;gap:10px}
.backl{font-size:15px;font-weight:700;color:#5b6f7a;padding:4px 0}
.backl:hover{color:#14232c}
.tbadge{margin-left:auto;font-size:12px;font-weight:800;color:#7a5600;background:#ffe9a8;border-radius:999px;padding:4px 10px}
.page{max-width:680px;margin:0 auto;padding:0 18px 60px}
.eyebrow{margin:14px 0 6px;font-size:14px;font-weight:800;color:#1f8fc4}
h1{margin:0;font-size:30px;font-weight:800;letter-spacing:-.6px;line-height:1.3}
.goal{margin:10px 0 0;font-size:16px;color:#5b6f7a;line-height:1.65}
.meta{display:flex;align-items:center;gap:16px;margin:20px 0 12px}
.playl{font-size:15px;font-weight:800;color:#0f6f9e;white-space:nowrap}
.playl:hover,.allb:hover{text-decoration:underline;text-underline-offset:4px}
.allb{margin-left:auto;font-size:14px;font-weight:700;color:#5b6f7a}
/* 스프라이트 목록 */
.list{background:#fff;border-radius:20px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(20,60,80,.07);margin:0;padding:0;list-style:none}
.it{border-top:1px solid #e9f0f3}.it:first-child{border-top:0}
.ih{display:flex;align-items:center;gap:12px;padding:18px 22px;cursor:pointer}
.nm{font-size:17px;font-weight:800;white-space:nowrap}
.say{flex:1;font-size:15.5px;color:#5b6f7a;line-height:1.5}
.arr{font-size:14px;font-weight:800;color:#1b6fa8;white-space:nowrap;border-bottom:2px solid transparent}
.ih:hover .arr,.it.o .arr{border-bottom-color:currentColor}
.ib{display:none;padding:0 22px 20px}
.it.o .ib{display:block}
.pane{padding:16px;border-radius:14px;background:#f5f9fb;overflow-x:auto}
.pane.ans{margin-top:10px;background:#fffdf3;box-shadow:inset 0 0 0 1.5px #f2c94c}
.lab{font-size:12px;font-weight:800;color:#8a6a00;margin:0 0 8px}
.ansb{display:inline-block;margin-top:10px;font-size:14px;font-weight:800;color:#8a6a00}
.pile{display:flex;flex-wrap:wrap;align-items:flex-start;gap:10px 12px}
.pile>*{transform:rotate(var(--r,0deg))}
.stacks{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.stack{display:inline-flex;flex-direction:column;align-items:flex-start}
.b{display:inline-flex;align-items:center;gap:5px;padding:7px 12px;border-radius:7px;color:#fff;font-size:13.5px;font-weight:600;line-height:1.2;white-space:nowrap}
.stack>*+*,.in>*+*{margin-top:2px}
.b.hat{border-radius:16px 16px 7px 7px;padding-top:9px}
.v{display:inline-block;background:#fff;color:#333;border-radius:999px;padding:1px 9px;font-size:12.5px;font-weight:600}
.v.sel{border-radius:5px;background:rgba(0,0,0,.18);color:#fff}
.v.blank{min-width:30px;height:19px;vertical-align:middle;padding:0}
.v.bool{border-radius:4px;background:#5cb1d6;color:#fff;padding:2px 6px}
.c{display:flex;flex-direction:column;align-items:flex-start;border-radius:7px}
.c .head,.c .foot{padding:7px 12px;color:#fff;font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:5px;white-space:nowrap}
.c .foot{padding:5px 12px;min-width:70px}
.c .head.mid{padding:5px 12px}
.c .in{margin-left:14px;padding:2px 2px 2px 0;background:#fff;border-radius:0 6px 6px 0;display:flex;flex-direction:column;align-items:flex-start}
.c.hollow .in{min-width:110px;min-height:22px;box-shadow:inset 0 0 0 1.5px #dfe8ec}
/* 스크래치 블록 색 */
.ev{background:#e6ac00}.ctl{background:#f29a0c}.mo{background:#4c97ff}.lk{background:#9966ff}.snd{background:#cf63cf}.sen{background:#47a8d1}.op{background:#4fb34f}.va{background:#ff8c1a}.my{background:#ff6680}.pen{background:#0fbd8c}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:24px;gap:10px}
.ghost{font-size:15px;font-weight:700;color:#0f6f9e;text-decoration:none}
.ghost:hover{text-decoration:underline;text-underline-offset:4px}
.done{border-radius:999px;padding:11px 22px;font-size:15px;font-weight:700;background:#14232c;color:#fff}
.done.sm{padding:7px 14px;font-size:14px}
.modal{position:fixed;inset:0;background:rgba(14,24,30,.6);display:flex;align-items:center;justify-content:center;z-index:60;padding:18px;visibility:hidden;opacity:0;transition:opacity .15s}
.modal.on{visibility:visible;opacity:1}
.modal .box{width:min(900px,100%);background:#fff;border-radius:22px;overflow:hidden;display:flex;flex-direction:column}
.modal .mh{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;font-weight:800;font-size:16px}
.mclose{font-size:14px;font-weight:700;border-radius:999px;padding:7px 14px;background:#eef3f6}
.modal iframe{width:100%;height:min(640px,76vh);border:0;display:block}
@media (max-width:600px){.ih{flex-wrap:wrap}.say{flex-basis:100%;order:3}h1{font-size:25px}}
</style>
</head>
<body>
<div class="topbar"><button class="backl" id="backBtn">← 바닷길</button></div>
<div class="page">
  <p class="eyebrow" id="tag"></p>
  <h1 id="title"></h1>
  <p class="goal" id="goal"></p>
  <div class="meta"><button class="playl" id="playBtn">▶ 완성작</button><a class="playl" href="https://scratch.mit.edu/projects/editor/" target="_blank" rel="noopener" style="text-decoration:none">스크래치 열기 ↗</a><button class="done sm" data-done style="margin-left:auto">미션 완료 ⭐</button><button class="allb" id="allBtn" hidden></button></div>
  <ol class="list" id="list"></ol>
  <div class="foot">
    <a class="ghost" href="https://scratch.mit.edu/projects/editor/" target="_blank" rel="noopener">스크래치 열기 ↗</a>
    <button class="done" data-done>미션 완료 ⭐</button>
  </div>
</div>
<div class="modal" id="modal"><div class="box"><div class="mh"><span id="mTitle"></span><button class="mclose" id="mClose">닫기 ✕</button></div><iframe id="mFrame" title="완성작"></iframe></div></div>
<script>
(() => {
/* 시안용 미션 하나: 기초 1 · 1-2 달리기 시합 (완성작 s1_4_1.sb3 의 블록을 옮김)
   블록 쓰는 법은 엔트리 미션지와 같음 — '분류:글자', '분류^글자'(모자 블록), [숫자·글자], {고르는 칸}, <판단> */
const ID = 's1_4';
const M = {
  tag: '1-2', title: '달리기 시합',
  goal: '게가 <b>3, 2, 1, 출발!</b> 을 외치면 친구들이 달리기 시작해요.',
  sprites: [
    {obj: '게 (Crab)', say: '숫자를 세고 출발 신호를 보내요.', code: [
      'ev^🚩 클릭했을 때', 'mo:x: [-134] y: [123] (으)로 이동하기', 'lk:[3] 을(를) [1] 초 동안 말하기', 'lk:[2] 을(를) [1] 초 동안 말하기', 'lk:[1] 을(를) [1] 초 동안 말하기', 'lk:[출발~~!!] 을(를) [1] 초 동안 말하기', 'ev:{메시지1} 신호 보내기']},
    {obj: '앵무새 (Parrot)', say: '신호를 받으면 벽에 닿을 때까지 날아가요.', code: [
      'ev^🚩 클릭했을 때', 'lk:크기를 [40] %로 정하기', 'mo:x: [-199] y: [-9] (으)로 이동하기',
      'ev^{메시지1} 신호를 받았을 때', ['ctl:<{벽} 에 닿았는가?> 까지 반복하기', ['mo:[12] 만큼 움직이기', 'lk:다음 모양으로 바꾸기', 'ctl:[0.1] 초 기다리기']]]},
    {obj: '달리는 친구 (스프라이트 1)', say: '신호를 받으면 계속 달려요. 스페이스 키로 제자리에 돌아와요.', code: [
      'ev^🚩 클릭했을 때', 'mo:x: [-198] y: [72] (으)로 이동하기',
      'ev^{메시지1} 신호를 받았을 때', ['ctl:무한 반복하기', ['mo:[10] 만큼 움직이기', 'lk:다음 모양으로 바꾸기', 'ctl:[0.1] 초 기다리기']],
      'ev^{스페이스} 키를 눌렀을 때', 'mo:x: [-198] y: [72] (으)로 이동하기', 'lk:모양을 {모양1} (으)로 바꾸기']},
    {obj: '상어 (Shark)', say: '신호를 받으면 입만 뻐끔거리다 지쳐요.', code: [
      'ev^{메시지1} 신호를 받았을 때', ['ctl:[20] 번 반복하기', ['lk:모양을 {shark-b} (으)로 바꾸기', 'ctl:[0.1] 초 기다리기', 'lk:모양을 {shark-a} (으)로 바꾸기', 'ctl:[0.1] 초 기다리기']], 'lk:모양을 {shark-c} (으)로 바꾸기']}
  ]
};
const $ = id => document.getElementById(id);
const Q = new URLSearchParams(location.search);
let V = Q.get('v') === '1' ? 1 : 2; /* 확정: 처음부터 다 보이기 */
const TEACHER = (() => { try { return localStorage.getItem('학습홈_admin') === '1'; } catch (e) { return false; } })();
document.title = M.title + ' · 스크래치 미션 (시안)';
$('tag').textContent = M.tag + ' 미션'; $('title').textContent = M.title; $('goal').innerHTML = M.goal;
$('mTitle').textContent = '▶ 완성작 · ' + M.title;
if (TEACHER) { const t = document.createElement('span'); t.className = 'tbadge'; t.textContent = '🔑 선생님'; document.querySelector('.topbar').appendChild(t); }

/* 블록 그리기 (미션.html 과 같은 방식) */
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
function inline(t) {
  let h = esc(t);
  h = h.replace(/\[ \]/g, '<span class="v blank"></span>');
  h = h.replace(/\[([^\]]*)\]/g, '<span class="v">$1</span>').replace(/\{([^}]*)\}/g, '<span class="v sel">$1 ▾</span>');
  return h.replace(/&lt;(.*?)&gt;/g, '<span class="v bool">$1</span>');
}
function block(x) {
  if (Array.isArray(x)) { const m = x[0].match(/^(\w+)[:^](.*)$/); return '<div class="c ' + m[1] + '"><div class="head">' + inline(m[2]) + '</div><div class="in">' + x[1].map(block).join('') + '</div>' + (x.length > 3 ? '<div class="head mid">' + inline(x[2]) + '</div><div class="in">' + x[3].map(block).join('') + '</div>' : '') + '<div class="foot"></div></div>'; }
  const m = x.match(/^(\w+)([:^])(.*)$/); return '<span class="b ' + m[1] + (m[2] === '^' ? ' hat' : '') + '">' + inline(m[3]) + '</span>';
}
/* 흩어진 블록: 반복·만일 안은 비우고, 같은 블록은 한 번만(숫자 칸 비움), 순서는 섞음 */
function pieces(list, out) { list.forEach(x => { if (Array.isArray(x)) { out.push(x.length > 3 ? [x[0], [], x[2], []] : [x[0], []]); pieces(x[1], out); if (x.length > 3) pieces(x[3], out); } else out.push(x); }); return out; }
function shuffle(a, seed) {
  const r = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
  const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; }
  if (b.length > 1 && b.every((x, i) => x === a[i])) b.push(b.shift());
  return b;
}
function uniq(list) {
  const key = x => (Array.isArray(x) ? x[0] : x).replace(/\[[^\]]*\]/g, '[]'), seen = new Map(), out = [];
  list.forEach(x => { const k = key(x); if (!seen.has(k)) { seen.set(k, out.length); out.push(x); } else { const i = seen.get(k), y = out[i], ys = Array.isArray(y) ? y[0] : y, xs = Array.isArray(x) ? x[0] : x; if (ys !== xs) out[i] = Array.isArray(y) ? [k, ...y.slice(1)] : k.replace(/\[\]/g, '[ ]'); } });
  return out.map(x => Array.isArray(x) ? [x[0].replace(/\[\]/g, '[ ]'), ...x.slice(1)] : x);
}
const pileHTML = (code, seed) => '<div class="pile">' + shuffle(uniq(pieces(code, [])), seed * 31 + 3).map((x, i) => {
  const h = Array.isArray(x) ? block(x).replace('class="c ', 'class="c hollow ') : block(x);
  return h.replace(/^<(\w+) /, '<$1 style="--r:' + (((i * 37 + seed * 13) % 5) - 2) * .7 + 'deg" ');
}).join('') + '</div>';
/* 정답(선생님만): 모자 블록마다 한 묶음으로 조립해서 */
const ansHTML = code => { const g = []; code.forEach(x => { if (!Array.isArray(x) && /^\w+\^/.test(x) || !g.length) g.push([]); g[g.length - 1].push(x); }); return '<div class="stacks">' + g.map(s => '<div class="stack">' + s.map(block).join('') + '</div>').join('') + '</div>'; };

const open = M.sprites.map(() => false), ans = M.sprites.map(() => false);
function draw() {
  document.querySelectorAll('.pick button').forEach(b => b.classList.toggle('on', +b.dataset.v === V));
  const all = V === 2;
  $('allBtn').hidden = all; $('allBtn').textContent = open.every(Boolean) ? '모두 접기' : '블록 모두 보기';
  $('list').innerHTML = M.sprites.map((s, i) => {
    const o = all || open[i];
    return '<li class="it' + (o ? ' o' : '') + '" data-i="' + i + '"><div class="ih"><span class="nm">' + esc(s.obj) + '</span><span class="say">' + esc(s.say) + '</span>' + (all ? '' : '<span class="arr">🧩 블록 ' + (o ? '▴' : '▾') + '</span>') + '</div>' +
      '<div class="ib"><div class="pane">' + pileHTML(s.code, i + 1) + '</div>' +
      (TEACHER ? '<button class="ansb" data-ans>✅ 정답 ' + (ans[i] ? '▴' : '▾') + '</button>' + (ans[i] ? '<div class="pane ans"><p class="lab">정답 (원장님 화면에만 보여요)</p>' + ansHTML(s.code) + '</div>' : '') : '') + '</div></li>';
  }).join('');
}
$('list').addEventListener('click', e => {
  const li = e.target.closest('[data-i]'); if (!li) return; const i = +li.dataset.i;
  if (e.target.closest('[data-ans]')) ans[i] = !ans[i];
  else if (e.target.closest('.ih') && V === 1) open[i] = !open[i];
  else return;
  draw();
});
$('allBtn').addEventListener('click', () => { const t = !open.every(Boolean); open.fill(t); draw(); });

/* 완성작: 스크래치 미리 해보기 창 (깃허브에 올린 뒤에 재생됨) */
let loaded = false;
$('playBtn').addEventListener('click', () => { if (!loaded) { $('mFrame').src = '스크래치미리보기.html?id=' + ID + '&t=' + encodeURIComponent(M.title); loaded = true; } $('modal').classList.add('on'); });
const closeM = () => { $('modal').classList.remove('on'); $('mFrame').src = 'about:blank'; loaded = false; };
$('mClose').addEventListener('click', closeM);
$('modal').addEventListener('click', e => { if (e.target.id === 'modal') closeM(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeM(); });
$('backBtn').addEventListener('click', () => { location.href = '스크래치바다.html?at=' + ID; });
document.querySelectorAll('[data-done]').forEach(b => b.addEventListener('click', () => { alert('시안이에요. 실제 미션지에서는 바닷길로 돌아가 완료 표시가 돼요.'); }));
draw();
})();
</script>
</body>
</html>
