<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>COS Pro 오두막</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="favicon-180.png">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#2a1d14;font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#2b2118}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font:inherit;cursor:pointer}
.hud{position:fixed;left:0;right:0;top:0;padding:14px 18px;display:flex;align-items:center;gap:10px;pointer-events:none}
.hud>*{pointer-events:auto}
.logo{font-size:22px;font-weight:900;color:#fff3dc;text-shadow:0 2px 8px rgba(0,0,0,.5);margin-right:auto}
.pill{background:rgba(255,250,240,.95);border:0;border-radius:999px;padding:8px 16px;font-weight:800;font-size:15px;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.pin{position:fixed;left:0;top:0;transform:translate(-50%,-100%);border:0;background:rgba(255,253,247,.97);border-radius:16px;padding:9px 16px 10px;text-align:center;box-shadow:0 4px 16px rgba(0,0,0,.35);white-space:nowrap;animation:bob 2.2s ease-in-out infinite}
.pin b{display:block;font-size:17px;font-weight:900}
.pin small{display:block;font-size:12px;font-weight:700;color:#8a6a45;margin-top:1px}
.pin::after{content:"";position:absolute;left:50%;bottom:-8px;width:16px;height:16px;background:inherit;transform:translateX(-50%) rotate(45deg);border-radius:3px;z-index:-1}
.pin:hover,.pin.on{background:#fff1c9}
@keyframes bob{0%,100%{margin-top:0}50%{margin-top:-6px}}
.card{position:fixed;right:22px;top:50%;transform:translate(120%,-50%);width:min(370px,calc(100vw - 32px));background:rgba(255,253,247,.98);border-radius:24px;padding:22px;box-shadow:0 14px 40px rgba(0,0,0,.4);transition:transform .45s cubic-bezier(.2,.9,.3,1)}
.card.show{transform:translate(0,-50%)}
.tag{display:inline-block;font-size:13px;font-weight:800;border-radius:999px;padding:4px 12px;margin-bottom:10px;background:#fdeeb9;color:#7a5600}
.card h2{font-size:24px;margin:0 0 8px}
.card p{font-size:16px;line-height:1.6;margin:0 0 16px;color:#5a4633}
.col{display:flex;flex-direction:column;gap:9px}
.btn{border:0;border-radius:16px;padding:14px 18px;font-size:17px;font-weight:800;width:100%}
.btn.go{background:#2563eb;color:#fff}
.btn.sub{background:#f1eadc;color:#5a4633}
.btn:hover{filter:brightness(1.06)}
.say{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:rgba(255,253,247,.96);border-radius:999px;padding:12px 24px;font-size:16px;font-weight:800;box-shadow:0 6px 20px rgba(0,0,0,.35);white-space:nowrap}
.fade{position:fixed;inset:0;background:#eef8f2;opacity:0;pointer-events:none;transition:opacity .5s;z-index:40}
.fade.on{opacity:1}
.nogl{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:24px;font-size:18px;line-height:1.7;background:#f4f8ec}
@media (max-width:720px){.card{right:16px;top:auto;bottom:16px;transform:translate(0,130%)}.card.show{transform:translate(0,0)}.say{display:none}.logo{font-size:18px}}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div class="hud">
  <span class="logo">COS Pro 오두막</span>
  <span class="pill" id="who"></span>
  <button class="pill" id="worldBtn">세계 지도</button>
</div>
<div id="pins"></div>
<div class="say" id="say">어서 와! 하고 싶은 것을 눌러 봐.</div>
<div class="card" id="card">
  <span class="tag" id="cTag"></span>
  <h2 id="cTitle"></h2>
  <p id="cDesc"></p>
  <div class="col" id="cBtns"></div>
</div>
<div class="fade" id="fade"></div>
<div class="nogl" id="nogl">이 컴퓨터에서는 3D 화면을 띄울 수 없어요.</div>

<script src="lib/three.min.js"></script>
<script>
(() => {
const $ = id => document.getElementById(id);
if (!window.THREE) { $('nogl').style.display = 'flex'; return; }
const T = THREE;

/* 여기 주소만 바꾸면 연결되는 곳이 바뀝니다. */
const LINKS = {
  tutor: 'https://claude.ai/public/artifacts/68541789-3e4c-459d-a4db-f3a746415d74',
  exam: 'https://kssim00.github.io/coden_edu/cos_pro_exam/index.html'
};

const COLORS = ['#ff8a70', '#ffc94d', '#7fd39a', '#6cc4ee', '#8f9df2', '#c79bf2', '#f59ac4', '#f3f1ea'];
let S = {name:'탐험가', color:0, hair:0};
try { const v = JSON.parse(localStorage.getItem('studyhome_new_3d_demo')); if (v && typeof v === 'object') S = Object.assign(S, v); } catch (e) {}
$('who').textContent = S.name || '탐험가';

let renderer;
try { renderer = new T.WebGLRenderer({canvas: $('gl'), antialias: true}); } catch (e) { $('nogl').style.display = 'flex'; return; }
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = T.PCFSoftShadowMap;
renderer.toneMapping = T.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.1;
const scene = new T.Scene(); scene.background = new T.Color('#2a1d14');
const camera = new T.PerspectiveCamera(40, 1, 0.5, 200);

scene.add(new T.HemisphereLight(0xfff0d8, 0x6b4a30, 1.15));
const sun = new T.DirectionalLight(0xfff2cf, 2.2); sun.position.set(-9, 13, 9); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -0.0005; sun.shadow.normalBias = 0.03;
const sc = sun.shadow.camera; sc.left = -12; sc.right = 12; sc.top = 12; sc.bottom = -12; sc.near = 1; sc.far = 50; scene.add(sun);
const lamp = new T.PointLight(0xffb65c, 26, 16, 2); lamp.position.set(5.6, 4.3, -1.5); scene.add(lamp);
const glow = new T.PointLight(0x7fc8ff, 9, 7, 2); glow.position.set(3.1, 2.8, -3.2); scene.add(glow);

const lam = (c, o) => new T.MeshLambertMaterial(Object.assign({color: c}, o || {}));
const flat = (c, o) => new T.MeshStandardMaterial(Object.assign({color: c, flatShading: true, roughness: 0.92, metalness: 0}, o || {}));
function box(w, h, d, mat, x, y, z, parent) { const m = new T.Mesh(new T.BoxGeometry(w, h, d), mat); m.position.set(x, y, z); m.castShadow = m.receiveShadow = true; (parent || scene).add(m); return m; }
function cyl(rt, rb, h, seg, mat, x, y, z, parent) { const m = new T.Mesh(new T.CylinderGeometry(rt, rb, h, seg), mat); m.position.set(x, y, z); m.castShadow = m.receiveShadow = true; (parent || scene).add(m); return m; }
function textTex(w, h, draw) { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); const t = new T.CanvasTexture(c); t.colorSpace = T.SRGBColorSpace; t.anisotropy = 4; return t; }
const F = '"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif';

/* 방 */
const W = 15, D = 10, WH = 6.4;
for (let i = 0; i < 10; i++) box(W / 10 - 0.03, 0.3, D, flat(i % 2 ? '#c08a52' : '#b57f48'), -W / 2 + (i + 0.5) * W / 10, -0.15, 0);
box(W, WH, 0.4, flat('#f2dfba'), 0, WH / 2, -D / 2 - 0.2);
box(0.4, WH, D, flat('#ecd6ac'), -W / 2 - 0.2, WH / 2, 0);
box(0.4, WH, D, flat('#ecd6ac'), W / 2 + 0.2, WH / 2, 0);
box(W, 0.45, 0.2, flat('#7c5433'), 0, 0.22, -D / 2 + 0.1); box(W, 0.4, 0.5, flat('#7c5433'), 0, WH + 0.1, -D / 2 - 0.1);
[-W / 2 + 0.15, -2.6, 1.3, W / 2 - 0.15].forEach(x => box(0.3, WH, 0.3, flat('#8a5d38'), x, WH / 2, -D / 2 + 0.12));
box(0.5, 0.4, D, flat('#7c5433'), -W / 2 - 0.1, WH + 0.1, 0); box(0.5, 0.4, D, flat('#7c5433'), W / 2 + 0.1, WH + 0.1, 0);

/* 창문 */
(() => {
  const g = new T.Group(); g.position.set(-5, 3.6, -D / 2 + 0.05); scene.add(g);
  const pane = new T.Mesh(new T.PlaneGeometry(2.6, 2.4), new T.MeshBasicMaterial({map: textTex(256, 240, (x, w, h) => { const gr = x.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, '#6db8f2'); gr.addColorStop(0.62, '#d4efff'); gr.addColorStop(0.63, '#7cc65a'); gr.addColorStop(1, '#5faf4c'); x.fillStyle = gr; x.fillRect(0, 0, w, h); x.fillStyle = '#2f8f4e'; [[40, 150, 26], [200, 146, 30], [120, 156, 20]].forEach(t => { x.beginPath(); x.moveTo(t[0], t[1] - t[2] * 2.4); x.lineTo(t[0] - t[2], t[1]); x.lineTo(t[0] + t[2], t[1]); x.fill(); }); x.fillStyle = '#fff'; x.beginPath(); x.arc(70, 50, 16, 0, 7); x.arc(92, 46, 20, 0, 7); x.arc(116, 52, 15, 0, 7); x.fill(); })})); g.add(pane);
  [[0, 1.28, 2.9, 0.18], [0, -1.28, 2.9, 0.18], [-1.38, 0, 0.18, 2.6], [1.38, 0, 0.18, 2.6], [0, 0, 0.1, 2.5], [0, 0, 2.7, 0.1]].forEach(f => box(f[2], f[3], 0.16, flat('#8a5d38'), f[0], f[1], 0.06, g));
  box(3.2, 0.14, 0.5, flat('#8a5d38'), 0, -1.42, 0.22, g);
  const pot = cyl(0.26, 0.2, 0.36, 8, flat('#d9734a'), -0.9, -1.16, 0.26, g);
  [0, 2.1, 4.2].forEach(a => { const l = new T.Mesh(new T.ConeGeometry(0.16, 0.6, 5), flat('#4bb062')); l.position.set(-0.9 + Math.cos(a) * 0.12, -0.72, 0.26 + Math.sin(a) * 0.12); l.rotation.z = Math.cos(a) * 0.4; l.rotation.x = Math.sin(a) * 0.4; g.add(l); });
})();

/* 모의시험 게시판 */
const boardPos = new T.Vector3(-0.65, 3.7, -D / 2 + 0.1);
(() => {
  const g = new T.Group(); g.position.copy(boardPos); scene.add(g);
  box(3.3, 2.5, 0.14, flat('#8a5d38'), 0, 0, 0, g); box(3.0, 2.2, 0.06, flat('#d9b07a'), 0, 0, 0.08, g);
  const paper = new T.Mesh(new T.PlaneGeometry(1.5, 1.95), new T.MeshLambertMaterial({map: textTex(300, 390, (x, w, h) => { x.fillStyle = '#fff'; x.fillRect(0, 0, w, h); x.fillStyle = '#1f3a5f'; x.font = '800 30px ' + F; x.textAlign = 'center'; x.fillText('COS Pro', w / 2, 46); x.font = '700 24px ' + F; x.fillText('실전 모의시험', w / 2, 82); x.strokeStyle = '#c9d2dc'; x.lineWidth = 4; for (let i = 0; i < 7; i++) { x.beginPath(); x.moveTo(30, 122 + i * 34); x.lineTo(w - 30 - (i % 3) * 40, 122 + i * 34); x.stroke(); } x.strokeStyle = '#e03131'; x.lineWidth = 7; x.beginPath(); x.arc(220, 320, 44, 0, 7); x.stroke(); x.fillStyle = '#e03131'; x.font = '900 34px ' + F; x.fillText('100', 220, 332); })}));
  paper.position.set(-0.6, 0, 0.13); paper.rotation.z = 0.04; g.add(paper);
  const memo = new T.Mesh(new T.PlaneGeometry(0.95, 0.95), new T.MeshLambertMaterial({map: textTex(190, 190, (x, w, h) => { x.fillStyle = '#ffe680'; x.fillRect(0, 0, w, h); x.fillStyle = '#5a4300'; x.font = '800 30px ' + F; x.textAlign = 'center'; x.fillText('시험까지', w / 2, 70); x.fillText('화이팅!', w / 2, 118); })}));
  memo.position.set(0.85, 0.45, 0.13); memo.rotation.z = -0.07; g.add(memo);
  const memo2 = new T.Mesh(new T.PlaneGeometry(0.8, 0.6), new T.MeshLambertMaterial({color: '#bfe3ff'})); memo2.position.set(0.9, -0.55, 0.13); memo2.rotation.z = 0.06; g.add(memo2);
  [[-0.6, 0.9], [0.85, 0.86], [0.9, -0.3]].forEach(p => { const pin = new T.Mesh(new T.SphereGeometry(0.07, 8, 6), lam('#e03131')); pin.position.set(p[0], p[1], 0.16); g.add(pin); });
})();

/* 책상, 노트북, 로봇 튜터 */
const deskPos = new T.Vector3(4.1, 0, -3.5), laptopPos = new T.Vector3(3.5, 2.75, -3.6);
let robot, screenMat;
(() => {
  const g = new T.Group(); g.position.copy(deskPos); scene.add(g);
  box(4.6, 0.2, 2, flat('#a8754a'), 0, 1.75, 0, g);
  [[-2.1, -0.8], [2.1, -0.8], [-2.1, 0.8], [2.1, 0.8]].forEach(p => box(0.22, 1.7, 0.22, flat('#7c5433'), p[0], 0.85, p[1], g));
  box(1.5, 1.1, 1.6, flat('#b98252'), 1.4, 1.1, 0, g); [1.35, 0.85].forEach(y => box(1.2, 0.34, 0.08, flat('#a8754a'), 1.4, y, 0.82, g));
  box(1.7, 0.1, 1.15, flat('#c9ced6'), -0.6, 1.9, 0.1, g);
  screenMat = new T.MeshBasicMaterial({map: textTex(340, 220, (x, w, h) => { x.fillStyle = '#13233f'; x.fillRect(0, 0, w, h); x.fillStyle = '#7fd1ff'; x.font = '900 46px ' + F; x.textAlign = 'center'; x.fillText('AI 과외', w / 2, 84); x.fillStyle = '#ffffff'; x.font = '700 22px ' + F; x.fillText('print("안녕!")', w / 2, 136); x.fillStyle = '#7ae582'; x.fillRect(60, 166, 220, 12); })});
  const lid = new T.Group(); lid.position.set(-0.6, 1.95, -0.45); lid.rotation.x = -0.22; g.add(lid);
  box(1.7, 1.15, 0.08, flat('#c9ced6'), 0, 0.57, 0, lid);
  const scr = new T.Mesh(new T.PlaneGeometry(1.52, 0.98), screenMat); scr.position.set(0, 0.58, 0.05); lid.add(scr);
  cyl(0.2, 0.16, 0.3, 8, flat('#f4f4f4'), -1.85, 2.0, 0.45, g);
  [['#e8593c', 0], ['#3f8fe4', 0.14], ['#f2b632', 0.28]].forEach(b => box(0.9, 0.13, 0.62, flat(b[0]), 1.55, 1.92 + b[1], -0.35, g).rotation.y = b[1] * 1.3);
  robot = new T.Group(); robot.position.set(0.75, 1.85, 0.2); g.add(robot);
  const rb = flat('#f1f5f9'), rd = flat('#5b7fb5');
  box(0.62, 0.6, 0.48, rb, 0, 0.36, 0, robot); box(0.78, 0.56, 0.56, rb, 0, 0.98, 0, robot);
  const eye = new T.MeshBasicMaterial({color: '#39c5ff'});
  [-0.17, 0.17].forEach(x => { const e = new T.Mesh(new T.SphereGeometry(0.085, 10, 8), eye); e.position.set(x, 1.02, 0.29); robot.add(e); });
  box(0.24, 0.05, 0.04, new T.MeshBasicMaterial({color: '#39c5ff'}), 0, 0.84, 0.29, robot);
  cyl(0.03, 0.03, 0.3, 5, rd, 0, 1.4, 0, robot); const tip = new T.Mesh(new T.SphereGeometry(0.08, 8, 6), new T.MeshBasicMaterial({color: '#ffb300'})); tip.position.set(0, 1.58, 0); robot.add(tip);
  robot.userData.arms = [-1, 1].map(s => { const p = new T.Group(); p.position.set(s * 0.37, 0.56, 0); robot.add(p); box(0.12, 0.42, 0.12, rd, 0, -0.18, 0, p); return p; });
  [-0.16, 0.16].forEach(x => box(0.18, 0.12, 0.26, rd, x, 0.03, 0.04, robot));
  const ch = new T.Group(); ch.position.set(-0.4, 0, 2.1); ch.rotation.y = 0.3; g.add(ch);
  box(1.3, 0.16, 1.3, flat('#d9573f'), 0, 1.1, 0, ch); box(1.3, 1.4, 0.16, flat('#d9573f'), 0, 1.85, 0.6, ch);
  [[-0.55, -0.55], [0.55, -0.55], [-0.55, 0.55], [0.55, 0.55]].forEach(p => box(0.14, 1.05, 0.14, flat('#7c5433'), p[0], 0.52, p[1], ch));
})();

/* 책장, 러그, 스탠드 */
(() => {
  const g = new T.Group(); g.position.set(-W / 2 + 0.75, 0, -1.6); scene.add(g);
  box(1.2, 5, 0.16, flat('#8a5d38'), 0, 2.5, -1.7, g); box(1.2, 5, 0.16, flat('#8a5d38'), 0, 2.5, 1.7, g); box(0.12, 5, 3.4, flat('#7c5433'), -0.55, 2.5, 0, g);
  const cols = ['#e8593c', '#3f8fe4', '#f2b632', '#4bb062', '#c79bf2', '#f59ac4', '#6cc4ee', '#ff8a70'];
  for (let s = 0; s < 4; s++) { box(1.2, 0.14, 3.4, flat('#8a5d38'), 0, 0.3 + s * 1.5, 0, g); let z = -1.45, k = s * 3; while (z < 1.3) { const w = 0.16 + ((k * 7) % 5) * 0.03, h = 0.8 + ((k * 5) % 4) * 0.12; if ((k + s) % 6 !== 5) box(0.8, h, w, flat(cols[k % cols.length]), 0.05, 0.37 + s * 1.5 + h / 2, z + w / 2, g); z += w + 0.04; k++; } }
  box(1.2, 0.14, 3.4, flat('#8a5d38'), 0, 5, 0, g);
  const rug = new T.Mesh(new T.CircleGeometry(3.1, 28).rotateX(-Math.PI / 2), lam('#e9a88a')); rug.position.set(-0.6, 0.02, 1.2); rug.receiveShadow = true; scene.add(rug);
  const rug2 = new T.Mesh(new T.RingGeometry(2.3, 2.6, 28).rotateX(-Math.PI / 2), lam('#fff1dc')); rug2.position.set(-0.6, 0.03, 1.2); scene.add(rug2);
  cyl(0.5, 0.6, 0.14, 12, flat('#5a4633'), 5.6, 0.07, -1.5); cyl(0.07, 0.07, 4, 6, flat('#5a4633'), 5.6, 2.1, -1.5);
  const shade = new T.Mesh(new T.CylinderGeometry(0.5, 0.9, 1, 12, 1, true), new T.MeshStandardMaterial({color: '#ffe2a8', emissive: '#ffb65c', emissiveIntensity: 0.8, side: T.DoubleSide})); shade.position.set(5.6, 4.3, -1.5); scene.add(shade);
  const pg = new T.Group(); pg.position.set(-5.4, 0, 3.4); scene.add(pg);
  cyl(0.55, 0.42, 0.8, 8, flat('#d9734a'), 0, 0.4, 0, pg);
  for (let i = 0; i < 6; i++) { const a = i / 6 * Math.PI * 2, l = new T.Mesh(new T.ConeGeometry(0.28, 1.8, 5), flat(i % 2 ? '#3aa35a' : '#4bb062')); l.position.set(Math.cos(a) * 0.3, 1.5, Math.sin(a) * 0.3); l.rotation.z = -Math.cos(a) * 0.5; l.rotation.x = Math.sin(a) * 0.5; l.castShadow = true; pg.add(l); }
})();

/* 탐험가 */
const hero = new T.Group(); scene.add(hero); const H = {arms: []};
(() => {
  const skin = lam('#ffd9b0'), dark = lam('#4a3626'), cloth = lam(COLORS[S.color] || COLORS[0]), hairMat = lam('#5a3a22');
  const mk = (geo, mat, x, y, z, parent) => { const m = new T.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = true; (parent || hero).add(m); return m; };
  mk(new T.CapsuleGeometry(0.33, 0.42, 4, 10), cloth, 0, 1.0, 0); mk(new T.BoxGeometry(0.5, 0.52, 0.26), lam('#a8754a'), 0, 1.06, -0.36);
  mk(new T.SphereGeometry(0.34, 16, 12), skin, 0, 1.72, 0);
  mk(new T.SphereGeometry(0.045, 8, 6), dark, -0.12, 1.75, 0.31); mk(new T.SphereGeometry(0.045, 8, 6), dark, 0.12, 1.75, 0.31);
  mk(new T.SphereGeometry(0.05, 8, 6), lam('#ff9c8a'), -0.21, 1.66, 0.25); mk(new T.SphereGeometry(0.05, 8, 6), lam('#ff9c8a'), 0.21, 1.66, 0.25);
  [[-0.17, 0.62, 1], [0.17, 0.62, 1], [-0.44, 1.28, 0], [0.44, 1.28, 0]].forEach(d => {
    const piv = new T.Group(); piv.position.set(d[0], d[1], 0); hero.add(piv);
    mk(new T.CapsuleGeometry(d[2] ? 0.12 : 0.095, d[2] ? 0.36 : 0.34, 3, 8), d[2] ? lam('#3f4c6b') : cloth, 0, d[2] ? -0.3 : -0.26, 0, piv);
    if (d[2]) mk(new T.BoxGeometry(0.2, 0.12, 0.32), dark, 0, -0.58, 0.05, piv); else { mk(new T.SphereGeometry(0.1, 8, 6), skin, 0, -0.5, 0, piv); H.arms.push(piv); }
  });
  const hr = new T.Group(); hr.position.set(0, 1.72, 0); hero.add(hr);
  const add = (geo, x, y, z) => { const m = new T.Mesh(geo, hairMat); m.position.set(x, y, z); m.castShadow = true; hr.add(m); };
  add(new T.SphereGeometry(0.37, 16, 10, 0, 6.29, 0, 1.75), 0, 0.03, -0.03);
  if (S.hair === 1) { add(new T.BoxGeometry(0.16, 0.42, 0.5), -0.31, -0.12, -0.05); add(new T.BoxGeometry(0.16, 0.42, 0.5), 0.31, -0.12, -0.05); add(new T.BoxGeometry(0.6, 0.42, 0.16), 0, -0.12, -0.3); }
  if (S.hair === 2) { add(new T.SphereGeometry(0.17, 10, 8), 0, 0.12, -0.42); add(new T.SphereGeometry(0.13, 10, 8), 0, -0.1, -0.5); }
  if (S.hair === 3) { add(new T.SphereGeometry(0.16, 10, 8), -0.4, 0.02, -0.08); add(new T.SphereGeometry(0.16, 10, 8), 0.4, 0.02, -0.08); add(new T.SphereGeometry(0.11, 10, 8), -0.44, -0.22, -0.08); add(new T.SphereGeometry(0.11, 10, 8), 0.44, -0.22, -0.08); }
})();
hero.scale.setScalar(1.55); hero.position.set(-0.8, 0.02, 1.3); hero.rotation.y = 0.35;

/* 누를 수 있는 곳 */
const SPOTS = [
  {id: 'tutor', name: 'AI 과외', sub: '노트북', v: new T.Vector3(deskPos.x - 0.6, 4.1, deskPos.z - 0.4), tag: 'COS Pro 2·3급', desc: '로봇 튜터와 함께 COS Pro 문제를 풀어요. 막히면 힌트를 물어볼 수 있어요.', btn: 'AI 과외 열기', focus: [3.4, 2.6, -3.4]},
  {id: 'exam', name: '실전 모의시험', sub: '게시판', v: new T.Vector3(boardPos.x, boardPos.y + 1.55, boardPos.z), tag: 'COS Pro 2·3급', desc: '실제 시험과 같은 화면에서 시간을 재며 연습해요.', btn: '모의시험 시작', focus: [-0.65, 3.4, -4.4]}
];
let selected = null, leaving = false;
SPOTS.forEach(sp => { const b = document.createElement('button'); b.className = 'pin'; b.innerHTML = '<b></b><small></small>'; b.children[0].textContent = sp.name; b.children[1].textContent = sp.sub; b.addEventListener('click', () => select(sp.id)); $('pins').appendChild(b); sp.el = b; });
function button(cls, text, fn) { const b = document.createElement('button'); b.className = 'btn ' + cls; b.textContent = text; b.addEventListener('click', fn); return b; }
function select(id) {
  if (leaving) return; if (selected === id) { closeCard(); return; }
  selected = id; const sp = SPOTS.find(s => s.id === id), box = $('cBtns');
  SPOTS.forEach(s => s.el.classList.toggle('on', s.id === id));
  $('cTag').textContent = sp.tag; $('cTitle').textContent = sp.name; $('cDesc').textContent = sp.desc;
  box.innerHTML = ''; box.appendChild(button('go', sp.btn, () => window.open(encodeURI(LINKS[id]), '_blank'))); box.appendChild(button('sub', '닫기', closeCard));
  $('card').classList.add('show'); $('say').textContent = id === 'tutor' ? '같이 문제 풀어 볼까?' : '실전처럼 도전해 봐!';
}
function closeCard() { selected = null; SPOTS.forEach(s => s.el.classList.remove('on')); $('card').classList.remove('show'); $('say').textContent = '어서 와! 하고 싶은 것을 눌러 봐.'; }
$('worldBtn').addEventListener('click', () => { if (leaving) return; leaving = true; $('fade').classList.add('on'); setTimeout(() => { location.href = '시작.html?map=1'; }, 550); });

function resize() { const w = window.innerWidth, h = window.innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
window.addEventListener('resize', resize); resize();
const clock = new T.Clock(), camPos = new T.Vector3(), camLook = new T.Vector3(), tp = new T.Vector3(), tl = new T.Vector3(), tmp = new T.Vector3();
let time = 0, snap = true, viewShift = 0;
function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.05); time += dt;
  const w = window.innerWidth, h = window.innerHeight, k = Math.max(1, 1.45 / camera.aspect), sway = Math.sin(time * 0.25) * 0.5;
  if (selected) { const f = SPOTS.find(s => s.id === selected).focus; tp.set(f[0] * 0.55 + sway * 0.3, 4.2, 6.5 * k); tl.set(f[0], f[1], f[2]); }
  else { tp.set(sway, 7.2, 15.5 * k); tl.set(0, 2.4, -1.5); }
  const kf = snap ? 1 : 1 - Math.exp(-dt * 2.6); camPos.lerp(tp, kf); camLook.lerp(tl, kf); snap = false;
  camera.position.copy(camPos); camera.lookAt(camLook);
  const shiftT = selected && w > 720 ? 0.14 : 0; viewShift += (shiftT - viewShift) * Math.min(1, dt * 3);
  if (Math.abs(viewShift) > 0.002) camera.setViewOffset(w, h, w * viewShift, 0, w, h); else camera.clearViewOffset();
  camera.updateMatrixWorld();
  robot.position.y = 1.85 + Math.abs(Math.sin(time * 2.4)) * 0.06; robot.rotation.y = Math.sin(time * 0.9) * 0.35 - 0.25;
  robot.userData.arms.forEach((a, i) => { a.rotation.z = (i ? 1 : -1) * (0.25 + Math.sin(time * 3 + i) * 0.25); });
  lamp.intensity = 26 + Math.sin(time * 7) * 1.2; glow.intensity = 9 + Math.sin(time * 2) * 1.5;
  hero.position.y = 0.02 + Math.sin(time * 2) * 0.02; H.arms.forEach((a, i) => { a.rotation.x = Math.sin(time * 2 + i) * 0.08; });
  const want = selected === 'tutor' ? 0.95 : selected === 'exam' ? 0.0 : 0.35; hero.rotation.y += (want - hero.rotation.y) * Math.min(1, dt * 4);
  SPOTS.forEach(sp => { tmp.copy(sp.v).project(camera); sp.el.style.display = leaving ? 'none' : 'block'; sp.el.style.left = ((tmp.x * 0.5 + 0.5) * w) + 'px'; sp.el.style.top = ((-tmp.y * 0.5 + 0.5) * h - 8) + 'px'; });
  renderer.render(scene, camera);
}
frame();
})();
</script>
