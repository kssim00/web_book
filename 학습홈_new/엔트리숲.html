<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>엔트리 숲 · 코딩 탐험대</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="favicon-180.png">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#bfe6f3;font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#22331b}
button{font:inherit;cursor:pointer}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:fixed;left:0;right:0;top:0;padding:14px 18px;display:flex;align-items:center;gap:10px;pointer-events:none;z-index:6}
.hud>*{pointer-events:auto}
.pill{background:rgba(255,255,255,.93);border:0;border-radius:999px;padding:8px 16px;font-weight:800;font-size:15px;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.logo{font-weight:900;font-size:19px;color:#fff;text-shadow:0 2px 6px rgba(0,40,10,.35)}
.sp{flex:1}
.seg{display:flex;gap:3px;padding:3px;border-radius:999px;background:rgba(20,32,14,.78);box-shadow:0 2px 10px rgba(0,0,0,.15)}
.seg button{border:0;border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:800;color:#d8e6cc;background:transparent}
.seg button.on{background:#8bd450;color:#173404}
.zoom{position:fixed;right:18px;top:50%;transform:translateY(-50%);z-index:6;display:flex;flex-direction:column;align-items:center;gap:8px;background:rgba(255,255,255,.9);border-radius:999px;padding:10px 8px;box-shadow:0 4px 14px rgba(0,0,0,.14)}
.zoom button{border:0;width:36px;height:36px;border-radius:50%;background:#f1f6ea;font-size:17px;font-weight:900;color:#2c5a0f}
.zoom input{writing-mode:vertical-lr;direction:rtl;height:140px;width:22px;accent-color:#5aa62a}
.zoom small{font-size:11px;font-weight:800;color:#5b7a48}
body.card-on .zoom{right:auto;left:18px}
#pins{position:fixed;inset:0;pointer-events:none;z-index:4}
.lb{position:absolute;left:0;top:0;transform:translate(-50%,-100%);white-space:nowrap;border:0;pointer-events:auto;font-weight:800;box-shadow:0 3px 10px rgba(20,50,10,.18)}
.lb.m{background:rgba(255,255,255,.95);border-radius:10px;padding:4px 9px;font-size:12.5px;color:#2c4a1a}
.lb.m b{color:#5aa62a;margin-right:4px}
.lb.m.done{background:#fff0e0}.lb.m.done b{color:#e07a2a}
.lb.m.now{background:#fff3c4;font-size:14px;padding:6px 12px}
.lb.m.rev b{color:#2a8a7a}.lb.m.ai b{color:#6a5acd}
.lb.m.sel{outline:2px solid #ff8f5a}
.lb.lm{background:#2c3a22;color:#fff;border-radius:999px;padding:5px 12px;font-size:13px;pointer-events:none}
.lb.lm.gate{background:#c79a2a;pointer-events:auto}.lb.lm.ai{background:#5b4bc4}
.lb.me{background:#ff8f5a;color:#fff;border-radius:999px;padding:4px 10px;font-size:12px;pointer-events:none}
.lb.hide{display:none}
.lb.tip{background:#ff8f5a;color:#fff;border-radius:999px;padding:6px 13px;font-size:14px;pointer-events:none;animation:tipb 1s ease-in-out infinite}
.lb.tip:after{content:'';position:absolute;left:50%;bottom:-7px;margin-left:-7px;border:7px solid transparent;border-bottom:0;border-top-color:#ff8f5a}
@keyframes tipb{50%{margin-top:-6px}}
.cont{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:5;border:0;border-radius:999px;padding:14px 28px;font-size:17px;font-weight:900;color:#fff;background:linear-gradient(90deg,#ff7f50,#ffb347);box-shadow:0 10px 26px rgba(200,90,20,.35);text-align:center;line-height:1.2}
.cont small{display:block;font-size:12.5px;font-weight:700;opacity:.92;margin-top:3px}
.mebtn{position:fixed;left:18px;bottom:20px;z-index:5}
body.card-on .cont{display:none}
.card{position:fixed;right:18px;top:72px;width:min(360px,calc(100vw - 36px));background:rgba(255,253,247,.98);border-radius:22px;box-shadow:0 14px 40px rgba(20,40,10,.25);padding:18px 18px 16px;transform:translateX(120%);transition:transform .35s ease;z-index:7}
.card.show{transform:none}
.card .x{position:absolute;right:12px;top:12px;border:0;background:#eef2e8;border-radius:999px;width:30px;height:30px;font-size:15px}
.tag{display:inline-block;font-size:12px;font-weight:800;border-radius:999px;padding:3px 10px;background:#d9efc4;color:#2c5a0f}
.tag.ai{background:#e4defc;color:#3c2f8f}.tag.gate{background:#fff0c2;color:#7a5600}.tag.rev{background:#d6f1e8;color:#1f6a5a}.tag.done{background:#ffe2c7;color:#9a4a08}
.card h2{margin:8px 0 4px;font-size:20px;line-height:1.35}
.card p{margin:4px 0 0;font-size:13.5px;line-height:1.6;color:#4b5a40}
.card .dev{font-size:13px;margin-top:6px;color:#8a2a2a;font-weight:700}
.cb{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.btn{border:0;border-radius:999px;padding:12px 18px;font-weight:800;font-size:15px}
.btn.go{background:linear-gradient(90deg,#ff8f5a,#ffb347);color:#fff}
.btn.sub{background:#eef2e8;color:#3d5230}
.btn.ok{background:#5aa62a;color:#fff}
.btn.t{background:#fff3c4;color:#7a5600}
.toast{position:fixed;left:50%;top:72px;transform:translateX(-50%);background:rgba(30,45,22,.94);color:#fff;padding:11px 20px;border-radius:999px;font-size:14.5px;font-weight:700;opacity:0;transition:opacity .3s;pointer-events:none;z-index:9;white-space:nowrap}
.toast.show{opacity:1}
.nogl{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:24px;font-size:18px;line-height:1.7;background:#f4f8ec;z-index:20}
@media (max-width:720px){.seg button{padding:6px 9px}.logo{display:none}.card{top:auto;bottom:12px}}
.pv{position:fixed;inset:0;background:rgba(15,30,10,.62);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
.pv.show{display:flex}
.pv .box{background:#f7fbf1;border-radius:22px;width:min(860px,100%);height:min(700px,100%);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.35)}
.pv .top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px 10px 18px;font-weight:800;font-size:16px;background:#fff}
.pv .top button{border:0;background:#eef2e8;border-radius:999px;padding:8px 14px;font-weight:700}
.pv iframe{flex:1;border:0;width:100%;background:#fff}
.pv .none{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#5b6b50;font-size:15px;text-align:center;padding:20px}
.pv .none b{font-size:44px}
.pv .bot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;background:#fff;font-size:13.5px;color:#5b6b50}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="pins"></div>
<div class="hud">
  <span class="logo">🌲 엔트리 숲</span>
  <span class="pill" id="who"></span>
  <span class="pill">⭐ <span id="stars">0</span></span>
  <span class="sp"></span>
  <div class="seg" id="seg"><button data-v="A">🌲 숲길</button><button data-v="C">🎲 보드판</button></div>
  <button class="pill" id="worldBtn">🌍 세계 지도</button>
</div>
<div class="zoom"><small>가까이</small><button id="zin" title="가까이">＋</button><input type="range" id="zr" min="0" max="100" value="0" aria-label="확대·축소"><button id="zout" title="멀리">－</button><small>전체</small></div>
<button class="pill mebtn" id="meBtn">🧍 내 위치</button>
<button class="cont" id="contBtn"></button>
<aside class="card" id="card"><button class="x" id="cClose" aria-label="닫기">✕</button><span class="tag" id="cTag"></span><h2 id="cTitle"></h2><p id="cDesc"></p><div class="dev" id="cDev"></div><div class="cb" id="cBtns"></div></aside>
<div class="toast" id="toast"></div>
<div class="pv" id="pv"><div class="box">
  <div class="top"><span id="pvTitle"></span><button id="pvClose">닫기 ✕</button></div>
  <iframe id="pvFrame" title="미리 해보기"></iframe>
  <div class="none" id="pvNone"><b>🎬</b>이 미션은 미리 해보기를 준비 중이에요.<br>미션지에서 바로 시작해요!</div>
  <div class="bot"><span id="pvDev">완성된 모습을 먼저 해 보고, 미션지로 만들어 봐요.</span><button class="btn go" id="pvGo">📄 미션지 열기</button></div>
</div></div>
<div class="nogl" id="nogl">이 컴퓨터에서는 3D 화면을 띄울 수 없어요.</div>
<script src="lib/three.min.js"></script>

<script>

$('zin').addEventListener('click', () => { zoomT = Math.max(0, zoomT - .25); }); $('zout').addEventListener('click', () => { zoomT = Math.min(1, zoomT + .25); });
addEventListener('wheel', e => { if (e.target.closest && e.target.closest('.card, .pv')) return; zoomT = Math.max(0, Math.min(1, zoomT + e.deltaY * .0012)); }, {passive: true});
function resize() { renderer.setSize(innerWidth, innerHeight, false); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

/* 처음 */
build(VIEW);
const Q = new URLSearchParams(location.search), DONE = Q.get('done'), AT = Q.get('at');
if (DONE && IDX[DONE] !== undefined) { placeAt(IDX[DONE]); setTimeout(() => finish(DONE), 800); }
else if (AT && IDX[AT] !== undefined) { placeAt(IDX[AT]); showCard(IDX[AT]); }
else { const ni = nowIdx(); placeAt(ni >= 0 ? ni : N - 1); }
if (DONE || AT) history.replaceState(null, '', location.pathname);
S.place = 'forest'; save();

const clock = new T.Clock(), tmp = new T.Vector3(), dir = new T.Vector3(0, 0, -1), cp = new T.Vector3(), cl = new T.Vector3(), cpT = new T.Vector3(), clT = new T.Vector3(); let time = 0;
function frame() {
  requestAnimationFrame(frame); const dt = Math.min(clock.getDelta(), .05); time += dt;
  let moving = false;
  if (walking) { keyBack = false; const sp = 20 / curve.getLength() * dt, d = walking.to - hu; if (Math.abs(d) <= sp) { hu = walking.to; heroI = walking.i; const f = walking.then; walking = null; if (f) f(); } else { hu += Math.sign(d) * sp; moving = true; } }
  else if (keyDir) { const sp = 20 / curve.getLength() * dt, lo = Math.min.apply(null, U), hi = Math.max.apply(null, U), nu = Math.max(lo, Math.min(hi, hu + keyDir * sp)); moving = nu !== hu; hu = nu; keyBack = keyDir < 0; }
  const p = curve.getPointAt(Math.max(0, Math.min(1, hu))), t = curve.getTangentAt(Math.max(0, Math.min(1, hu))).setY(0).normalize();
  if (walking ? walking.to < hu : keyBack) t.negate();
  dir.lerp(t, snap ? 1 : .1).normalize(); hero.position.set(p.x, HEIGHT(p.x, p.z) + (VIEW === 'C' ? 1.3 : .2) + (moving ? Math.abs(Math.sin(time * 10)) * .15 : 0), p.z); hero.rotation.y = Math.atan2(dir.x, dir.z);
  H.legs.forEach((l, i) => { l.rotation.x = moving ? Math.sin(time * 10 + i * Math.PI) * .6 : 0; }); H.arms.forEach((a, i) => { a.rotation.x = moving ? Math.sin(time * 10 + i * Math.PI + Math.PI) * .5 : Math.sin(time * 2 + i) * .06; });
  /* 카메라: 0 = 탐험가 뒤, 1 = 숲 전체 */
  zoom += (zoomT - zoom) * (snap ? 1 : Math.min(1, dt * 3)); $('zr').value = Math.round(zoomT * 100);
  const z = zoom * zoom * (3 - 2 * zoom), side = new T.Vector3(-dir.z, 0, dir.x), cardOn = sel >= 0 && innerWidth > 720;
  const fP = hero.position.clone().addScaledVector(dir, -15).addScaledVector(side, cardOn ? 7 : 3).add(new T.Vector3(0, 9, 0)), fL = hero.position.clone().addScaledVector(dir, 8).addScaledVector(side, cardOn ? 7 : 0).add(new T.Vector3(0, 2, 0));
  const span = Math.max(EXT.x, EXT.z * 1.3) + 40, oL = CENTER.clone(), oP = oL.clone().add(new T.Vector3(0, span * 1.05, span * .62));
  if (cardOn) { oL.x += span * .12; oP.x += span * .12; }
  yaw += (yawT - yaw) * Math.min(1, dt * 10); pit += (pitT - pit) * Math.min(1, dt * 10);
  { const hp = hero.position, cs = Math.cos(yaw), sn = Math.sin(yaw), rot = (v, c) => { const dx = v.x - c.x, dz = v.z - c.z; v.x = c.x + dx * cs - dz * sn; v.z = c.z + dx * sn + dz * cs; };
    fP.y = hp.y + 9 * pit; const k = 1 / Math.sqrt(pit); fP.x = hp.x + (fP.x - hp.x) * k; fP.z = hp.z + (fP.z - hp.z) * k; rot(fP, hp); rot(fL, hp); rot(oP, oL); }
  cpT.copy(fP).lerp(oP, z); clT.copy(fL).lerp(oL, z);
  if (snap) { cp.copy(cpT); cl.copy(clT); snap = false; } else { cp.lerp(cpT, Math.min(1, dt * 5)); cl.lerp(clT, Math.min(1, dt * 5)); }
  cam.position.copy(cp); cam.lookAt(cl);
  const ni = nowIdx();
  signs.forEach(s => { if (s.ring && s.ring.visible) s.ring.scale.setScalar(1 + Math.sin(time * 4) * .12); if (s.board) s.board.position.y = s.i === ni ? 3.75 + Math.abs(Math.sin(time * 3.2)) * .45 : 3.6; if (s.glow && s.glow.visible) s.glow.material.opacity = .55 + Math.sin(time * 3) * .25; });
  lms.forEach(l => { if (l.g.userData.spin) l.g.userData.spin.rotation.y = time; });
  for (let k = spark.length - 1; k >= 0; k--) { const s = spark[k]; s.userData.v.y -= 30 * dt; s.position.addScaledVector(s.userData.v, dt); s.rotation.x += dt * 6; s.userData.l -= dt; if (s.userData.l <= 0) { scene.remove(s); spark.splice(k, 1); } }
  renderer.render(scene, cam);
  /* 이름표: 가까이선 주변 미션, 멀리선 랜드마크·관문·지금 */
  const W = innerWidth, Hh = innerHeight, far = z > .45;
  pinEls.forEach(e => {
    const pos = e.kind === 'm' ? signs[e.i].g.position : e.kind === 'lm' ? e.lm.g.position : e.s.g.position, top = e.kind === 'm' ? signs[e.i].top + 1.5 : e.kind === 'lm' ? e.lm.top : e.s.top;
    tmp.set(pos.x, pos.y + top, pos.z); const dist = tmp.distanceTo(cam.position); tmp.project(cam);
    let show = tmp.z < 1 && tmp.x > -1.1 && tmp.x < 1.1 && tmp.y > -1.1 && tmp.y < .88;
    if (e.kind === 'm') { show = show && (far ? e.i === ni || e.i === sel : dist > 45 && dist < 110); e.b.classList.toggle('now', e.i === ni); e.b.classList.toggle('done', isDone(e.i)); }
    else if (!far) show = show && dist < 120;
    e.b.classList.toggle('hide', !show); e.b.style.left = ((tmp.x * .5 + .5) * W) + 'px'; e.b.style.top = ((-tmp.y * .5 + .5) * Hh) + 'px';
  });
  { let tv = false; if (!S.entry.tapped && ni >= 0 && !L[ni].gate && !far && sel < 0 && !walking && !(VIEW === 'C' && Math.abs(hu - U[ni]) < 1e-4)) { const sg = signs[ni]; tmp.set(sg.g.position.x, sg.g.position.y + (VIEW === 'C' ? 4 : sg.top + .2), sg.g.position.z); tipEl.textContent = VIEW === 'C' ? '👆 칸을 눌러 보세요' : '👆 팻말을 눌러 보세요'; const d = tmp.distanceTo(cam.position); tmp.project(cam); tv = tmp.z < 1 && d < 70 && Math.abs(tmp.x) < 1 && Math.abs(tmp.y) < .9; tipEl.style.left = ((tmp.x * .5 + .5) * W) + 'px'; tipEl.style.top = ((-tmp.y * .5 + .5) * Hh) + 'px'; } tipEl.classList.toggle('hide', !tv); }
  tmp.copy(hero.position); tmp.y += 6; tmp.project(cam); meEl.style.left = ((tmp.x * .5 + .5) * W) + 'px'; meEl.style.top = ((-tmp.y * .5 + .5) * Hh) + 'px'; meEl.classList.toggle('hide', !far);
}
frame();
})();
