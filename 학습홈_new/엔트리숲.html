<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>엔트리 숲 · 코딩 탐험대</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">

<style>

button{font:inherit;cursor:pointer}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

.hud>*{pointer-events:auto}
.pill{background:rgba(255,255,255,.93);border:0;border-radius:999px;padding:8px 16px;font-weight:800;font-size:15px;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.logo{font-weight:900;font-size:19px;color:#fff;text-shadow:0 2px 6px rgba(0,40,10,.35)}
.sp{flex:1}

.seg button{border:0;border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:800;color:#d8e6cc;background:transparent}
.seg button.on{background:#8bd450;color:#173404}
.zoom{position:fixed;right:18px;top:50%;transform:translateY(-50%);z-index:6;display:flex;flex-direction:column;align-items:center;gap:8px;background:rgba(255,255,255,.9);border-radius:999px;padding:10px 8px;box-shadow:0 4px 14px rgba(0,0,0,.14)}
.zoom button{border:0;width:36px;height:36px;border-radius:50%;background:#f1f6ea;font-size:17px;font-weight:900;color:#2c5a0f}

.zoom small{font-size:11px;font-weight:800;color:#5b7a48}

#pins{position:fixed;inset:0;pointer-events:none;z-index:4}
.lb{position:absolute;left:0;top:0;transform:translate(-50%,-100%);white-space:nowrap;border:0;pointer-events:auto;font-weight:800;box-shadow:0 3px 10px rgba(20,50,10,.18)}
.lb.m{background:rgba(255,255,255,.95);border-radius:10px;padding:4px 9px;font-size:12.5px;color:#2c4a1a}
.lb.m b{color:#5aa62a;margin-right:4px}
.lb.m.done{background:#fff0e0}.lb.m.done b{color:#e07a2a}
.lb.m.now{background:#fff3c4;font-size:14px;padding:6px 12px}
.lb.m.rev b{color:#2a8a7a}.lb.m.ai b{color:#6a5acd}
.lb.m.sel{outline:2px solid #ff8f5a}
.lb.lm{background:#2c3a22;color:#fff;border-radius:999px;padding:5px 12px;font-size:13px;pointer-events:none}
.lb.lm.gate{background:#c79a2a;pointer-events:auto}.lb.lm.ai{background:#5b4bc4}
.lb.me{background:#ff8f5a;color:#fff;border-radius:999px;padding:4px 10px;font-size:12px;pointer-events:none;transform:translate(-50%,5px)}
.lb.hide{display:none}
.lb.tip{background:#ff8f5a;color:#fff;border-radius:999px;padding:6px 13px;font-size:14px;pointer-events:none;animation:tipb 1s ease-in-out infinite}
.lb.tip:after{content:'';position:absolute;left:50%;bottom:-7px;margin-left:-7px;border:7px solid transparent;border-bottom:0;border-top-color:#ff8f5a}
@keyframes tipb{50%{margin-top:-6px}}
.cont{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:5;border:0;border-radius:999px;padding:14px 28px;font-size:17px;font-weight:900;color:#fff;background:linear-gradient(90deg,#ff7f50,#ffb347);box-shadow:0 10px 26px rgba(200,90,20,.35);text-align:center;line-height:1.2}

.mebtn{position:fixed;left:18px;bottom:20px;z-index:5}

.card.show{transform:none}
.card .x{position:absolute;right:12px;top:12px;border:0;background:#eef2e8;border-radius:999px;width:30px;height:30px;font-size:15px}

.cb{display:flex;flex-direction:column;gap:8px;margin-top:14px}

.btn.sub{background:#eef2e8;color:#3d5230}
