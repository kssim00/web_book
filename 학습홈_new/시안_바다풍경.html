<!DOCTYPE html>
<html lang="ko">
<head>

<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>

.zoom input{writing-mode:vertical-lr;direction:rtl;height:150px;width:22px;accent-color:#2f8fd0}

.lb.z{background:#123a55;color:#fff}.lb.z.rest{background:#d9662f}.lb.z.gate{background:#c79a2a}.lb.z.game{background:#e0503a}

</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="pins"></div>
<div class="hud">
  <span class="pill">🌊 스크래치 바다 · 풍경 시안</span>
  <div class="seg" id="seg"><button data-v="A">A. 해안선 길</button><button data-v="B">B. 해안선 + 주변만</button><button data-v="C">C. 섬 잇기</button></div>
</div>

<div class="info" id="info"></div>
<script src="lib/three.min.js"></script>
<script src="lib/scratch_course.js"></script>
<script>
(() => {
const $ = id => document.getElementById(id), T = THREE;
const DESC = {
  A: '<b>A. 해안선 길</b> — 큰 만(바닷가)을 따라 길이 한 줄로 이어져요. 바다 쪽은 모래사장, 안쪽은 언덕·야자수, 멀리 산과 수평선. 구역마다 풍경이 달라요(모래사장 → 쉼터 → 바위 해안 → 게임 섬).',
  B: '<b>B. 해안선 + 주변만</b> — A와 같지만 가까이 볼 때 <b>지금 위치 앞뒤 미션만</b> 팻말이 보여서 화면이 깔끔해요. 멀리 보면 팻말 대신 구역 이름만.',
  C: '<b>C. 섬 잇기</b> — 미션 5~8개마다 <b>섬 하나</b> (책 구분 없이 순서대로). 섬 안은 모래길, 섬 사이는 나무다리. 쉼터·관문·게임 섬·오락실만 표지(해먹, 아치, 등대, 관람차)로 알려 줘요.'
};
/* 미션 목록 */
const L = [];
SCRATCH_COURSE.forEach((n, ni) => { if (n.zone === 'gate') L.push({id: n.id, no: '관문', t: n.title, node: ni, zone: 'gate'}); else n.ms.forEach(m => L.push({id: m[0], no: m[1], t: m[2], node: ni, zone: n.zone})); });
const N = L.length, NODES = SCRATCH_COURSE;
let rs = 11; const rnd = () => (rs = (rs * 16807) % 2147483647) / 2147483647, rr = (a, b) => a + (b - a) * rnd();
const smooth = (a, b, x) => { const t = Math.max(0, Math.min(1, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
const noise = (x, z) => Math.sin(x * .045 + 1.3) * Math.cos(z * .052) + .35 * Math.sin(x * .093 + Math.cos(z * .07) * 2) * Math.cos(z * .081 + Math.sin(x * .05)) + .18 * Math.sin(x * .21 - z * .17 + Math.sin(z * .05) * 3);
const flat = (c, o) => new T.MeshStandardMaterial(Object.assign({color: c, flatShading: true, roughness: .92, metalness: 0}, o || {}));

const renderer = new T.WebGLRenderer({canvas: $('gl'), antialias: true});
renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1)); renderer.shadowMap.enabled = true; renderer.shadowMap.type = T.PCFSoftShadowMap;
const cam = new T.PerspectiveCamera(50, 1, .5, 3000);
let scene, curve, U, P, H, signs, zoneLb, hero, HL, water, wBase, VAR = 'A', WORLD;
let hu = 0, heroI = 0, walking = null, zoom = 0, zoomT = 0, snap = true;

/* ── 길 모양 ── */
function layoutA() {
  /* 큰 만(灣)을 따라가는 해안선: 바다는 만 안쪽(중심), 땅은 바깥 */
  const R = 250, a0 = -2.15, a1 = 2.15, pts = [];
  for (let i = 0; i < N; i++) { const t = i / (N - 1), a = a0 + (a1 - a0) * t, r = R + 9 + Math.sin(i * .5) * 4 + Math.sin(i * .17) * 7; pts.push(new T.Vector3(Math.sin(a) * r, 0, -Math.cos(a) * r + 120)); }
  const C = new T.Vector2(0, 120);
  const shoreR = x => R - 14 + Math.sin(x * 3) * 4;
  H = (x, z) => { const dx = x - C.x, dz = z - C.y, d = Math.hypot(dx, dz), ang = Math.atan2(dx, -dz), sr = shoreR(ang);
    const land = smooth(sr - 16, sr + 2, d); let h = -4 + land * 4.4 + smooth(sr + 22, sr + 130, d) * (11 + noise(x, z) * 7) + smooth(sr + 6, sr + 24, d) * (noise(x * 1.7, z * 1.7) + 1) * .7;
    /* 만 입구(남쪽, 화면 앞쪽)는 바다로 열림 */ if (dz > R * .5) h = Math.min(h, -4 + 8 * (1 - smooth(R * .5, R * .62, dz)) * smooth(R * .35, R * .6, Math.abs(dx)));
    return h; };
  WORLD = {center: new T.Vector3(0, 0, 120), span: 640, sea: (x, z) => Math.hypot(x - C.x, z - C.y) < R - 20};
  return pts;
}
function layoutC() {
  /* 섬은 책과 상관없이 미션 5~8개씩 묶음. 섬을 큰 호 위에 놓고 섬 안은 S자 모래길, 섬 사이는 나무다리 */
  const SZ = [6, 7, 5, 8, 6, 7, 5, 6, 8, 6, 7, 5, 6, 7], cnt = []; let left = N, k = 0;
  while (left > 0) { let m = Math.min(left, SZ[k % SZ.length]); if (left - m > 0 && left - m < 4) m = left; cnt.push(m); left -= m; k++; }
  const R = 330, a0 = -2.35, a1 = 2.35, rad = cnt.map(m => 17 + m * 3.6 + (m % 2) * 3), tot = rad.reduce((a, b) => a + b * 2 + 14, 0);
  let acc = 0; const isl = [];
  cnt.forEach((m, k) => { const w = rad[k] * 2 + 14, a = a0 + (a1 - a0) * (acc + w / 2) / tot; acc += w; isl.push({x: Math.sin(a) * R + Math.sin(k * 2.1) * 14, z: -Math.cos(a) * R + 120 + Math.cos(k * 1.7) * 14, r: rad[k], a, m}); });
  const pts = [];
  isl.forEach((s, k) => { const ox = Math.sin(s.a), oz = -Math.cos(s.a), bx = Math.cos(s.a), bz = Math.sin(s.a), flip = k % 2 ? 1 : -1;
    for (let j = 0; j < s.m; j++) { const t = s.m === 1 ? .5 : j / (s.m - 1), u = (t - .5) * 2, w = Math.sin(u * Math.PI) * s.r * .34 * flip; pts.push(new T.Vector3(s.x + bx * u * s.r * .66 + ox * w, 0, s.z + bz * u * s.r * .66 + oz * w)); } });
  H = (x, z) => { let h = -4.5; isl.forEach(s => { const d = Math.hypot(x - s.x, z - s.z), rr3 = s.r * (1 + .12 * Math.sin(Math.atan2(z - s.z, x - s.x) * 3 + s.a * 5)); const e = smooth(rr3 + 3, rr3 - 7, d); h = Math.max(h, -4.5 + e * 5 + e * smooth(rr3 * .5, 0, d) * (2.5 + noise(x, z) * 2)); }); return h; };
  WORLD = {center: new T.Vector3(0, 0, 150), span: 860, isl};
  return pts;
}
/* 길에서 가장 가까운 거리 */
let SAMP = [];
function nearPath(x, z, step) { let m = 1e9, bi = 0; for (let i = 0; i < SAMP.length; i += step || 3) { const q = SAMP[i], d = (q.x - x) ** 2 + (q.z - z) ** 2; if (d < m) { m = d; bi = i; } } return [Math.sqrt(m), bi / (SAMP.length - 1)]; }
function zoneAt(u) { const i = Math.min(N - 1, Math.max(0, Math.round(u * (N - 1)))); return L[i]; }

function build(v) {
  VAR = v; rs = 11; scene = new T.Scene();
  document.querySelectorAll('#seg button').forEach(b => b.classList.toggle('on', b.dataset.v === v)); $('desc').innerHTML = DESC[v];
  P = v === 'C' ? layoutC() : layoutA();
  /* 길: C 에서는 섬 사이 다리를 위해 중간점 추가 없음 — 곡선 그대로 */
  P.forEach(p => p.y = Math.max(.3, H(p.x, p.z)));
  curve = new T.CatmullRomCurve3(P, false, 'catmullrom', .5); SAMP = curve.getSpacedPoints(N * 24);
  U = P.map(p => { let b = 0, m = 1e9; SAMP.forEach((q, i) => { const d = q.distanceToSquared(p); if (d < m) { m = d; b = i; } }); return b / (SAMP.length - 1); });
  const pathH = (x, z) => Math.max(.35, H(x, z));
  /* 하늘 */
  const skyU = {top: {value: new T.Color('#2a8ee6')}, bottom: {value: new T.Color('#fff1d6')}};
  scene.add(new T.Mesh(new T.SphereGeometry(1500, 24, 16), new T.ShaderMaterial({side: T.BackSide, depthWrite: false, fog: false, uniforms: skyU,
    vertexShader: 'varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
    fragmentShader: 'uniform vec3 top; uniform vec3 bottom; varying vec3 vP; void main(){ float h = clamp(normalize(vP).y*1.4+0.08, 0.0, 1.0); gl_FragColor = vec4(mix(bottom, top, pow(h,0.7)), 1.0); }'})));
  scene.fog = new T.Fog('#cdeefa', 260, 1250);
  scene.add(new T.HemisphereLight(0xd6efff, 0x8a9a5a, 1.45));
  const sun = new T.DirectionalLight(0xfff1d6, 2.6); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -.0006; sun.shadow.normalBias = .05;
  Object.assign(sun.shadow.camera, {left: -60, right: 60, top: 60, bottom: -60, near: 1, far: 300}); scene.add(sun); scene.add(sun.target); WORLD.sun = sun;
  const sd = new T.Mesh(new T.CircleGeometry(40, 32), new T.MeshBasicMaterial({color: '#fff6c9', fog: false})); sd.position.set(-500, 420, -900); sd.lookAt(0, 0, 0); scene.add(sd);
  /* 땅 */
  const C = WORLD.center, S = WORLD.span + 260, seg = 220, gg = new T.PlaneGeometry(S, S, seg, seg).rotateX(-Math.PI / 2); gg.translate(C.x, 0, C.z);
  const pp = gg.attributes.position, col = [], c = new T.Color();
  const SAND = new T.Color('#f3dfa6'), SAND2 = new T.Color('#e9cf8c'), WET = new T.Color('#d2b77a'), GRASS = new T.Color('#86c35a'), GRASS2 = new T.Color('#a8d26a'), ROCK = new T.Color('#9aa0a6'), RED = new T.Color('#e7a27a'), PATH = new T.Color('#f7ebc8'), DEEP = new T.Color('#5a8f86');
  for (let i = 0; i < pp.count; i++) {
    const x = pp.getX(i), z = pp.getZ(i); let y = H(x, z);
    const [d, u] = nearPath(x, z, 4), it = zoneAt(u), near = 1 - smooth(18, 60, d);
    if (d < 3.4) y = Math.max(y, pathH(x, z) - .05); pp.setY(i, y);
    if (y < .2) c.copy(WET).lerp(SAND, smooth(-1.2, .2, y));
    else { c.copy(SAND).lerp(SAND2, (noise(x * 2, z * 2) + 1.5) / 3);
      let land = GRASS.clone().lerp(GRASS2, (noise(x * 1.3, z * 1.3) + 1.5) / 3);
      if (it.zone === 'gate') land = ROCK.clone(); else if (it.zone === 'game' || it.zone === 'opt') land.lerp(RED, .55);
      c.lerp(land, smooth(1.2, 3.2, y) * (it.zone === 'rest' ? .55 : 1));
      if (y > 14) c.lerp(DEEP, smooth(14, 26, y));
      if (it.zone === 'gate' && near > .2) c.lerp(ROCK, near * .6); }
    if (d < 3.2 && y > .1) c.lerp(PATH, 1 - smooth(2.2, 3.2, d));
    col.push(c.r, c.g, c.b);
  }
  gg.setAttribute('color', new T.Float32BufferAttribute(col, 3)); gg.computeVertexNormals();
  const ground = new T.Mesh(gg, new T.MeshLambertMaterial({vertexColors: true, flatShading: true})); ground.receiveShadow = true; scene.add(ground);
  /* 바다 */
  water = new T.Mesh(new T.PlaneGeometry(3600, 3600, 90, 90).rotateX(-Math.PI / 2), new T.MeshStandardMaterial({color: '#2fb3e3', flatShading: true, roughness: .3, metalness: .1, transparent: true, opacity: .88}));
  water.position.set(C.x, -.6, C.z); scene.add(water); wBase = water.geometry.attributes.position.array.slice();
  /* 다리 (C: 길이 물 위를 지나는 곳) */
  const planks = [];
  for (let i = 0; i < SAMP.length; i += 2) { const p = SAMP[i]; if (H(p.x, p.z) < .1) { const t = curve.getTangentAt(i / (SAMP.length - 1)); planks.push([p.x, p.z, Math.atan2(t.x, t.z)]); } }
  if (planks.length) { const im = new T.InstancedMesh(new T.BoxGeometry(5, .35, 1.1), flat('#b07a4a'), planks.length), o = new T.Object3D(); planks.forEach((q, k) => { o.position.set(q[0], .55, q[1]); o.rotation.set(0, q[2], 0); o.updateMatrix(); im.setMatrixAt(k, o.matrix); }); im.castShadow = im.receiveShadow = true; scene.add(im);
    const posts = planks.filter((q, k) => k % 4 === 0), pm = new T.InstancedMesh(new T.CylinderGeometry(.18, .2, 3.4, 5), flat('#8a5a32'), posts.length * 2); posts.forEach((q, k) => [-1, 1].forEach((s, j) => { o.position.set(q[0] + Math.cos(q[2]) * 2.6 * s, .3, q[1] - Math.sin(q[2]) * 2.6 * s); o.rotation.set(0, 0, 0); o.updateMatrix(); pm.setMatrixAt(k * 2 + j, o.matrix); })); scene.add(pm); }
  /* 먼 산 (만 바깥, 수평선 너머) */
  const mt = [], sn = [];
  for (let i = 0; i < 34; i++) { const a = rr(-Math.PI, Math.PI), r = rr(560, 820), x = C.x + Math.sin(a) * r, z = C.z - Math.cos(a) * r; if (z > C.z + 200) continue; const s = rr(60, 110), h = rr(90, 190); mt.push([x, z, s, h, ['#6f9b8c', '#7fa894', '#628c86', '#86ae98'][i % 4]]); sn.push([x, z, s * .3, h * .3, h * .7]); }
  const cone = new T.ConeGeometry(1, 1, 7).translate(0, .5, 0), o2 = new T.Object3D();
  const im1 = new T.InstancedMesh(cone, flat('#fff'), mt.length); mt.forEach((m, k) => { o2.position.set(m[0], -6, m[1]); o2.scale.set(m[2], m[3], m[2]); o2.rotation.y = k; o2.updateMatrix(); im1.setMatrixAt(k, o2.matrix); im1.setColorAt(k, new T.Color(m[4])); }); scene.add(im1);
  const im2 = new T.InstancedMesh(cone, flat('#f6fbff'), sn.length); sn.forEach((m, k) => { o2.position.set(m[0], m[4] - 6, m[1]); o2.scale.set(m[2], m[3], m[2]); o2.rotation.y = k; o2.updateMatrix(); im2.setMatrixAt(k, o2.matrix); }); scene.add(im2);
  /* 야자수·나무·바위: 무리지어 (고르게 깔지 않음) */
  const palms = [], trees = [], rocks = [];
  const clusters = []; for (let k = 0; k < 70; k++) { const i = Math.floor(rnd() * SAMP.length), p = SAMP[i], t = curve.getTangentAt(i / (SAMP.length - 1)), side = rnd() < .75 ? 1 : -1, off = rr(12, 70); clusters.push([p.x - t.z * off * side, p.z + t.x * off * side, rr(6, 18)]); }
  for (let k = 0; k < 9000 && palms.length + trees.length < 700; k++) {
    const cl = clusters[k % clusters.length], a = rnd() * 6.28, r = Math.sqrt(rnd()) * cl[2] * 1.6, x = cl[0] + Math.cos(a) * r, z = cl[1] + Math.sin(a) * r, h = H(x, z); if (h < .9) continue;
    const [d] = nearPath(x, z, 6); if (d < 7) continue;
    (h > 6 ? trees : palms).push([x, z, h, rr(.8, 1.35), rnd() * 6.28, rr(-.25, .25)]); }
  for (let k = 0; k < 400; k++) { const i = Math.floor(rnd() * SAMP.length), p = SAMP[i], t = curve.getTangentAt(i / (SAMP.length - 1)), off = rr(-30, -6) * (VAR === 'C' ? (rnd() < .5 ? 1 : -1) : 1), x = p.x - t.z * off + rr(-4, 4), z = p.z + t.x * off + rr(-4, 4), h = H(x, z); if (h < -2.5 || h > 3) continue; const it = zoneAt(i / (SAMP.length - 1)); if (it.zone !== 'gate' && rnd() < .6) continue; rocks.push([x, z, h, rr(.6, 2.4), rnd() * 6]); }
  const o = new T.Object3D(), put = (geo, mat, list, f, colors) => { if (!list.length) return; const im = new T.InstancedMesh(geo, mat, list.length); list.forEach((q, k) => { f(o, q); o.updateMatrix(); im.setMatrixAt(k, o.matrix); if (colors) im.setColorAt(k, colors[k % colors.length]); }); im.castShadow = true; im.receiveShadow = true; scene.add(im); };
  const greens = ['#3f9a3a', '#4fae44', '#5dbb4d', '#3a8a3a'].map(x => new T.Color(x));
  put(new T.CylinderGeometry(.22, .36, 6, 6).translate(0, 3, 0), flat('#a0784e'), palms, (o, q) => { o.position.set(q[0], q[2] - .1, q[1]); o.scale.setScalar(q[3]); o.rotation.set(q[5], q[4], q[5] * .6); });
  for (let f = 0; f < 6; f++) put(new T.ConeGeometry(.75, 4.2, 4).rotateZ(Math.PI / 2 + .35).translate(2.1, 6.1, 0), flat('#fff'), palms, (o, q) => { o.position.set(q[0], q[2] - .1, q[1]); o.scale.setScalar(q[3]); o.rotation.set(q[5], q[4] + f * 1.047, q[5] * .6); }, greens);
  put(new T.CylinderGeometry(.3, .4, 1.6, 6).translate(0, .8, 0), flat('#8a6240'), trees, (o, q) => { o.position.set(q[0], q[2] - .1, q[1]); o.scale.setScalar(q[3] * 1.3); o.rotation.set(0, q[4], 0); });
  put(new T.ConeGeometry(2, 4, 7).translate(0, 3.2, 0), flat('#fff'), trees, (o, q) => { o.position.set(q[0], q[2] - .1, q[1]); o.scale.setScalar(q[3] * 1.3); o.rotation.set(0, q[4], 0); }, greens);
  put(new T.ConeGeometry(1.5, 3, 7).translate(0, 4.8, 0), flat('#fff'), trees, (o, q) => { o.position.set(q[0], q[2] - .1, q[1]); o.scale.setScalar(q[3] * 1.3); o.rotation.set(0, q[4], 0); }, greens.slice(1));
