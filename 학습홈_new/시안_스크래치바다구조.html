<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시안 · 스크래치 바다 구조</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#d6eef8;font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#14304a;overflow:hidden}
button{font:inherit;cursor:pointer}
.wrap{position:fixed;inset:0;display:flex}
.mapbox{flex:1;position:relative;min-width:0}
svg{width:100%;height:100%;display:block}
.node{cursor:pointer}
.node:hover .ring{stroke-width:5}
.node.sel .ring{stroke:#ff8f5a;stroke-width:6}
.lbl{font-size:16px;font-weight:900;fill:#0f2d48;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round;pointer-events:none}
.sub{font-size:12px;font-weight:700;fill:#3d6a8a;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round;pointer-events:none}
.top{position:absolute;left:16px;top:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{background:rgba(255,255,255,.94);border-radius:999px;padding:7px 14px;font-weight:800;font-size:14px;box-shadow:0 2px 10px rgba(0,0,0,.1);border:0}
.tog.on{background:#ffe9a8}
.panel{width:360px;flex-shrink:0;background:#fbfdff;border-left:1px solid #dbe7ef;display:flex;flex-direction:column;box-shadow:-6px 0 24px rgba(20,40,60,.08)}
.ph{padding:18px 18px 12px;border-bottom:1px solid #e8f0f5}
.tag{display:inline-block;font-size:12px;font-weight:800;border-radius:999px;padding:3px 10px;background:#d4ecfa;color:#11507a}
.tag.game{background:#ffe3c9;color:#8a4a0c}.tag.gate{background:#fff0c2;color:#7a5600}.tag.opt{background:#eef0ea;color:#5f665a}
.ph h2{margin:8px 0 4px;font-size:20px}
.ph p{margin:0;font-size:13.5px;line-height:1.6;color:#3f5568}
.pb{flex:1;overflow-y:auto;padding:10px 14px 18px}
.m{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border-radius:12px;margin-bottom:6px;background:#f2f8fc}
.m.g{background:#fff6ec}
.m b{min-width:44px;font-size:11.5px;font-weight:800;color:#2f7bb0;padding-top:3px}
.m.g b{color:#c06a1c}
.m .t{font-size:14.5px;font-weight:800;line-height:1.4}
.m .c{font-size:12px;color:#5d7486;margin-top:2px;line-height:1.5}
.src{display:inline-block;font-size:10.5px;font-weight:800;border-radius:999px;padding:1px 7px;margin-left:4px;vertical-align:1px;background:#e9eef2;color:#4d5f6c}
.src.w{background:#e4defc;color:#3c2f8f}.src.a{background:#ffe3c9;color:#8a4a0c}.src.cam{background:#fde2e2;color:#8a2a2a}
.foot{padding:12px 16px;border-top:1px solid #e8f0f5;font-size:12.5px;color:#5d7486;line-height:1.6}
.hint{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:rgba(10,30,50,.8);color:#fff;border-radius:999px;padding:8px 16px;font-size:13.5px;font-weight:700;white-space:nowrap}
@media (max-width:900px){.wrap{flex-direction:column}.panel{width:100%;height:45%}.mapbox{height:55%}}
</style>
</head>
<body>
<div class="wrap">
  <div class="mapbox">
    <svg id="map" viewBox="0 0 1200 760" preserveAspectRatio="xMidYMid meet"></svg>
    <div class="top">
      <span class="chip">🌊 스크래치 바다 · 구조 시안</span>
      <button class="chip tog" id="tA">A. 지금 방식 (게임은 끝에)</button>
      <button class="chip tog" id="tB">B. 추천 (책 사이에 짧은 게임)</button>
    </div>
    <div class="hint">섬을 눌러 들어 있는 미션을 보세요 · 위에서 A/B를 바꿔 비교</div>
  </div>
  <div class="panel">
    <div class="ph"><span class="tag" id="pTag"></span><h2 id="pTitle"></h2><p id="pDesc"></p></div>
    <div class="pb" id="pList"></div>
    <div class="foot" id="pFoot"></div>
  </div>
</div>
<script>
/* src: 'k' 기초 교재 · 'g' 게임 1·2권 · 'a' 스크래치_추가게임 · 'w' 와이즈 스크래치 */
const BOOK = [
 {id:'b1', kind:'book', icon:'📘', title:'기초 1', sub:'이벤트·신호·그래픽 효과', desc:'움직임과 신호, 그래픽 효과로 살아 있는 작품을 만들어요.', ms:[
  ['1-1','뛰는 고양이','키 이벤트'],['1-1','날아다니는 박쥐','무작위 수'],['1-1','치즈 먹는 생쥐','마우스 따라가기 · 닿았는가'],
  ['1-2','달리기 시합 (기본·응용)','신호 보내기'],['1-3','이상한 과일들','그래픽 효과'],['1-3','변신하는 고양이','신호 + 효과'],['1-3','엄마공룡을 따라하자','효과 순서'],
  ['1-4','녹아내리는 빙하','효과 응용'],['1-4','홈런','효과 응용']]},
 {id:'b2', kind:'book', icon:'📗', title:'기초 2', sub:'복제·감지', desc:'복제본으로 많은 물체를 만들고, 닿음·색을 감지해요.', ms:[
  ['2-1','복제 SHOW','복제'],['2-1','파티풍선 날리기','복제 + 무작위'],['2-1','눈 내리는 밤','복제 + ~까지 반복'],
  ['2-2','자동차 피하기 (기본·응용)','복제 + 조건 · 논리'],['2-3','거미와 쥐를 잡아야 해','복제 감지'],['2-3','색을 감지하는 카멜레온','색 감지'],['2-3','동물들의 이어달리기','색 감지'],
  ['2-4','별 줍는 유니콘 (기본·응용)','복제 게임']]},
 {id:'b3', kind:'book', icon:'📙', title:'기초 3', sub:'변수·타이머·묻고 답하기·참거짓', desc:'점수와 시간을 기억하는 변수, 묻고 답하기, 참·거짓 판단.', ms:[
  ['3-1','떨어지는 달걀 구하기','변수(점수)'],['3-1','축구공 막기 게임','변수 + 복제'],['3-2','날짜를 말해 주는 로봇','현재 시간'],['3-2','반응속도 테스트','타이머'],['3-2','밤이 되면 나타나는 그리핀','타이머 + 배경'],
  ['3-3','스무고개 게임','묻고 답하기'],['3-3','아바타 만들기','신호 + 무작위'],['3-3','암산 게임','연산 · 묻고 답하기'],['3-4','Go Go 패럴림픽','그리고·또는'],['3-4','몬스터 처치 게임','참·거짓 + 복제']]},
 {id:'b4', kind:'book', icon:'📕', title:'기초 4', sub:'펜·다각형·리스트·나만의 블록', desc:'펜으로 그리고, 리스트에 모으고, 나만의 블록을 만들어요.', ms:[
  ['4-1','무지개 펜 · 별 무늬 도장','펜'],['4-1','폭죽 그리기','펜 + 신호'],['4-1','달팽이 그림판','펜 그림판'],['4-2','다각형 그리기','변수 + 펜'],['4-2','회전하는 다각형','반복 + 펜'],
  ['4-2','일그러진 사각형 · 점점 커지는 집','변수 + 펜'],['4-3','평균 구하기','리스트'],['4-3','자판기 만들기','리스트 + 묻기'],['4-3','타자 연습 게임','리스트 게임'],['4-4','연산 · 동작 추가블록','나만의 블록']]},
];
const COS = {id:'cos', kind:'gate', icon:'🏅', title:'COS 2급 관문', sub:'스크래치 2.0 시험', desc:'기초 4권까지 끝내고 COS 2급. 합격하면 게임 만들기 섬으로!', ms:[['관문','COS 스크래치 연습실 (2.0)','연습 · 시험 모드']]};
const G1 = {id:'g1', kind:'game', icon:'🎮', title:'게임 1권', sub:'두더지·피하기·슈팅·미로', desc:'배운 블록을 모두 써서 완성형 게임을 만들어요.', ms:[
  ['G1-1','두더지잡기 게임','복제·변수·마우스','g'],['G1-2','피하기 게임','복제·색 감지·배경','g'],['G1-3','슈팅 게임','신호·복제·변수','g'],['G1-4','사막 미로 게임','색 감지·변수·아이템','g']]};
const G2 = {id:'g2', kind:'game', icon:'🕹️', title:'게임 2권', sub:'레이싱·보석·핑퐁·바운스볼', desc:'조금 더 큰 게임. 보너스로 테니스 게임도 있어요.', ms:[
  ['G2-1','우주 레이싱','타이머·복제·변수','g'],['G2-2','보석을 찾아라!','색 감지·논리','g'],['G2-3','핑퐁 게임 (+ 보너스 테니스)','변수·색 감지','g'],['G2-4','바운스볼 게임','복제·색 감지','g']]};
const ARC = {id:'arc', kind:'opt', icon:'🎡', title:'게임 오락실', sub:'선택 · 골라서 만들기', desc:'스크래치_추가게임 폴더. 빨리 끝난 학생이나 방학 특강용. 학생이 골라서 해요.', ms:[
  ['선택','팩맨 게임','논리·색 감지','a'],['선택','테트리스','펜·변수','a'],['선택','리듬 게임','복제·신호','a'],['선택','뱀 꼬리잡기 (펜)','펜 코딩','a'],['선택','사다리 게임','나만의 블록','a'],
  ['선택','미로 탈출 · 몬스터처치 미로','색 감지·배경','a'],['선택','낚시 게임 (기본→응용)','복제·변수','a'],['선택','레이싱 게임','타이머','a'],['선택','인형뽑기 · 인형줍기','변수','a'],
  ['선택','유니콘 쿠키런 (1·2단계)','큰 게임','a'],['선택','숨은 그림 게임','배경·효과','a'],['선택','테니스 · 벽돌깨기A · 스토리 총알','신호·복제','a'],
  ['선택','꽃송이 모으기 · 무궁화 게임 📷','비디오 감지(카메라)','cam']]};
/* B안: 책 사이 짧은 게임 쉼터 — 그 책까지 배운 블록으로 만들 수 있는 것만 */
const R1 = {id:'r1', kind:'rest', icon:'🏝️', title:'게임 쉼터 ①', sub:'1~2차시 · 기초 1 복습', desc:'기초 1에서 배운 키·신호·닿았는가만으로 만드는 짧은 게임.', ms:[
  ['쉼터','산성비 피하기 1단계','닿았는가 · 무작위','a'],['쉼터','축구 게임','신호 · 닿았는가','a'],['쉼터','고양이 피하기','조건 · 닿음','w']]};
const R2 = {id:'r2', kind:'rest', icon:'🏝️', title:'게임 쉼터 ②', sub:'1~2차시 · 복제 연습', desc:'기초 2의 복제를 바로 게임에 써 봐요. 같은 게임을 단계별로 키워 가요.', ms:[
  ['쉼터','산성비 피하기 2·3단계 → 완성','복제 · 신호','a'],['쉼터','번개 피하기','복제 게임','w'],['쉼터','박쥐잡기 게임','복제 + 마우스','w']]};
const R3 = {id:'r3', kind:'rest', icon:'🏝️', title:'게임 쉼터 ③', sub:'1~2차시 · 점수와 시간', desc:'기초 3의 변수·타이머로 점수판과 시간 제한이 있는 게임.', ms:[
  ['쉼터','반응속도 게임','타이머 · 무작위','a'],['쉼터','물풍선 사격 게임','점수 변수 · 마우스','a'],['쉼터','공 피하기 게임 (기초)','변수 · 타이머 · 배경','a'],['쉼터','맞힐 때까지 푸는 퀴즈','묻고 답하기 · 반복','w']]};
const PLAN = {
 A: [BOOK[0], BOOK[1], BOOK[2], BOOK[3], COS, G1, G2, ARC],
 B: [BOOK[0], R1, BOOK[1], R2, BOOK[2], R3, BOOK[3], COS, G1, G2, ARC]
};
const POS = {
 A: [[110,610],[260,470],[420,580],[560,420],[690,300],[850,400],[1000,260],[1080,110]],
 B: [[90,640],[200,520],[300,640],[400,500],[500,620],[600,470],[690,330],[790,200],[920,300],[1040,190],[1110,70]]
};
const COL = {book:['#4aa6e0','#e3f3fd'], rest:['#f29a4a','#fff1e2'], gate:['#e6b422','#fff6d6'], game:['#e0663a','#ffe7dc'], opt:['#9aa39a','#f1f3ef']};
const SRC = {k:['','기초 교재'], g:['','게임 교재'], a:['a','추가게임 폴더'], w:['w','와이즈'], cam:['cam','📷 카메라']};
const TAGN = {book:['','기본 교재'], rest:['game','게임 쉼터 (짧게)'], gate:['gate','관문'], game:['game','게임 만들기'], opt:['opt','선택']};
let mode = 'B', sel = 0;
const $ = id => document.getElementById(id), NS = 'http://www.w3.org/2000/svg';
function el(t, a, p){ const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); if (p) p.appendChild(e); return e; }
function draw(){
  const svg = $('map'); svg.innerHTML = '';
  const g0 = el('g', {}, svg);
  for (let i = 0; i < 26; i++) el('path', {d:`M${(i*97)%1200} ${(i*61)%760} q 14 -8 28 0 t 28 0`, stroke:'#bfe2f2', 'stroke-width':3, fill:'none', 'stroke-linecap':'round'}, g0);
  const L = PLAN[mode], P = POS[mode];
  let d = 'M' + P[0].join(' ');
  for (let i = 1; i < P.length; i++) { const a = P[i-1], b = P[i]; d += ` Q ${(a[0]+b[0])/2 + (i%2?40:-40)} ${(a[1]+b[1])/2 + (i%2?-30:30)} ${b[0]} ${b[1]}`; }
  el('path', {d, stroke:'#fff', 'stroke-width':14, fill:'none', 'stroke-linecap':'round', opacity:.85}, svg);
  el('path', {d, stroke:'#7cc3e6', 'stroke-width':5, fill:'none', 'stroke-dasharray':'2 12', 'stroke-linecap':'round'}, svg);
  L.forEach((n, i) => {
    const [x, y] = P[i], c = COL[n.kind], r = n.kind === 'rest' ? 34 : n.kind === 'gate' ? 40 : 46;
    const g = el('g', {class:'node' + (i === sel ? ' sel' : ''), transform:`translate(${x},${y})`}, svg);
    el('ellipse', {cx:0, cy:r*0.55, rx:r*1.25, ry:r*0.42, fill:'#9fd3ea', opacity:.55}, g);
    el('circle', {class:'ring', r, fill:c[1], stroke:c[0], 'stroke-width':3.5}, g);
    const t = el('text', {y:9, 'text-anchor':'middle', 'font-size': r*0.9}, g); t.textContent = n.icon;
    const lb = el('text', {class:'lbl', y:r+22, 'text-anchor':'middle'}, g); lb.textContent = n.title;
    const sb = el('text', {class:'sub', y:r+39, 'text-anchor':'middle'}, g); sb.textContent = n.sub;
    g.addEventListener('click', () => { sel = i; draw(); show(); });
  });
}
function show(){
  const n = PLAN[mode][sel], tg = TAGN[n.kind];
  $('pTag').className = 'tag ' + tg[0]; $('pTag').textContent = tg[1];
  $('pTitle').textContent = n.icon + ' ' + n.title; $('pDesc').textContent = n.desc;
  $('pList').innerHTML = n.ms.map(m => { const s = SRC[m[3] || 'k'], gm = m[3] && m[3] !== 'k';
    return `<div class="m${gm ? ' g' : ''}"><b>${m[0]}</b><div><div class="t">${m[1]}${m[3] ? `<span class="src ${s[0]}">${s[1]}</span>` : ''}</div><div class="c">${m[2]}</div></div></div>`; }).join('');
  const nb = PLAN[mode].filter(x => x.kind === 'rest').reduce((a, x) => a + x.ms.length, 0);
  $('pFoot').innerHTML = mode === 'A'
    ? '<b>A. 지금 방식</b> — 기초 1~4권(약 40개)을 쭉 하고, COS 2급 뒤에 게임을 몰아서 해요. 교재 흐름이 끊기지 않지만, 게임까지 오래 기다려요.'
    : `<b>B. 추천</b> — 책 한 권이 끝날 때마다 <b>짧은 게임 쉼터</b>(그 책까지 배운 블록만, 1~2차시)를 둬요. 쉼터 미션 ${nb}개. 큰 게임 1·2권은 지금처럼 COS 뒤에 그대로.`;
}
function setMode(m){ mode = m; sel = Math.min(sel, PLAN[m].length - 1); $('tA').classList.toggle('on', m === 'A'); $('tB').classList.toggle('on', m === 'B'); draw(); show(); }
$('tA').onclick = () => setMode('A'); $('tB').onclick = () => setMode('B');
setMode('B');
</script>
</body>
</html>
