<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>파이썬 화산섬</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="favicon-180.png">
<style>
*{box-sizing:border-box}
:root{--bg:#0e1220;--text:#eef1f8;--mid:#c3cbe0;--dim:#6f7a9c;--line:#1f2740;--soft:#161c2e;--btn:#141a2c;--btnline:#2a3350;--k:#ff8a3c;--cool:#4a5578;--smoke:#9aa3bd;--glow:rgba(255,110,50,.20);
  --h0:#56618a;--h1:#866f80;--h2:#b47a68;--h3:#d98552;--h4:#f0883c;--h5:#ff7a2e}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;cursor:pointer;color:inherit;background:none;border:0;padding:0}
.mono{font-family:"JetBrains Mono","D2Coding","Consolas",monospace}
.page{position:relative;max-width:1000px;margin:0 auto;padding:26px 40px 70px}
.page::before{content:"";position:absolute;right:-140px;top:-120px;width:560px;height:420px;background:radial-gradient(closest-side,var(--glow),transparent);pointer-events:none;transition:opacity .6s;opacity:.55}
.page.u::before{opacity:1}
.nav{display:flex;gap:18px;margin-bottom:14px}
.nav button{font-size:13px;font-weight:600;color:var(--dim)}
.nav button:hover{color:var(--text)}
.ttl b{display:block;font-size:24px;font-weight:800;letter-spacing:-.3px}
.ttl span{display:block;margin-top:5px;font-size:11.5px;letter-spacing:1px;color:var(--dim)}

/* 온도선 + 분화구 */
.heatwrap{position:relative;margin:30px 64px 30px 0}
.heat{height:5px;border-radius:9px;background:linear-gradient(90deg,var(--cool),var(--h2) 42%,var(--h4) 78%,#e03a12)}
.heat i{position:absolute;top:-5px;width:15px;height:15px;margin-left:-7.5px;border-radius:50%;background:var(--bg);border:3.5px solid var(--k);transition:left .6s cubic-bezier(.3,1.4,.5,1)}
.crater{position:absolute;right:-64px;top:-13px;width:64px;height:31px;cursor:pointer}
.crater .lava{position:absolute;left:14px;top:9px;width:36px;height:13px;border-radius:50%;background:radial-gradient(#ffe08a,#ff8a3c 55%,#e2521f);box-shadow:0 0 22px 6px rgba(255,120,50,.45);animation:lava 2.6s ease-in-out infinite}
@keyframes lava{50%{box-shadow:0 0 30px 10px rgba(255,120,50,.6)}}
.crater:hover .lava{filter:brightness(1.15)}
.puffs{position:absolute;left:50%;bottom:20px;width:0;height:0;pointer-events:none}
.puffs b{position:absolute;left:-9px;bottom:0;width:18px;height:18px;border-radius:50%;background:var(--smoke);opacity:0;animation:puff 4.2s ease-out infinite}
.puffs b:nth-child(2){animation-delay:1.05s;--dx:14px}
.puffs b:nth-child(3){animation-delay:2.1s;--dx:-10px}
.puffs b:nth-child(4){animation-delay:3.15s;--dx:8px}
@keyframes puff{0%{transform:translate(0,0) scale(.2);opacity:0}8%{transform:translate(0,-8px) scale(.75);opacity:.55}14%{transform:translate(0,-13px) scale(.62);opacity:.55}100%{transform:translate(var(--dx,-6px),-104px) scale(1.9);opacity:0}}
.page.u .puffs b{animation-duration:2.6s}
.page.u .puffs b:nth-child(2){animation-delay:.65s}
.page.u .puffs b:nth-child(3){animation-delay:1.3s}
.page.u .puffs b:nth-child(4){animation-delay:1.95s}

/* 목차 */
.tabs{display:flex;gap:22px;align-items:baseline;margin-bottom:24px}
.tabs button{font-size:21px;font-weight:800;color:var(--dim);opacity:.55;padding-bottom:6px;border-bottom:2.5px solid transparent;transition:.2s}
.tabs button:hover{opacity:.9}
.tabs button.on{color:var(--text);opacity:1;border-color:var(--k)}
.tabs button i{font-style:normal;font-size:12px;font-weight:600;color:var(--dim);margin-left:7px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:0 48px;align-items:start}
.ch{margin-bottom:24px;padding-left:20px;border-left:3px solid var(--c)}
.ch h3{margin:0 0 4px;font-size:12.5px;font-weight:700;color:var(--mid);display:flex;gap:9px;align-items:baseline}
.ch h3 i{font-style:normal;font-size:11px;color:var(--c)}
.ls{position:relative;display:flex;align-items:center;gap:8px;height:44px;border-bottom:1px solid var(--line);cursor:pointer}
.ls .lt{font-size:15.5px;font-weight:600;color:var(--mid);margin-right:auto;transition:.2s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ls .no{font-size:11.5px;color:var(--dim);width:20px;flex:none}
.ls:hover .lt{color:var(--text);transform:translateX(3px)}
.ic,.ver{flex:none;width:25px;height:25px;border-radius:50%;display:grid;place-items:center;font-size:11.5px;font-weight:700;color:var(--dim);border:1px solid var(--btnline);background:var(--btn);transition:.2s}
.ic:hover,.ver:hover{border-color:var(--k);color:var(--k)}
.ver.done{color:var(--c);border-color:var(--c)}
.ls.done .lt{color:var(--dim);font-weight:500}
.ls.done .ic{background:var(--c);border-color:var(--c);color:var(--bg)}
.ls.now .lt{color:var(--text);font-weight:800}
.ls.now::before{content:"";position:absolute;left:-25.5px;top:50%;width:8px;height:8px;margin-top:-4px;border-radius:50%;background:var(--k);box-shadow:0 0 0 3px var(--bg)}
.ls.now .ic{border-color:var(--k);color:var(--k)}
/* 실전: 줄 앞의 작은 그림 */
.ls.tl{height:58px;gap:12px}
.ls.tl .mt{flex:none;width:70px;height:44px;border-radius:8px;background:#131829;border:1px solid var(--btnline);overflow:hidden}
.ls.tl .mt svg{display:block;width:100%;height:100%}
.ls.tl.done .mt{opacity:.4}
.ls.tl.now .mt{border-color:var(--k)}
.spin{transform-box:fill-box;transform-origin:center}
.ls:hover .spin{animation:spin 2.4s linear infinite}
.orb{transform-origin:80px 50px}
.ls:hover .orb{animation:spin 3s linear infinite}
.ls:hover .orb.o2{animation-duration:5s}
.ls:hover .slide{animation:slide 1.4s ease-in-out infinite alternate}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes slide{from{transform:translateX(-34px)}to{transform:translateX(34px)}}
@media (max-width:820px){.page{padding:20px 24px 70px}.cols{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.puffs b,.crater .lava{animation:none}}
</style>
</head>
<body>
<div class="page" id="page">
  <div class="nav"><button id="worldBtn">← 세계 지도</button><button id="beachBtn">거북이 해변길</button></div>
  <div class="ttl"><b>파이썬 화산섬</b><span class="mono">PYTHON LAB</span></div>
  <div class="heatwrap">
    <div class="heat"><i id="mark"></i></div>
    <div class="crater" id="crater" title="실전 연구소"><div class="puffs"><b></b><b></b><b></b><b></b></div><div class="lava"></div></div>
  </div>
  <div class="tabs" id="tabs"></div>
  <div id="list"></div>
</div>

<script src="lib/py_data.js"></script>
<script>
(() => {
/* 교재 목록은 lib/py_data.js (GRAMMAR, URSINA). 완료 표시는 교재마다 따로: S.py.gd(문법 파일 이름), S.py.ud(실전 번호) */
const $ = id => document.getElementById(id);
const D = window.PYDATA, BASE = D.BASE, URS = D.URSINA || [];
const KEY = 'studyhome_new_3d_demo';
let S = {name: '탐험가'};
try { const v = JSON.parse(localStorage.getItem(KEY)); if (v && typeof v === 'object') S = Object.assign(S, v); } catch (e) {}
if (!S.py || typeof S.py !== 'object') S.py = {};
const flat = [].concat.apply([], D.GRAMMAR.map(c => c.items));
if (!Array.isArray(S.py.gd)) S.py.gd = flat.slice(0, Math.max(0, S.py.g | 0)).map(it => it[2]);   /* 예전 순서식 진도에서 옮김 */
S.py.gd = S.py.gd.filter(f => flat.some(it => it[2] === f));
S.py.ud = Array.isArray(S.py.ud) ? S.py.ud.filter(n => n >= 1 && n <= URS.length) : [];
S.py.t = S.py.t | 0; if (!Array.isArray(S.py.b)) S.py.b = [];
S.place = 'volcano'; S.pyAt = 'lab';
const save = () => { S.py.g = S.py.gd.length; try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
if (S.started) save();
let TAB = S.py.tab === 'u' ? 'u' : 'g';

/* 문법 줄 만들기: "딕셔너리 (dict) 1·2·4" 처럼 번호만 다른 교재는 한 줄로 묶음 */
let gi = 0;
const CH = D.GRAMMAR.map(c => {
  const rows = [];
  c.items.forEach(it => {
    const m = it[1].match(/^(.+\(dict\)) (\d+)$/), last = rows[rows.length - 1], one = {i: gi++, file: it[2]};
    if (m && last && last.title === m[1]) last.vers.push([m[2], one]);
    else if (m) rows.push({title: m[1], vers: [[m[2], one]]});
    else rows.push({title: it[1], vers: [['', one]]});
  });
  return {name: c.ch.replace(/^LV\.\d+\s+/, ''), rows};
});
const ROWS = [].concat.apply([], CH.map(c => c.rows));
const gDone = r => r.vers.every(v => S.py.gd.includes(v[1].file));
const uDone = n => S.py.ud.includes(n);
const pad = n => String(n).padStart(2, '0');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));

/* 실전 차시 그림: 코드로 그린 작은 미리보기 (160×100). 나중에 실제 실행 화면으로 바꿀 수 있음 */
const O = '#ff8a3c', C = '#f3e9d8', B = '#5cc8ff', SL = '#56618a';
const iso = (x, y, s, c) => '<polygon points="' + [x, y - s, x + s, y - s / 2, x, y, x - s, y - s / 2] + '" fill="' + c + '"/><polygon points="' + [x - s, y - s / 2, x, y, x, y + s, x - s, y + s / 2] + '" fill="' + c + '" opacity=".68"/><polygon points="' + [x + s, y - s / 2, x, y, x, y + s, x + s, y + s / 2] + '" fill="' + c + '" opacity=".42"/>';
const floor = '<path d="M10 78 H150 M24 66 H136 M36 56 H124 M80 50 L80 86 M80 50 L30 86 M80 50 L130 86" stroke="' + SL + '" stroke-width="1" opacity=".35" fill="none"/>';
const key = (x, y, t, on) => '<rect x="' + x + '" y="' + y + '" width="24" height="24" rx="5" fill="' + (on ? O : 'none') + '" stroke="' + (on ? O : SL) + '" stroke-width="1.5"/><text x="' + (x + 12) + '" y="' + (y + 16.5) + '" text-anchor="middle" style="font:700 11px monospace;fill:' + (on ? '#0e1220' : C) + '">' + t + '</text>';
const TH = [
  floor + iso(80, 52, 20, C),
  '<circle cx="36" cy="50" r="15" fill="' + O + '"/><rect x="62" y="36" width="28" height="28" fill="' + B + '"/><text x="124" y="56" text-anchor="middle" style="font:800 15px sans-serif;fill:' + C + '">Text</text>',
  '<rect class="spin" x="62" y="32" width="36" height="36" rx="3" fill="' + O + '" transform="rotate(18 80 50)"/><path d="M36 50 a44 44 0 0 1 14 -32 M124 50 a44 44 0 0 1 -14 32" fill="none" stroke="' + C + '" stroke-width="2" stroke-linecap="round" opacity=".6"/><path d="M50 18 l-8 1 l5 6 M110 82 l8 -1 l-5 -6" fill="none" stroke="' + C + '" stroke-width="2" stroke-linecap="round" opacity=".6"/>',
  '<rect x="20" y="16" width="120" height="68" rx="4" fill="none" stroke="' + C + '" stroke-width="1.5" stroke-dasharray="5 5" opacity=".55"/><rect class="slide" x="69" y="39" width="22" height="22" rx="3" fill="' + O + '"/>',
  floor + iso(96, 50, 14, O) + '<rect x="22" y="22" width="26" height="18" rx="3" fill="' + C + '"/><polygon points="48,27 60,21 60,41 48,35" fill="' + C + '"/><path d="M62 31 L84 44" stroke="' + C + '" stroke-width="1.2" stroke-dasharray="3 3" opacity=".6"/>',
  '<rect x="42" y="36" width="30" height="30" rx="3" fill="' + O + '"/><rect x="72" y="36" width="30" height="30" rx="3" fill="' + B + '"/><path d="M72 22 v8 M62 25 l5 7 M82 25 l-5 7 M110 34 l8 -5 M112 51 h10 M110 68 l8 5" stroke="' + C + '" stroke-width="2" stroke-linecap="round"/>',
  key(68, 22, 'W', 1) + key(40, 52, 'A') + key(68, 52, 'S') + key(96, 52, 'D'),
  '<rect x="104" y="14" width="14" height="72" rx="2" fill="' + SL + '"/><rect x="78" y="38" width="26" height="26" rx="3" fill="' + O + '"/><path d="M30 51 h34 M54 43 l10 8 l-10 8" fill="none" stroke="' + C + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".6"/>',
  iso(40, 54, 13, C) + iso(80, 50, 16, O) + iso(122, 54, 13, B),
  '<rect x="34" y="34" width="84" height="30" rx="15" fill="' + O + '"/><text x="76" y="54" text-anchor="middle" style="font:800 13px sans-serif;fill:#0e1220">Click</text><polygon points="106,52 106,76 112,70 117,80 121,78 116,68 124,68" fill="' + C + '" stroke="#0e1220" stroke-width="1.2"/>',
  [0, 1, 2].map(i => '<rect x="' + (18 + i * 44) + '" y="26" width="36" height="48" rx="4" fill="none" stroke="' + (i === 1 ? O : SL) + '" stroke-width="1.5"/><circle cx="' + (36 + i * 44) + '" cy="' + [60, 42, 52][i] + '" r="7" fill="' + (i === 1 ? O : C) + '" opacity="' + (i === 1 ? 1 : .6) + '"/>').join(''),
  '<circle cx="80" cy="50" r="30" fill="none" stroke="' + SL + '" stroke-width="1" opacity=".6"/><circle cx="80" cy="50" r="12" fill="' + O + '"/><g class="orb"><circle cx="110" cy="50" r="6" fill="' + B + '"/></g>',
  '<ellipse cx="80" cy="50" rx="24" ry="24" fill="none" stroke="' + SL + '" stroke-width="1" opacity=".6"/><ellipse cx="80" cy="50" rx="42" ry="42" fill="none" stroke="' + SL + '" stroke-width="1" opacity=".4"/><circle cx="80" cy="50" r="10" fill="' + O + '"/><g class="orb"><circle cx="104" cy="50" r="5" fill="' + B + '"/></g><g class="orb o2"><circle cx="38" cy="50" r="7" fill="' + C + '"/><circle cx="28" cy="44" r="2.5" fill="' + SL + '"/></g>',
  /* 14 자전·공전 시계 */ '<circle cx="80" cy="50" r="34" fill="none" stroke="' + SL + '" stroke-width="1.5"/><path d="M80 50 V24" stroke="' + C + '" stroke-width="3" stroke-linecap="round"/><g class="orb"><path d="M80 50 H104" stroke="' + O + '" stroke-width="3" stroke-linecap="round"/></g><circle cx="80" cy="50" r="4" fill="' + C + '"/>',
  /* 15 animate */ '<rect x="20" y="38" width="24" height="24" rx="3" fill="' + SL + '"/><path d="M52 50 h44 M88 42 l8 8 l-8 8" fill="none" stroke="' + C + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".6"/><circle cx="122" cy="50" r="15" fill="' + O + '"/>',
  /* 16 Sequence */ '<path d="M22 50 H138" stroke="' + SL + '" stroke-width="2"/>' + [0, 1, 2, 3].map(i => '<circle cx="' + (30 + i * 33) + '" cy="50" r="' + (i === 1 ? 9 : 6) + '" fill="' + (i === 1 ? O : C) + '" opacity="' + (i === 1 ? 1 : .6) + '"/>').join('') + '<text x="80" y="82" text-anchor="middle" style="font:700 11px monospace;fill:' + SL + '">1 · 2 · 3 · 4</text>',
  /* 17 충돌 구분 */ '<circle cx="34" cy="50" r="14" fill="' + B + '"/><rect x="68" y="38" width="24" height="24" rx="3" fill="' + O + '"/>' + iso(126, 52, 13, C) + '<path d="M52 50 h10 M98 50 h10" stroke="' + C + '" stroke-width="2" stroke-linecap="round" opacity=".6"/>',
  /* 18 체력바 */ '<rect x="24" y="40" width="112" height="20" rx="4" fill="#c2452e" opacity=".75"/><rect x="24" y="40" width="70" height="20" rx="4" fill="#7fd39a"/><rect x="24" y="40" width="112" height="20" rx="4" fill="none" stroke="' + C + '" stroke-width="1.5" opacity=".6"/>',
  /* 19 숫자판 */ '<rect x="32" y="28" width="96" height="44" rx="6" fill="#0a0d16" stroke="' + SL + '" stroke-width="1.5"/><text x="80" y="58" text-anchor="middle" style="font:800 22px monospace;fill:' + O + '">042</text>',
  /* 20 스파크 */ [0, 1, 2, 3, 4, 5, 6, 7].map(i => '<circle cx="' + (80 + Math.cos(i * .785) * (16 + (i % 3) * 8)).toFixed(1) + '" cy="' + (50 + Math.sin(i * .785) * (16 + (i % 3) * 8)).toFixed(1) + '" r="' + (5 - i % 3) + '" fill="' + (i % 2 ? O : '#ffd84a') + '"/>').join('') + '<circle cx="80" cy="50" r="3" fill="' + C + '"/>',
  /* 21 버블 */ [[44, 66, 9], [70, 44, 13], [98, 62, 7], [116, 34, 10], [58, 24, 6]].map(b => '<circle cx="' + b[0] + '" cy="' + b[1] + '" r="' + b[2] + '" fill="none" stroke="' + B + '" stroke-width="1.8"/><circle cx="' + (b[0] - b[2] * .35) + '" cy="' + (b[1] - b[2] * .35) + '" r="' + (b[2] * .22) + '" fill="' + C + '" opacity=".7"/>').join(''),
  /* 22 흐르는 배경 */ [0, 1, 2, 3].map(i => '<rect x="' + (10 + i * 36) + '" y="58" width="18" height="26" fill="' + SL + '" opacity="' + (.35 + i * .15) + '"/>').join('') + '<path d="M10 84 H150" stroke="' + SL + '" stroke-width="1.5"/><path d="M62 34 q9 -12 18 0 q9 -12 18 0" fill="none" stroke="' + O + '" stroke-width="3" stroke-linecap="round"/><path d="M120 22 h-26 M102 16 l-8 6 l8 6" fill="none" stroke="' + C + '" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity=".6"/>',
  /* 23 따라오는 용 */ [0, 1, 2, 3, 4].map(i => '<circle cx="' + (118 - i * 22) + '" cy="' + (50 + Math.sin(i * 1.2) * 12).toFixed(1) + '" r="' + (13 - i * 2) + '" fill="' + (i ? C : O) + '" opacity="' + (1 - i * .15) + '"/>').join('') + '<circle cx="123" cy="46" r="2.2" fill="#0e1220"/>',
  /* 24 3D 모델 */ floor + '<path d="M52 52 a28 22 0 0 1 56 0 z" fill="' + O + '"/><rect x="72" y="52" width="16" height="22" rx="4" fill="' + C + '"/><circle cx="68" cy="42" r="3" fill="' + C + '"/><circle cx="88" cy="38" r="4" fill="' + C + '"/>',
  /* 25 조명 */ iso(80, 62, 16, C) + '<circle cx="120" cy="26" r="8" fill="#ffd84a"/><path d="M120 10 v-4 M134 26 h4 M130 16 l3 -3 M106 26 h-4 M110 16 l-3 -3 M112 34 L94 50" stroke="#ffd84a" stroke-width="1.6" stroke-linecap="round" opacity=".7"/>'
];

function render() {
  const gNow = ROWS.find(r => !gDone(r)), gCnt = ROWS.filter(gDone).length;
  let uNow = 0; for (let n = 1; n <= URS.length; n++) if (!uDone(n)) { uNow = n; break; }
  $('page').classList.toggle('u', TAB === 'u');
  $('mark').style.left = (TAB === 'u' ? 80 + (URS.length ? S.py.ud.length / URS.length : 0) * 20 : gCnt / ROWS.length * 80).toFixed(1) + '%';
  $('tabs').innerHTML = '<button data-tab="g" class="' + (TAB === 'g' ? 'on' : '') + '">문법<i class="mono">' + gCnt + '/' + ROWS.length + '</i></button><button data-tab="u" class="' + (TAB === 'u' ? 'on' : '') + '">실전<i class="mono">' + S.py.ud.length + '/' + URS.length + '</i></button>';
  const gRow = r => {
    const d = gDone(r), k = ROWS.indexOf(r);
    return '<div class="ls' + (d ? ' done' : r === gNow ? ' now' : '') + '" data-g="' + r.vers[0][1].i + '"><span class="lt">' + esc(r.title) + '</span>' +
      (r.vers.length > 1 ? r.vers.map(v => '<span class="ver mono' + (S.py.gd.includes(v[1].file) ? ' done' : '') + '" data-g="' + v[1].i + '" title="' + esc(r.title + ' ' + v[0]) + '">' + v[0] + '</span>').join('') : '') +
      '<span class="ic" data-gt="' + k + '" title="' + (d ? '완료 취소' : '완료') + '">' + (d ? '✓' : '→') + '</span></div>';
  };
  const uRow = n => '<div class="ls tl' + (uDone(n) ? ' done' : n === uNow ? ' now' : '') + '" data-u="' + n + '">' + (TH[n - 1] ? '<span class="mt"><svg viewBox="0 0 160 100">' + TH[n - 1] + '</svg></span>' : '') + '<span class="no mono">' + pad(n) + '</span><span class="lt">' + esc(URS[n - 1]) + '</span><span class="ic" data-ut="' + n + '" title="' + (uDone(n) ? '완료 취소' : '완료') + '">' + (uDone(n) ? '✓' : '→') + '</span></div>';
  const gCh = ci => '<section class="ch" style="--c:var(--h' + Math.min(5, ci) + ')"><h3><i class="mono">LV.' + (ci + 1) + '</i>' + esc(CH[ci].name) + '</h3>' + CH[ci].rows.map(gRow).join('') + '</section>';
  if (TAB === 'g') {
    /* 두 줄로 나누기: 줄 수가 비슷해지는 곳에서 자름 */
    const tot = ROWS.length + CH.length; let acc = 0, cut = CH.length;
    for (let ci = 0; ci < CH.length; ci++) { acc += CH[ci].rows.length + 1; if (acc >= tot / 2) { cut = ci + 1; break; } }
    const ids = CH.map((_, ci) => ci);
    $('list').innerHTML = '<div class="cols"><div>' + ids.slice(0, cut).map(gCh).join('') + '</div><div>' + ids.slice(cut).map(gCh).join('') + '</div></div>';
  } else {
    const half = Math.ceil(URS.length / 2), ns = URS.map((_, k) => k + 1);
    $('list').innerHTML = '<section class="ch" style="--c:#e03a12"><h3><i class="mono">Ursina</i>3D 게임 만들기</h3><div class="cols"><div>' + ns.slice(0, half).map(uRow).join('') + '</div><div>' + ns.slice(half).map(uRow).join('') + '</div></div></section>';
  }
}
const setTab = t => { TAB = t; S.py.tab = t; save(); render(); };
document.addEventListener('click', e => {
  const t = e.target;
  const tab = t.closest('[data-tab]'); if (tab) { setTab(tab.dataset.tab); return; }
  if (t.closest('#crater')) { setTab('u'); return; }
  const gt = t.closest('[data-gt]');
  if (gt) { const r = ROWS[+gt.dataset.gt], fs = r.vers.map(v => v[1].file); if (gDone(r)) S.py.gd = S.py.gd.filter(f => !fs.includes(f)); else fs.forEach(f => { if (!S.py.gd.includes(f)) S.py.gd.push(f); }); save(); render(); return; }
  const ut = t.closest('[data-ut]');
  if (ut) { const n = +ut.dataset.ut; if (uDone(n)) S.py.ud = S.py.ud.filter(x => x !== n); else S.py.ud.push(n); save(); render(); return; }
  const g = t.closest('[data-g]'); if (g) { location.href = '교재.html?i=' + g.dataset.g; return; }
  const u = t.closest('[data-u]'); if (u) window.open(BASE + 'python_ursina.html#lesson-' + pad(+u.dataset.u), '_blank');
});
$('worldBtn').addEventListener('click', () => { location.href = '시작.html?map=1'; });
$('beachBtn').addEventListener('click', () => { location.href = '해변.html'; });
render();
})();
</script>
