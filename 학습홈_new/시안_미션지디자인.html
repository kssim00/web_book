<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시안 · 미션지 디자인</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#2a3a1c}
button{font:inherit;cursor:pointer}
/* 시안 고르기 */
.pick{position:sticky;top:0;z-index:50;display:flex;gap:8px;justify-content:center;align-items:center;padding:10px;background:#1f2b16;color:#fff;flex-wrap:wrap}
.pick b{font-size:14px;margin-right:6px}
.pick button{border:0;border-radius:999px;padding:8px 16px;font-weight:800;font-size:14px;background:#3a4a2c;color:#dfe9d3}
.pick button.on{background:#ffcf3f;color:#3a2a00}
.pick small{width:100%;text-align:center;color:#b9c9a8;font-size:12.5px}
.v{display:none}.v.on{display:block}
/* 블록 공통 */
.obj{font-size:12px;font-weight:800;color:#6b7a58;margin:0 0 4px}
.pile{display:flex;flex-wrap:wrap;align-items:flex-start;gap:10px 12px}
.pile>*{transform:rotate(var(--r,0deg))}
.stack{display:inline-flex;flex-direction:column;align-items:flex-start}
.b{display:inline-flex;align-items:center;gap:5px;padding:7px 12px;border-radius:7px;color:#fff;font-size:13.5px;font-weight:700;line-height:1.2;white-space:nowrap}
.stack>*+*,.in>*+*{margin-top:2px}
.b.hat{border-radius:16px 16px 7px 7px;padding-top:9px}
.vv{display:inline-block;background:#fff;color:#333;border-radius:999px;padding:1px 9px;font-size:12.5px;font-weight:700}
.vv.sel{border-radius:5px}.vv.blank{min-width:30px;height:19px;vertical-align:middle;padding:0}
.vv.bool{border-radius:4px;background:#8fa2ff;color:#fff;padding:2px 6px}
.c{display:flex;flex-direction:column;align-items:flex-start;border-radius:7px}
.c .head,.c .foot{padding:7px 12px;color:#fff;font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:5px;white-space:nowrap}
.c .foot{padding:5px 12px;min-width:70px}
.c .in{margin-left:14px;padding:2px 2px 2px 0;background:#fff;border-radius:0 6px 6px 0;display:flex;flex-direction:column;align-items:flex-start}
.c.hollow .in{min-width:110px;min-height:22px;box-shadow:inset 0 0 0 1.5px #d7e9c6}
.start{background:#2fae51}.flow{background:#14b6d9}.move{background:#a34ee8}.look{background:#ee4f84}.sound{background:#7cb300}.judge{background:#4a63f0}

/* ───── A. 탐험 수첩 ───── */
#A{background:#e7dcc3 radial-gradient(circle at 20% 10%,#efe6d1 0,transparent 60%);min-height:100vh;padding:24px 16px 60px}
#A .book{max-width:800px;margin:0 auto;background:#fffaf0;border-radius:6px 18px 18px 6px;box-shadow:0 14px 34px rgba(80,60,20,.22),inset 14px 0 0 #c9a46a,inset 17px 0 0 #b38a4e;padding:26px 26px 30px 44px;position:relative}
#A .top{display:flex;align-items:center;gap:10px;margin-bottom:6px}
#A .back{border:0;background:#f1e6cc;border-radius:999px;padding:7px 13px;font-weight:800;font-size:13px;color:#6b4a1a}
#A .wood{background:#a8754a;color:#fff7e6;font-weight:900;border-radius:8px;padding:5px 12px;font-size:15px;box-shadow:0 3px 0 #7c5433}
#A h1{margin:6px 0 4px;font-size:26px;font-weight:900;color:#3b2a17}
#A .goal{font-size:15.5px;line-height:1.7;color:#5a4a2c;margin:0 0 16px;padding:12px 14px;background:#fff3d6;border-radius:12px;border-left:5px solid #ffb347}
#A .trail{display:flex;align-items:center;gap:0;margin:0 0 18px}
#A .trail i{flex:1;height:4px;background:repeating-linear-gradient(90deg,#d9c39a 0 8px,transparent 8px 14px)}
#A .trail span{width:34px;height:34px;border-radius:50%;background:#efe3c6;color:#8a7350;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;flex-shrink:0}
#A .trail span.d{background:#5aa62a;color:#fff}#A .trail span.c{background:#ffcf3f;color:#5a3d00;box-shadow:0 0 0 4px #fff1b8}
#A .q{border-radius:16px;padding:14px 16px;margin:0 0 12px;background:#fff;box-shadow:0 2px 0 #eadfc6,0 0 0 1.5px #efe5cf inset;position:relative}
#A .q.c{box-shadow:0 0 0 2.5px #ffcf3f inset,0 6px 18px rgba(200,150,30,.18)}
#A .q.d{background:#f6f8ef}
#A .qh{display:flex;align-items:center;gap:10px;cursor:pointer}
#A .num{width:32px;height:32px;border-radius:10px;background:#a8754a;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;flex-shrink:0}
#A .q.d .num{background:#5aa62a}
#A .qt{font-size:17px;font-weight:900;flex:1}
#A .stamp{font-size:13px;font-weight:900;color:#d0661a;border:2.5px solid #d0661a;border-radius:8px;padding:2px 8px;transform:rotate(-8deg)}
#A .now{font-size:12px;font-weight:900;background:#ffcf3f;color:#5a3d00;border-radius:999px;padding:3px 10px}
#A .qb{display:none;margin:10px 0 0 42px}
#A .q.o .qb{display:block}
#A .say{font-size:15px;line-height:1.7;margin:0 0 10px;color:#4a3a22}
#A .note{font-size:13.5px;line-height:1.7;color:#6a5a3a;background:#fbf5e6;border-radius:10px;padding:8px 12px;margin:0 0 10px}
#A .tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
#A .tools button{border:0;border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:800;background:#f4ecd8;color:#6b4a1a}
#A .tools .ok{margin-left:auto;background:#5aa62a;color:#fff}
#A .hint{font-size:14px;line-height:1.6;color:#6a5310;background:#fff6d6;border-radius:12px;padding:10px 12px;margin:8px 0 0}
#A .code{margin:10px 0 0;padding:14px;border-radius:14px;background:#fbf7ec;display:flex;flex-wrap:wrap;gap:16px}
#A .foot{display:flex;justify-content:space-between;align-items:center;margin-top:18px}
#A .pill{border:0;border-radius:999px;padding:11px 20px;font-weight:900;font-size:15px;text-decoration:none}
#A .pill.ent{background:#fff;color:#2c5a0f;box-shadow:0 0 0 1.5px #a9d68a inset}
#A .pill.go{background:linear-gradient(90deg,#ff8f5a,#ffb347);color:#fff}

/* ───── B. 한 단계씩 ───── */
#B{background:linear-gradient(#bfe6ff,#e7f6d9 55%);min-height:100vh;padding:18px 16px 40px}
#B .wrap{max-width:820px;margin:0 auto}
#B .top{display:flex;align-items:center;gap:10px}
#B .back{border:0;background:rgba(255,255,255,.8);border-radius:999px;padding:8px 14px;font-weight:800;font-size:13px;color:#2f5a14}
#B .mt{font-size:15px;font-weight:900;color:#2f5a14}
#B .dots{display:flex;align-items:center;margin:16px 4px 14px}
#B .dots button{width:38px;height:38px;border-radius:50%;border:0;background:#fff;color:#8aa476;font-weight:900;font-size:15px;box-shadow:0 2px 6px rgba(40,80,20,.15);flex-shrink:0}
#B .dots button.d{background:#5aa62a;color:#fff}
#B .dots button.c{background:#ffcf3f;color:#5a3d00;transform:scale(1.15);box-shadow:0 0 0 5px rgba(255,207,63,.35)}
#B .dots i{flex:1;height:5px;background:#fff;border-radius:3px;margin:0 4px}
#B .dots i.d{background:#5aa62a}
#B .card{background:#fff;border-radius:26px;padding:24px 24px 20px;box-shadow:0 16px 40px rgba(40,80,20,.16)}
#B .lab{font-size:13px;font-weight:900;color:#5aa62a;letter-spacing:.5px}
#B h2{margin:4px 0 8px;font-size:28px;font-weight:900}
#B .say{font-size:17px;line-height:1.7;margin:0 0 14px;color:#3d5a2a}
#B .note{font-size:14px;line-height:1.7;background:#f3f9ec;border-radius:12px;padding:10px 14px;margin:0 0 14px;color:#4b6a37}
#B .tabs{display:flex;gap:8px;margin:0 0 10px}
#B .tabs button{flex:1;border:0;border-radius:14px;padding:12px;font-weight:900;font-size:15px;background:#f3f6ee;color:#4b6a37}
#B .tabs button.on{background:#fff6d6;color:#7a5600;box-shadow:0 0 0 2px #ffd84a inset}
#B .tabs button.k.on{background:#eef7ff;color:#1b5f8a;box-shadow:0 0 0 2px #8fd0f5 inset}
#B .panel{min-height:120px;border-radius:16px;background:#fafcf7;padding:14px;display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
#B .panel.hint{font-size:16px;line-height:1.7;color:#6a5310;background:#fffaea}
#B .panel.empty{color:#9aab88;align-items:center;justify-content:center;font-size:14px}
#B .nav{display:flex;gap:10px;margin-top:18px;align-items:center}
#B .nav button{border:0;border-radius:999px;padding:14px 22px;font-weight:900;font-size:16px}
#B .nav .prev{background:#f1f5ec;color:#4b6a37}
#B .nav .ok{flex:1;background:#5aa62a;color:#fff;font-size:18px}
#B .nav .ok.fin{background:linear-gradient(90deg,#ff8f5a,#ffb347)}
#B .goal{margin:12px 6px 0;font-size:13.5px;color:#4b6a37;line-height:1.6}

/* ───── C. 엔트리 옆 안내판 ───── */
#C{background:#d7e3cc;min-height:100vh;padding:20px}
#C .stage{display:flex;gap:14px;max-width:1100px;margin:0 auto;align-items:stretch}
#C .fake{flex:1;min-height:640px;border-radius:14px;background:#f4f6f9;border:1px solid #c9d1db;display:flex;align-items:center;justify-content:center;color:#8a96a6;font-weight:700;text-align:center;line-height:1.7}
#C .side{width:340px;flex-shrink:0;background:#fffdf6;border-radius:16px;box-shadow:0 10px 26px rgba(40,60,20,.18);display:flex;flex-direction:column;overflow:hidden}
#C .sh{background:#3b6d11;color:#fff;padding:12px 14px}
#C .sh small{display:block;font-size:12px;opacity:.8;font-weight:700}
#C .sh b{font-size:17px}
#C .bar{height:6px;background:#2a4f0c}#C .bar i{display:block;height:100%;background:#ffcf3f;transition:width .3s}
#C .list{flex:1;overflow:auto;padding:10px}
#C .it{border-radius:12px;margin:0 0 6px;background:#f5f8ef}
#C .it.c{background:#fff8dc;box-shadow:0 0 0 1.5px #ffd84a inset}
#C .ih{display:flex;align-items:center;gap:8px;padding:10px;cursor:pointer}
#C .ck{width:22px;height:22px;border-radius:6px;border:2px solid #a9d68a;background:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;color:#fff;flex-shrink:0}
#C .it.d .ck{background:#5aa62a;border-color:#5aa62a}
#C .it.d .tt{color:#8aa476;text-decoration:line-through}
#C .tt{font-size:14.5px;font-weight:800;flex:1}
#C .ib{display:none;padding:0 10px 10px 40px}
#C .it.o .ib{display:block}
#C .say{font-size:13.5px;line-height:1.6;margin:0 0 8px;color:#3d5a2a}
#C .note{font-size:12.5px;line-height:1.6;color:#4b6a37;background:#fff;border-radius:8px;padding:6px 10px;margin:0 0 8px}
#C .tools{display:flex;gap:5px}
#C .tools button{border:0;border-radius:999px;padding:5px 10px;font-size:12.5px;font-weight:800;background:#fff;color:#3b6d11;box-shadow:0 0 0 1px #c6e3ad inset}
#C .hint{font-size:13px;line-height:1.55;color:#6a5310;background:#fff6d6;border-radius:10px;padding:8px 10px;margin:6px 0 0}
#C .code{margin:6px 0 0;padding:10px;border-radius:10px;background:#fff;display:flex;flex-wrap:wrap;gap:10px;zoom:.82}
#C .sf{padding:10px;border-top:1px solid #eee5cf;display:flex;gap:6px}
#C .sf button,#C .sf a{flex:1;border:0;border-radius:999px;padding:10px;font-weight:900;font-size:13.5px;text-align:center;text-decoration:none}
#C .sf .pop{background:#eef6e6;color:#2f5a14}#C .sf .go{background:#5aa62a;color:#fff}
@media (max-width:760px){#C .stage{flex-direction:column}#C .fake{min-height:200px}#C .side{width:100%}#A .book{padding-left:30px}#A .qb{margin-left:0}}
</style>
</head>
<body>
<div class="pick"><b>미션지 시안</b>
  <button data-v="A" class="on">A. 탐험 수첩</button><button data-v="B">B. 한 단계씩</button><button data-v="C">C. 엔트리 옆 안내판</button>
  <small id="desc"></small>
</div>

<div class="v on" id="A"></div>
<div class="v" id="B"></div>
<div class="v" id="C"></div>

<script>document.write('<script src="lib/entry_missions.js?t=' + Date.now() + '"><\/script>');</script>
<script>
(() => {
const $ = id => document.getElementById(id);
const DESC = {
  A: '숲 탐험 수첩 느낌. 모든 단계가 한눈에 보이고, 지금 단계만 펼쳐져요. 끝낸 단계엔 "통과" 도장. 위쪽 발자국 길로 진도가 보여요.',
  B: '한 화면에 한 단계만 크게. 큰 "다 했어요" 버튼으로 다음 단계로 넘어가요. 저학년·집중이 어려운 아이에게 좋아요.',
  C: '엔트리 화면 옆에 좁게 세워 두고 보는 안내판. "작은 창으로 띄우기"로 엔트리 옆에 붙여 쓸 수 있어요. (왼쪽 회색은 엔트리 자리 예시)'
};
const ID = new URLSearchParams(location.search).get('id') || 'w1_2', M = window.ENTRY_MISSIONS[ID];
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
function inline(t) { let h = esc(t); h = h.replace(/\[ \]/g, '<span class="vv blank"></span>'); h = h.replace(/\[([^\]]*)\]/g, '<span class="vv">$1</span>').replace(/\{([^}]*)\}/g, '<span class="vv sel">$1</span>'); return h.replace(/&lt;(.*?)&gt;/g, '<span class="vv bool">$1</span>'); }
function block(x) { if (Array.isArray(x)) { const m = x[0].match(/^(\w+)[:^](.*)$/); return '<div class="c ' + m[1] + '"><div class="head">' + inline(m[2]) + '</div><div class="in">' + x[1].map(block).join('') + '</div><div class="foot"></div></div>'; } const m = x.match(/^(\w+)([:^])(.*)$/); return '<span class="b ' + m[1] + (m[2] === '^' ? ' hat' : '') + '">' + inline(m[3]) + '</span>'; }
function pieces(list, out) { list.forEach(x => { if (Array.isArray(x)) { out.push([x[0], []]); pieces(x[1], out); } else out.push(x); }); return out; }
function shuffle(a, seed) { const r = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }; const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } if (b.length > 1 && b.every((x, i) => x === a[i])) b.push(b.shift()); return b; }
function uniq(list) { const key = x => (Array.isArray(x) ? x[0] : x).replace(/\[[^\]]*\]/g, '[]'), seen = new Map(), out = []; list.forEach(x => { const k = key(x); if (!seen.has(k)) { seen.set(k, out.length); out.push(x); } else { const i = seen.get(k), y = out[i], ys = Array.isArray(y) ? y[0] : y, xs = Array.isArray(x) ? x[0] : x; if (ys !== xs) out[i] = Array.isArray(y) ? [k, []] : k.replace(/\[\]/g, '[ ]'); } }); return out.map(x => Array.isArray(x) ? [x[0].replace(/\[\]/g, '[ ]'), x[1]] : x); }
const pile = (groups, seed) => groups.map((g, gi) => '<div><p class="obj">' + esc(g.obj || '') + '</p><div class="pile">' + shuffle(uniq(pieces(g.code, [])), seed * 31 + gi * 7 + 3).map((x, i) => { const h = Array.isArray(x) ? block(x).replace('class="c ', 'class="c hollow ') : block(x); return h.replace(/^<(\w+) /, '<$1 style="--r:' + (((i * 37 + seed * 13) % 5) - 2) + 'deg" '); }).join('') + '</div></div>').join('');

const N = M.steps.length, done = M.steps.map(() => false); done[0] = true;   // 예시: 1단계는 끝낸 상태
const cur = () => { const k = done.indexOf(false); return k < 0 ? N : k; };
const ui = {};

/* A */
let aOpen = null;
function drawA() {
  const c = cur(), o = aOpen === null ? c : aOpen;
  $('A').innerHTML = '<div class="book"><div class="top"><button class="back">← 숲길</button><span class="wood">' + (M.unit ? '1-2' : '') + '</span></div>' +
    '<h1>' + esc(M.title) + '</h1><p class="goal">🎯 ' + M.goal + '</p>' +
    '<div class="trail">' + M.steps.map((s, i) => (i ? '<i></i>' : '') + '<span class="' + (done[i] ? 'd' : i === c ? 'c' : '') + '">' + (done[i] ? '✓' : i + 1) + '</span>').join('') + '<i></i><span class="' + (c === N ? 'd' : '') + '">⭐</span></div>' +
    M.steps.map((s, i) => { const u = ui['A' + i] || {}; return '<div class="q' + (done[i] ? ' d' : '') + (i === c ? ' c' : '') + (i === o ? ' o' : '') + '" data-i="' + i + '"><div class="qh"><span class="num">' + (i + 1) + '</span><span class="qt">' + esc(s.t) + '</span>' + (done[i] ? '<span class="stamp">통과!</span>' : i === c ? '<span class="now">지금 여기</span>' : '') + '</div>' +
      '<div class="qb"><p class="say">' + esc(s.say) + '</p>' + (s.note ? '<p class="note">' + s.note + '</p>' : '') +
      '<div class="tools">' + (s.hint ? '<button data-h>💡 힌트</button>' : '') + (s.code ? '<button data-c>🧩 블록 조각</button>' : '') + '<button class="ok" data-ok>' + (done[i] ? '↩ 다시 하기' : '✓ 다 했어요') + '</button></div>' +
      (s.hint && u.h ? '<p class="hint">' + esc(s.hint) + '</p>' : '') + (s.code && u.c ? '<div class="code">' + pile(s.code, i + 1) + '</div>' : '') + '</div></div>'; }).join('') +
    '<div class="foot"><a class="pill ent" href="https://playentry.org/ws/new" target="_blank">엔트리 열기 ↗</a><button class="pill go">' + (c === N ? '⭐ 미션 완료!' : '✓ 미션 완료') + '</button></div></div>';
}
$('A').addEventListener('click', e => { const q = e.target.closest('[data-i]'); if (!q) return; const i = +q.dataset.i, u = ui['A' + i] = ui['A' + i] || {};
  if (e.target.closest('[data-h]')) u.h = !u.h; else if (e.target.closest('[data-c]')) u.c = !u.c; else if (e.target.closest('[data-ok]')) { done[i] = !done[i]; aOpen = null; } else if (e.target.closest('.qh')) { const o = aOpen === null ? cur() : aOpen; aOpen = o === i ? -1 : i; } else return; drawAll(); });

/* B */
let bI = null, bTab = '';
function drawB() {
  const c = cur(), i = bI === null ? Math.min(c, N - 1) : bI, s = M.steps[i];
  $('B').innerHTML = '<div class="wrap"><div class="top"><button class="back">← 숲길</button><span class="mt">1-2 · ' + esc(M.title) + '</span></div>' +
    '<div class="dots">' + M.steps.map((x, k) => (k ? '<i class="' + (done[k - 1] ? 'd' : '') + '"></i>' : '') + '<button data-go="' + k + '" class="' + (done[k] ? 'd' : k === i ? 'c' : '') + '">' + (done[k] ? '✓' : k + 1) + '</button>').join('') + '</div>' +
    '<div class="card"><div class="lab">' + (i + 1) + '단계 / ' + N + '단계</div><h2>' + esc(s.t) + '</h2><p class="say">' + esc(s.say) + '</p>' + (s.note ? '<p class="note">' + s.note + '</p>' : '') +
    '<div class="tabs">' + (s.hint ? '<button data-t="h" class="' + (bTab === 'h' ? 'on' : '') + '">💡 힌트 보기</button>' : '') + (s.code ? '<button data-t="k" class="k ' + (bTab === 'k' ? 'on' : '') + '">🧩 블록 조각 보기</button>' : '') + '</div>' +
    (bTab === 'h' && s.hint ? '<div class="panel hint">' + esc(s.hint) + '</div>' : bTab === 'k' && s.code ? '<div class="panel">' + pile(s.code, i + 1) + '</div>' : (s.hint || s.code) ? '<div class="panel empty">막히면 위 버튼을 눌러 봐요</div>' : '') +
    '<div class="nav">' + (i > 0 ? '<button class="prev" data-go="' + (i - 1) + '">‹ 이전</button>' : '') + '<button class="ok' + (i === N - 1 ? ' fin' : '') + '" data-ok="' + i + '">' + (i === N - 1 ? '⭐ 다 했어요! 미션 완료' : '✓ 다 했어요! 다음 단계 ›') + '</button></div></div>' +
    '<p class="goal">🎯 ' + M.goal + '</p></div>';
}
$('B').addEventListener('click', e => { const g = e.target.closest('[data-go]'), t = e.target.closest('[data-t]'), ok = e.target.closest('[data-ok]');
  if (g) { bI = +g.dataset.go; bTab = ''; } else if (t) bTab = bTab === t.dataset.t ? '' : t.dataset.t; else if (ok) { const i = +ok.dataset.ok; done[i] = true; bI = Math.min(i + 1, N - 1); bTab = ''; } else return; drawAll(); });

/* C */
let cOpen = null;
function drawC() {
  const c = cur(), o = cOpen === null ? c : cOpen, n = done.filter(Boolean).length;
  $('C').innerHTML = '<div class="stage"><div class="fake">엔트리 만들기 화면<br><small>(학생은 여기서 코딩하고, 오른쪽 안내판을 보며 따라가요)</small></div><div class="side">' +
    '<div class="sh"><small>1-2 · ' + n + ' / ' + N + ' 단계</small><b>' + esc(M.title) + '</b></div><div class="bar"><i style="width:' + (n / N * 100) + '%"></i></div><div class="list">' +
    M.steps.map((s, i) => { const u = ui['C' + i] || {}; return '<div class="it' + (done[i] ? ' d' : '') + (i === c ? ' c' : '') + (i === o ? ' o' : '') + '" data-i="' + i + '"><div class="ih"><span class="ck" data-ck>' + (done[i] ? '✓' : '') + '</span><span class="tt">' + (i + 1) + '. ' + esc(s.t) + '</span></div>' +
      '<div class="ib"><p class="say">' + esc(s.say) + '</p>' + (s.note ? '<p class="note">' + s.note + '</p>' : '') + '<div class="tools">' + (s.hint ? '<button data-h>💡 힌트</button>' : '') + (s.code ? '<button data-c>🧩 블록</button>' : '') + '</div>' +
      (s.hint && u.h ? '<p class="hint">' + esc(s.hint) + '</p>' : '') + (s.code && u.c ? '<div class="code">' + pile(s.code, i + 1) + '</div>' : '') + '</div></div>'; }).join('') +
    '</div><div class="sf"><button class="pop" title="엔트리 옆에 붙여 둘 작은 창으로 열어요">🗗 작은 창으로 띄우기</button><button class="go">✓ 미션 완료</button></div></div></div>';
}
$('C').addEventListener('click', e => { const q = e.target.closest('[data-i]'); if (!q) return; const i = +q.dataset.i, u = ui['C' + i] = ui['C' + i] || {};
  if (e.target.closest('[data-ck]')) { done[i] = !done[i]; cOpen = null; } else if (e.target.closest('[data-h]')) u.h = !u.h; else if (e.target.closest('[data-c]')) u.c = !u.c; else if (e.target.closest('.ih')) { const o = cOpen === null ? cur() : cOpen; cOpen = o === i ? -1 : i; } else return; drawAll(); });

function drawAll() { drawA(); drawB(); drawC(); }
document.querySelector('.pick').addEventListener('click', e => { const b = e.target.closest('[data-v]'); if (!b) return; document.querySelectorAll('.pick [data-v]').forEach(x => x.classList.toggle('on', x === b)); document.querySelectorAll('.v').forEach(x => x.classList.toggle('on', x.id === b.dataset.v)); $('desc').textContent = DESC[b.dataset.v]; });
$('desc').textContent = DESC.A;
drawAll();
})();
</script>
</body>
</html>
