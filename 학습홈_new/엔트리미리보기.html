<style>
html,body{margin:0;height:100%;background:#eef6e6;font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#23401a;overflow:hidden}
#wrap{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:12px}
#ttl{font-size:20px;font-weight:800;margin:0}
#stageBox{position:relative;width:min(100%, calc((100vh - 120px) * 1.778));aspect-ratio:16/9;border:3px solid #3b6d11;border-radius:16px;overflow:hidden;background:#fff}
#stageBox canvas{position:absolute;inset:0;width:100%!important;height:100%!important}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(255,255,255,.55);z-index:5;text-align:center;font-weight:700;font-size:16px;padding:16px}
#ov.hide{display:none}
.b{font:inherit;font-size:18px;font-weight:800;border:0;border-radius:999px;padding:12px 30px;background:#3b6d11;color:#fff;cursor:pointer}
.bar{display:flex;gap:10px;align-items:center;font-size:14px;color:#4a6b3c}
#scn{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:100%}
#scn button{font:inherit;font-size:13.5px;font-weight:700;border:2px solid #b9d3a3;background:#fff;color:#3b6d11;border-radius:999px;padding:5px 12px;cursor:pointer}
#scn button.on{background:#3b6d11;border-color:#3b6d11;color:#fff}
#scn:empty{display:none}
#hint{font-size:14.5px;font-weight:800;color:#c76a00}
#hint:empty{display:none}
.bar .s{font-size:15px;padding:8px 18px;background:#fff;color:#3b6d11;border:2px solid #3b6d11}
#entryContainer{position:fixed;left:-99999px;top:0;width:1200px;height:800px;visibility:hidden}
</style>

<script>
(function(){
  var TD = new TextDecoder(), Q = new URLSearchParams(location.search), F = Q.get('f'), $ = function(i){ return document.getElementById(i); };
  document.getElementById('ttl').textContent = Q.get('t') || ''; if (window !== top) document.getElementById('ttl').style.display = 'none';
  var ASSET_RE = /temp\/[^\/\\]+\/[^\/\\]+\/(?:image|thumb|sound)\/[^\/\\]+$/i;
  var MIME = {png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',gif:'image/gif',svg:'image/svg+xml',bmp:'image/bmp',mp3:'audio/mpeg',wav:'audio/wav',ogg:'audio/ogg'};
  function mapStrings(v, fn){
    if(Array.isArray(v)) return v.map(function(x){ return mapStrings(x, fn); });
    if(v && typeof v === 'object'){ var o = {}; Object.keys(v).forEach(function(k){ o[k] = mapStrings(v[k], fn); }); return o; }
    return typeof v === 'string' ? fn(v) : v;
  }
  /* ---- tar 읽기/쓰기 ---- */
  function parseTar(u8){
    var out = [], off = 0;
    while(off + 512 <= u8.length){
      var h = u8.subarray(off, off + 512), allZero = true;
      for(var i=0;i<512;i++){ if(h[i] !== 0){ allZero = false; break; } }
      if(allZero) break;
      var str = function(a,b){ var s = TD.decode(h.subarray(a,b)); var z = s.indexOf('\0'); return z >= 0 ? s.slice(0,z) : s; };
      var name = str(0,100), prefix = str(345,500);
      if(prefix) name = prefix + '/' + name;
      var size = parseInt(str(124,136).trim() || '0', 8);
      var type = str(156,157) || '0';
      off += 512;
      out.push({name:name, type:type, data:u8.slice(off, off + size)});
      off += Math.ceil(size / 512) * 512;
    }
    return out;
  }

  function fail(m){ $('ovMsg').innerHTML = m; $('ov').classList.remove('hide'); }
  async function go(){
    if(!F) return fail('작품 파일이 지정되지 않았어요.');
    var r = await fetch(F); if(!r.ok) return fail('작품 파일을 찾지 못했어요.');
    var entries = parseTar(fflate.gunzipSync(new Uint8Array(await r.arrayBuffer())));
    var pe = entries.filter(function(e){ return /(^|\/)project\.json$/.test(e.name); })[0];
    var byRel = {};
    entries.forEach(function(e){ var m = e.name.match(ASSET_RE); if(!m) return; var ext = (e.name.split('.').pop()||'').toLowerCase(); byRel[m[0]] = URL.createObjectURL(new Blob([e.data], {type: MIME[ext]||'application/octet-stream'})); });
    var MEDIA_RE = /\/images\/media\/([^\/\\?#]+)$/, ASSETLIKE = /\.(?:png|jpe?g|gif|svg|bmp|mp3|wav|ogg)(?:[?#].*)?$/i;
    function localize(s){
      if(s.indexOf('blob:')===0 || s.indexOf('data:')===0 || !ASSETLIKE.test(s)) return s;
      var n = s; try{ n = decodeURIComponent(s); }catch(e){} n = n.replace(/\\/g,'/'); if(n.indexOf('/')<0) return s;
      var m = n.match(ASSET_RE), u = m && byRel[m[0]];
      if(!u){ var mm = n.match(MEDIA_RE); if(mm && window.__MEDIA && window.__MEDIA[mm[1]]) u = window.__MEDIA[mm[1]]; }
      return u || s;
    }
    var project = mapStrings(JSON.parse(TD.decode(pe.data)), localize);
    /* 장면마다 어떤 키·클릭으로 움직이는지 찾아 아래에 안내 (예: 2-1 학습하기는 스페이스·화살표 키) */
    (function(){
      var KN = {32:'스페이스',37:'←',38:'↑',39:'→',40:'↓',13:'엔터'};
      (project.objects||[]).forEach(function(o){
        var c = CTL[o.scene] || (CTL[o.scene] = {keys:[], obj:false, mouse:false});
        var sc = o.script; try{ if (typeof sc === 'string') sc = JSON.parse(sc); }catch(e){ sc = []; }
        (function walk(b){
          if (Array.isArray(b)) { b.forEach(walk); return; }
          if (!b || typeof b !== 'object') return;
          var t = b.type, P = b.params || [];
          var k = t === 'when_some_key_pressed' ? P[1] : (t === 'is_press_some_key' ? P[0] : null);
          if (k != null && k !== '') { var n = KN[+k] || (+k >= 48 && +k <= 90 ? String.fromCharCode(+k) : String(k)); if (c.keys.indexOf(n) < 0) c.keys.push(n); }
          if (t === 'when_object_click' || t === 'when_object_click_canceled') c.obj = true;
          if (t === 'mouse_clicked' || t === 'mouse_click_cancled' || t === 'is_clicked') c.mouse = true;
          for (var x in b) if (x !== 'type') walk(b[x]);
        })(sc);
      });
    })();
    (project.objects||[]).forEach(function(o){ ((o.sprite&&o.sprite.pictures)||[]).forEach(function(p){ var f=p.fileurl||''; if(f.indexOf('blob:')===0){ p.thumbUrl=f; p.thumbnail=f; } }); });
    Entry.creationChangedEvent = new Entry.Event(window);
    Entry.init($('entryContainer'), {type:'workspace', libDir:'https://playentry.org/lib', entryDir:'/entry-js', resourcePath:'https://playentry.org/', textCodingEnable:false});
    await Entry.loadProject(project);
    var cv = document.querySelector('#entryContainer canvas#entryCanvas') || document.querySelector('#entryContainer canvas');
    window.__cv = cv;
    $('stageBox').appendChild(cv);
    try{ Entry.stage.updateBoundRect && Entry.stage.updateBoundRect(); }catch(e){}
    try{ Entry.stage.selectObject && Entry.stage.selectObject(null); }catch(e){}
    try{ Entry.stage.handle.setVisible(false); Entry.stage.update(); }catch(e){}
    var scs = (Entry.scene.getScenes && Entry.scene.getScenes()) || [];
    if (scs.length > 1) {
      $('scn').innerHTML = '<span style="font-size:13px;font-weight:700;align-self:center">🎬 장면</span>';
      scs.forEach(function(sc, k){ var b = document.createElement('button'); b.textContent = (k + 1) + '. ' + sc.name; b.onclick = function(){ stop(); try{ Entry.scene.selectScene(sc); }catch(e){} $('ovMsg').innerHTML = '<b>' + sc.name + '</b><button class="b" id="bigRun">▶ 이 장면 시작하기</button>'; $('bigRun').onclick = run; $('ov').classList.remove('hide'); mark(); }; b.dataset.k = k; $('scn').appendChild(b); });
      setInterval(mark, 400); mark();
    }
    $('ovMsg').innerHTML = (scs.length > 1 ? '<span>장면이 ' + scs.length + '개 있어요. 아래에서 골라 볼 수도 있어요.</span>' : '') + '<button class="b" id="bigRun">▶ 시작하기</button>';
    $('bigRun').onclick = run;
  }
  var CTL = {};
  function ctlText(){
    var id = ''; try{ id = Entry.scene.selectedScene.id; }catch(e){}
    var c = CTL[id]; if (!c) return '';
    var ORD = ['스페이스','←','→','↑','↓','엔터'], ks = c.keys.slice().sort(function(a,b){ var i=ORD.indexOf(a), j=ORD.indexOf(b); return (i<0?99:i)-(j<0?99:j) || (a<b?-1:1); });
    var arrows = ks.filter(function(k){ return '←→↑↓'.indexOf(k) >= 0; }).join(' '), other = ks.filter(function(k){ return '←→↑↓'.indexOf(k) < 0; });
    var parts = other.concat(arrows ? [arrows] : []), out = [];
    if (parts.length) out.push('⌨️ ' + parts.join(' · ') + ' 키를 눌러 보세요');
    if (c.obj) out.push('🖱️ 오브젝트를 클릭해 보세요');
    else if (c.mouse) out.push('🖱️ 화면을 클릭해 보세요');
    return out.join('  ');
  }
  function showCtl(){ var t = ctlText(); if ($('hint').textContent !== t) $('hint').textContent = t; }
  function mark(){ try{ var cur = Entry.scene.selectedScene, scs = Entry.scene.getScenes(); [].forEach.call(document.querySelectorAll('#scn button'), function(b){ b.classList.toggle('on', scs[+b.dataset.k] === cur); }); }catch(e){} }
  function run(){ $('ov').classList.add('hide'); try{ if(Entry.engine.state !== 'stop') Entry.engine.toggleStop(); Entry.engine.toggleRun(); }catch(e){ console.error(e); } }
  function stop(){ try{ if(Entry.engine.state !== 'stop') Entry.engine.toggleStop(); }catch(e){} }
  function running(){ try{ return Entry.engine.state !== 'stop'; }catch(e){ return false; } }
  $('tgBtn').onclick = function(){ if (running()) stop(); else run(); sync(); };
  $('reBtn').onclick = function(){ run(); sync(); };
  function sync(){ var r = running(); $('tgBtn').textContent = r ? '■ 멈추기' : '▶ 시작하기'; }
  setInterval(sync, 300);
  setInterval(showCtl, 400);
  /* 다른 탭으로 가거나 창이 가려지면 저절로 멈춤 */
  document.addEventListener('visibilitychange', function(){ if (document.hidden) stop(); });
  go().catch(function(e){ console.error(e); fail('엔트리를 불러오지 못했어요.<br><small>'+(e.message||e)+'</small>'); });
})();
</script>
