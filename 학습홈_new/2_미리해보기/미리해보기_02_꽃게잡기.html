    case 'move_y': e.y += num(p[0], e); break;
    case 'locate_x': e.x = num(p[0], e); break;
    case 'locate_y': e.y = num(p[0], e); break;
    case 'locate_xy': e.x = num(p[0], e); e.y = num(p[1], e); break;
    case 'locate_xy_time': { const x = num(p[1], e), y = num(p[2], e); await glide(e, g, num(p[0], e), () => ({x, y})); break; }
    case 'locate_object_time': { const id = strParam(b); await glide(e, g, num(p[0], e), () => target(e, id)); break; }
    case 'rotate_relative': e.rot += num(p[0], e); break;
    case 'direction_relative': e.dir += num(p[0], e); break;
    case 'rotate_absolute': e.rot = num(p[0], e); break;
    case 'direction_absolute': e.dir = num(p[0], e); break;
    case 'rotate_by_time': { const n = Math.max(Math.floor(num(p[0], e) * FPS), 1), d = num(p[1], e) / n; for (let i = 0; i < n; i++) { e.rot += d; await tick(g); } break; }
    case 'see_angle_object': {
      const id = strParam(b); if (id === e.id) break;
      const t = target(e, id), dx = t.x - e.x, dy = t.y - e.y; let v;
      if (dx === 0 && dy === 0) v = e.dir + e.rot;
      else if (dx >= 0) v = -Math.atan(dy / dx) / Math.PI * 180 + 90;
      else v = -Math.atan(dy / dx) / Math.PI * 180 + 270;

    }
    case 'change_to_next_shape': { const n = e.o.pics.length; e.shape = (e.shape + (p[0] === 'prev' ? n - 1 : 1)) % n; break; }
    case 'show': e.visible = true; break;
    case 'hide': e.visible = false; break;
    case 'set_scale_size': setSize(e, num(p[0], e)); break;
    case 'change_scale_size': setSize(e, getSize(e) + num(p[0], e)); break;
    case 'add_effect_amount': if (p[0] === 'color') e.hsv += num(p[1], e); break;
    case 'erase_all_effects': e.hsv = 0; break;
    case 'dialog': say(e, val(p[0], e)); break;
    case 'dialog_time': { const d = say(e, val(p[0], e)); try { await wait(num(p[1], e) * 1000, g); } finally { if (e.dialog === d) e.dialog = null; } break; }
    case 'wait_second': await wait(num(p[0], e) * 1000, g); break;
    case 'repeat_basic': { const n = num(p[0], e); for (let i = 0; i < n; i++) { await runList(e, st[0] || [], g); await tick(g); } break; }
    case 'repeat_inf': for (;;) { await runList(e, st[0] || [], g); await tick(g); }
    case 'repeat_while_true': { for (;;) { let c = !!val(p[0], e); if (p[1] === 'until') c = !c; if (!c) break; await runList(e, st[0] || [], g); await tick(g); } break; }
    case '_if': if (val(p[0], e)) await runList(e, st[0] || [], g); break;
    case 'if_else': await runList(e, (val(p[0], e) ? st[0] : st[1]) || [], g); break;
    case 'sound_something_with_block': { const s = sounds[val(p[0], e)]; if (s) { const a = new Audio(s); const pr = a.play(); if (pr && pr.catch) pr.catch(() => {}); } break; }
    case 'message_cast': { const id = strParam(b); fire('when_message_cast', h => strParam(h) === id); break; }
    case 'message_cast_wait': { const id = strParam(b); await Promise.all(fire('when_message_cast', h => strParam(h) === id)); if (dead(g)) throw STOP; break; }
    case 'stop_object': {
      const m = p[0];
      if (m === 'all') { stopAll(); throw STOP; }
      throw STOP_THREAD;
    }
    default: console.warn('지원하지 않는 블록:', b.type);
  }
}
function stopAll() {
  gen++; running = false;
  const g = gen;
  setTimeout(() => {
    if (g !== gen) return;
    $('msg').textContent = CFG.endMsg; $('startBtn').textContent = '↺ 다시하기';
    $('overlay').classList.remove('hide');
  }, 1300);
}
function start() {
  reset(); $('overlay').classList.add('hide'); $('hint').textContent = CFG.hintPlaying;
  running = true; fire('when_run_button_click');
}
function draw() {
  ctx.setTransform(K, 0, 0, K, 0, 0); ctx.clearRect(0, 0, W, H);
  for (let i = ents.length - 1; i >= 0; i--) {
    const e = ents[i]; if (!e.visible) continue;
    const p = pic(e);
    ctx.save();
    ctx.translate(e.x + W / 2, H / 2 - e.y); ctx.rotate(e.rot * Math.PI / 180); ctx.scale(e.sx, e.sy);
    if (e.hsv) ctx.filter = 'hue-rotate(' + (e.hsv * 3.6) + 'deg)';
    ctx.drawImage(p.img, -p.w / 2, -p.h / 2);
    ctx.restore();
  }
  ents.forEach(e => {
    if (!e.dialog || !e.visible) return;
    const b = bbox(e), text = e.dialog.text;
    ctx.font = 'bold 13px "Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif';
    const pw = ctx.measureText(text).width + 20, ph = 28;
    const bx = Math.max(4, Math.min(W - pw - 4, (b.l + b.r) / 2 - pw / 2)), by = Math.max(4, b.t - ph - 6);
    ctx.fillStyle = '#fff'; ctx.strokeStyle = '#4f7cff'; ctx.lineWidth = 2;
    ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(bx, by, pw, ph, 10); else ctx.rect(bx, by, pw, ph);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#222'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(text, bx + pw / 2, by + ph / 2 + 1);
  });
}
function toStage(ev) {
  const r = cv.getBoundingClientRect();
  return {px: (ev.clientX - r.left) / r.width * W, py: (ev.clientY - r.top) / r.height * H};
}
function track(ev) { const q = toStage(ev); mouse.x = q.px - W / 2; mouse.y = H / 2 - q.py; return q; }
cv.addEventListener('pointermove', track);
cv.addEventListener('pointerdown', ev => {
  ev.preventDefault(); const q = track(ev);
  if (!running) return;
  fire('mouse_clicked');
  for (const e of ents) {
    if (e.visible && alphaAt(e, q.px, q.py) > 0) { fire('when_object_click', (h, x) => x === e); break; }
  }
});
$('startBtn').addEventListener('click', start);
$('resetBtn').addEventListener('click', reset);
const all = []; P.objects.forEach(o => o.pics.forEach(p => all.push(loadPic(p))));
Promise.all(all).then(() => { reset(); lastT = performance.now(); (function raf() { pump(); requestAnimationFrame(raf); })(); setInterval(pump, 50); });
})();
