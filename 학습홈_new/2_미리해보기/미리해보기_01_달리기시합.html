<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#eef6e6;font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#23401a}
.wrap{width:min(760px,100vw);padding:16px}
h1{font-size:22px;margin:0 0 4px;text-align:center}
.sub{font-size:15px;text-align:center;margin:0 0 12px;color:#4a6b3c}
.stage{position:relative;border-radius:16px;overflow:hidden;border:3px solid #3b6d11;background:#fff;line-height:0}

.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(255,255,255,.72);line-height:1.4}
.overlay.hide{display:none}
.overlay p{margin:0;font-size:17px;font-weight:700;text-align:center;padding:0 16px}
button{font:inherit;font-size:18px;font-weight:700;border:0;border-radius:999px;padding:12px 30px;background:#3b6d11;color:#fff;cursor:pointer}
button:hover{background:#2f570d}
.bar{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:15px;gap:8px}
.bar button{font-size:15px;padding:8px 18px;background:#fff;color:#3b6d11;border:2px solid #3b6d11}
</style>

const INIT = {"dog": {"x": -190.7, "y": -26.01, "scale": 0.28112449799196787, "shape": 0}, "cat": {"x": -195.03, "y": -94.26, "scale": 0.27999999999999997, "shape": 0}};
const W = 480, H = 270, K = 2;
const cv = document.getElementById('stage'), ctx = cv.getContext('2d');
const overlay = document.getElementById('overlay'), startBtn = document.getElementById('startBtn');
const msg = document.getElementById('msg'), hint = document.getElementById('hint');
const load = s => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = s; });
const bark = new Audio(SRC.bark);
let bg, dogImgs, catImgs, dog, cat, running = false, speech = null, gen = 0, dogArrived = false;

function reset() {
  gen++; running = false; speech = null; dogArrived = false;
  dog = Object.assign({}, INIT.dog); cat = Object.assign({}, INIT.cat);
  bark.pause(); try { bark.currentTime = 0; } catch (e) {}
  msg.textContent = '강아지는 혼자 달려요. 고양이는 내가 클릭해야 달려요.';
  startBtn.textContent = '▶ 시작하기';
  hint.textContent = '시작한 뒤 화면을 클릭(터치)하세요.';
  overlay.classList.remove('hide');
}
const rightEdge = (o, imgs) => o.x + imgs[o.shape].width * o.scale / 2;
const touchRightWall = (o, imgs) => rightEdge(o, imgs) >= W / 2;
const sleep = (ms, g) => new Promise(r => setTimeout(() => r(g === gen), ms));

async function dogScript(g) {
  const p = bark.play(); if (p && p.catch) p.catch(() => {});
  while (g === gen && !touchRightWall(dog, dogImgs)) {
    dog.x += 5;
    dog.shape = (dog.shape + 1) % dogImgs.length;
    if (!await sleep(100 + 1000 / 60, g)) return;
  }
  if (g === gen) dogArrived = true;
}
function catClicked() {
  if (!running) return;
  cat.x += 7;
  cat.shape = (cat.shape + 1) % catImgs.length;
  if (touchRightWall(cat, catImgs)) {
    speech = '도착!';
    const won = !dogArrived;
    running = false; gen++;
    const g = gen;
    setTimeout(() => {
      if (g !== gen) return;
      msg.textContent = won ? '고양이가 먼저 도착했어요! 이제 직접 만들어 볼까요?' : '강아지가 더 빨랐어요. 더 빠르게 클릭해 보세요!';
      startBtn.textContent = '↺ 다시하기';
      overlay.classList.remove('hide');
    }, 1500);
  }
}
function start() {
  reset();
  overlay.classList.add('hide');
  hint.textContent = '클릭! 클릭! 고양이를 달리게 하세요.';
  running = true;
  dogScript(gen);
}
function drawSprite(o, imgs) {
  const img = imgs[o.shape], w = img.width * o.scale, h = img.height * o.scale;
  ctx.drawImage(img, (o.x + W / 2) - w / 2, (H / 2 - o.y) - h / 2, w, h);
}
function drawSpeech(o, imgs, text) {
  const img = imgs[o.shape], h = img.height * o.scale;
  const cx = o.x + W / 2, top = (H / 2 - o.y) - h / 2;
  ctx.font = 'bold 14px "Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif';
  const pw = ctx.measureText(text).width + 20, ph = 28;
  const bx = Math.max(4, Math.min(W - pw - 4, cx - pw / 2)), by = Math.max(4, top - ph - 8);
  ctx.fillStyle = '#fff'; ctx.strokeStyle = '#4f7cff'; ctx.lineWidth = 2;
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(bx, by, pw, ph, 10); else ctx.rect(bx, by, pw, ph);
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#222'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, bx + pw / 2, by + ph / 2 + 1);
}
function frame() {
  ctx.setTransform(K, 0, 0, K, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.drawImage(bg, 0, 0, W, H);
  drawSprite(cat, catImgs);
  drawSprite(dog, dogImgs);
  if (speech) drawSpeech(cat, catImgs, speech);
  requestAnimationFrame(frame);
}
cv.addEventListener('pointerdown', e => { e.preventDefault(); catClicked(); });
startBtn.addEventListener('click', start);
document.getElementById('resetBtn').addEventListener('click', reset);
Promise.all([load(SRC.bg), Promise.all(SRC.dog.map(load)), Promise.all(SRC.cat.map(load))]).then(r => {
  bg = r[0]; dogImgs = r[1]; catImgs = r[2];
  reset(); requestAnimationFrame(frame);
});
})();
