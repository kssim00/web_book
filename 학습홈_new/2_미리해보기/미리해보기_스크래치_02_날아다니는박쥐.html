<title>미리 해보기 - 날아다니는 박쥐</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#e6f4fb;font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#0c3a5c}
.wrap{width:min(640px,100vw);padding:14px}
h1{font-size:22px;margin:0 0 4px;text-align:center}
.sub{font-size:15px;text-align:center;margin:0 0 10px;color:#3b6585}

.stage{position:relative;border-radius:16px;overflow:hidden;border:3px solid #1c6ea4;background:#fff;line-height:0}
canvas{width:100%;height:auto;display:block;cursor:pointer;touch-action:none}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(255,255,255,.74);line-height:1.4}
.overlay.hide{display:none}
.overlay p{margin:0;font-size:17px;font-weight:700;text-align:center;padding:0 16px}
button{font:inherit;font-size:18px;font-weight:700;border:0;border-radius:999px;padding:12px 30px;background:#1c6ea4;color:#fff;cursor:pointer}
button:hover{filter:brightness(1.08)}
.bar{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:15px;gap:8px}
.bar button{font-size:15px;padding:8px 18px;background:#fff;color:#1c6ea4;border:2px solid #1c6ea4}
</style>
