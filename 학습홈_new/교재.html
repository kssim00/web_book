<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>파이썬 교재</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="favicon-180.png">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#fff;font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
button{font:inherit;cursor:pointer}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}
.fab{position:fixed;right:18px;bottom:18px;z-index:10;display:flex;align-items:center;gap:6px;padding:6px;border-radius:999px;background:rgba(14,18,32,.82);backdrop-filter:blur(8px);box-shadow:0 6px 20px rgba(0,0,0,.22);transition:opacity .2s}
.fab button{border:0;border-radius:999px;height:36px;padding:0 14px;font-size:13.5px;font-weight:700;color:#e6ebf7;background:transparent;white-space:nowrap}
.fab button:hover{background:rgba(255,255,255,.12)}
.fab button:disabled{opacity:.3;cursor:not-allowed;background:transparent}
.fab .ic{width:36px;padding:0;font-size:16px}
.fab .go{background:var(--k,#5cc8ff);color:#0e1220}
.fab .go:hover{background:var(--k,#5cc8ff);filter:brightness(1.1)}
.fab .pos{font-size:12px;color:#8a95b3;padding:0 6px 0 4px;font-family:"JetBrains Mono","D2Coding","Consolas",monospace}
@media (max-width:600px){.fab .pos{display:none}}
.toc{position:fixed;left:0;top:0;bottom:0;width:170px;z-index:9;background:#f6f7fb;border-right:1px solid #e6e8f0;padding:14px 8px;overflow-y:auto;scrollbar-width:none;transform:translateX(-100%);transition:transform .25s ease}
.toc::-webkit-scrollbar{display:none}
.toc a{display:flex;gap:7px;align-items:baseline;padding:6px 8px;border-radius:8px;font-size:12.5px;color:#5b6478;text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toc a b{font-weight:600;font-size:11px;color:#9aa3b8;min-width:22px;font-family:"JetBrains Mono","D2Coding","Consolas",monospace}
.toc a span{overflow:hidden;text-overflow:ellipsis}
.toc a:hover{background:#eceef5}
.toc a.cur{background:#fff0e2;color:#8a4a10;font-weight:700}
.toc a.cur b{color:#c2701f}
.tocTab{position:fixed;left:0;top:50%;z-index:10;width:12px;height:44px;transform:translateY(-50%);border:0;border-radius:0 8px 8px 0;background:#e9ecf4;color:#7a8499;font-size:11px;padding:0;opacity:.55;transition:left .25s ease,opacity .2s}
.tocTab:hover{opacity:1}
body.toc-open .toc{transform:none}
body.toc-open .tocTab{left:170px}
body.toc-open iframe{left:170px;width:calc(100% - 170px)}
iframe{transition:left .25s ease,width .25s ease}

</style>
</head>
<body>
<iframe id="frame" title="파이썬 교재"></iframe>
<nav class="toc" id="toc" hidden></nav>
<button class="tocTab" id="tocTab" title="목차 열기/닫기" hidden>›</button>
<div class="fab">
  <button id="treeBtn" title="스킬 트리로 돌아가기">← 스킬 트리</button>
  <span class="pos" id="pos"></span>
  <button class="ic" id="prevBtn">‹</button>
  <button class="go" id="nextBtn"></button>
  <button class="ic" id="newTab" title="새 창으로 보기">↗</button>
</div>
<script src="lib/py_data.js"></script>
<script>
(() => {
const $ = id => document.getElementById(id);
const D = window.PYDATA, flat = [], Q = new URLSearchParams(location.search), TUR = Q.has('t'), PK = TUR ? 't' : 'g', QK = TUR ? 't' : 'i', COL = TUR ? '#ff9b4a' : '#5cc8ff';
(TUR ? D.TURTLE : D.GRAMMAR).forEach(c => c.items.forEach(it => flat.push({ch: c.ch, glyph: it[0], title: it[1], file: it[2]})));
document.documentElement.style.setProperty('--k', COL);
const KEY = 'studyhome_new_3d_demo';
let S = {};
try { const v = JSON.parse(localStorage.getItem(KEY)); if (v && typeof v === 'object') S = v; } catch (e) {}
if (!S.py || typeof S.py !== 'object') S.py = {};
S.py.g = S.py.g | 0; S.py.t = S.py.t | 0; if (!Array.isArray(S.py.b)) S.py.b = []; S.py[PK] = Math.max(0, Math.min(flat.length, S.py[PK]));
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
let i = parseInt(Q.get(QK), 10);
if (isNaN(i) || i < 0 || i >= flat.length) i = Math.min(S.py[PK], flat.length - 1);
const cur = flat[i], plain = TUR ? D.TURTLE_URL + '?lesson=' + i : D.BASE + cur.file, url = TUR ? plain + '&embed=1' : plain;
document.title = cur.title + ' · 파이썬 교재';
$('frame').src = url;
$('pos').textContent = (i + 1) + ' / ' + flat.length;
$('pos').title = (TUR ? '터틀 ' : '문법 ') + cur.ch.replace(/\s+/g, ' ') + ' · ' + cur.title;
const BEACH = TUR && S.pyAt === 'beach', HOMEURL = BEACH ? '해변.html?back=1' : '화산섬.html', HOMENAME = BEACH ? '해변길' : '스킬 트리';
if (BEACH) { $('treeBtn').textContent = '← 해변길'; $('treeBtn').title = '해변길로 돌아가기'; }
const go = k => { location.href = '교재.html?' + QK + '=' + k; };
const prev = $('prevBtn'), next = $('nextBtn'), last = i === flat.length - 1, isNow = i === S.py[PK];
prev.title = i > 0 ? '이전: ' + flat[i - 1].title : '처음 교재예요'; prev.disabled = i === 0;
prev.addEventListener('click', () => go(i - 1));
next.textContent = last ? (isNow ? '✓ 완료하고 ' + HOMENAME + '로' : HOMENAME + '로 ›') : (isNow ? '✓ 완료하고 다음 ›' : '다음 ›');
next.title = last ? HOMENAME + '로 돌아가기' : '다음: ' + flat[i + 1].title;
next.addEventListener('click', () => { if (isNow) { S.py[PK] = i + 1; save(); } if (last) location.href = HOMEURL; else go(i + 1); });
$('treeBtn').addEventListener('click', () => { location.href = HOMEURL; });
$('newTab').addEventListener('click', () => window.open(plain, '_blank'));
// 목차 서랍(터틀만): 평소엔 접혀 있고 왼쪽 작은 탭으로 연다. 열림 상태는 차시를 넘겨도 유지
if (TUR) {
  const toc = $('toc'), tab = $('tocTab'), TK = 'studyhome_new_toc_open';
  toc.hidden = false; tab.hidden = false;
  flat.forEach((it, k) => {
    const a = document.createElement('a'); a.href = '교재.html?' + QK + '=' + k; a.title = it.title;
    if (k === i) a.className = 'cur';
    const short = it.title.split(/[:,-]/)[0].trim();
    a.innerHTML = '<b>' + (it.glyph === 'mini' ? '★' : it.glyph) + '</b><span></span>';
    a.querySelector('span').textContent = short;
    toc.appendChild(a);
  });
  const setOpen = o => { document.body.classList.toggle('toc-open', o); tab.textContent = o ? '‹' : '›'; try { localStorage.setItem(TK, o ? '1' : ''); } catch (e) {} };
  let open = false; try { open = localStorage.getItem(TK) === '1'; } catch (e) {}
  setOpen(open);
  tab.addEventListener('click', () => setOpen(!document.body.classList.contains('toc-open')));
  const c = toc.querySelector('.cur'); if (c) c.scrollIntoView({block: 'center'});
}
})();
</script>
</body>
</html>
