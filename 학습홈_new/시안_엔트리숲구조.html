<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시안 · 엔트리 숲 구조 (기초 → 3급 관문 → 심화·AI)</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#dff0f7;font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#22331b;overflow:hidden}
button{font:inherit;cursor:pointer}
.wrap{position:fixed;inset:0;display:flex}
.mapbox{flex:1;position:relative;min-width:0}
svg{width:100%;height:100%;display:block}
.node{cursor:pointer}
.node:hover .ring{stroke-width:5}
.node.sel .ring{stroke:#ff8f5a;stroke-width:6}
.lbl{font-size:17px;font-weight:900;fill:#1f3a14;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round;pointer-events:none}
.sub{font-size:12.5px;font-weight:700;fill:#4b6a37;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round;pointer-events:none}
.ai .lbl{fill:#2b1f5c}.ai .sub{fill:#5546a8}
.top{position:absolute;left:16px;top:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{background:rgba(255,255,255,.92);border-radius:999px;padding:7px 14px;font-weight:800;font-size:14px;box-shadow:0 2px 10px rgba(0,0,0,.1)}
.tog{border:0}
.tog.on{background:#ffe9a8}
.panel{width:340px;flex-shrink:0;background:#fffdf7;border-left:1px solid #e3ead9;display:flex;flex-direction:column;box-shadow:-6px 0 24px rgba(30,50,20,.08)}
.ph{padding:18px 18px 12px;border-bottom:1px solid #eef2e8}
.ph .tag{display:inline-block;font-size:12px;font-weight:800;border-radius:999px;padding:3px 10px;background:#d9efc4;color:#2c5a0f}
.ph .tag.ai{background:#e4defc;color:#3c2f8f}
.ph .tag.gate{background:#fff0c2;color:#7a5600}
.ph .tag.opt{background:#eef0ea;color:#5f665a}
.ph h2{margin:8px 0 4px;font-size:20px}
.ph p{margin:0;font-size:13.5px;line-height:1.6;color:#4b5a40}
.pb{flex:1;overflow-y:auto;padding:10px 14px 18px}
.m{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border-radius:12px;margin-bottom:6px;background:#f6faf1}
.ai-on .m{background:#f4f2fd}
.m b{min-width:38px;font-size:12px;font-weight:800;color:#5b8a3a;font-family:"JetBrains Mono","D2Coding","Consolas",monospace;padding-top:2px}
.ai-on .m b{color:#6a5acd}
.m .t{font-size:14.5px;font-weight:800;line-height:1.4}
.m .c{font-size:12px;color:#6a7a5c;margin-top:2px;line-height:1.5}
.dev{display:inline-block;font-size:11px;font-weight:800;border-radius:999px;padding:1px 7px;margin-left:4px;background:#fde2e2;color:#8a2a2a;vertical-align:1px}
.newc{display:inline-block;font-size:11px;font-weight:800;border-radius:999px;padding:1px 7px;margin-right:4px;background:#fff3c4;color:#7a5600}
.foot{padding:12px 16px;border-top:1px solid #eef2e8;font-size:12.5px;color:#6a7a5c;line-height:1.6}
.hint{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:rgba(20,32,14,.8);color:#fff;border-radius:999px;padding:8px 16px;font-size:13.5px;font-weight:700}
@media (max-width:900px){.wrap{flex-direction:column}.panel{width:100%;height:45%}.mapbox{height:55%}}
</style>
</head>
<body>
<div class="wrap">
  <div class="mapbox">
    <svg id="map" viewBox="0 0 1200 760" preserveAspectRatio="xMidYMid meet" aria-label="엔트리 숲 구조 지도"></svg>
    <div class="top">
      <span class="chip">🌲 엔트리 숲 · 구조 시안</span>
      <button class="chip tog" id="progTog">진도 예시 보기</button>
    </div>
    <div class="hint" id="hint">공터를 누르면 오른쪽에 미션 목록이 나와요</div>
  </div>
  <aside class="panel" id="panel">
    <div class="ph"><span class="tag" id="pTag">안내</span><h2 id="pTitle">엔트리 숲 구조</h2><p id="pDesc"></p></div>
    <div class="pb" id="pList"></div>
    <div class="foot">📷 카메라 · 🎤 마이크 · 🔊 스피커가 필요한 미션은 빨간 표시. <span class="newc">새</span> = 이 공터에서 처음 배우는 개념.</div>
  </aside>
</div>
<script>
(() => {
const $ = id => document.getElementById(id);
/* 구역 데이터 — 미션 이름은 원장님 파일 이름·장면 이름에서 가져옴 */
const N = [
 {id:'u1', x:150, y:640, zone:'base', title:'1단원', sub:'움직임·장면 꾸미기', newc:'시작하기·움직임·반복',
  ms:[['1-1','장면 꾸미기 예시'],['1-2','움직임 (징검다리·스케이트장)'],['1-3','미끄럼·전망대·호수·자유 날기'],['1-4','끝말잇기']]},
 {id:'u2', x:330, y:560, zone:'base', title:'2단원', sub:'모양·소리·조건', newc:'모양 바꾸기·소리·만일(조건)',
  ms:[['2-1','널뛰기 잠수부'],['2-2','풍선 동물원'],['2-3','x·y 좌표 생쥐 편의점'],['2-4','사과, 곰돌이']]},
 {id:'o1', x:250, y:420, zone:'opt', r:34, title:'선택 길', sub:'쉬운 복습', newc:'',
  desc:'코딩하루 프로젝트 1의 1차시. 아주 쉬워서 빨리 끝낸 아이나 복습이 필요한 아이에게.',
  ms:[['P1-1','달리기 시합'],['P1-1','바닷속 꽃게잡기']]},
 {id:'u3', x:470, y:430, zone:'base', title:'3단원', sub:'장면 이동·복제', newc:'장면·좌표 계산·복제',
  ms:[['3-1','흡혈귀'],['3-2','강아지 여행 (장면 이동 · 4개 파일을 한 미션으로)'],['3-3','별똥별 공 피하기 게임'],['3-4','해적 문어']]},
 {id:'o2', x:600, y:560, zone:'opt', r:34, title:'선택 길', sub:'복제 연습', newc:'',
  desc:'코딩하루 프로젝트 1의 4차시. 3단원의 복제를 한 번 더 연습.',
  ms:[['P1-4','꽃 만들기'],['P1-4','풍선 터트리기']]},
 {id:'u4', x:350, y:290, zone:'base', title:'4단원', sub:'조건 반복', newc:'~이 될 때까지 반복·참이 될 때까지 기다리기',
  ms:[['4-1','장애물 넘기'],['4-2','선풍기 주차'],['4-3','거미를 하트로'],['4-4','좀비 피하기']]},
 {id:'u5', x:190, y:170, zone:'base', title:'5단원', sub:'묻고 답하기·변수·신호', newc:'묻고 답하기·변수·신호',
  ms:[['5-1','퀴즈 (묻고 대답 기다리기)'],['5-2','동전 받기'],['5-3','두더지 게임'],['5-4','스위치·모자 (신호 보내기)']]},
 {id:'sg', x:400, y:110, zone:'base', title:'신호 수련장', sub:'신호 보강', newc:'',
  desc:'COS 3급 30문제 중 27문제에 신호가 나와요. 와이즈에서는 5-4에서 처음 배우니, 바로 이어서 신호 위주 미션 4개로 충분히 연습해요. (코딩하루 프로젝트 1의 2·3차시)',
  ms:[['P1-2','신비한 물약'],['P1-2','어떤 모자가 어울릴까'],['P1-3','소방차 출동'],['P1-3','미로 탈출']]},
 {id:'u6', x:590, y:200, zone:'base', title:'6-1', sub:'엔트리 런게임', newc:'점수 변수·논리 연산',
  desc:'기초 과정의 마지막 큰 게임.',
  ms:[['6-1','엔트리 런게임']]},
 {id:'rv', x:720, y:330, zone:'base', title:'총정리 캠프', sub:'코딩하루 프로젝트 2', newc:'붓·타이머',
  desc:'3급 전에 배운 것을 섞어서 쓰는 총정리. 리뉴얼판 8개 — 상황에 따라 일부만 해도 돼요.',
  ms:[['P2-1','별 도장 아트'],['P2-1','대칭 그림 그리기'],['P2-2','숫자 맞히기'],['P2-2','곱셈 달리기 시합'],['P2-3','선물상자 모으기'],['P2-3','별 모으기'],['P2-4','총알 피하기'],['P2-4','성으로 달리는 엔트리봇']]},
 {id:'g3', x:800, y:520, zone:'gate', title:'COS 3급 관문', sub:'자격증 · 다음 단계로', newc:'',
  desc:'여기까지가 엔트리 기초 과정. 합격하면 문이 열리고 심화·인공지능 구역으로 넘어가요. 세계 지도의 COS 시험의 탑(시험 연습)과 연결.',
  ms:[]},
 {id:'a1', x:930, y:600, zone:'ai', title:'리스트·함수', sub:'파이썬으로 가는 다리', newc:'리스트·글상자·함수',
  desc:'함수는 COS 2급 30문제 중 26문제에 나오는 핵심.',
  ms:[['6-2','우리 반 대표 뽑기 (리스트 · 3개 파일을 한 미션으로)'],['6-3','로켓 슈팅 게임 (함수)']]},
 {id:'a2', x:1080, y:470, zone:'ai', title:'AI 써 보기', sub:'인식·번역·읽어주기', newc:'인공지능 블록',
  desc:'엔트리에 들어 있는 인공지능을 가져다 써 보는 단계.',
  ms:[['6-4','스마트 로봇 비서 (날씨·번역)'],['7-1','AI가 내 감정을 알아요','📷'],['7-2','가면무도회','📷'],['7-3','시각장애인 알림 서비스','📷🔊'],['7-4','위인 맞히기 게임','🎤🔊'],['8-1','AI 번역','🔊'],['8-2','맞춤법 확인 (받아쓰기)','🔊'],['8-3','엔트리봇의 조깅 (동작 인식)','📷'],['8-4','카우벨·모션 게임','📷']]},
 {id:'a3', x:960, y:270, zone:'ai', title:'AI 가르치기', sub:'모델 학습', newc:'데이터 모으기·학습·분류',
  desc:'데이터를 모아 AI를 직접 학습시키는 단계. AI 원리를 이해하는 데 가장 중요해요.',
  ms:[['9-1','해양 쓰레기 분류 AI'],['9-2','색칠놀이 (모델 학습)','📷'],['9-3','닮은 연예인 찾기'],['9-4','가위바위보 게임']]},
 {id:'g2', x:1100, y:120, zone:'gate', r:44, title:'COS 2급 관문', sub:'선택 · 다음 이정표', newc:'',
  desc:'원하면 다음 자격증 이정표로. 그 뒤 스크래치 또는 파이썬 터틀로.',
  ms:[]}
];
const PATH = ['u1','u2','u3','u4','u5','sg','u6','rv','g3','a1','a2','a3','g2'];
const SIDE = [['u2','o1'],['u3','o2']];
const byId = Object.fromEntries(N.map(n => [n.id, n]));
const DONE = new Set(['u1','u2','o1','u3','u4']); const NOW = 'u5';
let showProg = false, sel = null;

function svgEl(t, a, p) { const e = document.createElementNS('http://www.w3.org/2000/svg', t); for (const k in a) e.setAttribute(k, a[k]); if (p) p.appendChild(e); return e; }
function curve(a, b, k) { const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2, dx = b.x - a.x, dy = b.y - a.y; return 'M' + a.x + ',' + a.y + ' Q' + (mx - dy * (k || .22)) + ',' + (my + dx * (k || .22)) + ' ' + b.x + ',' + b.y; }

function draw() {
  const s = $('map'); s.innerHTML = '';
  const defs = svgEl('defs', {}, s);
  defs.innerHTML = '<radialGradient id="gF" cx="50%" cy="45%"><stop offset="0" stop-color="#b9e39a"/><stop offset="1" stop-color="#86c96a"/></radialGradient>' +
    '<radialGradient id="gA" cx="50%" cy="45%"><stop offset="0" stop-color="#d9d2ff"/><stop offset="1" stop-color="#a99af0"/></radialGradient>' +
    '<linearGradient id="gSea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfeaf5"/><stop offset="1" stop-color="#b6dcec"/></linearGradient>' +
    '<filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1d3a10" flood-opacity=".18"/></filter>';
  svgEl('rect', {x:0, y:0, width:1200, height:760, fill:'url(#gSea)'}, s);
  /* 땅: 왼쪽 숲(기초) · 오른쪽 보랏빛 숲(심화·AI) */
  svgEl('path', {d:'M40,720 C20,520 60,300 90,140 C120,40 360,20 560,60 C700,90 780,160 820,260 C860,380 860,520 820,640 C780,730 500,750 300,740 C180,735 60,745 40,720Z', fill:'url(#gF)', filter:'url(#sh)'}, s);
  svgEl('path', {d:'M840,700 C820,560 830,420 860,300 C880,180 950,60 1080,50 C1170,45 1185,200 1175,360 C1165,520 1170,640 1120,710 C1060,750 900,750 840,700Z', fill:'url(#gA)', filter:'url(#sh)'}, s);
  /* 나무 장식 */
  const rnd = (i => () => (i = (i * 9301 + 49297) % 233280) / 233280)(7);
  const occupied = (x, y) => N.some(n => Math.hypot(n.x - x, n.y - y) < (n.r || 46) + 26);
  for (let i = 0; i < 160; i++) {
    const ai = i % 3 === 0, x = ai ? 860 + rnd() * 300 : 80 + rnd() * 740, y = ai ? 80 + rnd() * 640 : 70 + rnd() * 650;
    if (occupied(x, y)) continue;
    if (!ai && (x - 430) ** 2 / 400 ** 2 + (y - 400) ** 2 / 340 ** 2 > 1) continue;
    if (ai) { svgEl('path', {d:'M' + x + ',' + (y - 18) + ' L' + (x + 8) + ',' + y + ' L' + x + ',' + (y + 6) + ' L' + (x - 8) + ',' + y + 'Z', fill: i % 2 ? '#7f6fe0' : '#9b8cf2', opacity:.85}, s); }
    else { svgEl('path', {d:'M' + x + ',' + (y - 20) + ' L' + (x + 11) + ',' + (y + 4) + ' L' + (x - 11) + ',' + (y + 4) + 'Z', fill: i % 2 ? '#3f8f3a' : '#4fa244'}, s); svgEl('rect', {x:x - 2, y:y + 4, width:4, height:5, fill:'#7a5a3a'}, s); }
  }
  /* 길 */
  for (let i = 0; i < PATH.length - 1; i++) {
    const a = byId[PATH[i]], b = byId[PATH[i + 1]], ai = b.zone === 'ai' || a.zone === 'ai' && b.zone !== 'base';
    const done = showProg && DONE.has(a.id) && (DONE.has(b.id) || b.id === NOW);
    svgEl('path', {d:curve(a, b, i % 2 ? .18 : -.18), fill:'none', stroke: ai ? '#efeaff' : '#f3e4c2', 'stroke-width':18, 'stroke-linecap':'round'}, s);
    svgEl('path', {d:curve(a, b, i % 2 ? .18 : -.18), fill:'none', stroke: done ? '#ff9b4a' : (ai ? '#c9bff5' : '#e2cc9a'), 'stroke-width': done ? 5 : 3, 'stroke-dasharray': done ? '0' : '2 10', 'stroke-linecap':'round'}, s);
  }
  SIDE.forEach(([a, b]) => svgEl('path', {d:curve(byId[a], byId[b], .25), fill:'none', stroke:'#f3e4c2', 'stroke-width':10, 'stroke-dasharray':'3 12', 'stroke-linecap':'round'}, s));
  /* 공터·관문 */
  N.forEach(n => {
    const g = svgEl('g', {class:'node' + (n.zone === 'ai' ? ' ai' : '') + (sel === n.id ? ' sel' : ''), transform:'translate(' + n.x + ',' + n.y + ')', tabindex:0, role:'button', 'aria-label':n.title + ' ' + n.sub}, s);
    const r = n.r || 46, done = showProg && DONE.has(n.id), now = showProg && n.id === NOW;
    if (n.zone === 'gate') {
      svgEl('rect', {x:-r, y:-r * .9, width:r * 2, height:r * 1.8, rx:10, fill:'#fff6d8', class:'ring', stroke:'#e0b84a', 'stroke-width':3, filter:'url(#sh)'}, g);
      svgEl('path', {d:'M' + (-r * .55) + ',' + (r * .9) + ' L' + (-r * .55) + ',' + (-r * .15) + ' A' + (r * .55) + ',' + (r * .55) + ' 0 0 1 ' + (r * .55) + ',' + (-r * .15) + ' L' + (r * .55) + ',' + (r * .9), fill:'#e9cf7a', stroke:'#c79a2a', 'stroke-width':2}, g);
      const t = svgEl('text', {x:0, y:r * .25, 'text-anchor':'middle', 'font-size':r * .6}, g); t.textContent = n.id === 'g3' ? '🏅' : '🎖️';
    } else {
      svgEl('circle', {r:r, fill: n.zone === 'opt' ? '#eef6e4' : (n.zone === 'ai' ? 'url(#gA)' : '#f4f9ea'), class:'ring', stroke: now ? '#ff9b4a' : (n.zone === 'ai' ? '#7f6fe0' : (n.zone === 'opt' ? '#b9d6a3' : '#5aa62a')), 'stroke-width': now ? 6 : 3, 'stroke-dasharray': n.zone === 'opt' ? '6 6' : '0', filter:'url(#sh)'}, g);
      const k = n.ms.length, show = Math.min(k, 10);
      for (let i = 0; i < show; i++) {
        const a = -Math.PI / 2 + i / show * Math.PI * 2, rr = r * .62;
        const md = done || (now && i < 2);
        svgEl('circle', {cx:Math.cos(a) * rr, cy:Math.sin(a) * rr, r: k > 6 ? 5 : 7, fill: md ? '#ff9b4a' : (n.zone === 'ai' ? '#fff' : '#ffffff'), stroke: md ? '#e07a2a' : (n.zone === 'ai' ? '#7f6fe0' : '#8cc56a'), 'stroke-width':2}, g);
      }
      const ic = svgEl('text', {x:0, y:7, 'text-anchor':'middle', 'font-size':20}, g); ic.textContent = n.zone === 'ai' ? '🤖' : (n.zone === 'opt' ? '🌿' : (n.id === 'sg' ? '📡' : (n.id === 'rv' ? '⛺' : (done ? '⭐' : '🌳'))));
    }
    const ly = (n.zone === 'gate' ? r * .9 : r) + 22;
    svgEl('text', {x:0, y:ly, 'text-anchor':'middle', class:'lbl'}, g).textContent = n.title;
    svgEl('text', {x:0, y:ly + 17, 'text-anchor':'middle', class:'sub'}, g).textContent = n.sub + (n.ms.length ? ' · ' + n.ms.length : '');
    if (now) { const t = svgEl('text', {x:0, y:-r - 12, 'text-anchor':'middle', 'font-size':24}, g); t.textContent = '🧒'; }
    g.addEventListener('click', () => pick(n.id));
    g.addEventListener('keydown', e => { if (e.key === 'Enter') pick(n.id); });
  });
  /* 구역 이름 */
  const zl = (x, y, t, c) => { const e = svgEl('text', {x, y, 'text-anchor':'middle', 'font-size':22, 'font-weight':900, fill:c, opacity:.75}, s); e.textContent = t; };
  zl(470, 748, '기초 숲 · 와이즈 엔트리 1~6-1', '#2f6a1f'); zl(1010, 748, '심화·인공지능 숲', '#3c2f8f');
}

function pick(id) {
  sel = id; const n = byId[id]; draw();
  $('hint').style.display = 'none';
  const tag = $('pTag'); tag.className = 'tag' + (n.zone === 'ai' ? ' ai' : n.zone === 'gate' ? ' gate' : n.zone === 'opt' ? ' opt' : '');
  tag.textContent = n.zone === 'ai' ? '심화·인공지능 숲' : n.zone === 'gate' ? '관문' : n.zone === 'opt' ? '선택 미션' : '기초 숲';
  $('pTitle').textContent = n.title + (n.zone === 'gate' ? '' : ' · ' + n.sub);
  $('pDesc').innerHTML = (n.desc ? n.desc + ' ' : '') + (n.newc ? '<br><span class="newc">새</span>' + n.newc : '');
  $('panel').classList.toggle('ai-on', n.zone === 'ai');
  $('pList').innerHTML = n.ms.length ? n.ms.map(m => '<div class="m"><b>' + m[0] + '</b><div><div class="t">' + m[1] + (m[2] ? '<span class="dev">' + m[2] + '</span>' : '') + '</div></div></div>').join('') : '<p style="font-size:14px;color:#6a7a5c;line-height:1.7;margin:6px 4px">미션 대신 시험을 보는 곳이에요. 합격 표시를 하면 다음 구역 길이 열리게 할 수 있어요.</p>';
}
function intro() {
  $('pDesc').innerHTML = '왼쪽 <b>기초 숲</b>은 원장님 커리큘럼(와이즈 엔트리 1~6-1)을 단원별 공터로 묶고, 5-4 뒤에 <b>신호 수련장</b>, 6-1 뒤에 <b>총정리 캠프</b>를 넣었어요. 그다음 <b>COS 3급 관문</b>을 지나면 오른쪽 <b>심화·인공지능 숲</b>이 열려요.';
  const all = N.filter(n => n.ms.length);
  const cnt = z => N.filter(n => n.zone === z).reduce((a, n) => a + n.ms.length, 0);
  $('pList').innerHTML = [['기초 숲', cnt('base') + '개 미션'], ['선택 길', cnt('opt') + '개 미션'], ['심화·인공지능 숲', cnt('ai') + '개 미션'], ['관문', 'COS 3급 · COS 2급(선택)']].map(r => '<div class="m"><div><div class="t">' + r[0] + '</div><div class="c">' + r[1] + '</div></div></div>').join('');
}
$('progTog').addEventListener('click', () => { showProg = !showProg; $('progTog').classList.toggle('on', showProg); $('progTog').textContent = showProg ? '진도 예시 끄기' : '진도 예시 보기'; draw(); });
draw(); intro();
})();
</script>
