<!DOCTYPE html>
<html lang="ko">
<head>

<title>시안 · 엔트리 숲 절충안 (걷기 + 확대·축소 지도)</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>

<body>
<canvas id="gl"></canvas>
<div id="pins"></div>
<div class="pick" id="pick">
  <button data-v="A" class="on">A. 굽이굽이 숲길</button>
  <button data-v="B">B. 나선형 산길</button>

</div>

<div class="zoom"><small>가까이</small><button id="zin" title="가까이">＋</button><input type="range" id="zr" min="0" max="100" value="0" aria-label="확대·축소"><button id="zout" title="멀리">－</button><small>전체</small></div>

<div class="bar"><button class="sub" id="meBtn">🧍 내 위치로</button><button class="go" id="doneBtn">✓ 미션 완료 (시연)</button></div>
<div class="toast" id="toast"></div>
<script src="lib/three.min.js"></script>
<script>document.write('<script src="lib/entry_course.js?t=' + Date.now() + '"><\/script>');</script>
<script>
(() => {
const $ = id => document.getElementById(id), T = THREE;
const DESC = {
  A: '숲속을 지그재그로 굽이굽이 이어지는 한 줄 길. 멀리서 보면 길 전체가 한 장의 지도처럼 보여요.',
  B: '산을 빙글빙글 돌며 올라가는 길. 미션을 할수록 높이 올라가고, COS 관문을 지나면 구름 위 보라빛 꼭대기(인공지능)로!',
  C: '보드게임 판처럼 칸을 한 칸씩 밟아 가는 길. 가장 깔끔하고 한눈에 잘 보여요.'
};
/* 미션 순서 (구조 파일에서 단원 구분 없이 펼침) */
const L = [];
window.ENTRY_COURSE.forEach(n => {
  if (n.zone === 'gate') L.push({gate: true, id: n.id, t: n.title, ai: n.id === 'g2', lm: n.title});
  else n.ms.forEach((m, i) => L.push({id: m[0], no: m[1], t: m[2], rev: !!n.opt, ai: n.zone === 'ai', lm: i === 0 && (n.id === 'sg' || n.id === 'rv' || n.id === 'a1') ? n.title : (i === 0 && n.opt ? '복습 길' : null), kind: n.id}));
});
const N = L.length, GATE3 = L.findIndex(x => x.id === 'g3');
let done = 9; /* 시연용 진도: 2단원 중간쯤 */
const isDone = i => i < done, isNow = i => i === done;

const renderer = new T.WebGLRenderer({canvas: $('gl'), antialias: true});
renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1)); renderer.shadowMap.enabled = true; renderer.shadowMap.type = T.PCFSoftShadowMap;
const cam = new T.PerspectiveCamera(48, 1, .5, 2000);
let scene, curve, SAMP, U, hero, H, signs, lms, HEIGHT, CENTER, EXT, VIEW = 'A', zoom = 0, zoomT = 0, snap = true;
const flat = (c, o) => new T.MeshStandardMaterial(Object.assign({color: c, flatShading: true, roughness: .95, metalness: 0}, o || {}));
const lam = c => new T.MeshLambertMaterial({color: c});
const smooth = (a, b, x) => { const t = Math.max(0, Math.min(1, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
let rs = 7; const rnd = () => (rs = (rs * 16807) % 2147483647) / 2147483647;

function build(v) {
  VIEW = v; rs = 7; scene = new T.Scene();
  const sky = v === 'B' ? '#c8e4f6' : '#bfe6f3'; scene.background = new T.Color(sky); scene.fog = new T.Fog(sky, 160, 700);
  scene.add(new T.HemisphereLight(0xeaf6ff, 0x5c7a3a, 1.2));
  const sun = new T.DirectionalLight(0xfff1d6, 2.3); sun.position.set(-120, 220, 90); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, {left: -220, right: 220, top: 220, bottom: -220, near: 10, far: 700}); scene.add(sun);
  /* 길 점 */
  const P = [];
  if (v === 'A') { const per = 7; for (let i = 0; i < N; i++) { const row = Math.floor(i / per), c = i % per, col = row % 2 ? per - 1 - c : c; P.push(new T.Vector3(-96 + col * 32 + Math.sin(i * 1.7) * 5, 0, 130 - row * 34 + Math.cos(i * 1.3) * 4)); } }
  if (v === 'B') { for (let i = 0; i < N; i++) { const t = i / (N - 1), a = t * Math.PI * 2 * 3.1 + .6, r = 150 - 118 * t; P.push(new T.Vector3(Math.cos(a) * r, 0, Math.sin(a) * r)); } }
  if (v === 'C') { const per = 9; for (let i = 0; i < N; i++) { const row = Math.floor(i / per), c = i % per, col = row % 2 ? per - 1 - c : c; P.push(new T.Vector3(-88 + col * 22, 0, 75 - row * 24)); } }
  HEIGHT = (x, z) => { if (v === 'B') { const r = Math.hypot(x, z); return 70 * (1 - smooth(10, 175, r)) + Math.sin(x * .2) * Math.cos(z * .2) * .6; } return Math.sin(x * .09) * Math.cos(z * .08) * .8 + Math.sin(x * .23 + z * .17) * .3; };
  P.forEach(p => p.y = HEIGHT(p.x, p.z));
  curve = new T.CatmullRomCurve3(P, false, 'catmullrom', v === 'C' ? 0 : .5); SAMP = curve.getSpacedPoints(N * 30);
  U = P.map(p => { let b = 0, m = 1e9; SAMP.forEach((q, i) => { const d = q.distanceToSquared(p); if (d < m) { m = d; b = i; } }); return b / (SAMP.length - 1); });
  const bb = new T.Box3().setFromPoints(P); CENTER = bb.getCenter(new T.Vector3()); EXT = bb.getSize(new T.Vector3());
  const aiStart = U[GATE3];
  const uNear = (x, z) => { let b = 0, m = 1e9; for (let i = 0; i < SAMP.length; i += 2) { const q = SAMP[i], d = (q.x - x) ** 2 + (q.z - z) ** 2; if (d < m) { m = d; b = i; } } return [Math.sqrt(m), b / (SAMP.length - 1)]; };
  /* 땅 */
  const R = v === 'B' ? 210 : 190, gg = new T.PlaneGeometry(R * 2.2, R * 2, 150, 140).rotateX(-Math.PI / 2); if (v !== 'B') gg.translate(CENTER.x, 0, CENTER.z); const pp = gg.attributes.position, col = [], c = new T.Color();
  const G1 = new T.Color('#86c96a'), G2 = new T.Color('#a2d67b'), A1 = new T.Color('#b4a5ee'), A2 = new T.Color('#c9bdf7'), PA = new T.Color('#f0dcaa'), PAI = new T.Color('#e6dcff'), SAND = new T.Color('#f3e2b3'), SNOW = new T.Color('#eef0f7'), BOARD = new T.Color('#fff7e2');
  for (let i = 0; i < pp.count; i++) {
    const x = pp.getX(i), z = pp.getZ(i), [d, u] = uNear(x, z), edge = v === 'B' ? Math.hypot(x, z) / 185 : Math.max(Math.abs(x - CENTER.x) / (EXT.x / 2 + 40), Math.abs(z - CENTER.z) / (EXT.z / 2 + 40));
    let y = HEIGHT(x, z); if (edge > 1) y = -2 - (edge - 1) * 30; pp.setY(i, y);
    const ai = u > aiStart && d < 40 ? smooth(aiStart, aiStart + .01, u) : 0;
    c.copy(G1).lerp(G2, (Math.sin(x * .2) * Math.sin(z * .23) + 1) / 2);
    if (v === 'B') { c.lerp(SNOW, smooth(48, 66, y) * .5); c.lerp(A1, smooth(aiStart, aiStart + .02, u) * (1 - smooth(10, 40, d)) * .9); }
    else c.lerp(A1, ai * (1 - smooth(14, 40, d)));
    if (v === 'C') c.lerp(BOARD, 1 - smooth(8, 12, d));
    else c.lerp(u > aiStart ? PAI : PA, 1 - smooth(2.2, 3.4, d));
    if (edge > .97) c.lerp(SAND, smooth(.97, 1.02, edge));
    col.push(c.r, c.g, c.b);
  }
  gg.setAttribute('color', new T.Float32BufferAttribute(col, 3)); gg.computeVertexNormals();
  const ground = new T.Mesh(gg, new T.MeshLambertMaterial({vertexColors: true})); ground.receiveShadow = true;
  if (v !== 'B') { /* 땅을 길 가운데로 옮겼으니 높이는 그대로 */ }
  scene.add(ground);
  const water = new T.Mesh(new T.PlaneGeometry(3000, 3000).rotateX(-Math.PI / 2), new T.MeshStandardMaterial({color: '#4cc0e0', roughness: .35})); water.position.y = -1.2; scene.add(water);
  /* 나무·수정 */
  const tps = [], cps = [];
  for (let i = 0; i < 6000 && tps.length + cps.length < (v === 'C' ? 260 : 720); i++) {
    const x = CENTER.x + (rnd() - .5) * (v === 'B' ? 360 : EXT.x + 70), z = CENTER.z + (rnd() - .5) * (v === 'B' ? 360 : EXT.z + 70);
    if (v === 'B' && Math.hypot(x, z) > 178) continue;
    const [d, u] = uNear(x, z); if (d < (v === 'C' ? 13 : 6.5)) continue;
    if (v === 'C' && rnd() < .5) continue;
    (u > aiStart && (v !== 'B' || HEIGHT(x, z) > 40) ? cps : tps).push([x, z, .8 + rnd() * .7, rnd() * 6]);
  }
  const mk = (geo, mat, list, colors) => { if (!list.length) return; const im = new T.InstancedMesh(geo, mat, list.length), o = new T.Object3D(); list.forEach((q, i) => { o.position.set(q[0], HEIGHT(q[0], q[1]) - .1, q[1]); o.scale.setScalar(q[2]); o.rotation.y = q[3]; o.updateMatrix(); im.setMatrixAt(i, o.matrix); if (colors) im.setColorAt(i, colors[i % colors.length]); }); im.castShadow = true; im.receiveShadow = true; scene.add(im); };
  const greens = ['#3f8f3a', '#4fa244', '#5bb04d', '#3a7f3a'].map(x => new T.Color(x)), purples = ['#8f7ff0', '#a597f7', '#7c6ae6', '#b9adfa'].map(x => new T.Color(x));
  mk(new T.CylinderGeometry(.3, .4, 1.6, 6).translate(0, .8, 0), flat('#8a6240'), tps);
  mk(new T.ConeGeometry(2, 4, 7).translate(0, 3.2, 0), flat('#fff'), tps, greens); mk(new T.ConeGeometry(1.5, 3, 7).translate(0, 4.8, 0), flat('#fff'), tps, greens.slice(1).concat(greens[0]));
  mk(new T.OctahedronGeometry(1.4, 0).scale(.7, 1.9, .7).translate(0, 2, 0), flat('#fff', {emissive: '#3a2a90', emissiveIntensity: .3}), cps, purples);
  if (v === 'B') for (let i = 0; i < 10; i++) { const cl = new T.Mesh(new T.SphereGeometry(10 + rnd() * 8, 12, 8), new T.MeshLambertMaterial({color: '#ffffff', transparent: true, opacity: .75})); const a = rnd() * 6.3, r = 40 + rnd() * 30; cl.position.set(Math.cos(a) * r, 52 + rnd() * 10, Math.sin(a) * r); cl.scale.y = .4; scene.add(cl); }
  /* 길 띠 (A·B) */
  if (v !== 'C') { const n = SAMP.length - 1, vv = [], idx = [], cc = []; for (let i = 0; i <= n; i++) { const u = i / n, p = SAMP[i], t = curve.getTangentAt(u), r = new T.Vector3(-t.z, 0, t.x).normalize(), w = 2.2, k = new T.Color(u > aiStart ? (i % 2 ? '#e2d8ff' : '#d6caff') : (i % 2 ? '#ecd49a' : '#dfc282')); vv.push(p.x - r.x * w, HEIGHT(p.x - r.x * w, p.z - r.z * w) + .12, p.z - r.z * w, p.x + r.x * w, HEIGHT(p.x + r.x * w, p.z + r.z * w) + .12, p.z + r.z * w); cc.push(k.r, k.g, k.b, k.r, k.g, k.b); if (i < n) { const q = i * 2; idx.push(q, q + 1, q + 2, q + 1, q + 3, q + 2); } } const g = new T.BufferGeometry(); g.setAttribute('position', new T.Float32BufferAttribute(vv, 3)); g.setAttribute('color', new T.Float32BufferAttribute(cc, 3)); g.setIndex(idx); g.computeVertexNormals(); const m = new T.Mesh(g, new T.MeshLambertMaterial({vertexColors: true, side: T.DoubleSide})); m.receiveShadow = true; scene.add(m); }
  /* 표지판 / 칸 */
  signs = L.map((it, i) => {
    const p = P[i], t = curve.getTangentAt(U[i]), r = new T.Vector3(-t.z, 0, t.x).normalize(), g = new T.Group(); scene.add(g);
    if (it.gate) {
      g.position.copy(p); g.lookAt(p.clone().add(t)); const s = it.id === 'g2' ? .8 : 1.15, st = flat('#d8c89a');
      [-1, 1].forEach(k => { const pl = new T.Mesh(new T.BoxGeometry(1.6 * s, 8 * s, 1.6 * s), st); pl.position.set(k * 4 * s, 4 * s, 0); pl.castShadow = true; g.add(pl); });
      const ar = new T.Mesh(new T.TorusGeometry(4 * s, .8 * s, 8, 20, Math.PI), st); ar.position.y = 8 * s; g.add(ar);
      const md = new T.Mesh(new T.CylinderGeometry(1.1 * s, 1.1 * s, .3, 18).rotateX(Math.PI / 2), flat('#e6c25a', {emissive: '#6a4a00', emissiveIntensity: .2})); md.position.set(0, 12.4 * s, 0); g.add(md);
      return {g, i, top: 14 * s};
    }
    if (v === 'C') {
      g.position.copy(p); const tile = new T.Mesh(new T.CylinderGeometry(7.5, 7.8, 1.2, 6), flat('#ffffff')); tile.position.y = .5; tile.castShadow = tile.receiveShadow = true; g.add(tile);
      const cv = document.createElement('canvas'); cv.width = cv.height = 256; const tex = new T.CanvasTexture(cv); tex.colorSpace = T.SRGBColorSpace;
      const top = new T.Mesh(new T.CircleGeometry(6.6, 6).rotateX(-Math.PI / 2), new T.MeshLambertMaterial({map: tex})); top.position.y = 1.12; g.add(top);
      return {g, i, tile, cv, tex, top: 2.5};
    }
    const sp = p.clone().addScaledVector(r, 3.6); g.position.copy(sp); g.position.y = HEIGHT(sp.x, sp.z); const fd = t.clone().multiplyScalar(-.85).addScaledVector(r, -.5); g.rotation.y = Math.atan2(fd.x, fd.z);
    const post = new T.Mesh(new T.CylinderGeometry(.16, .2, 3.6, 6), flat('#7c5433')); post.position.y = 1.8; post.castShadow = true; g.add(post);
    const cv = document.createElement('canvas'); cv.width = 256; cv.height = 160; const tex = new T.CanvasTexture(cv); tex.colorSpace = T.SRGBColorSpace;
    const board = new T.Mesh(new T.BoxGeometry(3.2, 2, .2), [flat('#a8754a'), flat('#a8754a'), flat('#a8754a'), flat('#a8754a'), new T.MeshLambertMaterial({map: tex}), flat('#a8754a')]); board.position.y = 3.4; board.castShadow = true; g.add(board);
    const ring = new T.Mesh(new T.RingGeometry(1.6, 2.1, 32).rotateX(-Math.PI / 2), new T.MeshBasicMaterial({color: '#ffcf3f', transparent: true, opacity: .9})); ring.position.set(p.x, HEIGHT(p.x, p.z) + .2, p.z); scene.add(ring);
    return {g, i, cv, tex, ring, board, top: 5};
  });
  /* 랜드마크 */
  lms = [];
  L.forEach((it, i) => { if (!it.lm || it.gate) return; const p = P[i], t = curve.getTangentAt(U[i]), r = new T.Vector3(-t.z, 0, t.x).normalize(), q = p.clone().addScaledVector(r, v === 'C' ? -14 : -11), g = new T.Group(); g.position.set(q.x, HEIGHT(q.x, q.z), q.z); scene.add(g);
    if (it.kind === 'sg') { const tw = new T.Mesh(new T.CylinderGeometry(.4, .8, 12, 6), flat('#c94f4f')); tw.position.y = 6; tw.castShadow = true; g.add(tw); const b = new T.Mesh(new T.SphereGeometry(1.1, 12, 8), flat('#ffe14d', {emissive: '#806000', emissiveIntensity: .5})); b.position.y = 12.5; g.add(b); }
    else if (it.kind === 'rv') { const tn = new T.Mesh(new T.ConeGeometry(4.5, 5.5, 4), flat('#ff9b4a')); tn.position.y = 2.8; tn.rotation.y = .8; tn.castShadow = true; g.add(tn); const f = new T.Mesh(new T.ConeGeometry(.8, 1.6, 6), flat('#ffcf4a', {emissive: '#a05000', emissiveIntensity: .7})); f.position.set(5, 1, 2); g.add(f); }
    else if (it.kind === 'a1') { const cr = new T.Mesh(new T.OctahedronGeometry(2.6, 0).scale(.8, 2.4, .8), flat('#c9bfff', {emissive: '#5a48d8', emissiveIntensity: .6})); cr.position.y = 6.5; cr.castShadow = true; g.add(cr); g.userData.spin = cr; }
    else { const lf = new T.Mesh(new T.SphereGeometry(1.4, 8, 6), flat('#7fd39a')); lf.position.y = 2; g.add(lf); const st = new T.Mesh(new T.CylinderGeometry(.2, .2, 2, 5), flat('#7c5433')); st.position.y = 1; g.add(st); }
    lms.push({g, i, name: it.lm, top: it.kind === 'sg' ? 15 : it.kind === 'a1' ? 13 : 8});
  });
  /* 탐험가 */
  hero = new T.Group(); scene.add(hero); H = {legs: [], arms: []};
  const skin = lam('#ffd9b0'), dark = lam('#4a3626'), cloth = lam('#6cc4ee');
  const mk2 = (geo, mat, x, y, z, par) => { const m = new T.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = true; (par || hero).add(m); return m; };
  mk2(new T.CapsuleGeometry(.33, .42, 4, 10), cloth, 0, 1, 0); mk2(new T.BoxGeometry(.5, .52, .26), lam('#a8754a'), 0, 1.06, -.36); mk2(new T.SphereGeometry(.34, 16, 12), skin, 0, 1.72, 0);
  mk2(new T.SphereGeometry(.37, 16, 10, 0, 6.29, 0, 1.75), lam('#5a3a22'), 0, 1.75, -.03);
  [[-.17, .62, 1], [.17, .62, 1], [-.44, 1.28, 0], [.44, 1.28, 0]].forEach(d => { const pv = new T.Group(); pv.position.set(d[0], d[1], 0); hero.add(pv); mk2(new T.CapsuleGeometry(d[2] ? .12 : .095, d[2] ? .36 : .34, 3, 8), d[2] ? lam('#3f4c6b') : cloth, 0, d[2] ? -.3 : -.26, 0, pv); (d[2] ? H.legs : H.arms).push(pv); });
  hero.scale.setScalar(v === 'B' ? 2.6 : 2.4);

}
/* 표지판 칠하기 */
function paint() {
  signs.forEach(s => {
    const it = L[s.i]; if (it.gate || !s.cv) return; const x = s.cv.getContext('2d'), W = s.cv.width, Hh = s.cv.height, st = isDone(s.i) ? 'done' : isNow(s.i) ? 'now' : 'open';
    const bg = st === 'done' ? '#ffe2c7' : st === 'now' ? '#fff27a' : it.ai ? '#ece7ff' : it.rev ? '#dff5ee' : '#fbf0d2';
    x.fillStyle = bg; x.fillRect(0, 0, W, Hh);

    x.fillStyle = st === 'done' ? '#d0661a' : it.ai ? '#5546a8' : it.rev ? '#2a8a7a' : '#3b6d11'; x.textAlign = 'center'; x.textBaseline = 'middle';
    x.font = '900 ' + (VIEW === 'C' ? 74 : 58) + 'px "Pretendard","Malgun Gothic",sans-serif'; x.fillText(st === 'done' ? '⭐' : it.no === 'P1' || it.no === 'P2' ? (it.rev ? '복습' : it.no) : it.no, W / 2, VIEW === 'C' ? Hh / 2 : 62, W - 20);
    if (VIEW !== 'C') { x.font = '800 26px "Pretendard","Malgun Gothic",sans-serif'; x.fillStyle = '#3b2a17'; x.fillText(it.t.split(' (')[0], W / 2, 122, W - 16); }

  });

}
/* 이름표 */
let pinEls = [], meEl;
function makePins() {
  $('pins').innerHTML = ''; pinEls = [];
  L.forEach((it, i) => { const b = document.createElement('button'); b.className = 'lb m' + (it.rev ? ' rev' : '') + (it.ai ? ' ai' : ''); b.innerHTML = '<b>' + (it.gate ? '🏅' : it.no === 'P1' || it.no === 'P2' ? '•' : it.no) + '</b>' + it.t.split(' (')[0]; b.addEventListener('click', () => walkTo(i)); $('pins').appendChild(b); pinEls.push({b, i, kind: 'm'}); });
  lms.forEach(l => { const b = document.createElement('div'); b.className = 'lb lm' + (l.name.includes('관문') ? ' gate' : '') + (L[l.i].ai ? ' ai' : ''); b.textContent = (L[l.i].kind === 'sg' ? '📡 ' : L[l.i].kind === 'rv' ? '⛺ ' : L[l.i].kind === 'a1' ? '🤖 ' : '🍃 ') + l.name; $('pins').appendChild(b); pinEls.push({b, i: l.i, kind: 'lm', lm: l}); });
  signs.filter(s => L[s.i].gate).forEach(s => { const b = document.createElement('div'); b.className = 'lb lm gate'; b.textContent = (s.i === GATE3 ? '🏅 ' : '🎖️ ') + L[s.i].t; $('pins').appendChild(b); pinEls.push({b, i: s.i, kind: 'gate', s}); });
  meEl = document.createElement('div'); meEl.className = 'lb me'; meEl.textContent = '나'; $('pins').appendChild(meEl);
}
/* 걷기 */
let hu = 0, walking = null;
function walkTo(i) { walking = {to: U[i], i}; }
$('doneBtn').addEventListener('click', () => { if (done >= N - 1 || walking) return; done++; paint(); toast('⭐ 미션 완료! 다음 표지판으로 걸어가요'); walkTo(done); if (zoomT > .5) zoomT = .15; });
$('meBtn').addEventListener('click', () => { zoomT = 0; });
function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('show'), 2000); }
/* 확대·축소 */

$('zr').addEventListener('input', e => { zoomT = e.target.value / 100; });
$('zin').addEventListener('click', () => { zoomT = Math.max(0, zoomT - .25); }); $('zout').addEventListener('click', () => { zoomT = Math.min(1, zoomT + .25); });
addEventListener('wheel', e => { zoomT = Math.max(0, Math.min(1, zoomT + e.deltaY * .0012)); }, {passive: true});
$('pick').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; document.querySelectorAll('#pick button').forEach(x => x.classList.toggle('on', x === b)); build(b.dataset.v); });
function resize() { renderer.setSize(innerWidth, innerHeight, false); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

const clock = new T.Clock(), tmp = new T.Vector3(), dir = new T.Vector3(0, 0, -1), cp = new T.Vector3(), cl = new T.Vector3(), cpT = new T.Vector3(), clT = new T.Vector3(); let time = 0;
function frame() {
  requestAnimationFrame(frame); const dt = Math.min(clock.getDelta(), .05); time += dt;
  let moving = false;
  if (walking) { const sp = 20 / curve.getLength() * dt, d = walking.to - hu; if (Math.abs(d) <= sp) { hu = walking.to; walking = null; } else { hu += Math.sign(d) * sp; moving = true; } }
  const p = curve.getPointAt(Math.max(0, Math.min(1, hu))), t = curve.getTangentAt(Math.max(0, Math.min(1, hu))).setY(0).normalize();
  if (walking && walking.to < hu) t.negate();
  dir.lerp(t, .1).normalize(); hero.position.set(p.x, HEIGHT(p.x, p.z) + .2 + (moving ? Math.abs(Math.sin(time * 10)) * .15 : 0), p.z); hero.rotation.y = Math.atan2(dir.x, dir.z);
  H.legs.forEach((l, i) => { l.rotation.x = moving ? Math.sin(time * 10 + i * Math.PI) * .6 : 0; }); H.arms.forEach((a, i) => { a.rotation.x = moving ? Math.sin(time * 10 + i * Math.PI + Math.PI) * .5 : Math.sin(time * 2 + i) * .06; });
  /* 카메라: 0 = 탐험가 뒤, 1 = 전체 지도 */
  zoom += (zoomT - zoom) * (snap ? 1 : Math.min(1, dt * 3)); $('zr').value = Math.round(zoomT * 100);
  const z = zoom * zoom * (3 - 2 * zoom), side = new T.Vector3(-dir.z, 0, dir.x);
  const fP = hero.position.clone().addScaledVector(dir, -15).addScaledVector(side, 3).add(new T.Vector3(0, 9, 0)), fL = hero.position.clone().addScaledVector(dir, 8).add(new T.Vector3(0, 2, 0));
  const span = Math.max(EXT.x, EXT.z * 1.3) + 40, oL = VIEW === 'B' ? new T.Vector3(0, 25, 0) : CENTER.clone(), oP = oL.clone().add(VIEW === 'B' ? new T.Vector3(0, span * .62, span * 1.0) : new T.Vector3(0, span * 1.05, span * .62));
  cpT.copy(fP).lerp(oP, z); clT.copy(fL).lerp(oL, z);
  if (snap) { cp.copy(cpT); cl.copy(clT); snap = false; } else { cp.lerp(cpT, Math.min(1, dt * 5)); cl.lerp(clT, Math.min(1, dt * 5)); }
  cam.position.copy(cp); cam.lookAt(cl);
  signs.forEach(s => { if (s.ring && s.ring.visible) s.ring.scale.setScalar(1 + Math.sin(time * 4) * .12); if (s.board && isNow(s.i)) s.board.position.y = 3.4 + Math.sin(time * 4) * .15; });
  lms.forEach(l => { if (l.g.userData.spin) l.g.userData.spin.rotation.y = time; });
  renderer.render(scene, cam);
  /* 이름표: 가까이선 주변 미션 이름, 멀리선 랜드마크·관문·지금 */
  const W = innerWidth, Hh = innerHeight, far = z > .45;
  pinEls.forEach(e => {
    const it = L[e.i], pos = e.kind === 'm' ? (signs[e.i].g.position) : e.kind === 'lm' ? e.lm.g.position : e.s.g.position, top = e.kind === 'm' ? signs[e.i].top + 1.5 : e.kind === 'lm' ? e.lm.top : e.s.top;
    tmp.set(pos.x, pos.y + top, pos.z); const dist = tmp.distanceTo(cam.position); tmp.project(cam);
    let show = tmp.z < 1 && tmp.x > -1.1 && tmp.x < 1.1 && tmp.y > -1.1 && tmp.y < .9;
    if (e.kind === 'm') { if (far) show = show && isNow(e.i); else show = show && dist < 70 && !it.gate; e.b.classList.toggle('now', isNow(e.i)); e.b.classList.toggle('done', isDone(e.i)); }
    else if (!far) show = show && dist < 120;
    e.b.classList.toggle('hide', !show); e.b.style.left = ((tmp.x * .5 + .5) * W) + 'px'; e.b.style.top = ((-tmp.y * .5 + .5) * Hh) + 'px';
  });
  tmp.copy(hero.position); tmp.y += 6; tmp.project(cam); meEl.style.left = ((tmp.x * .5 + .5) * W) + 'px'; meEl.style.top = ((-tmp.y * .5 + .5) * Hh) + 'px'; meEl.classList.toggle('hide', !far);
}
build('A'); frame();
})();
