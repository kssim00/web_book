<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>거북이 해변길 (체험용 시안)</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
*{box-sizing:border-box}
:root{--sand:#fff6e0;--ink:#1f3d47;--dim:#5f7a82;--sea:#14a3a8;--sea2:#0d7f86;--coral:#ff7a4d;--ok:#2fa56b;--line:#e6d7b2;--card:#ffffff;--arc:#7a5cf0}
html,body{margin:0;background:var(--sand);color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
button{font:inherit;cursor:pointer}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:12px 20px;background:var(--sea);color:#fff}
header .brand{margin-right:auto}
header b{display:block;font-size:20px;font-weight:800}
header span{font-size:13px;opacity:.9}
.chip{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.45);color:#fff;border-radius:999px;padding:7px 14px;font-size:14px;font-weight:700}
button.chip:hover{background:rgba(255,255,255,.3)}
main{max-width:1120px;margin:0 auto;padding:18px 18px 70px}
h2{font-size:22px;margin:26px 4px 4px;font-weight:800}
.sub{margin:0 4px 12px;color:var(--dim);font-size:15px}
.beach{background:linear-gradient(#bdeef0 0 34%,#ffe9b8 34% 100%);border:2px solid var(--line);border-radius:22px;padding:6px;overflow:hidden}
#path{display:block;width:100%;height:auto}
.stop{cursor:pointer}
.stop .ring{fill:#fff;stroke:#b9cdd0;stroke-width:5}
.stop.done .ring{stroke:var(--ok)}
.stop.now .ring{stroke:var(--coral);stroke-width:7}
.stop.sel .ring{fill:#fff3d6}
.stop:hover .ring{fill:#fff8e6}
.stop .no{font-size:15px;font-weight:800;fill:#fff}
.stop .nm{font-size:15px;font-weight:700;fill:var(--ink);text-anchor:middle}
.stop .bd{fill:#9fb4b8}
.stop.done .bd{fill:var(--ok)}
.stop.now .bd{fill:var(--coral)}
.stop.now .pulse{animation:pulse 1.6s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(1.45)}}
.detail{display:grid;grid-template-columns:150px 1fr auto;gap:18px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px 20px;margin-top:12px}
.detail svg{width:150px;height:150px;background:#f4fbfb;border-radius:14px}
.detail .tag{display:inline-block;font-size:13px;font-weight:800;color:#fff;background:var(--sea);border-radius:999px;padding:3px 11px}
.detail h3{margin:8px 0 4px;font-size:21px}
.detail p{margin:0;color:var(--dim);font-size:15.5px;line-height:1.55}
.col{display:flex;flex-direction:column;gap:8px;min-width:170px}
.b1{border:0;border-radius:12px;padding:12px 16px;font-size:16px;font-weight:800;color:#fff;background:var(--coral)}
.b1:hover{filter:brightness(1.06)}
.b2{border:2px solid var(--line);border-radius:12px;padding:10px 16px;font-size:15px;font-weight:700;background:#fff;color:var(--ink)}
.b2:hover{border-color:var(--sea)}
.note{font-size:13px;color:var(--dim)}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.game{background:var(--card);border:2px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;position:relative}
.game:hover{border-color:var(--arc);transform:translateY(-2px);transition:transform .12s}
.game svg{display:block;width:100%;height:auto;background:#10203a}
.game .in{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.game b{font-size:16.5px}
.game small{color:var(--dim);font-size:13px;line-height:1.4;flex:1}
.game .row{display:flex;gap:6px}
.game .play{flex:1;border:0;border-radius:10px;padding:9px 6px;font-size:14.5px;font-weight:800;color:#fff;background:var(--arc)}
.game .how{border:2px solid var(--line);border-radius:10px;padding:7px 9px;font-size:13.5px;font-weight:700;background:#fff;color:var(--ink)}
.game .chk{position:absolute;right:8px;top:8px;width:34px;height:34px;border-radius:50%;border:2px solid #fff;background:rgba(16,32,58,.55);color:#fff;font-size:17px;font-weight:800}
.game.done .chk{background:var(--ok)}
.modal{position:fixed;inset:0;z-index:20;background:rgba(10,25,35,.6);display:none;align-items:center;justify-content:center;padding:16px}
.modal.show{display:flex}
.mbox{width:min(980px,100%);height:min(720px,92vh);background:#fff;border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.mtop{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;font-weight:800;border-bottom:2px solid var(--line)}
.mtop button{border:2px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-weight:700}
.mbox iframe{flex:1;border:0;width:100%}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-weight:700;opacity:0;transition:.25s;pointer-events:none;z-index:30}
.toast.show{opacity:1;transform:translateX(-50%)}
.simbar{position:fixed;left:14px;bottom:14px;z-index:15;background:rgba(20,28,40,.88);color:#fff;font:600 13px/1.4 sans-serif;padding:8px 14px;border-radius:999px}
.simbar button{margin-left:8px;border:0;border-radius:999px;padding:4px 10px;font:700 12px sans-serif}
@media (max-width:760px){.detail{grid-template-columns:1fr}.detail svg{margin:0 auto}}
</style>
</head>
<body>
<header>
  <div class="brand"><b>거북이 해변길</b><span>파이썬 터틀 · 그림으로 배우는 첫 파이썬</span></div>
  <span class="chip" id="who">탐험가</span>
  <span class="chip" id="pts">0 / 10</span>
  <button class="chip" id="backBtn">화산섬으로</button>
</header>
<main>
  <h2>해변길 따라 걷기</h2>
  <p class="sub">동그라미 안의 그림이 그 차시에 만드는 작품이에요. 어느 칸이든 눌러서 열어 볼 수 있어요.</p>
  <div class="beach"><svg id="path" viewBox="0 0 1040 400" role="img" aria-label="터틀 10차시 길"></svg></div>
  <div class="detail">
    <svg id="dPic" viewBox="-32 -32 64 64"></svg>
    <div><span class="tag" id="dTag"></span><h3 id="dTitle"></h3><p id="dDesc"></p></div>
    <div class="col"><button class="b1" id="openBtn">교재 열기</button><button class="b2" id="doneBtn"></button><span class="note" id="dNote"></span></div>
  </div>
  <h2>오락실 · 게임 만들기</h2>
  <p class="sub">해변길에서 배운 걸로 만드는 게임이에요. 먼저 해 보고, 마음에 드는 게임부터 만들어요.</p>
  <div class="games" id="games"></div>
</main>
<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="mbox"><div class="mtop"><span id="mTitle"></span><button id="mClose">닫기 ✕</button></div><iframe id="mFrame" title="미리 해보기"></iframe></div></div>
<div class="simbar">체험용 시안 · 거북이 해변길 + 오락실<button id="resetBtn">진행 초기화</button></div>

<script src="lib/py_data.js"></script>
<script>
(() => {
const $ = id => document.getElementById(id);
const TUR = [].concat.apply([], window.PYDATA.TURTLE.map(c => c.items)), BONUS = window.PYDATA.BONUS, BASE = window.PYDATA.BASE;
const KEY = 'studyhome_new_3d_demo';
let S = {name: '탐험가'};
try { const v = JSON.parse(localStorage.getItem(KEY)); if (v && typeof v === 'object') S = Object.assign(S, v); } catch (e) {}
if (!S.py || typeof S.py !== 'object') S.py = {};
S.py.t = Math.max(0, Math.min(TUR.length, S.py.t | 0)); S.py.g = S.py.g | 0;
S.py.b = Array.isArray(S.py.b) ? S.py.b.filter(x => BONUS.some(b => b[0] === x)) : [];
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
$('who').textContent = S.name || '탐험가';
function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2200); }

/* 거북이 그림 */
function tur(x, y, c, s, r) {
  return '<g transform="translate(' + x + ' ' + y + ') rotate(' + (r || 0) + ') scale(' + (s || 1) + ')">' +
    '<circle cx="9" cy="0" r="3.4" fill="' + c + '"/><circle cx="-5" cy="-6.5" r="2.3" fill="' + c + '"/><circle cx="-5" cy="6.5" r="2.3" fill="' + c + '"/><circle cx="5" cy="-6.5" r="2.3" fill="' + c + '"/><circle cx="5" cy="6.5" r="2.3" fill="' + c + '"/>' +
    '<ellipse cx="0" cy="0" rx="8" ry="6.6" fill="' + c + '" stroke="rgba(0,0,0,.25)" stroke-width="1"/><path d="M-4 -3L0 -5L4 -3L4 3L0 5L-4 3Z" fill="none" stroke="rgba(255,255,255,.6)" stroke-width="1"/></g>';
}
const SHORT = ['화면·모양·색', '앞뒤로 이동', '좌표·펜', '방향 바꾸기', '원·색·도장', '반복문 무늬', '방패 만들기', '함수', '키보드·마우스', '피하기 게임'];
const rose = (() => { let s = ''; for (let i = 0; i < 9; i++) s += '<rect x="-13" y="-13" width="26" height="26" fill="none" stroke="hsl(' + (i * 40) + ' 75% 50%)" stroke-width="1.6" transform="rotate(' + (i * 10) + ')"/>'; return s; })();
const PIC = [
  tur(-9, -8, '#2fa56b', 1.25) + '<circle cx="12" cy="12" r="5" fill="#ff7a4d"/><circle cx="-2" cy="14" r="5" fill="#f5b921"/><circle cx="-15" cy="11" r="5" fill="#3f8fe4"/>',
  '<path d="M-22 6H12" stroke="#3f8fe4" stroke-width="3.5" stroke-linecap="round"/><path d="M-22 6l6 -5M-22 6l6 5" stroke="#3f8fe4" stroke-width="3" fill="none" stroke-linecap="round"/>' + tur(14, 6, '#2fa56b', 1.05),
  '<path d="M-24 0H24M0 -24V24" stroke="#b9cdd0" stroke-width="1.5"/><path d="M-16 14L-4 2" stroke="#ff7a4d" stroke-width="3" stroke-linecap="round"/><path d="M-4 2L10 -12" stroke="#ff7a4d" stroke-width="2" stroke-dasharray="1 5" stroke-linecap="round"/><circle cx="14" cy="-16" r="4.5" fill="#ff7a4d"/><text x="6" y="22" font-size="8" fill="#5f7a82">(x, y)</text>',
  '<path d="M-16 14V-14H14V14Z" fill="none" stroke="#7a5cf0" stroke-width="3" stroke-linejoin="round"/><path d="M-16 4A10 10 0 0 0 -6 14" fill="none" stroke="#ff7a4d" stroke-width="2.5"/><text x="-8" y="6" font-size="8" font-weight="700" fill="#ff7a4d">90°</text>',
  '<circle cx="-4" cy="-3" r="15" fill="#f5b921" stroke="#d99a06" stroke-width="2"/>' + tur(15, 15, '#2fa56b', .6) + tur(-17, 17, '#3f8fe4', .6) + '<text x="-10" y="2" font-size="12" font-weight="800" fill="#fff">가</text>',
  rose,
  '<circle r="22" fill="#14a3a8"/><circle r="16" fill="#fff"/><circle r="10" fill="#ff7a4d"/><circle r="4" fill="#fff"/>',
  '<path d="M-22 12L-13 -4L-4 12Z" fill="none" stroke="#2fa56b" stroke-width="2.6"/><rect x="2" y="-18" width="15" height="15" fill="none" stroke="#3f8fe4" stroke-width="2.6"/><path d="M11 3L20 10L16.5 21H5.5L2 10Z" fill="none" stroke="#ff7a4d" stroke-width="2.6"/><text x="-23" y="-9" font-size="8.5" font-weight="700" fill="#7a5cf0">def</text>',
  '<g fill="#fff" stroke="#5f7a82" stroke-width="1.6"><rect x="-7" y="-19" width="14" height="14" rx="3"/><rect x="-23" y="-3" width="14" height="14" rx="3"/><rect x="-7" y="-3" width="14" height="14" rx="3"/><rect x="9" y="-3" width="14" height="14" rx="3"/></g><path d="M0 -15v6M0 -15l-3 3M0 -15l3 3M-19 4h6M-19 4l3 -3M-19 4l3 3M19 4h-6M19 4l-3 -3M19 4l-3 3M0 8v-6M0 8l-3 -3M0 8l3 -3" stroke="#ff7a4d" stroke-width="1.8" fill="none" stroke-linecap="round"/>',
  tur(-2, 16, '#2fa56b', 1.05, -90) + '<circle cx="-14" cy="-14" r="5" fill="#8a5a34"/><circle cx="6" cy="-18" r="5" fill="#8a5a34"/><circle cx="17" cy="-4" r="5" fill="#8a5a34"/><path d="M-14 -7v6M6 -11v6M17 3v6" stroke="#b9cdd0" stroke-width="2" stroke-dasharray="2 3"/>'
];

/* 해변길 */
const svg = $('path'), N = TUR.length;
const pos = TUR.map((_, i) => [70 + i * 100, 196 + Math.sin(i * 1.15 + 0.4) * 78]);
let d = 'M' + pos[0][0] + ' ' + pos[0][1];
for (let i = 1; i < N; i++) { const a = pos[i - 1], b = pos[i], mx = (a[0] + b[0]) / 2; d += ' C' + mx + ' ' + a[1] + ' ' + mx + ' ' + b[1] + ' ' + b[0] + ' ' + b[1]; }
let h = '<path d="M0 124 Q130 104 260 124 T520 124 T780 124 T1040 124" fill="none" stroke="#fff" stroke-width="5" opacity=".7"/>';
h += '<path d="' + d + '" fill="none" stroke="#e9c98a" stroke-width="30" stroke-linecap="round"/><path d="' + d + '" fill="none" stroke="#fff" stroke-width="4" stroke-dasharray="2 16" stroke-linecap="round"/>';
h += '<path id="prog" d="' + d + '" fill="none" stroke="#2fa56b" stroke-width="8" stroke-linecap="round"/>';
pos.forEach((p, i) => {
  h += '<g class="stop" data-i="' + i + '" tabindex="0"><circle class="pulse" cx="' + p[0] + '" cy="' + p[1] + '" r="44" fill="none" stroke="#ff7a4d" stroke-width="4" opacity="0"/>' +
    '<circle class="ring" cx="' + p[0] + '" cy="' + p[1] + '" r="42"/><g transform="translate(' + p[0] + ' ' + p[1] + ') scale(1.12)">' + PIC[i] + '</g>' +
    '<circle class="bd" cx="' + (p[0] - 31) + '" cy="' + (p[1] - 31) + '" r="15"/><text class="no" x="' + (p[0] - 31) + '" y="' + (p[1] - 26) + '" text-anchor="middle">' + (i + 1) + '</text>' +
    '<text class="nm" x="' + p[0] + '" y="' + (p[1] + 64) + '">' + SHORT[i] + '</text></g>';
});
h += '<g id="walker"></g>';
svg.innerHTML = h;
const prog = $('prog'), PL = prog.getTotalLength ? prog.getTotalLength() : 1000;
prog.setAttribute('stroke-dasharray', PL);
const stops = [...svg.querySelectorAll('.stop')];
let sel = Math.min(S.py.t, N - 1);
const stT = i => i < S.py.t ? 'done' : i === S.py.t ? 'now' : 'open';
function lenAt(i) { if (i <= 0) return 0; if (i >= N - 1) return PL; let lo = 0, hi = PL; for (let k = 0; k < 22; k++) { const m = (lo + hi) / 2; if (prog.getPointAtLength(m).x < pos[i][0]) lo = m; else hi = m; } return lo; }
function render() {
  stops.forEach((g, i) => { g.setAttribute('class', 'stop ' + stT(i) + (i === sel ? ' sel' : '')); });
  prog.setAttribute('stroke-dashoffset', PL - lenAt(Math.min(S.py.t, N - 1)));
  const w = pos[Math.min(S.py.t, N - 1)]; $('walker').innerHTML = tur(w[0] + 34, w[1] - 40, '#2fa56b', 1.5, 20);
  const it = TUR[sel], st = stT(sel);
  $('dPic').innerHTML = PIC[sel]; $('dTag').textContent = (sel + 1) + '번째 길 · ' + (st === 'done' ? '완료' : st === 'now' ? '지금 할 차례' : '열어 볼 수 있어요');
  $('dTag').style.background = st === 'done' ? 'var(--ok)' : st === 'now' ? 'var(--coral)' : 'var(--sea)';
  $('dTitle').textContent = it[1]; $('dDesc').textContent = sel === 6 ? '반복문으로 동그란 방패 무늬를 그리는 미니 프로젝트예요.' : it[3];
  $('openBtn').textContent = st === 'done' ? '교재 다시 보기' : '교재 열기';
  $('doneBtn').style.display = st === 'open' ? 'none' : 'block'; $('doneBtn').textContent = st === 'done' ? '✓ 완료함 (누르면 취소)' : '다 했어요!';
  $('dNote').textContent = st === 'open' ? '완료 표시는 지금 할 차례부터 순서대로 해요.' : '';
  $('pts').textContent = S.py.t + ' / ' + N + ' · 게임 ' + S.py.b.length + ' / ' + BONUS.length;
  [...$('games').children].forEach(c => { const on = S.py.b.includes(c.dataset.id); c.classList.toggle('done', on); c.querySelector('.chk').textContent = on ? '✓' : '☆'; });
}
stops.forEach((g, i) => { g.addEventListener('click', () => { sel = i; render(); }); g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); sel = i; render(); } }); });
$('openBtn').addEventListener('click', () => { location.href = '교재.html?t=' + sel; });
$('doneBtn').addEventListener('click', () => {
  const st = stT(sel);
  if (st === 'now') { S.py.t++; toast(S.py.t >= N ? '해변길을 끝까지 걸었어요!' : '다음 칸으로 걸어갔어요.'); if (S.py.t < N) sel = S.py.t; }
  else if (st === 'done') { if (sel === S.py.t - 1) S.py.t--; else { toast('마지막으로 완료한 칸만 취소할 수 있어요.'); return; } }
  save(); render();
});

/* 오락실 그림 */
const G = {
  paint: '<rect width="200" height="120" fill="#fffdf5"/><path d="M20 80C50 20 70 110 100 50S150 30 180 70" fill="none" stroke="#ff7a4d" stroke-width="7" stroke-linecap="round"/><path d="M30 35C60 60 90 15 130 30" fill="none" stroke="#3f8fe4" stroke-width="6" stroke-linecap="round"/><path d="M60 100C90 85 130 105 165 95" fill="none" stroke="#2fa56b" stroke-width="6" stroke-linecap="round"/>' + tur(180, 70, '#1f3d47', 1.1, 30),
  arrow: '<rect width="200" height="120" fill="#dff3ff"/><circle cx="150" cy="60" r="38" fill="#fff" stroke="#e8483b" stroke-width="6"/><circle cx="150" cy="60" r="23" fill="#fff" stroke="#3f8fe4" stroke-width="6"/><circle cx="150" cy="60" r="9" fill="#f5b921"/><path d="M22 84L132 64" stroke="#7c5433" stroke-width="5" stroke-linecap="round"/><path d="M146 61L128 56L131 70Z" fill="#555"/><path d="M22 84l-8 -8M22 84l-10 4" stroke="#e8483b" stroke-width="4" stroke-linecap="round"/>',
  maze: '<rect width="200" height="120" fill="#1b2a4a"/><g stroke="#7fd1ff" stroke-width="5" stroke-linecap="round" fill="none"><path d="M20 15H180V105H20Z"/><path d="M52 15V75M84 45V105M116 15V60M116 82V105M148 40V105M52 75H84M148 40H180"/></g>' + tur(36, 92, '#6fe39a', 1, -90) + '<rect x="158" y="18" width="16" height="16" rx="3" fill="#f5b921"/>',
  cannon: '<rect width="200" height="120" fill="#cdefff"/><rect y="96" width="200" height="24" fill="#7cc66a"/><path d="M34 88Q100 -20 162 80" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="3 8" stroke-linecap="round"/><g transform="translate(30 92) rotate(-42)"><rect x="-4" y="-8" width="36" height="16" rx="6" fill="#3d4852"/></g><circle cx="30" cy="96" r="11" fill="#7c5433"/><circle cx="108" cy="30" r="7" fill="#222"/><rect x="152" y="70" width="24" height="26" fill="#e8483b"/><path d="M148 70L164 54L180 70Z" fill="#b5362b"/>',
  run: '<rect width="200" height="120" fill="#e9f8e4"/><path d="M30 95C60 70 80 85 105 55" fill="none" stroke="#2fa56b" stroke-width="3" stroke-dasharray="2 7" stroke-linecap="round"/>' + tur(112, 48, '#2fa56b', 1.5, -45) + tur(48, 84, '#e8483b', 1.7, -35) + '<text x="150" y="34" font-size="20" font-weight="800" fill="#ff7a4d">!</text><path d="M128 30l10 -8M134 42l12 -2" stroke="#ff7a4d" stroke-width="3" stroke-linecap="round"/>',
  art: '<rect width="200" height="120" fill="#15131f"/><path d="M20 20L80 20L80 70L140 70L140 30L180 30" fill="none" stroke="#ff5a8a" stroke-width="5"/><path d="M30 100L30 50L110 50L110 100L170 100L170 60" fill="none" stroke="#5cc8ff" stroke-width="5"/><path d="M60 110L60 85L150 85L150 15L100 15" fill="none" stroke="#ffd23f" stroke-width="5"/>' + tur(100, 15, '#fff', .9, 180),

BONUS.forEach(b => {
  const c = document.createElement('div'); c.className = 'game'; c.dataset.id = b[0];
  c.innerHTML = '<svg viewBox="0 0 200 120">' + (G[b[0]] || '') + '</svg><button class="chk" title="완료 표시">☆</button><div class="in"><b></b><small></small><div class="row"><button class="play">▶ 미리 해보기</button><button class="how">만드는 법</button></div></div>';
  c.querySelector('b').textContent = b[1]; c.querySelector('small').textContent = b[3];
  c.querySelector('.play').addEventListener('click', () => { $('mTitle').textContent = '미리 해보기 · ' + b[1]; $('mFrame').src = '터틀게임.html?g=' + b[0]; $('modal').classList.add('show'); });
  c.querySelector('.how').addEventListener('click', () => window.open(BASE + b[2], '_blank'));
  c.querySelector('.chk').addEventListener('click', () => { if (S.py.b.includes(b[0])) S.py.b = S.py.b.filter(x => x !== b[0]); else { S.py.b.push(b[0]); toast('게임 완성!'); } save(); render(); });
  $('games').appendChild(c);
});
const closeModal = () => { $('modal').classList.remove('show'); $('mFrame').src = 'about:blank'; };
$('mClose').addEventListener('click', closeModal);
$('modal').addEventListener('click', e => { if (e.target === $('modal')) closeModal(); });
$('backBtn').addEventListener('click', () => { location.href = '화산섬.html'; });
$('resetBtn').addEventListener('click', () => { S.py.t = 0; S.py.b = []; save(); sel = 0; render(); });
render();
})();
