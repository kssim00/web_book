<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>엔트리 미션</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="favicon-180.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#f4f6f1;font-family:Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#1d2a16;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
/* 위 고정 줄: 숲길 · 완성작 해보기 */
.topbar .in{max-width:680px;margin:0 auto;padding:28px 18px 0;display:flex;align-items:center;gap:10px}
.backl{font-size:15px;font-weight:700;color:#5f6b56;padding:4px 0}
.backl:hover{color:#1d2a16}
.ghost{font-size:15px;font-weight:700;color:#3b6d11;text-decoration:none}
.ghost:hover{text-decoration:underline;text-underline-offset:4px}
.playl{font-size:15px;font-weight:800;color:#3b6d11;white-space:nowrap}
.playl:hover{text-decoration:underline;text-underline-offset:4px}
.tbadge{font-size:12px;font-weight:800;color:#7a5600;background:#ffe9a8;border-radius:999px;padding:4px 10px}
.page{max-width:680px;margin:0 auto;padding:0 18px 60px}
.eyebrow{margin:14px 0 6px;font-size:14px;font-weight:800;color:#5aa62a}
h1{margin:0;font-size:30px;font-weight:800;letter-spacing:-.6px;line-height:1.3}
.goal{margin:10px 0 0;font-size:16px;color:#5f6b56;line-height:1.65}
.goal b{color:#1d2a16}
.needs{display:flex;flex-direction:column;gap:6px;margin:16px 0 0}
.need{display:flex;gap:10px;align-items:flex-start;border-radius:14px;padding:10px 14px;font-size:15px;line-height:1.55;background:#fff6d6;color:#6a4b00}
.need .i{font-size:20px;line-height:1.2}
.meta{display:flex;align-items:center;gap:12px;margin:24px 0 10px}
.bar{flex:1;height:6px;border-radius:3px;background:#e1e7da;overflow:hidden}.bar i{display:block;height:100%;background:#5aa62a;transition:width .3s}
.meta span{font-size:14px;color:#7b8770;font-weight:700}
/* 단계 목록 */
.list{background:#fff;border-radius:20px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(40,60,20,.06);margin:0;padding:0;list-style:none}
.it{border-top:1px solid #eef1ea}.it:first-child{border-top:0}
.ih{display:flex;align-items:center;gap:14px;padding:20px 22px;cursor:pointer}
.ck{width:28px;height:28px;border-radius:50%;box-shadow:inset 0 0 0 2.5px #cfd8c5;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:900;transition:.15s;background:#fff}
.ck:hover{box-shadow:inset 0 0 0 2.5px #5aa62a}
.it.d .ck{background:#5aa62a;box-shadow:none}
.tt{flex:1;font-size:18px;font-weight:800}
.it.d .tt{color:#a5ae9c}
.nowtag{font-size:12px;font-weight:800;color:#5aa62a;background:#eaf5df;border-radius:999px;padding:3px 9px}
.ib{display:none;padding:0 22px 22px 64px}
.it.o .ib{display:block}
.say{margin:0;font-size:17px;line-height:1.7;color:#3f4b36}
.chips{display:flex;gap:18px;margin-top:12px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:15px;font-weight:800;padding:2px 0;border-bottom:2px solid transparent}
.chip.h{color:#a86a00}.chip.k{color:#1b6fa8}.chip.a{color:#8a6a00}
.chip:hover,.chip.on{border-bottom-color:currentColor}
.pane{margin-top:12px;padding:16px;border-radius:14px;background:#f7f9f4;font-size:16px;line-height:1.7;color:#3f4b36}
.pane.h{background:#fffbea}
.pane.code{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start;overflow-x:auto}
.pane.ans{display:flex;flex-wrap:wrap;gap:16px;overflow-x:auto;background:#fffdf3;box-shadow:inset 0 0 0 1.5px #f2c94c}
.pane .sub{display:block;margin-top:6px;font-size:14.5px;color:#7b6a3a}
.ans .lab{width:100%;font-size:12px;font-weight:800;color:#8a6a00;margin:-2px 0 -6px}
.okrow{display:flex;justify-content:flex-end;margin-top:16px}
.ok{border-radius:999px;padding:7px 14px;font-size:14px;font-weight:700;color:#3b6d11;box-shadow:inset 0 0 0 1.5px #bcd5a6}
.ok:hover{background:#5aa62a;color:#fff;box-shadow:none}
/* 블록 */
.obj{font-size:12px;font-weight:700;color:#8a9580;margin:0 0 6px}
.pile{display:flex;flex-wrap:wrap;align-items:flex-start;gap:10px 12px;max-width:100%}
.pile>*{transform:rotate(var(--r,0deg))}
.stack{display:inline-flex;flex-direction:column;align-items:flex-start}
.b{display:inline-flex;align-items:center;gap:5px;padding:7px 12px;border-radius:7px;color:#fff;font-size:13.5px;font-weight:600;line-height:1.2;white-space:nowrap}
.stack>*+*,.in>*+*{margin-top:2px}
.b.hat{border-radius:16px 16px 7px 7px;padding-top:9px}
.v{display:inline-block;background:#fff;color:#333;border-radius:999px;padding:1px 9px;font-size:12.5px;font-weight:600}
.v.sel{border-radius:5px}
.v.blank{min-width:30px;height:19px;vertical-align:middle;padding:0}
.v.bool{border-radius:4px;background:#8fa2ff;color:#fff;padding:2px 6px}
.c{display:flex;flex-direction:column;align-items:flex-start;border-radius:7px}
.c .head,.c .foot{padding:7px 12px;color:#fff;font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:5px;white-space:nowrap}
.c .foot{padding:5px 12px;min-width:70px}
.c .head.mid{padding:5px 12px}
.c .in{margin-left:14px;padding:2px 2px 2px 0;background:#fff;border-radius:0 6px 6px 0;display:flex;flex-direction:column;align-items:flex-start}
.c.hollow .in{min-width:110px;min-height:22px;box-shadow:inset 0 0 0 1.5px #e3e8dd}
.start{background:#2fae51}.flow{background:#14b6d9}.move{background:#a34ee8}.look{background:#ee4f84}.sound{background:#7cb300}.judge{background:#4a63f0}.calc{background:#f0a21a}.data{background:#d94fd0}.func{background:#d9661c}.ai{background:#1f9e8f}.brush{background:#e8901c}
/* 아래 */
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:24px;gap:10px}
.done{border-radius:999px;padding:11px 22px;font-size:15px;font-weight:700;background:#1d2a16;color:#fff}
.done.was{background:#e3ead9;color:#4b6a37}
/* 완성작 창 */
.modal{position:fixed;inset:0;background:rgba(20,28,14,.6);display:flex;align-items:center;justify-content:center;z-index:60;padding:18px;visibility:hidden;opacity:0;transition:opacity .15s}
.modal.on{visibility:visible;opacity:1}
.modal .box{width:min(900px,100%);background:#fff;border-radius:22px;overflow:hidden;display:flex;flex-direction:column}
.modal .mh{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;font-weight:800;font-size:16px}
.mclose{font-size:14px;font-weight:700;border-radius:999px;padding:7px 14px;background:#f1f4ed}
.modal iframe{width:100%;height:min(640px,76vh);border:0;display:block}
.empty{text-align:center;padding:60px 20px;font-size:17px;line-height:1.8;color:#4b6a37}
@media (max-width:600px){.ib{padding-left:22px}h1{font-size:25px}}
</style>
</head>
<body>
<div class="topbar"><div class="in"><button class="backl" id="backBtn">← 숲길</button></div></div>
<div class="page" id="page">
  <p class="eyebrow" id="tag"></p>
  <h1 id="title"></h1>
  <p class="goal" id="goal"></p>
  <div class="needs" id="needs" hidden></div>
  <div class="meta"><div class="bar"><i id="barI"></i></div><span id="count"></span><button class="playl" data-play hidden>▶ 완성작</button></div>
  <ol class="list" id="steps"></ol>
  <div class="foot">
    <a class="ghost" href="https://playentry.org/ws/new" target="_blank" rel="noopener">엔트리 열기 ↗</a>
    <button class="done" id="doneBtn"></button>
  </div>
</div>
<div class="modal" id="modal"><div class="box"><div class="mh"><span id="mTitle"></span><button class="mclose" id="mClose">닫기 ✕</button></div><iframe id="mFrame" title="완성작"></iframe></div></div>
<script>/* 자료 파일은 고칠 때마다 바로 보이게 매번 새로 받아 온다 */ document.write('<script src="lib/entry_missions.js?t=' + Date.now() + '"><\/script><script src="lib/entry_previews.js?t=' + Date.now() + '"><\/script>');</script>
<script>
(() => {
const $ = id => document.getElementById(id);
const Q = new URLSearchParams(location.search), ID = Q.get('id'), K = parseInt(Q.get('k'), 10) || 0;
const F2 = Q.get('f') === '2', FOREST = F2 ? '엔트리숲.html' : '탐험_3D.html', NLAB = Q.get('n');
const M = (window.ENTRY_MISSIONS || {})[ID];
const KEY = 'studyhome_new_3d_demo', SKEY = 'studyhome_new_entry_steps';
let S = {}; try { const v = JSON.parse(localStorage.getItem(KEY)); if (v && typeof v === 'object') S = v; } catch (e) {}
const prog = S.progress | 0;
$('backBtn').addEventListener('click', () => { location.href = FOREST + '?at=' + (F2 ? ID : K); });
$('tag').textContent = (F2 && NLAB ? NLAB : '미션 ' + (K + 1)) + ' 미션';
if (!M) { $('page').innerHTML = '<div class="empty">이 미션의 안내는 아직 준비 중이에요.<br>숲길로 돌아가 다른 미션을 해 봐요.</div>'; return; }
document.title = M.title + ' · 엔트리 미션';
$('title').textContent = M.title.split(' (')[0]; $('goal').innerHTML = M.goal;
/* 준비물 안내: 미션 자료의 needs 에 camera·mic·sound 를 적으면 맨 위에 나옴 */
const NEEDS = {
  camera: ['📷', '<b>카메라를 써요.</b> "카메라를 사용할까요?"가 뜨면 <b>허용</b>을 눌러요. 밝은 곳에 앉아요.'],
  mic: ['🎤', '<b>마이크를 써요.</b> "마이크를 사용할까요?"가 뜨면 <b>허용</b>을 눌러요. 또박또박 말해요.'],
  sound: ['🔊', '<b>소리가 나요.</b> 이어폰을 끼고 해요.']
};
const nd = String(M.needs || '').split(/[\s,]+/).filter(k => NEEDS[k]);
if (nd.length) { $('needs').hidden = false; $('needs').innerHTML = nd.map(k => '<div class="need"><span class="i">' + NEEDS[k][0] + '</span><span>' + NEEDS[k][1] + '</span></div>').join(''); }
/* 완성작: 손으로 만든 미리보기가 있으면 그것, 없으면 .ent 완성작을 엔트리로 재생 */
const PV = M.preview || ((window.ENTRY_PREVIEWS || []).indexOf(ID) >= 0 ? '엔트리미리보기.html?f=' + encodeURIComponent('2_미리해보기/엔트리/' + ID + '.ent') + '&t=' + encodeURIComponent(M.title) : '');
if (PV) document.querySelector('[data-play]').hidden = false;
$('mTitle').textContent = '▶ 완성작 · ' + M.title.split(' (')[0];

/* 단계 체크 저장 (미션별) */
let ALL = {}; try { const v = JSON.parse(localStorage.getItem(SKEY)); if (v && typeof v === 'object') ALL = v; } catch (e) {}
const done = M.steps.map((_, i) => !!(ALL[ID] && ALL[ID][i]));
const saveSteps = () => { ALL[ID] = done; try { localStorage.setItem(SKEY, JSON.stringify(ALL)); } catch (e) {} };

/* 블록 그리기 */
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
function inline(t) {
  let h = esc(t);
  h = h.replace(/\[ \]/g, '<span class="v blank"></span>');
  h = h.replace(/\[([^\]]*)\]/g, '<span class="v">$1</span>').replace(/\{([^}]*)\}/g, '<span class="v sel">$1</span>');
  return h.replace(/&lt;(.*?)&gt;/g, '<span class="v bool">$1</span>');
}
function block(x) {
  if (Array.isArray(x)) { const m = x[0].match(/^(\w+)[:^](.*)$/); return '<div class="c ' + m[1] + '"><div class="head">' + inline(m[2]) + '</div><div class="in">' + x[1].map(block).join('') + '</div>' + (x.length > 3 ? '<div class="head mid">' + inline(x[2]) + '</div><div class="in">' + x[3].map(block).join('') + '</div>' : '') + '<div class="foot"></div></div>'; }
  const m = x.match(/^(\w+)([:^])(.*)$/); return '<span class="b ' + m[1] + (m[2] === '^' ? ' hat' : '') + '">' + inline(m[3]) + '</span>';
}
/* 블록 조각: 조립하지 않고 흩어서 보여 줌. 반복·만일 블록은 안쪽을 비워 둔다. 섞는 순서는 단계마다 늘 같게 */
function pieces(list, out) { list.forEach(x => { if (Array.isArray(x)) { out.push(x.length > 3 ? [x[0], [], x[2], []] : [x[0], []]); pieces(x[1], out); if (x.length > 3) pieces(x[3], out); } else out.push(x); }); return out; }
function shuffle(a, seed) {
  const r = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
  const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; }
  if (b.length > 1 && b.every((x, i) => x === a[i])) b.push(b.shift());
  return b;
}
/* 같은 블록은 한 번만: 숫자만 다른 블록은 하나로 합치고 숫자 칸을 비운다 */
function uniq(list) {
  const key = x => (Array.isArray(x) ? x[0] : x).replace(/\[[^\]]*\]/g, '[]'), seen = new Map(), out = [];
  list.forEach(x => { const k = key(x); if (!seen.has(k)) { seen.set(k, out.length); out.push(x); } else { const i = seen.get(k), y = out[i], ys = Array.isArray(y) ? y[0] : y, xs = Array.isArray(x) ? x[0] : x; if (ys !== xs) out[i] = Array.isArray(y) ? [k, ...y.slice(1)] : k.replace(/\[\]/g, '[ ]'); } });
  return out.map(x => Array.isArray(x) ? [x[0].replace(/\[\]/g, '[ ]'), ...x.slice(1)] : x);
}
const pileHTML = (groups, seed) => groups.map((g, gi) => {
  const ps = shuffle(uniq(pieces(g.code, [])), seed * 31 + gi * 7 + 3);
  return '<div style="max-width:100%"><p class="obj">' + esc(g.obj || '') + '</p><div class="pile">' + ps.map((x, i) => {
    const h = Array.isArray(x) ? block(x).replace('class="c ', 'class="c hollow ') : block(x);
    return h.replace(/^<(\w+) /, '<$1 style="--r:' + (((i * 37 + seed * 13) % 5) - 2) * .7 + 'deg" ');
  }).join('') + '</div></div>';
}).join('');
const TEACHER = (() => { try { return localStorage.getItem('학습홈_admin') === '1'; } catch (e) { return false; } })();
const codeHTML = groups => groups.map(g => '<div><p class="obj">' + esc(g.obj || '') + '</p><div class="stack">' + g.code.map(block).join('') + '</div></div>').join('');

/* 단계 목록: 아직 안 끝낸 첫 단계가 저절로 펼쳐짐. 힌트·블록 조각은 눌러야 보임 */
let openK = null; const ui = {};
const cur = () => { const k = done.indexOf(false); return k < 0 ? -1 : k; };
function draw() {
  const c = cur(), o = openK === null ? c : openK, N = M.steps.length;
  $('steps').innerHTML = M.steps.map((s, i) => {
    const t = ui[i] || '';
    return '<li class="it' + (done[i] ? ' d' : '') + (i === o ? ' o' : '') + '" data-i="' + i + '"><div class="ih"><span class="ck" data-ck title="다 했으면 눌러요">' + (done[i] ? '✓' : '') + '</span><span class="tt">' + esc(s.t) + '</span>' + (i === c ? '<span class="nowtag">지금</span>' : '') + '</div>' +
      '<div class="ib"><p class="say">' + esc(s.say) + '</p>' +
      ((s.hint || s.note || s.code) ? '<div class="chips">' + ((s.hint || s.note) ? '<button class="chip h' + (t === 'h' ? ' on' : '') + '" data-t="h">💡 힌트</button>' : '') + (s.code ? '<button class="chip k' + (t === 'k' ? ' on' : '') + '" data-t="k">🧩 블록 조각</button>' : '') + (s.code && TEACHER ? '<button class="chip a' + (t === 'a' ? ' on' : '') + '" data-t="a">✅ 정답</button>' : '') + '</div>' : '') +
      (t === 'h' ? '<div class="pane h">' + (s.hint ? esc(s.hint) : '') + (s.note ? '<span class="sub">' + s.note + '</span>' : '') + '</div>' : '') +
      (t === 'k' && s.code ? '<div class="pane code">' + pileHTML(s.code, i + 1) + '</div>' : '') +
      (t === 'a' && s.code && TEACHER ? '<div class="pane ans"><p class="lab">정답 (원장님 화면에만 보여요)</p>' + codeHTML(s.code) + '</div>' : '') +
      (done[i] ? '' : '<div class="okrow"><button class="ok" data-ck>' + '다 했어요 ✓' + '</button></div>') + '</div></li>';
  }).join('');
  const n = done.filter(Boolean).length; $('count').textContent = n + ' / ' + N; $('barI').style.width = (n / N * 100) + '%';
}
$('steps').addEventListener('click', e => {
  const li = e.target.closest('[data-i]'); if (!li) return; const i = +li.dataset.i;
  if (e.target.closest('[data-ck]')) { done[i] = !done[i]; saveSteps(); openK = null; draw(); if (done[i]) { const c = cur(); if (c < 0) $('doneBtn').scrollIntoView({behavior: 'smooth', block: 'center'}); else { const el = document.querySelector('[data-i="' + c + '"]'); if (el) el.scrollIntoView({behavior: 'smooth', block: 'center'}); } } return; }
  const t = e.target.closest('[data-t]');
  if (t) ui[i] = ui[i] === t.dataset.t ? '' : t.dataset.t;
  else if (e.target.closest('.ih')) { const o = openK === null ? cur() : openK; openK = o === i ? -2 : i; }
  else return;
  draw();
});

/* 완료 버튼: 지금 차례 미션이면 숲길로 돌아가 완료 처리, 이미 끝낸 미션이면 그냥 돌아가기 */
const E = (S.entry && S.entry.done) || {};
const isDone = F2 ? !!E[ID] : K < prog, isNow = F2 ? !isDone : K === prog;
$('doneBtn').textContent = isNow ? '미션 완료 ⭐' : (isDone ? '✓ 완료한 미션' : '숲길로 ›');
if (isDone) $('doneBtn').classList.add('was');
$('doneBtn').addEventListener('click', () => { location.href = FOREST + (isNow ? '?done=' : '?at=') + (F2 ? ID : K); });

/* 완성작 해보기: 한 번 불러온 창은 닫아도 남겨 둬서, 다시 열면 바로 보임 */
let loaded = false;
document.addEventListener('click', e => { if (PV && e.target.closest('[data-play]')) { if (!loaded) { $('mFrame').src = PV; loaded = true; } $('modal').classList.add('on'); } });
const closeM = () => { $('modal').classList.remove('on'); try { const w = $('mFrame').contentWindow; if (w && w.Entry && w.Entry.engine && w.Entry.engine.state !== 'stop') w.Entry.engine.toggleStop(); } catch (er) {} };
$('mClose').addEventListener('click', closeM);
$('modal').addEventListener('click', e => { if (e.target.id === 'modal') closeM(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeM(); });
if (TEACHER) { const t = document.createElement('span'); t.className = 'tbadge'; t.textContent = '🔑 선생님'; t.title = '선생님 모드: 블록이 있는 단계에 ✅ 정답이 보여요'; t.style.marginLeft = 'auto'; document.querySelector('.topbar .in').appendChild(t); }
draw();
})();
</script>
</body>
</html>
