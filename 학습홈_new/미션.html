<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>엔트리 미션</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="favicon-180.png">
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#23401a}
html{background:#e7f6d9}
body{background:linear-gradient(#bfe6ff,#e7f6d9 420px,#e7f6d9) no-repeat}
button{font:inherit;cursor:pointer}
.page{max-width:820px;margin:0 auto;padding:18px 16px 44px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.back{border:0;background:rgba(255,255,255,.85);border-radius:999px;padding:8px 14px;font-size:13.5px;font-weight:800;color:#2f5a14}
.tag{font-size:13px;font-weight:900;color:#fff;background:#5aa62a;border-radius:999px;padding:4px 11px}
.tbadge{margin-left:auto;font-size:12px;font-weight:800;color:#7a5600;background:#ffe9a8;border-radius:999px;padding:4px 10px}
/* 진도 길 */
.dots{display:flex;align-items:center;margin:16px 4px 14px}
.dots button{width:38px;height:38px;border-radius:50%;border:0;background:#fff;color:#8aa476;font-weight:900;font-size:15px;box-shadow:0 2px 6px rgba(40,80,20,.15);flex-shrink:0;display:flex;align-items:center;justify-content:center;padding:0}
.dots button.d{background:#5aa62a;color:#fff}
.dots button.c{background:#ffcf3f;color:#5a3d00;box-shadow:0 0 0 5px rgba(255,207,63,.35)}
.dots button.star{cursor:default}
.dots i{flex:1;height:5px;background:#fff;border-radius:3px;margin:0 4px}
.dots i.d{background:#5aa62a}
/* 카드 */
.sheet{background:#fff;border-radius:26px;padding:24px 24px 20px;box-shadow:0 16px 40px rgba(40,80,20,.16)}
h1{font-size:28px;margin:0 0 10px;font-weight:900;line-height:1.3}
.goal{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:16px;line-height:1.7;color:#5a4a2c;margin:0 0 18px;padding:12px 16px;background:#fff6dc;border-radius:14px;border-left:5px solid #ffb347}
.goal p{margin:0;flex:1;min-width:240px}
.play{border:0;border-radius:999px;padding:9px 16px;font-weight:900;font-size:14px;background:#fff;color:#c4621a;box-shadow:0 0 0 1.5px #ffcf9a inset;white-space:nowrap}
.needs{display:flex;flex-direction:column;gap:6px;margin:0 0 14px}
.need{display:flex;gap:10px;align-items:flex-start;border-radius:14px;padding:10px 14px;font-size:14.5px;line-height:1.55;background:#fff6d6;color:#6a4b00}
.need .i{font-size:20px;line-height:1.2}
.need b{font-weight:800}
/* 단계 */
.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px}
.step{border-radius:18px;padding:14px 16px;background:#fff;box-shadow:0 0 0 1.5px #e4eedb inset}
.step.cur{box-shadow:0 0 0 2.5px #ffcf3f inset,0 8px 20px rgba(200,150,30,.15)}
.step.done{background:#f5f9f0}
.row{display:flex;align-items:center;gap:10px;cursor:pointer}
.num{width:34px;height:34px;border-radius:11px;background:#8fbf6a;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px;flex-shrink:0}
.step.cur .num{background:#ffb02e}
.step.done .num{background:#5aa62a}
.st{font-size:18px;font-weight:900;flex:1}
.step.done .st{color:#6f8a5c}
.stamp{font-size:13.5px;font-weight:900;color:#d0661a;border:2.5px solid #d0661a;border-radius:8px;padding:2px 8px;transform:rotate(-8deg);background:#fff}
.now{font-size:12.5px;font-weight:900;background:#ffcf3f;color:#5a3d00;border-radius:999px;padding:3px 11px}
.body{display:none;margin:12px 0 2px 44px}
.step.open .body{display:block}
.say{margin:0 0 12px;font-size:16.5px;line-height:1.7;color:#3d5a2a}
.note{margin:0 0 12px;font-size:14px;line-height:1.7;color:#4b6a37;background:#f3f9ec;border-radius:12px;padding:10px 14px}
.tabs{display:flex;gap:8px;margin:0 0 10px;flex-wrap:wrap}
.tabs button{flex:1;min-width:140px;border:0;border-radius:14px;padding:11px;font-weight:900;font-size:15px;background:#f3f6ee;color:#4b6a37}
.tabs .h.on{background:#fff6d6;color:#7a5600;box-shadow:0 0 0 2px #ffd84a inset}
.tabs .k.on{background:#eef7ff;color:#1b5f8a;box-shadow:0 0 0 2px #8fd0f5 inset}
.tabs .a{flex:0 0 auto;min-width:0;background:#fff3c4;color:#7a5600}
.tabs .a.on{box-shadow:0 0 0 2px #ffd84a inset}
.panel{border-radius:16px;background:#fafcf7;padding:14px;margin:0 0 10px}
.panel.hint{font-size:16px;line-height:1.7;color:#6a5310;background:#fffaea}
.panel.code{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.panel.ans{display:flex;flex-wrap:wrap;gap:16px;box-shadow:0 0 0 1.5px #ffd84a inset;background:#fffdf3}
.ans .lab{width:100%;font-size:12px;font-weight:800;color:#8a6a00;margin:-2px 0 -6px}
.okb{display:block;margin:4px 0 0 auto;border:0;border-radius:999px;padding:9px 18px;font-weight:900;font-size:15px;background:#5aa62a;color:#fff}
.okb.re{background:#f1f5ec;color:#4b6a37;font-size:13.5px;padding:7px 14px}
/* 블록 */
.pile{display:flex;flex-wrap:wrap;align-items:flex-start;gap:10px 12px;max-width:100%}
.pile>*{transform:rotate(var(--r,0deg))}
.c.hollow .in{min-width:110px;min-height:22px;background:#fff;box-shadow:inset 0 0 0 1.5px #d7e9c6}
.obj{font-size:12px;font-weight:800;color:#5b7a48;margin:0 0 4px;min-height:1px}
.stack{display:inline-flex;flex-direction:column;align-items:flex-start}
.b{display:inline-flex;align-items:center;gap:5px;padding:7px 12px;border-radius:7px;color:#fff;font-size:13.5px;font-weight:700;line-height:1.2;white-space:nowrap}
.stack>*+*,.in>*+*{margin-top:2px}
.b.hat{border-radius:16px 16px 7px 7px;padding-top:9px}
.v{display:inline-block;background:#fff;color:#333;border-radius:999px;padding:1px 9px;font-size:12.5px;font-weight:700}
.v.sel{border-radius:5px}
.v.blank{min-width:30px;height:19px;vertical-align:middle;padding:0}
.v.bool{border-radius:4px;background:#8fa2ff;color:#fff;padding:2px 6px}
.v.bool .v{font-size:12px}
.c{display:flex;flex-direction:column;align-items:flex-start;border-radius:7px}
.c .head,.c .foot{padding:7px 12px;color:#fff;font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:5px;white-space:nowrap}
.c .foot{padding:5px 12px;min-width:70px}
.c .in{margin-left:14px;padding:2px 2px 2px 0;background:#fff;border-radius:0 6px 6px 0;display:flex;flex-direction:column;align-items:flex-start}
.start{background:#2fae51}.flow{background:#14b6d9}.move{background:#a34ee8}.look{background:#ee4f84}.sound{background:#7cb300}.judge{background:#4a63f0}
/* 아래 */
.bar{display:flex;justify-content:space-between;align-items:center;margin-top:20px;gap:10px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:12px 22px;font-size:15.5px;font-weight:900;text-decoration:none}
.pill.ent{background:#fff;color:#2c5a0f;box-shadow:0 0 0 1.5px #a9d68a inset}
.pill.ok{background:linear-gradient(90deg,#ff8f5a,#ffb347);color:#fff}
.pill.ok.done{background:#d9efc4;color:#3b6d11}
.count{font-size:13.5px;color:#5b7a48;font-weight:800}
.modal{position:fixed;inset:0;background:rgba(20,32,14,.55);display:none;align-items:center;justify-content:center;z-index:60;padding:20px}
.modal.on{display:flex}
.modal .box{width:min(860px,100%);background:#fff;border-radius:20px;overflow:hidden}
.modal .mh{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;font-weight:800}
.modal .mh button{border:0;background:#eef6e6;border-radius:999px;width:32px;height:32px}
.modal iframe{width:100%;height:min(620px,75vh);border:0;display:block}
.empty{text-align:center;padding:60px 20px;font-size:16px;line-height:1.8;color:#4b6a37}
@media (max-width:640px){.body{margin-left:0}.sheet{padding:18px 14px}h1{font-size:23px}.dots button{width:32px;height:32px}}
</style>
</head>
<body>
<div class="page">
  <div class="top"><button class="back" id="backBtn">← 숲길</button><span class="tag" id="tag"></span></div>
  <div class="dots" id="dots"></div>
  <div class="sheet" id="sheet">
    <h1 id="title"></h1>
    <div class="needs" id="needs" hidden></div>
    <div class="goal"><p id="goal"></p><button class="play" data-play hidden>▶ 완성작 다시 해보기</button></div>
    <ol class="steps" id="steps"></ol>
    <div class="bar">
      <a class="pill ent" href="https://playentry.org/ws/new" target="_blank" rel="noopener">엔트리 열기 ↗</a>
      <span class="count" id="count"></span>
      <button class="pill ok" id="doneBtn"></button>
    </div>
  </div>
</div>
<div class="modal" id="modal"><div class="box"><div class="mh"><span id="mTitle"></span><button id="mClose" aria-label="닫기">×</button></div><iframe id="mFrame" title="완성작"></iframe></div></div>
<script>/* 자료 파일은 고칠 때마다 바로 보이게 매번 새로 받아 온다 */ document.write('<script src="lib/entry_missions.js?t=' + Date.now() + '"><\/script><script src="lib/entry_previews.js?t=' + Date.now() + '"><\/script>');</script>
<script>
(() => {
const $ = id => document.getElementById(id);
const Q = new URLSearchParams(location.search), ID = Q.get('id'), K = parseInt(Q.get('k'), 10) || 0;
const F2 = Q.get('f') === '2', FOREST = F2 ? '엔트리숲.html' : '탐험_3D_시안.html', NLAB = Q.get('n');
const M = (window.ENTRY_MISSIONS || {})[ID];
const KEY = 'studyhome_new_3d_demo', SKEY = 'studyhome_new_entry_steps';
let S = {}; try { const v = JSON.parse(localStorage.getItem(KEY)); if (v && typeof v === 'object') S = v; } catch (e) {}
const prog = S.progress | 0;
$('backBtn').addEventListener('click', () => { location.href = FOREST + '?at=' + (F2 ? ID : K); });
$('tag').textContent = F2 && NLAB ? NLAB : '미션 ' + (K + 1);
if (!M) { $('title').textContent = '준비 중인 미션'; $('sheet').innerHTML = '<div class="empty">이 미션의 안내는 아직 준비 중이에요.<br>숲길로 돌아가 다른 미션을 해 봐요.</div>'; return; }
document.title = M.title + ' · 엔트리 미션';
$('title').textContent = M.title; $('goal').innerHTML = '🎯 ' + M.goal;
/* 준비물 안내: 미션 자료의 needs 에 camera·mic·sound 를 적으면 맨 위에 나옴 */
const NEEDS = {
  camera: ['📷', '<b>카메라를 써요.</b> 처음에 "카메라를 사용할까요?"가 뜨면 꼭 <b>허용</b>을 눌러요. 얼굴(몸)이 화면에 잘 보이게 밝은 곳에 앉아요.'],
  mic: ['🎤', '<b>마이크를 써요.</b> 처음에 "마이크를 사용할까요?"가 뜨면 꼭 <b>허용</b>을 눌러요. 또박또박 말해요.'],
  sound: ['🔊', '<b>소리가 나요.</b> 이어폰을 끼고 해요.']
};
const nd = String(M.needs || '').split(/[\s,]+/).filter(k => NEEDS[k]);
if (nd.length) { $('needs').hidden = false; $('needs').innerHTML = nd.map(k => '<div class="need"><span class="i">' + NEEDS[k][0] + '</span><span>' + NEEDS[k][1] + '</span></div>').join(''); }
/* 완성작: 손으로 만든 미리보기가 있으면 그것, 없으면 .ent 완성작을 엔트리로 재생 */
const PV = M.preview || ((window.ENTRY_PREVIEWS || []).indexOf(ID) >= 0 ? '엔트리미리보기.html?f=' + encodeURIComponent('2_미리해보기/엔트리/' + ID + '.ent') + '&t=' + encodeURIComponent(M.title) : '');
if (PV) document.querySelector('[data-play]').hidden = false;
$('mTitle').textContent = '완성작 해보기 · ' + M.title;

/* 단계 체크 저장 (미션별) */
let ALL = {}; try { const v = JSON.parse(localStorage.getItem(SKEY)); if (v && typeof v === 'object') ALL = v; } catch (e) {}
const done = M.steps.map((_, i) => !!(ALL[ID] && ALL[ID][i]));
const saveSteps = () => { ALL[ID] = done; try { localStorage.setItem(SKEY, JSON.stringify(ALL)); } catch (e) {} };

/* 블록 그리기 */
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
function inline(t) {
  let h = esc(t);
  h = h.replace(/\[ \]/g, '<span class="v blank"></span>');
  h = h.replace(/\[([^\]]*)\]/g, '<span class="v">$1</span>').replace(/\{([^}]*)\}/g, '<span class="v sel">$1</span>');
  return h.replace(/&lt;(.*?)&gt;/g, '<span class="v bool">$1</span>');
}
function block(x) {
  if (Array.isArray(x)) { const m = x[0].match(/^(\w+)[:^](.*)$/); return '<div class="c ' + m[1] + '"><div class="head">' + inline(m[2]) + '</div><div class="in">' + x[1].map(block).join('') + '</div><div class="foot"></div></div>'; }
  const m = x.match(/^(\w+)([:^])(.*)$/); return '<span class="b ' + m[1] + (m[2] === '^' ? ' hat' : '') + '">' + inline(m[3]) + '</span>';
}
/* 블록 조각: 조립하지 않고 흩어서 보여 줌. 반복·만일 블록은 안쪽을 비워 둔다. 섞는 순서는 단계마다 늘 같게 */
function pieces(list, out) { list.forEach(x => { if (Array.isArray(x)) { out.push([x[0], []]); pieces(x[1], out); } else out.push(x); }); return out; }
function shuffle(a, seed) {
  const r = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
  const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; }
  if (b.length > 1 && b.every((x, i) => x === a[i])) b.push(b.shift());
  return b;
}
/* 같은 블록은 한 번만: 숫자만 다른 블록은 하나로 합치고 숫자 칸을 비운다 */
function uniq(list) {
  const key = x => (Array.isArray(x) ? x[0] : x).replace(/\[[^\]]*\]/g, '[]'), seen = new Map(), out = [];
  list.forEach(x => { const k = key(x); if (!seen.has(k)) { seen.set(k, out.length); out.push(x); } else { const i = seen.get(k), y = out[i], ys = Array.isArray(y) ? y[0] : y, xs = Array.isArray(x) ? x[0] : x; if (ys !== xs) out[i] = Array.isArray(y) ? [k, []] : k.replace(/\[\]/g, '[ ]'); } });
  return out.map(x => Array.isArray(x) ? [x[0].replace(/\[\]/g, '[ ]'), x[1]] : x);
}
const pileHTML = (groups, seed) => groups.map((g, gi) => {
  const ps = shuffle(uniq(pieces(g.code, [])), seed * 31 + gi * 7 + 3);
  return '<div style="max-width:100%"><p class="obj">' + esc(g.obj || '') + '</p><div class="pile">' + ps.map((x, i) => {
    const h = Array.isArray(x) ? block(x).replace('class="c ', 'class="c hollow ') : block(x);
    return h.replace(/^<(\w+) /, '<$1 style="--r:' + (((i * 37 + seed * 13) % 5) - 2) + 'deg" ');
  }).join('') + '</div></div>';
}).join('');
const TEACHER = (() => { try { return localStorage.getItem('학습홈_admin') === '1'; } catch (e) { return false; } })();
const codeHTML = groups => groups.map(g => '<div><p class="obj">' + esc(g.obj || '') + '</p><div class="stack">' + g.code.map(block).join('') + '</div></div>').join('');

/* 단계 목록: 아직 안 끝낸 첫 단계가 저절로 펼쳐짐. 힌트·블록 조각은 탭을 눌러야 보임 */
let openK = null; const ui = {};
const cur = () => { const k = done.indexOf(false); return k < 0 ? -1 : k; };
function draw() {
  const c = cur(), o = openK === null ? c : openK, N = M.steps.length;
  $('dots').innerHTML = M.steps.map((s, i) => (i ? '<i class="' + (done[i - 1] ? 'd' : '') + '"></i>' : '') + '<button data-go="' + i + '" title="' + esc(s.t) + '" class="' + (done[i] ? 'd' : i === c ? 'c' : '') + '">' + (done[i] ? '✓' : i + 1) + '</button>').join('') +
    '<i class="' + (c < 0 ? 'd' : '') + '"></i><button class="star' + (c < 0 ? ' d' : '') + '" title="미션 완료">⭐</button>';
  $('steps').innerHTML = M.steps.map((s, i) => {
    const u = ui[i] || {}, cls = ['step', done[i] && 'done', i === c && 'cur', i === o && 'open'].filter(Boolean).join(' ');
    const tab = u.t || '';
    return '<li class="' + cls + '" data-i="' + i + '"><div class="row"><span class="num">' + (i + 1) + '</span><span class="st">' + esc(s.t) + '</span>' + (done[i] ? '<span class="stamp">통과!</span>' : i === c ? '<span class="now">지금 여기</span>' : '') + '</div>' +
      '<div class="body"><p class="say">' + esc(s.say) + '</p>' + (s.note ? '<p class="note">' + s.note + '</p>' : '') +
      ((s.hint || s.code) ? '<div class="tabs">' + (s.hint ? '<button class="h' + (tab === 'h' ? ' on' : '') + '" data-t="h">💡 힌트 보기</button>' : '') + (s.code ? '<button class="k' + (tab === 'k' ? ' on' : '') + '" data-t="k">🧩 블록 조각 보기</button>' : '') + (s.code && TEACHER ? '<button class="a' + (tab === 'a' ? ' on' : '') + '" data-t="a">✅ 정답</button>' : '') + '</div>' : '') +
      (tab === 'h' && s.hint ? '<div class="panel hint">' + esc(s.hint) + '</div>' : '') +
      (tab === 'k' && s.code ? '<div class="panel code">' + pileHTML(s.code, i + 1) + '</div>' : '') +
      (tab === 'a' && s.code && TEACHER ? '<div class="panel ans"><p class="lab">정답 (원장님 화면에만 보여요)</p>' + codeHTML(s.code) + '</div>' : '') +
      '<button class="okb' + (done[i] ? ' re' : '') + '" data-ck>' + (done[i] ? '↩ 다시 하기' : (i === N - 1 ? '⭐ 다 했어요! 마지막 단계 끝' : '✓ 다 했어요! 다음 단계 ›')) + '</button></div></li>';
  }).join('');
  const n = done.filter(Boolean).length; $('count').textContent = n + ' / ' + N + ' 단계';
}
$('steps').addEventListener('click', e => {
  const li = e.target.closest('[data-i]'); if (!li) return; const i = +li.dataset.i;
  if (e.target.closest('[data-ck]')) { done[i] = !done[i]; saveSteps(); openK = null; draw(); if (done[i]) { const c = cur(); if (c < 0) $('doneBtn').scrollIntoView({behavior: 'smooth', block: 'center'}); else { const t = document.querySelector('[data-i="' + c + '"]'); if (t) t.scrollIntoView({behavior: 'smooth', block: 'start'}); } } return; }
  const t = e.target.closest('[data-t]');
  if (t) { ui[i] = Object.assign({}, ui[i]); ui[i].t = ui[i].t === t.dataset.t ? '' : t.dataset.t; }
  else if (e.target.closest('.row')) { const o = openK === null ? cur() : openK; openK = o === i ? -2 : i; }
  else return;
  draw();
});
$('dots').addEventListener('click', e => { const b = e.target.closest('[data-go]'); if (!b) return; openK = +b.dataset.go; draw(); const t = document.querySelector('[data-i="' + openK + '"]'); if (t) t.scrollIntoView({behavior: 'smooth', block: 'start'}); });

/* 완료 버튼: 지금 차례 미션이면 숲길로 돌아가 완료 처리, 이미 끝낸 미션이면 그냥 돌아가기 */
const E = (S.entry && S.entry.done) || {};
const isDone = F2 ? !!E[ID] : K < prog, isNow = F2 ? !isDone : K === prog;
$('doneBtn').textContent = isNow ? '⭐ 미션 완료' : (isDone ? '✓ 완료한 미션' : '숲길로 ›');
if (isDone) $('doneBtn').classList.add('done');
$('doneBtn').addEventListener('click', () => { location.href = FOREST + (isNow ? '?done=' : '?at=') + (F2 ? ID : K); });

/* 완성작 해보기 */
document.addEventListener('click', e => { if (PV && e.target.closest('[data-play]')) { $('mFrame').src = PV; $('modal').classList.add('on'); } });
$('mClose').addEventListener('click', () => { $('modal').classList.remove('on'); $('mFrame').src = 'about:blank'; });
$('modal').addEventListener('click', e => { if (e.target.id === 'modal') $('mClose').click(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('mClose').click(); });
if (TEACHER) { const t = document.createElement('span'); t.className = 'tbadge'; t.textContent = '🔑 선생님'; t.title = '선생님 모드: 블록이 있는 단계에 ✅ 정답 버튼이 보여요'; document.querySelector('.top').appendChild(t); }
draw();
})();
