<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>거북이 해변길 · 파이썬 터틀</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="favicon-180.png">
<style>
*{box-sizing:border-box}
:root{--sand:#fff3d6;--ink:#1f3d47;--dim:#5f7a82;--sea:#1295a8;--coral:#ff7a4d;--ok:#2fa56b;--line:#ecd9ac;--card:#fff;--arc:#6b4fe0}
html,body{margin:0;background:var(--sand);color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
button{font:inherit;cursor:pointer}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:11px 20px;background:var(--sea);color:#fff;flex-wrap:wrap}
header .brand{margin-right:auto}
header b{display:block;font-size:20px;font-weight:800}
header span{font-size:13px;opacity:.92}
.chip{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.45);color:#fff;border-radius:999px;padding:7px 14px;font-size:14px;font-weight:700}
main{max-width:1240px;margin:0 auto;padding:16px 16px 90px}
.scene{position:relative;border:3px solid #d9b877;border-radius:24px;overflow:hidden;box-shadow:0 8px 0 #e7cf9a,0 18px 30px rgba(120,90,30,.18);background:#bfeaf5}
#gl{display:block;width:100%}
#pins{position:absolute;inset:0;pointer-events:none;font-size:9px}
.pin{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;background:none;border:0;padding:0;width:5.4em;height:5.4em;border-radius:50%}
.pin svg{width:100%;height:100%;display:block}
.pin i{position:absolute;left:-.5em;top:-.5em;width:1.75em;height:1.75em;border-radius:50%;background:#a89878;color:#fff;font-style:normal;font-weight:800;border:.16em solid #fff;display:grid;place-items:center}
.pin i span{font-size:.95em}
.pin.done i{background:var(--ok)}.pin.now i{background:var(--coral)}
.pin u{position:absolute;left:50%;top:118%;transform:translateX(-50%);text-decoration:none;white-space:nowrap;background:#a8754a;border-bottom:.22em solid #8a5a34;color:#fff8e7;font-weight:800;border-radius:.55em;padding:.2em .7em}
.pin u span{font-size:max(11px,1.25em)}
.pin:hover{transform:translate(-50%,-56%)}
.apin{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;border:0;background:#1c1440;color:#ffd23f;font-weight:800;border-radius:.6em;padding:.35em .9em;box-shadow:0 0 0 .2em #ff8fb0}
.apin span{font-size:max(13px,1.9em)}
.gopin{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;background:#fff;border:.3em solid var(--coral);border-radius:1.8em;padding:.9em;box-shadow:0 .6em 1.4em rgba(60,40,10,.3);display:none;gap:1.1em;align-items:center;white-space:nowrap;z-index:3}
.gopin.show{display:flex}
.gopin::after{content:"";position:absolute;left:calc(50% + var(--ax,0px));bottom:-1em;width:1.5em;height:1.5em;background:#fff;border-right:.3em solid var(--coral);border-bottom:.3em solid var(--coral);transform:translateX(-50%) rotate(45deg);border-radius:0 0 .3em 0}
.gopin canvas{width:10.5em;height:10.5em;border-radius:1.1em;display:block;cursor:pointer;border:.15em solid #e2c27c}
.gopin .gi{display:flex;flex-direction:column;gap:.5em;align-items:flex-start}
.gopin .tag{color:#fff;background:var(--sea);border-radius:999px;padding:.2em .8em;font-weight:800}
.gopin .tag span,.gopin small{font-size:max(12px,1.35em)}
.gopin b{font-size:max(15px,1.95em);color:var(--ink)}
.gopin small{color:#8a5a34;font-weight:700}
.gopin .gb{display:flex;gap:.6em;margin-top:.2em}
.gopin .gb button{border-radius:1.1em;padding:.55em 1em;font-weight:800;font-size:1em}
.gopin .gb button span{font-size:max(14px,1.6em)}
.gopin .b1{border:0;color:#fff;background:var(--coral);box-shadow:0 .3em 0 #d9542b}
.gopin .b2{border:.2em solid var(--ok);background:#fff;color:var(--ok)}
.gopin .b2.undo{border-color:var(--line);color:var(--dim)}
.gopin button:hover{filter:brightness(1.07)}
.hint{position:absolute;left:14px;bottom:12px;background:rgba(255,255,255,.88);border-radius:999px;padding:5px 13px;font-size:13px;font-weight:700}
.newtag{position:absolute;transform:translate(-50%,-50%);background:#ffd23f;color:#5a3d00;font-weight:800;border-radius:999px;padding:3px 10px;font-size:13px;pointer-events:none;opacity:0;transition:opacity .3s}
.newtag.show{opacity:1}
.detail{display:grid;grid-template-columns:230px 1fr auto;gap:20px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px 20px;margin-top:14px}
.paper{position:relative;width:230px;height:230px;border-radius:16px;overflow:hidden;background:#f3dba0;border:2px solid #e2c27c}
.paper canvas{display:block;width:230px;height:230px}
.paper button{position:absolute;right:6px;bottom:6px;border:0;border-radius:999px;background:rgba(31,61,71,.8);color:#fff;font-size:12px;font-weight:700;padding:4px 10px}
.paper small{position:absolute;left:8px;top:6px;font-size:12px;font-weight:800;color:#9a7a3a}
.detail .tag{display:inline-block;font-size:13px;font-weight:800;color:#fff;background:var(--sea);border-radius:999px;padding:3px 11px}
.detail h3{margin:8px 0 4px;font-size:21px}
.detail p{margin:0;color:var(--dim);font-size:15.5px;line-height:1.55}
.got{margin-top:10px;font-size:14px;font-weight:700;color:#8a5a34}
.col{display:flex;flex-direction:column;gap:8px;min-width:170px}
.b1{border:0;border-radius:12px;padding:12px 16px;font-size:16px;font-weight:800;color:#fff;background:var(--coral)}
.b2{border:2px solid var(--line);border-radius:12px;padding:10px 16px;font-size:15px;font-weight:700;background:#fff;color:var(--ink)}
.note{font-size:13px;color:var(--dim)}
.ahead{display:flex;align-items:center;gap:12px;margin:30px 4px 4px;flex-wrap:wrap}
.ahead h2{margin:0;font-size:22px}
.neon{background:#241a4d;color:#ffd23f;border-radius:10px;padding:4px 12px;font-weight:800;font-size:14px;letter-spacing:1px}
.sub{margin:0 4px 12px;color:var(--dim);font-size:15px}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:14px}
.game{background:var(--card);border:2px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;position:relative}
.game svg{display:block;width:100%;height:auto}
.game .in{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.game b{font-size:16.5px}
.game small{color:var(--dim);font-size:13px;flex:1}
.game:hover{border-color:var(--arc)}
.game .row{display:flex;gap:6px;justify-content:center}

.game .play{border:0;border-radius:10px;padding:8px 16px;font-size:12px;color:#fff;background:var(--arc)}
.game .play:hover{filter:brightness(1.12)}
.game .how{border:2px solid var(--line);border-radius:10px;padding:6px 12px;font-size:13.5px;font-weight:700;background:#fff;color:var(--ink)}
.game .how:hover{color:var(--arc)}
.game .chk{position:absolute;right:8px;top:8px;width:34px;height:34px;border-radius:50%;border:2px solid #fff;background:rgba(16,32,58,.55);color:#fff;font-size:17px;font-weight:800}
.game.done .chk{background:var(--ok)}
button.chip:hover{background:rgba(255,255,255,.32)}
.modal{position:fixed;inset:0;z-index:20;background:rgba(10,25,35,.6);display:none;align-items:center;justify-content:center;padding:16px}
.modal.show{display:flex}
.mbox{width:min(980px,100%);height:min(720px,92vh);background:#fff;border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.mtop{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;font-weight:800;border-bottom:2px solid var(--line)}
.mtop button{border:2px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-weight:700}
.mbox iframe{flex:1;border:0;width:100%}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-weight:700;opacity:0;transition:.25s;pointer-events:none;z-index:30}
.toast.show{opacity:1;transform:translateX(-50%)}
.simbar{margin:0 0 12px;background:rgba(20,28,40,.9);color:#fff;font:600 13px/1.4 sans-serif;padding:8px 12px;border-radius:14px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;width:fit-content;max-width:100%}
.simbar button{border:0;border-radius:999px;padding:5px 11px;font:700 13px sans-serif;background:#ffd23f;color:#222}
@media (max-width:820px){.detail{grid-template-columns:1fr}.paper{margin:0 auto}.hint{display:none}}
</style>
</head>
<body>
<header>
  <div class="brand"><b>거북이 해변길</b></div>
  <span class="chip" id="who">탐험가</span>
  <span class="chip" id="pts"></span>
  <button class="chip" id="labBtn">화산섬 연구소</button>
  <button class="chip" id="worldBtn">세계 지도</button>
</header>
<main>
  <div class="scene" id="scene"><canvas id="gl"></canvas><div id="pins"></div><span class="newtag" id="newtag">새로 생겼어요!</span></div>
  <div class="ahead" id="arcadeSec"><h2>오락실</h2></div>
  <div class="games" id="games"></div>
</main>
<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="mbox"><div class="mtop"><span id="mTitle"></span><button id="mClose">닫기 ✕</button></div><iframe id="mFrame" title="미리 해보기"></iframe></div></div>

<script src="lib/three.min.js"></script>
<script src="lib/py_data.js"></script>
<script>

  box(body, new T.ConeGeometry(.3, .9, 6), lam('#55c27a'), 0, .3, -1.95).rotation.x = -Math.PI / 2; })();
const ripple = new T.Mesh(new T.RingGeometry(2.3, 2.7, 24).rotateX(-Math.PI / 2), new T.MeshBasicMaterial({color: '#ffffff', transparent: true, opacity: .8})); scene.add(ripple);
let cu = 0, tu = 0, facing = 1, moving = false, onArrive = null;
function placeTurtle() { const p = route.getPointAt(Math.max(0, Math.min(1, cu))), q = route.getPointAt(Math.max(0, Math.min(1, cu + facing * .004))), h = Hgt(p.x, p.z), swim = h < -.25;
  turtle.position.set(p.x, swim ? -.75 : h + .5, p.z); turtle.rotation.y = Math.atan2(q.x - p.x, q.z - p.z); ripple.visible = swim; ripple.position.set(p.x, -.1, p.z); }
function walkTo(u, fn) { tu = u; onArrive = fn || null; moving = true; }
function jump() { cu = tu; moving = false; placeTurtle(); if (onArrive) { const f = onArrive; onArrive = null; f(); } }

/* 표지판 그림(HTML)과 화면 맞춤 */
const pins = SP.map((p, i) => { const b = document.createElement('button'); b.className = 'pin'; b.innerHTML = '<svg viewBox="-27 -27 54 54">' + PIC[i] + '</svg><i><span>' + (i + 1) + '</span></i><u><span>' + SHORT[i] + '</span></u>'; b.setAttribute('aria-label', (i + 1) + '번째 길 ' + SHORT[i]); b.addEventListener('click', e => { e.stopPropagation(); if (i === sel && arrived()) openBook(); else pick(i); }); $('pins').appendChild(b); return b; });
const apin = document.createElement('button'); apin.className = 'apin'; apin.innerHTML = '<span>오락실</span>'; $('pins').appendChild(apin);
const gopin = document.createElement('div'); gopin.className = 'gopin'; gopin.addEventListener('click', e => e.stopPropagation());
gopin.innerHTML = '<canvas id="paper" width="460" height="460" title="누르면 거북이가 다시 그려요"></canvas><div class="gi"><b id="dTitle"></b><div class="gb"><button class="b1" id="openBtn"><span></span></button><button class="b2" id="doneBtn"><span></span></button></div></div>';
$('pins').appendChild(gopin);
const arrived = () => !moving && Math.abs(cu - stopU[sel]) < 1e-6;
function placeGo() { const W = sceneEl.clientWidth, q = toScreen(signs[sel].at, W, canvas.clientHeight), u = W / VW, hw = (gopin.offsetWidth || 36 * u) / 2, x = Math.max(hw + 8, Math.min(W - hw - 8, q[0]));
  gopin.style.left = x + 'px'; gopin.style.top = Math.max((gopin.offsetHeight || 14 * u) + 6, q[1] - 4.4 * u) + 'px'; gopin.style.setProperty('--ax', (q[0] - x) + 'px'); }
const tmp = new T.Vector3();
function toScreen(v, w, h) { tmp.copy(v).project(cam); return [(tmp.x * .5 + .5) * w, (-tmp.y * .5 + .5) * h]; }
function resize() { const w = sceneEl.clientWidth, h = Math.round(w / ASP); renderer.setSize(w, h, false); canvas.style.height = h + 'px'; cam.updateProjectionMatrix(); cam.updateMatrixWorld();
  $('pins').style.fontSize = (w / VW) + 'px';
  signs.forEach((s, i) => { const q = toScreen(s.at, w, h); pins[i].style.left = q[0] + 'px'; pins[i].style.top = q[1] + 'px'; });
  const a = toScreen(arcadeAt, w, h); apin.style.left = a[0] + 'px'; apin.style.top = a[1] + 'px'; placeGo(); }
window.addEventListener('resize', resize);

/* 거북이가 그려 주는 그림 (아이디어 2) */
const paper = $('paper'), px = paper.getContext('2d');
function program(i) {
  const ops = []; let x = 0, y = 0, a = 0, down = true, col = '#1f3d47', w = 4;
  const P = {
    color: c => { col = c; }, width: v => { w = v; }, up: () => { down = false; }, dn: () => { down = true; }, lt: d => { a += d; }, rt: d => { a -= d; }, face: d => { a = d; },
    fd: d => { const nx = x + Math.cos(a * Math.PI / 180) * d, ny = y + Math.sin(a * Math.PI / 180) * d; P.go(nx, ny, true); },
    go: (nx, ny, keep) => { if (!keep) a = Math.atan2(ny - y, nx - x) * 180 / Math.PI; ops.push({t: down ? 'l' : 'm', x1: x, y1: y, x2: nx, y2: ny, c: col, w, len: Math.hypot(nx - x, ny - y) * (down ? 1 : .5) + .01}); x = nx; y = ny; },
    dot: (r, c) => { ops.push({t: 'd', x1: x, y1: y, x2: x, y2: y, r, c: c || col, len: 26}); },
    poly: (n, s) => { for (let k = 0; k < n; k++) { P.fd(s); P.lt(360 / n); } }
  };
  [() => { P.up(); P.go(-55, 10); P.dot(22, '#e8483b'); P.go(0, 10); P.dot(22, '#f5b921'); P.go(55, 10); P.dot(22, '#3f8fe4'); P.go(-70, -45); P.dn(); P.color('#2fa56b'); P.width(6); P.face(0); P.fd(140); },
   () => { P.up(); P.go(-75, 0); P.dn(); P.face(0); P.color('#3f8fe4'); P.width(6); P.fd(150); P.color('#ff7a4d'); P.fd(-90); P.color('#2fa56b'); P.fd(50); },
   () => { P.up(); P.go(-70, -50); P.dn(); P.color('#ff7a4d'); P.width(5); P.go(-30, 30); P.go(10, -30); P.up(); P.go(40, 40); P.dn(); P.go(75, -10); P.dot(8, '#7a5cf0'); },
   () => { P.up(); P.go(-70, -45); P.dn(); P.face(0); P.color('#7a5cf0'); P.width(5); P.poly(4, 75); P.up(); P.go(15, -45); P.dn(); P.face(0); P.color('#ff7a4d'); P.poly(3, 70); },
   () => { P.up(); P.go(-20, 5); P.dot(46, '#f5b921'); P.go(-20, -41); P.dn(); P.face(0); P.color('#d99a06'); P.width(4); for (let k = 0; k < 36; k++) { P.fd(8.03); P.lt(10); } P.up(); P.go(55, 45); P.dot(10, '#2fa56b'); P.go(62, -5); P.dot(10, '#3f8fe4'); P.go(50, -52); P.dot(10, '#e8483b'); },
   () => { P.width(2.5); P.up(); P.go(0, 0); P.dn(); for (let k = 0; k < 18; k++) { P.color('hsl(' + (k * 20) + ' 75% 48%)'); P.poly(4, 62); P.rt(20); } },
   () => { P.up(); P.go(0, 0); P.dot(78, '#14a3a8'); P.dot(58, '#ffffff'); P.dot(38, '#ff7a4d'); P.dot(16, '#ffffff'); },
   () => { P.width(4); [[3, -85, '#2fa56b'], [4, -40, '#3f8fe4'], [5, 10, '#ff7a4d'], [6, 60, '#7a5cf0']].forEach(v => { P.up(); P.go(v[1], -10); P.dn(); P.face(0); P.color(v[2]); P.poly(v[0], 150 / (v[0] + 2)); }); },
   () => { P.up(); P.go(-75, -50); P.dn(); P.face(0); P.color('#ff7a4d'); P.width(5); P.fd(45); P.lt(90); P.fd(55); P.rt(90); P.fd(50); P.rt(90); P.fd(30); P.lt(90); P.fd(45); P.lt(90); P.fd(70); },
   () => { P.up(); P.go(-55, 62); P.dot(13, '#8a5a34'); P.go(5, 40); P.dot(13, '#8a5a34'); P.go(58, 66); P.dot(13, '#8a5a34'); P.go(-80, -55); P.dn(); P.face(0); P.color('#2fa56b'); P.width(5); P.fd(60); P.fd(-30); P.fd(110); P.fd(-45); }
  ][i]();

}
let drawOps = [], drawT = 0, drawTot = 1, drawing = false;
function startDraw(i) { drawOps = program(i); drawTot = drawOps.reduce((s, o) => s + o.len, 0); drawT = 0; drawing = true; }
function paint() {
  const S = 2.3, cx = 230, cy = 236; px.clearRect(0, 0, 460, 460); px.fillStyle = '#f3dba0'; px.fillRect(0, 0, 460, 460);
  px.fillStyle = 'rgba(180,140,70,.25)'; for (let k = 0; k < 60; k++) px.fillRect((k * 97) % 460, (k * 173) % 460, 3, 3);
  let left = drawT, hx = 0, hy = 0, ha = 0; px.lineCap = 'round'; px.lineJoin = 'round';
  for (const o of drawOps) { if (left <= 0) break; const f = Math.min(1, left / o.len), ex = o.x1 + (o.x2 - o.x1) * f, ey = o.y1 + (o.y2 - o.y1) * f;
    if (o.t === 'l') { px.strokeStyle = o.c; px.lineWidth = o.w * 1.6; px.beginPath(); px.moveTo(cx + o.x1 * S, cy - o.y1 * S); px.lineTo(cx + ex * S, cy - ey * S); px.stroke(); }
    if (o.t === 'd') { px.fillStyle = o.c; px.beginPath(); px.arc(cx + o.x1 * S, cy - o.y1 * S, o.r * S * f, 0, 7); px.fill(); }
    if (o.t !== 'd' && o.len > .1) ha = Math.atan2(o.y2 - o.y1, o.x2 - o.x1) * (o.x2 < o.x1 && o.t === 'l' && false ? 1 : 1); hx = ex; hy = ey; left -= o.len; }
  px.save(); px.translate(cx + hx * S, cy - hy * S); px.rotate(-ha); px.fillStyle = '#2f9e5a'; px.strokeStyle = '#1f7a43'; px.lineWidth = 3;
  px.beginPath(); px.arc(17, 0, 7, 0, 7); px.fill(); [[-9, -13], [9, -13], [-9, 13], [9, 13]].forEach(l => { px.beginPath(); px.arc(l[0], l[1], 5, 0, 7); px.fill(); });
  px.beginPath(); px.ellipse(0, 0, 15, 12, 0, 0, 7); px.fill(); px.stroke(); px.restore();
}
paper.addEventListener('click', () => startDraw(sel));

/* 진도와 화면 */
let sel = Math.min(D.t, N - 1), newAt = null, newUntil = 0;
const stT = i => i < D.t ? 'done' : i === D.t ? 'now' : 'open';
function render() {
  pins.forEach((b, i) => { b.className = 'pin ' + stT(i); signs[i].mat.color.set(stT(i) === 'done' ? '#2fa56b' : stT(i) === 'now' ? '#ff7a4d' : '#c9b48a'); });
  const st = stT(sel), it = TUR[sel];
  $('dTitle').textContent = SHORT[sel]; $('dTitle').title = it[1]; $('openBtn').firstChild.textContent = '교재';
  const undo = st === 'done' && sel === D.t - 1; $('doneBtn').style.display = st === 'now' || undo ? '' : 'none'; $('doneBtn').className = 'b2' + (undo ? ' undo' : ''); $('doneBtn').firstChild.textContent = undo ? '완료 취소' : '완료';
  placeGo();
  $('pts').textContent = '길 ' + D.t + ' / ' + N + ' · 게임 ' + D.b.length + ' / ' + BONUS.length;
  DECOR.forEach((d, i) => { d.on = i < D.t; }); MACH.forEach(m => { m.on = D.b.includes(m.id); });
  [...$('games').children].forEach(c => { const on = D.b.includes(c.dataset.id); c.classList.toggle('done', on); c.querySelector('.chk').textContent = on ? '✓' : '☆'; });
}
function pick(i) { sel = i; render(); walkTo(stopU[i], () => startDraw(i)); }
function goArcade() { walkTo(arcU, () => $('arcadeSec').scrollIntoView({behavior: 'smooth', block: 'start'})); }
apin.addEventListener('click', e => { e.stopPropagation(); goArcade(); });
sceneEl.addEventListener('click', () => { if (moving) jump(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && arrived() && !/BUTTON|A|INPUT/.test(e.target.tagName || '')) { e.preventDefault(); openBook(); return; }
  if ($('modal').classList.contains('show')) return;
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') { e.preventDefault(); if (sel < N - 1 && tu !== arcU) pick(sel + 1); else goArcade(); }
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') { e.preventDefault(); if (tu === arcU) pick(N - 1); else if (sel > 0) pick(sel - 1); }
});
function showNew(d) { newAt = d.g.position.clone(); newAt.y += 9; newUntil = performance.now() + 2600; }
function complete() { if (D.t >= N) return; const d = DECOR[D.t]; D.t++; save(); toast('“' + d.name + '”이(가) 해변에 생겼어요!'); showNew(d); if (D.t < N) { sel = D.t; walkTo(stopU[sel], () => startDraw(sel)); } render(); }
$('doneBtn').addEventListener('click', () => { const st = stT(sel); if (st === 'now') complete(); else if (st === 'done') { if (sel === D.t - 1) { D.t--; save(); render(); } else toast('마지막으로 완료한 칸만 취소할 수 있어요.'); } });
function openBook() { location.href = '교재.html?t=' + sel; }
$('openBtn').addEventListener('click', openBook);
BONUS.forEach(b => {
  const c = document.createElement('div'); c.className = 'game'; c.dataset.id = b[0];
  c.innerHTML = '<svg viewBox="0 0 200 120">' + (G[b[0]] || '<rect width="200" height="120" fill="#241a4d"/>') + '</svg><button class="chk" title="완성 표시">☆</button><div class="in"><b></b><small></small><div class="row"><button class="play" title="미리 해보기" aria-label="미리 해보기">▶</button><button class="how" title="만드는 방법 교재 열기">교재</button></div></div>';
  c.querySelector('b').textContent = b[1]; c.querySelector('small').textContent = b[3];
  c.querySelector('.play').addEventListener('click', () => { $('mTitle').textContent = b[1]; $('mFrame').src = '터틀게임.html?g=' + b[0]; $('modal').classList.add('show'); });
  c.querySelector('.how').addEventListener('click', () => window.open(BASE + b[2], '_blank'));
  c.querySelector('.chk').addEventListener('click', () => { if (D.b.includes(b[0])) D.b = D.b.filter(x => x !== b[0]); else { D.b.push(b[0]); toast('오락실 앞에 “' + b[1] + '” 게임기가 놓였어요!'); showNew(MACH.find(m => m.id === b[0])); } save(); render(); });
  $('games').appendChild(c);
});
const closeModal = () => { $('modal').classList.remove('show'); $('mFrame').src = 'about:blank'; };
$('mClose').addEventListener('click', closeModal);
$('modal').addEventListener('click', e => { if (e.target === $('modal')) closeModal(); });
$('worldBtn').addEventListener('click', () => { location.href = '시작.html?map=1'; });
$('labBtn').addEventListener('click', () => { location.href = '화산섬.html'; });

/* 그리기 반복 */
const clock = new T.Clock(); let time = 0;
function frame() {
  requestAnimationFrame(frame); const dt = Math.min(clock.getDelta(), .05); time += dt;
  if (moving) { const d = tu - cu, sp = (Hgt(turtle.position.x, turtle.position.z) < -.25 ? 16 : Math.max(30, Math.abs(d) * RL * 2.2)) / RL * dt; if (Math.abs(d) <= sp) jump(); else { facing = d > 0 ? 1 : -1; cu += facing * sp; placeTurtle(); } }
  legs.forEach((l, i) => { l.position.z += 0; l.rotation.y = moving ? Math.sin(time * 16 + (i % 3 ? 0 : Math.PI)) * .7 : 0; l.position.y = .25 + (moving ? Math.abs(Math.sin(time * 16 + (i % 3 ? 0 : Math.PI))) * .18 : 0); });
  turtle.position.y += moving ? Math.sin(time * 16) * .0 : 0; ripple.scale.setScalar(1 + (time * 1.2 % 1) * .6); ripple.material.opacity = .8 * (1 - time * 1.2 % 1);
  const wa = water.geometry.attributes.position.array; for (let i = 0; i < wa.length; i += 3) wa[i + 1] = Math.sin(wBase[i] * .12 + time * 1.3) * .22 + Math.cos(wBase[i + 2] * .16 + time * .9) * .18; water.geometry.attributes.position.needsUpdate = true; water.geometry.computeVertexNormals();
  foam.position.z = Math.sin(time * .9) * .7; foam.material.opacity = .65 + Math.sin(time * .9) * .25;
  boats.forEach((b, i) => { b.position.y = -.1 + Math.sin(time * 1.3 + i * 2) * .22; b.rotation.z = Math.sin(time + i) * .05; });
  palms.forEach((p, i) => { p.rotation.z = Math.sin(time * .9 + i) * .05; });
  bulbs.forEach((b, i) => { b.visible = (Math.floor(time * 2.4) + i) % 2 === 0; });
  spinners.forEach(s => { s.rotation.z = time * 2.2; });
  signs.forEach((s, i) => { const k = stT(i) === 'now' ? 1 + (Math.sin(time * 4) * .5 + .5) * .13 : 1; s.ring.scale.setScalar(k); });
  DECOR.concat(MACH).forEach(d => { const tg = d.on ? 1 : 0; if (Math.abs(d.k - tg) > .001) { d.k += (tg - d.k) * Math.min(1, dt * 6); const e = d.k, pop = e < 1 ? e * (1 + Math.sin(e * Math.PI) * .35) : 1; d.g.scale.setScalar(Math.max(.001, pop * d.s)); d.g.visible = d.k > .01; } });
  const nt = $('newtag'); if (newAt && performance.now() < newUntil) { const q = toScreen(newAt, sceneEl.clientWidth, canvas.clientHeight); nt.style.left = q[0] + 'px'; nt.style.top = (q[1] - Math.abs(Math.sin(time * 5)) * 6) + 'px'; nt.classList.add('show'); } else nt.classList.remove('show');
  if (drawing) { drawT += drawTot / 2.4 * dt; if (drawT >= drawTot) { drawT = drawTot; drawing = false; } }
  if (gopin.classList.contains('show') !== arrived()) { gopin.classList.toggle('show', arrived()); placeGo(); }
  paint(); renderer.render(scene, cam);
}
/* 입장: 바다에서 올라와 지금 할 차례까지 걸어오기. 교재에서 돌아올 때(?back=1)는 바로 서 있기 */
const still = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches, back = /[?&]back=1/.test(location.search);
DECOR.concat(MACH).forEach(d => { d.on = d.id ? D.b.includes(d.id) : DECOR.indexOf(d) < D.t; if (d.on) { d.k = 1; d.g.scale.setScalar(d.s); d.g.visible = true; } });
resize(); render();
if (still || back) { cu = tu = stopU[sel]; placeTurtle(); startDraw(sel); } else { cu = 0; placeTurtle(); setTimeout(() => walkTo(stopU[sel], () => startDraw(sel)), 400); }
frame();
})();
</script>
