<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>코딩 탐험 (3D 시안)</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="favicon-180.png">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#bfe3f5;font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#22331b}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font:inherit;cursor:pointer}
.hud{position:fixed;left:0;right:0;top:0;padding:14px 18px;display:flex;align-items:center;gap:12px;pointer-events:none}
.hud>*{pointer-events:auto}
.pill{background:rgba(255,255,255,.92);border-radius:999px;padding:8px 16px;font-weight:800;font-size:15px;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.pill.star{color:#8a6200}
.bar{flex:1;height:14px;background:rgba(255,255,255,.55);border-radius:999px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.1)}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffb347,#ff7a59);border-radius:999px;transition:width .8s}
.hudbtn{border:0}
.card{position:fixed;right:22px;top:50%;transform:translate(120%,-50%);width:min(380px,calc(100vw - 32px));background:rgba(255,253,247,.97);border-radius:24px;padding:22px 22px 20px;box-shadow:0 14px 40px rgba(20,40,10,.28);transition:transform .5s cubic-bezier(.2,.9,.3,1)}
.card.show{transform:translate(0,-50%)}
.tag{display:inline-block;font-size:13px;font-weight:800;border-radius:999px;padding:4px 12px;margin-bottom:10px}
.tag.current{background:#fdeeb9;color:#7a5600}.tag.done{background:#d8f3e4;color:#0f6e56}.tag.soon{background:#e8ebe4;color:#5f665a}
.card h2{font-size:24px;margin:0 0 8px;line-height:1.3}
.card p{font-size:16px;line-height:1.6;margin:0 0 16px;color:#4b5d40}
.col{display:flex;flex-direction:column;gap:9px}
.btn{border:0;border-radius:16px;padding:14px 18px;font-size:17px;font-weight:800;width:100%}
.btn.play{background:#2563eb;color:#fff}
.btn.go{background:#fff;color:#2f6b12;box-shadow:inset 0 0 0 2px #2f6b12}
.btn.ok{background:linear-gradient(90deg,#ff8f5a,#ffb347);color:#fff}
.btn.sub{background:#eef2e8;color:#3d5230}
.btn:hover{filter:brightness(1.06)}
.intro{position:fixed;inset:0;display:flex;align-items:center;justify-content:flex-end;padding:24px 5vw 24px 24px}
@media (max-width:720px){.intro{align-items:flex-end;justify-content:center}}
.intro.hide{display:none}
.panel{width:min(460px,100%);background:rgba(255,253,247,.97);border-radius:26px;padding:24px;box-shadow:0 14px 40px rgba(20,40,10,.3)}
.panel small{color:#e0703f;font-weight:800;font-size:14px}
.panel h1{font-size:30px;margin:4px 0 6px}
.panel p{margin:0 0 14px;color:#4b5d40;font-size:15px;line-height:1.5}
.panel label{display:block;font-size:14px;font-weight:800;margin:12px 0 6px}
.panel input{width:100%;font:inherit;font-size:17px;padding:12px 14px;border-radius:14px;border:2px solid #dfe6d6;outline:0}
.panel input:focus{border-color:#ff9a5a}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw button{width:38px;height:38px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #dfe6d6}
.sw button.on{box-shadow:0 0 0 3px #22331b}
.hs{display:flex;gap:8px;flex-wrap:wrap}
.hs button{border:2px solid #dfe6d6;background:#fff;border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px}
.hs button.on{border-color:#ff8f5a;background:#fff1e8}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:rgba(30,45,22,.94);color:#fff;padding:12px 22px;border-radius:999px;font-size:15px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .25s;z-index:30}
.toast.show{opacity:1}
.modal{position:fixed;inset:0;background:rgba(15,30,10,.62);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal.show{display:flex}
.modal .box{background:#f7fbf1;border-radius:22px;width:min(840px,100%);height:min(690px,100%);display:flex;flex-direction:column;overflow:hidden}
.modal .box.list{height:auto;max-height:100%;width:min(440px,100%);padding:20px;overflow:auto}
.modal .top{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;font-weight:800;font-size:16px;background:#fff}
.modal iframe{flex:1;border:0;width:100%}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:#fff;border-radius:14px;padding:12px 14px;margin-top:8px;font-size:16px;font-weight:700}
.row b{flex:0 0 34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;background:#a9b3a2}
.row.done b{background:#2f9e6e}.row.current b{background:#f5b921;color:#5a3d00}
.row span{flex:1}.row em{font-style:normal;font-size:13px;color:#7b8773}
.row:disabled{opacity:.6;cursor:not-allowed}
.nogl{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:24px;font-size:18px;line-height:1.7;background:#f4f8ec}
@media (max-width:720px){.card{right:16px;top:auto;bottom:16px;transform:translate(0,130%)}.card.show{transform:translate(0,0)}}
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div class="hud" id="hud" style="display:none">
  <span class="pill" id="zone">엔트리 숲</span>
  <div class="bar"><i id="barFill"></i></div>
  <span class="pill" id="who"></span>
  <span class="pill star">★ <span id="stars">0</span></span>
  <button class="pill hudbtn" id="listBtn">전체 길 보기</button>
  <button class="pill hudbtn" id="worldBtn">세계 지도</button>
</div>

<div class="card" id="card">
  <span class="tag" id="cTag"></span>
  <h2 id="cTitle"></h2>
  <p id="cDesc"></p>
  <div class="col" id="cBtns"></div>
</div>

<div class="intro" id="intro">
  <div class="panel">
    <small>코딩 탐험대</small>
    <h1 id="introTitle"></h1>
    <p id="introDesc"></p>
    <label for="nm">탐험가 이름</label>
    <input id="nm" maxlength="8" placeholder="예: 하늘, 번개 코더">
    <label>옷 색</label>
    <div class="sw" id="sw"></div>
    <label>머리 모양</label>
    <div class="hs" id="hs"></div>
    <button class="btn ok" id="startBtn" style="margin-top:18px">탐험 시작</button>
  </div>
</div>

<div class="modal" id="modal"><div class="box">
  <div class="top"><span id="modalTitle"></span><button class="pill hudbtn" id="closeBtn">닫기 ✕</button></div>
  <iframe id="frame" title="미리 해보기"></iframe>
</div></div>

<div class="modal" id="listModal"><div class="box list">
  <div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:20px" id="listTitle"></b><button class="pill hudbtn" id="listClose">닫기 ✕</button></div>
  <div id="rows"></div>
  <button class="row" id="aiRow"><b style="background:#c96f4a">A</b><span>AI 튜터 오두막</span><em>연결 예정</em></button>
  <button class="row" id="cosRow"><b style="background:#7a6bb5">C</b><span>COS 시험의 탑</span><em>연결 예정</em></button>
  <button class="row" id="resetRow"><b style="background:#888">↺</b><span>시안 처음부터 다시 보기</span><em></em></button>
</div></div>

<div class="toast" id="toast"></div>
<div class="nogl" id="nogl">이 컴퓨터에서는 3D 화면을 띄울 수 없어요.<br>같은 폴더의 '모험지도_시안.html'을 열어 주세요.</div>

<script src="lib/three.min.js"></script>
<script>
(() => {
const $ = id => document.getElementById(id);
if (!window.THREE) { $('nogl').style.display = 'flex'; return; }
const T = THREE;

const ZONE = new URLSearchParams(location.search).get('zone') === 'sea' ? 'sea' : 'forest';
const SEA = ZONE === 'sea', PK = SEA ? 'sea' : 'progress', ZNAME = SEA ? '스크래치 바다' : '엔트리 숲';
const MISSIONS = {forest: [
  {title:'달리기 시합', desc:'클릭할 때마다 고양이가 달려요. 강아지보다 먼저 도착해 볼까요?', file:'2_미리해보기/미리해보기_01_달리기시합.html'},
  {title:'바닷속 꽃게잡기', desc:'마우스를 따라 움직이는 꽃게를 만들어요. 쫓아오는 골대를 피해요.', file:'2_미리해보기/미리해보기_02_꽃게잡기.html'},
  {title:'신비한 물약', desc:'물약을 클릭하면 꼬마 마법사가 커지고 작아져요.', file:'2_미리해보기/미리해보기_03_신비한물약.html'},
  {title:'어떤 모자가 어울릴까', desc:'모자를 클릭해서 선생님께 씌워 줘요.', file:'2_미리해보기/미리해보기_04_모자고르기.html'},
  {title:'준비 중', desc:'다음 미션은 아직 준비 중이에요. 곧 새로운 길이 열려요!', soon:true},
  {title:'준비 중', desc:'다음 미션은 아직 준비 중이에요.', soon:true}
],
sea: [
  {title:'뛰는 고양이', desc:'스페이스 키로 고양이를 점프시키고, 클릭하면 달리게 만들어요. 보너스로 토끼도 뛰게 해요.', file:'2_미리해보기/미리해보기_스크래치_01_뛰는고양이.html'},
  {title:'날아다니는 박쥐', desc:'박쥐와 해골이 벽에 닿으면 튕기며 돌아다녀요. 보너스로 바닷속 물고기도 헤엄치게 해요.', file:'2_미리해보기/미리해보기_스크래치_02_날아다니는박쥐.html'},
  {title:'나만의 밴드', desc:'악기를 클릭하면 소리가 나요. 여러 개 만들면 밴드 완성! (샘플 미션)'},
  {title:'점수판 만들기', desc:'변수를 만들어 클릭할 때마다 점수가 올라가게 해요. (샘플 미션)'},
  {title:'준비 중', desc:'다음 미션은 아직 준비 중이에요. 곧 새로운 길이 열려요!', soon:true},
  {title:'준비 중', desc:'다음 미션은 아직 준비 중이에요.', soon:true}
]};
const M = MISSIONS[ZONE];
const REAL = M.filter(m => !m.soon).length;
const ST_U = [0.06, 0.22, 0.38, 0.54, 0.70, 0.86];
const COLORS = ['#ff8a70', '#ffc94d', '#7fd39a', '#6cc4ee', '#8f9df2', '#c79bf2', '#f59ac4', '#f3f1ea'];
const HAIRS = ['짧은 머리', '단발', '묶은 머리', '양갈래'];
const KEY = 'studyhome_new_3d_demo';
let S = {name:'', color:0, hair:0, progress:0, sea:0, started:false, place:'forest'};
try { const v = JSON.parse(localStorage.getItem(KEY)); if (v && typeof v === 'object') S = Object.assign(S, v); } catch (e) {}
S[PK] = Math.max(0, Math.min(REAL, S[PK] | 0)); S.place = ZONE;
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
if (S.started) save();

let rnd = (seed => () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; })(11);
const rr = (a, b) => a + (b - a) * rnd();

let renderer;
try { renderer = new T.WebGLRenderer({canvas: $('gl'), antialias: true}); } catch (e) { $('nogl').style.display = 'flex'; return; }
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = T.PCFSoftShadowMap;
renderer.toneMapping = T.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
const scene = new T.Scene();
scene.fog = new T.Fog(0xdcebd2, 55, 330);
const camera = new T.PerspectiveCamera(50, 1, 0.5, 1200);

const PTS = [[0,6],[5,-10],[-5,-26],[-15,-42],[-6,-58],[9,-72],[10,-90],[-5,-104],[-12,-120],[-2,-136],[10,-148],[8,-160]];
const curve = new T.CatmullRomCurve3(PTS.map(p => new T.Vector3(p[0], 0, p[1])), false, 'catmullrom', 0.5);
const SAMP = curve.getSpacedPoints(360);
const UP = new T.Vector3(0, 1, 0);
const at = u => curve.getPointAt(Math.max(0, Math.min(1, u)));
const tan = u => curve.getTangentAt(Math.max(0, Math.min(1, u))).setY(0).normalize();
const rightOf = t => new T.Vector3().crossVectors(t, UP).normalize();
function pathDist(x, z) { let m = 1e9; for (let i = 0; i < SAMP.length; i++) { const p = SAMP[i], dx = p.x - x, dz = p.z - z, d = dx*dx + dz*dz; if (d < m) m = d; } return Math.sqrt(m); }
const SAMP_R = SAMP.map((p, i) => rightOf(tan(i / (SAMP.length - 1))));
function sideOf(x, z) { let m = 1e9, k = 0; for (let i = 0; i < SAMP.length; i++) { const p = SAMP[i], dx = p.x - x, dz = p.z - z, d = dx*dx + dz*dz; if (d < m) { m = d; k = i; } } const p = SAMP[k], r = SAMP_R[k]; return (x - p.x) * r.x + (z - p.z) * r.z; }
const smooth = (a, b, x) => { const t = Math.max(0, Math.min(1, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
const SEA_Z = -160;
function heightAt(x, z, d) {
  if (d === undefined) d = pathDist(x, z);
  const m = smooth(3.2, 16, d);
  let h = (Math.sin(x * 0.07 + 1.3) * Math.cos(z * 0.055) * 2.6 + Math.sin(x * 0.19 + z * 0.15) * 0.9 + Math.cos(x * 0.03 - z * 0.04) * 2 + 2.2) * m;
  h += smooth(60, 150, Math.abs(x)) * 9;
  if (SEA) { const sd = -sideOf(x, z); h *= 0.6; if (sd > 0) { const k = smooth(6, 22, sd); h = h * (1 - k) - k * 3.4; } }
  if (z < SEA_Z + 6) { const k = smooth(SEA_Z + 6, SEA_Z - 14, z); h = h * (1 - k) - k * 3.2; }
  return h;
}

/* 하늘 */
const skyU = {top: {value: new T.Color()}, bottom: {value: new T.Color()}};
const sky = new T.Mesh(new T.SphereGeometry(900, 24, 16), new T.ShaderMaterial({
  side: T.BackSide, depthWrite: false, fog: false, uniforms: skyU,
  vertexShader: 'varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
  fragmentShader: 'uniform vec3 top; uniform vec3 bottom; varying vec3 vP; void main(){ float h = clamp(normalize(vP).y*1.25+0.12, 0.0, 1.0); gl_FragColor = vec4(mix(bottom, top, pow(h,0.75)), 1.0); }'
}));
scene.add(sky);
const hemi = new T.HemisphereLight(0xcfe9ff, 0x6f8f4a, 1.5); scene.add(hemi);
const sun = new T.DirectionalLight(0xfff1d6, 2.6); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.04;
const sc = sun.shadow.camera; sc.left = -42; sc.right = 42; sc.top = 42; sc.bottom = -42; sc.near = 1; sc.far = 160;
scene.add(sun); scene.add(sun.target);
const sunDisc = new T.Mesh(new T.CircleGeometry(34, 32), new T.MeshBasicMaterial({color: 0xfff6c9, fog: false, transparent: true, opacity: 0.95}));
scene.add(sunDisc);

const tc = new T.Color();
const lam = (c, o) => new T.MeshLambertMaterial(Object.assign({color: c}, o || {}));
const flat = (c, o) => new T.MeshStandardMaterial(Object.assign({color: c, flatShading: true, roughness: 0.95, metalness: 0}, o || {}));

/* 땅 */
(() => {
  const g = new T.PlaneGeometry(360, 380, 150, 160); g.rotateX(-Math.PI / 2); g.translate(0, 0, -110);
  const pos = g.attributes.position, col = new Float32Array(pos.count * 3);
  const c1 = new T.Color('#7cc65a'), c2 = new T.Color('#5faf4c'), c3 = new T.Color('#a5d86a'), sand = new T.Color('#f1dea5'), dirt = new T.Color('#8fbf5e'), c = new T.Color();
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i), d = pathDist(x, z), h = heightAt(x, z, d);
    pos.setY(i, h);
    const n = Math.sin(x * 0.31) * Math.cos(z * 0.27) * 0.5 + 0.5;
    c.copy(c1).lerp(c2, n).lerp(c3, smooth(1, 7, h) * 0.6).lerp(dirt, 1 - smooth(2, 7, d));
    if (SEA) { const sd = sideOf(x, z); c.lerp(tc.set(n > 0.5 ? '#f6e6b4' : '#efd99e'), 1 - smooth(14, 38, sd)); c.lerp(tc.set('#d9c48c'), smooth(0.1, -0.9, h) * 0.8); }
    c.lerp(sand, smooth(SEA_Z + 12, SEA_Z + 1, z));
    col[i*3] = c.r; col[i*3+1] = c.g; col[i*3+2] = c.b;
  }
  g.setAttribute('color', new T.BufferAttribute(col, 3)); g.computeVertexNormals();
  const m = new T.Mesh(g, flat(0xffffff, {vertexColors: true})); m.receiveShadow = true; scene.add(m);
})();

/* 길 */
(() => {
  const n = 320, v = [], idx = [], cl = [], a = new T.Color(SEA ? '#c99b66' : '#ecd49a'), b = new T.Color(SEA ? '#b5834f' : '#dfc282');
  for (let i = 0; i <= n; i++) {
    const u = i / n, p = at(u), r = rightOf(tan(u)), w = 1.75 + Math.sin(i * 0.5) * 0.12;
    v.push(p.x - r.x * w, 0.05, p.z - r.z * w, p.x + r.x * w, 0.05, p.z + r.z * w);
    const k = (i % 2) ? a : b; cl.push(k.r, k.g, k.b, k.r, k.g, k.b);
    if (i < n) { const q = i * 2; idx.push(q, q + 1, q + 2, q + 1, q + 3, q + 2); }
  }
  const g = new T.BufferGeometry(); g.setAttribute('position', new T.Float32BufferAttribute(v, 3)); g.setAttribute('color', new T.Float32BufferAttribute(cl, 3)); g.setIndex(idx); g.computeVertexNormals();
  const m = new T.Mesh(g, new T.MeshLambertMaterial({vertexColors: true, side: T.DoubleSide})); m.receiveShadow = true; scene.add(m);
})();

/* 인스턴스 도우미 */
const dummy = new T.Object3D();
function inst(geo, mat, list, shadow) {
  const m = new T.InstancedMesh(geo, mat, list.length);
  list.forEach((o, i) => {
    dummy.position.set(o.x, o.y, o.z); dummy.rotation.set(o.rx || 0, o.ry || 0, o.rz || 0); dummy.scale.set(o.sx === undefined ? o.s : o.sx, o.sy === undefined ? o.s : o.sy, o.sz === undefined ? o.s : o.sz); dummy.updateMatrix();
    m.setMatrixAt(i, dummy.matrix); if (o.c) m.setColorAt(i, tc.set(o.c));
  });
  m.castShadow = shadow !== false; m.receiveShadow = true; scene.add(m); return m;
}
const KEEP = [];
const clear = (x, z, r) => KEEP.every(k => Math.hypot(k.x - x, k.z - z) > k.r + r);
function scatter(count, minD, maxD, zMin, test) {
  const out = []; let guard = 0;
  while (out.length < count && guard++ < count * 40) {
    let x, z;
    if (rnd() < 0.72) { const u = rnd(), p = at(u), r = rightOf(tan(u)), o = rr(minD, maxD) * (rnd() < 0.5 ? -1 : 1); x = p.x + r.x * o; z = p.z + r.z * o; }
    else { x = rr(-150, 150); z = rr(-150, 60); }
    if (z < zMin) continue;
    const d = pathDist(x, z); if (d < minD) continue;
    if (!clear(x, z, 2)) continue;
    if (test && !test(x, z, d)) continue;
    out.push({x, z, d, y: heightAt(x, z, d)});
  }
  return out;
}

/* 정거장 위치 */

    mk(new T.CapsuleGeometry(leg ? 0.12 : 0.095, leg ? 0.36 : 0.34, 3, 8), leg ? lam('#3f4c6b') : H.cloth, 0, leg ? -0.3 : -0.26, 0, piv);
    if (leg) mk(new T.BoxGeometry(0.2, 0.12, 0.32), dark, 0, -0.58, 0.05, piv); else mk(new T.SphereGeometry(0.1, 8, 6), skin, 0, -0.5, 0, piv);
    H.limbs.push({piv, sign: (i % 2 ? -1 : 1) * (leg ? 1 : -1), amp: leg ? 0.75 : 0.6});
  });
  H.hair = new T.Group(); H.hair.position.set(0, 1.72, 0); hero.add(H.hair);
})();
function styleHero() {
  H.cloth.color.set(COLORS[S.color] || COLORS[0]);
  while (H.hair.children.length) H.hair.remove(H.hair.children[0]);
  const hm = H.hairMat, add = (geo, x, y, z) => { const m = new T.Mesh(geo, hm); m.position.set(x, y, z); m.castShadow = true; H.hair.add(m); return m; };
  add(new T.SphereGeometry(0.37, 16, 10, 0, 6.29, 0, 1.75), 0, 0.03, -0.03);
  if (S.hair === 1) { add(new T.BoxGeometry(0.16, 0.42, 0.5), -0.31, -0.12, -0.05); add(new T.BoxGeometry(0.16, 0.42, 0.5), 0.31, -0.12, -0.05); add(new T.BoxGeometry(0.6, 0.42, 0.16), 0, -0.12, -0.3); }
  if (S.hair === 2) { add(new T.SphereGeometry(0.17, 10, 8), 0, 0.12, -0.42); add(new T.SphereGeometry(0.13, 10, 8), 0, -0.1, -0.5); }
  if (S.hair === 3) { add(new T.SphereGeometry(0.16, 10, 8), -0.4, 0.02, -0.08); add(new T.SphereGeometry(0.16, 10, 8), 0.4, 0.02, -0.08); add(new T.SphereGeometry(0.11, 10, 8), -0.44, -0.22, -0.08); add(new T.SphereGeometry(0.11, 10, 8), 0.44, -0.22, -0.08); }
}

/* 떠다니는 빛, 폭죽 */
const dotTex = (() => { const c = document.createElement('canvas'); c.width = c.height = 32; const x = c.getContext('2d'); x.fillStyle = '#fff'; x.beginPath(); x.arc(16, 16, 14, 0, 6.3); x.fill(); return new T.CanvasTexture(c); })();
const POL = 220, polPos = new Float32Array(POL * 3), polSeed = [];
for (let i = 0; i < POL; i++) { { const a = rr(0, 6.28), d = rr(5, 26); polPos[i*3] = Math.cos(a) * d; polPos[i*3+1] = rr(0.4, 9); polPos[i*3+2] = Math.sin(a) * d; } polSeed.push(rr(0, 6.28)); }
const polGeo = new T.BufferGeometry(); polGeo.setAttribute('position', new T.BufferAttribute(polPos, 3));
const pollen = new T.Points(polGeo, new T.PointsMaterial({color: '#fff7c2', size: 0.13, map: dotTex, transparent: true, opacity: 0.8, depthWrite: false})); scene.add(pollen);
const CN = 160, cPos = new Float32Array(CN * 3), cCol = new Float32Array(CN * 3), cVel = [];
const cGeo = new T.BufferGeometry(); cGeo.setAttribute('position', new T.BufferAttribute(cPos, 3)); cGeo.setAttribute('color', new T.BufferAttribute(cCol, 3));
const confetti = new T.Points(cGeo, new T.PointsMaterial({size: 0.2, map: dotTex, vertexColors: true, transparent: true, depthWrite: false})); confetti.visible = false; confetti.frustumCulled = false; scene.add(confetti);
let cLife = 0;
function burst(p) {
  const pal = ['#ffd23f', '#ff7a59', '#4cc9f0', '#7ae582', '#f72585', '#ffffff'];
  for (let i = 0; i < CN; i++) {
    cPos[i*3] = p.x; cPos[i*3+1] = 1.6; cPos[i*3+2] = p.z;
    const a = rnd() * 6.28, v = 2 + rnd() * 5; cVel[i] = [Math.cos(a) * v, 5 + rnd() * 7, Math.sin(a) * v];
    tc.set(pal[i % pal.length]); cCol[i*3] = tc.r; cCol[i*3+1] = tc.g; cCol[i*3+2] = tc.b;
  }
  cGeo.attributes.color.needsUpdate = true; cLife = 1.9; confetti.visible = true; confetti.material.opacity = 1;
}

/* 하늘빛 변화 */
const SKY = [
  {u: 0.0, top: '#4f9be6', bottom: '#ffe2bd', fog: '#e4eed6', sun: '#fff0d0', si: 2.5, hi: 1.45, dir: [0.55, 0.62, 0.55]},
  {u: 0.45, top: '#2f86e0', bottom: '#cdeaff', fog: '#d3ecf3', sun: '#ffffff', si: 2.9, hi: 1.6, dir: [0.35, 0.85, 0.3]},
  {u: 0.8, top: '#4a78d0', bottom: '#ffd0a0', fog: '#f2d9b8', sun: '#ffd9a0', si: 2.6, hi: 1.35, dir: [-0.45, 0.5, -0.6]},
  {u: 1.0, top: '#5466b8', bottom: '#ffab7a', fog: '#f4c7a0', sun: '#ffb877', si: 2.3, hi: 1.2, dir: [-0.5, 0.3, -0.8]}
];
if (SEA) { SKY[0].fog = '#e3f4f8'; SKY[0].bottom = '#fff1d6'; SKY[1].fog = '#cdeefa'; SKY[1].top = '#2a8ee6'; }
const ca = new T.Color(), cb = new T.Color(), sunDir = new T.Vector3();
function applySky(u) {
  let i = 0; while (i < SKY.length - 2 && u > SKY[i + 1].u) i++;
  const A = SKY[i], B = SKY[i + 1], t = smooth(A.u, B.u, u), mix = k => ca.set(A[k]).lerp(cb.set(B[k]), t);
  skyU.top.value.copy(mix('top')); skyU.bottom.value.copy(mix('bottom')); scene.fog.color.copy(mix('fog')); sun.color.copy(mix('sun'));
  sun.intensity = A.si + (B.si - A.si) * t; hemi.intensity = A.hi + (B.hi - A.hi) * t;
  sunDir.set(A.dir[0] + (B.dir[0] - A.dir[0]) * t, A.dir[1] + (B.dir[1] - A.dir[1]) * t, A.dir[2] + (B.dir[2] - A.dir[2]) * t).normalize();
  sunDisc.material.color.copy(sun.color);
}

/* 진행 상태 */
let mode = 'intro', heroU = ST_U[0], walk = null, atStation = 0, cardOpen = false, paused = false;
const camPos = new T.Vector3(), camLook = new T.Vector3(), tp = new T.Vector3(), tl = new T.Vector3();
let viewShift = window.innerWidth > 720 ? 0.2 : 0, snap = true;
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2200); }
function hud() {
  $('who').textContent = S.name || '탐험가'; $('stars').textContent = S[PK];
  $('barFill').style.width = (S[PK] / REAL * 100) + '%';
  $('zone').textContent = ZNAME + ' · ' + Math.min(S[PK] + 1, REAL) + ' / ' + REAL;
}
function button(cls, text, fn) { const b = document.createElement('button'); b.className = 'btn ' + cls; b.textContent = text; b.addEventListener('click', fn); return b; }
function showCard(k) {
  const m = M[k], st = stateOf(k), box = $('cBtns'); box.innerHTML = '';
  $('cTag').className = 'tag ' + (m.soon ? 'soon' : st); $('cTag').textContent = m.soon ? '준비 중' : (st === 'done' ? '완료한 미션' : '미션 ' + (k + 1));
  $('cTitle').textContent = m.soon ? '여기까지 왔어요!' : m.title; $('cDesc').textContent = m.desc;
  if (!m.soon) {
    if (m.file) box.appendChild(button('play', '▶ 미리 해보기', () => openPreview(k))); else box.appendChild(button('sub', '미리 해보기 준비 중', () => toast('완성 파일을 넣으면 미리 해보기가 열려요.')));
    box.appendChild(button('go', '미션 시작', () => toast('여기에 미션 교재(학습지)가 연결될 예정이에요.')));
    if (st === 'current') box.appendChild(button('ok', '✓ 완료! 다음 걸음', () => complete(k)));
    else box.appendChild(button('sub', '지금 미션으로 돌아가기', () => jump(S[PK])));
  } else box.appendChild(button('sub', '전체 길 보기', openList));
  $('card').classList.add('show'); cardOpen = true;
}
function hideCard() { $('card').classList.remove('show'); cardOpen = false; }
function complete(k) {
  if (mode !== 'stop' || k !== S[PK]) return;
  S[PK]++; save(); hud(); paintSigns(); hideCard(); burst(stations[k].p);
  toast('미션 완료! 별을 하나 얻었어요.');
  setTimeout(() => startWalk(k, k + 1), 900);
}
function startWalk(a, b) { walk = {a: ST_U[a], b: ST_U[b], t: 0, dur: Math.abs(ST_U[b] - ST_U[a]) * curve.getLength() / 5.2, to: b}; mode = 'walk'; }
function arrive(k) { atStation = k; heroU = ST_U[k]; mode = 'stop'; setTimeout(() => { if (mode === 'stop' && atStation === k) showCard(k); }, 500); }
function jump(k) { hideCard(); walk = null; atStation = k; heroU = ST_U[k]; snap = true; mode = 'stop'; showCard(k); closeList(); }
function openPreview(k) { $('modalTitle').textContent = '미리 해보기 · ' + M[k].title; $('frame').src = M[k].file; $('modal').classList.add('show'); paused = true; }
function closePreview() { $('modal').classList.remove('show'); $('frame').src = 'about:blank'; paused = false; }
function openList() {
  const box = $('rows'); box.innerHTML = '';
  M.forEach((m, k) => {
    const st = stateOf(k), b = document.createElement('button'); b.className = 'row ' + st;
    b.innerHTML = '<b></b><span></span><em></em>'; b.children[0].textContent = st === 'done' ? '✓' : (m.soon ? '?' : k + 1);
    b.children[1].textContent = m.title; b.children[2].textContent = m.soon ? '준비 중' : (st === 'done' ? '완료' : st === 'current' ? '지금 여기' : '잠김');
    b.disabled = mode === 'walk' || st === 'locked'; b.addEventListener('click', () => jump(k)); box.appendChild(b);
  });
  $('listModal').classList.add('show');
}
function closeList() { $('listModal').classList.remove('show'); }
$('listBtn').addEventListener('click', openList); $('worldBtn').addEventListener('click', () => { location.href = '시작.html'; }); $('listClose').addEventListener('click', closeList);
$('closeBtn').addEventListener('click', closePreview);
$('modal').addEventListener('click', e => { if (e.target === $('modal')) closePreview(); });
$('listModal').addEventListener('click', e => { if (e.target === $('listModal')) closeList(); });
$('aiRow').addEventListener('click', () => toast('AI 튜터는 곧 연결될 예정이에요.'));
$('cosRow').addEventListener('click', () => toast('COS 시험연습은 곧 연결될 예정이에요.'));
$('resetRow').addEventListener('click', () => { S.progress = 0; S.sea = 0; S.place = 'forest'; S.started = false; save(); location.href = '시작.html'; });

/* 시작 화면 */
COLORS.forEach((c, i) => { const b = document.createElement('button'); b.style.background = c; b.setAttribute('aria-label', '옷 색 ' + (i + 1)); b.addEventListener('click', () => { S.color = i; introUI(); }); $('sw').appendChild(b); });
HAIRS.forEach((h, i) => { const b = document.createElement('button'); b.textContent = h; b.addEventListener('click', () => { S.hair = i; introUI(); }); $('hs').appendChild(b); });
function introUI() { [...$('sw').children].forEach((b, i) => b.classList.toggle('on', i === S.color)); [...$('hs').children].forEach((b, i) => b.classList.toggle('on', i === S.hair)); styleHero(); }
$('nm').value = S.name;
function begin() {
  S.name = $('nm').value.trim() || '탐험가'; S.started = true; save();
  $('intro').classList.add('hide'); $('hud').style.display = 'flex'; hud();
  const k = Math.min(S[PK], M.length - 1); heroU = ST_U[k]; arrive(k);
}
$('startBtn').addEventListener('click', begin);
$('nm').addEventListener('keydown', e => { if (e.key === 'Enter') begin(); });

/* 그리기 */
function resize() { const w = window.innerWidth, h = window.innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
window.addEventListener('resize', resize); resize();
const clock = new T.Clock(); let time = 0;
function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.05); if (paused) return; time += dt;
  let moving = false;
  if (mode === 'walk' && walk) {
    walk.t += dt / walk.dur; const e = Math.min(1, walk.t), k = e < 0.5 ? 2 * e * e : 1 - Math.pow(-2 * e + 2, 2) / 2;
    heroU = walk.a + (walk.b - walk.a) * k; moving = true;
    if (e >= 1) { const to = walk.to; walk = null; arrive(to); }
  }
  const p = at(heroU), t = tan(heroU), r = rightOf(t);
  hero.position.set(p.x, 0.05 + (moving ? Math.abs(Math.sin(time * 9)) * 0.09 : Math.sin(time * 2) * 0.015), p.z);
  const face = mode === 'intro' ? tp.copy(p).addScaledVector(t, 1).addScaledVector(r, 0.25) : (moving ? tp.copy(p).add(t) : tp.copy(p).addScaledVector(t, 0.5).addScaledVector(r, 1));
  const want = Math.atan2(face.x - p.x, face.z - p.z); let dy = want - hero.rotation.y; dy = Math.atan2(Math.sin(dy), Math.cos(dy)); hero.rotation.y += dy * Math.min(1, dt * 7);
  H.limbs.forEach(l => { const target = moving ? Math.sin(time * 9) * l.amp * l.sign : 0; l.piv.rotation.x += (target - l.piv.rotation.x) * Math.min(1, dt * 12); });
  H.body.rotation.z = moving ? Math.sin(time * 9) * 0.05 : 0;

  if (mode === 'intro') { const a = time * 0.3; tp.copy(p).addScaledVector(t, 5.4 + Math.sin(a) * 0.5).addScaledVector(r, 2.2 + Math.cos(a) * 0.7); tp.y = 2.1; tl.copy(p); tl.y = 1.25; }
  else if (moving) { tp.copy(p).addScaledVector(t, -9.5).addScaledVector(r, 1.2); tp.y = 5; tl.copy(p).addScaledVector(t, 6); tl.y = 1.4; }
  else { tp.copy(p).addScaledVector(t, -7.2).addScaledVector(r, 5.2); tp.y = 3.3; tl.copy(p).addScaledVector(t, 1.6).addScaledVector(r, -1.5); tl.y = 1.9; }
  const kf = snap ? 1 : 1 - Math.exp(-dt * 2.4); camPos.lerp(tp, kf); camLook.lerp(tl, kf); snap = false;
  camera.position.copy(camPos); camera.lookAt(camLook);
  const wide = window.innerWidth > 720, shiftT = (cardOpen || mode === 'intro') && wide ? (mode === 'intro' ? 0.2 : 0.17) : 0;
  viewShift += (shiftT - viewShift) * Math.min(1, dt * 3);
  const w = window.innerWidth, h = window.innerHeight;
  if (Math.abs(viewShift) > 0.002) camera.setViewOffset(w, h, w * viewShift, 0, w, h); else camera.clearViewOffset();

  applySky(heroU);
  sun.position.copy(p).addScaledVector(sunDir, 70); sun.target.position.copy(p); sun.target.updateMatrixWorld();
  sunDisc.position.copy(camera.position).addScaledVector(sunDir, 780); sunDisc.lookAt(camera.position);
  sky.position.copy(camera.position);

  stations.forEach(s => {
    const st = stateOf(s.k), pulse = st === 'current' ? 1 + Math.sin(time * 3.2) * 0.1 : 1;
    s.ring.scale.set(pulse, 1, pulse); s.star.rotation.y = time * 1.6; s.star.position.y = 4.3 + Math.sin(time * 2 + s.k) * 0.14;
    s.beam.visible = st === 'current' && mode !== 'intro'; if (s.beam.visible) s.beam.material.opacity = 0.13 + Math.sin(time * 3.2) * 0.05;
  });
  clouds.forEach(c => { c.position.x += c.userData.v * dt; if (c.position.x > 400) c.position.x = -400; });
  const wa = water.geometry.attributes.position.array;
  for (let i = 0; i < wa.length; i += 3) wa[i + 1] = Math.sin(wBase[i] * 0.06 + time * 1.1) * 0.35 + Math.cos(wBase[i + 2] * 0.08 + time * 0.8) * 0.3;
  water.geometry.attributes.position.needsUpdate = true; water.geometry.computeVertexNormals();
  seaBoats.forEach((b, i) => { b.position.y = -0.8 + Math.sin(time * 1.1 + i * 1.7) * 0.16; b.rotation.z = Math.sin(time * 0.9 + i) * 0.06; });
  if (window.__boat) { window.__boat.position.y = -0.75 + Math.sin(time * 1.2) * 0.14; window.__boat.rotation.z = Math.sin(time * 0.9) * 0.05; }
  pollen.position.set(p.x, 0, p.z);
  for (let i = 0; i < POL; i++) { polPos[i*3+1] += Math.sin(time * 0.8 + polSeed[i]) * dt * 0.35; polPos[i*3] += Math.cos(time * 0.5 + polSeed[i]) * dt * 0.3; }
  polGeo.attributes.position.needsUpdate = true;
  if (cLife > 0) {
    cLife -= dt;
    for (let i = 0; i < CN; i++) { const v = cVel[i]; v[1] -= 13 * dt; cPos[i*3] += v[0] * dt; cPos[i*3+1] = Math.max(0.1, cPos[i*3+1] + v[1] * dt); cPos[i*3+2] += v[2] * dt; }
    cGeo.attributes.position.needsUpdate = true; confetti.material.opacity = Math.min(1, cLife * 1.4); if (cLife <= 0) confetti.visible = false;
  }
  renderer.render(scene, camera);
}
$('listTitle').textContent = ZNAME + '의 길'; $('introTitle').textContent = ZNAME + (SEA ? '로 출발!' : '으로 출발!'); $('introDesc').textContent = (SEA ? '바닷길' : '숲길') + '을 걸으며 미션을 하나씩 해결해요. 먼저 탐험가를 만들어 볼까요?'; document.title = ZNAME + ' 탐험';
introUI(); paintSigns(); applySky(heroU);
if (S.started) { $('intro').classList.add('hide'); $('hud').style.display = 'flex'; hud(); const k = Math.min(S[PK], M.length - 1); heroU = ST_U[k]; arrive(k); }
frame();
})();
</script>
