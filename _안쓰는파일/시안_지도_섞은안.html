<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>세계 지도 섞은 안 (체험용 시안)</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="favicon-180.png">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#8fd3f2;font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#22331b}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font:inherit;cursor:pointer}
.hud{position:fixed;left:0;right:0;top:0;padding:14px 18px;display:none;align-items:center;gap:10px;pointer-events:none}
.hud>*{pointer-events:auto}
.logo{font-size:22px;font-weight:900;color:#fff;text-shadow:0 2px 8px rgba(20,60,90,.45);margin-right:auto}
.pill{background:rgba(255,255,255,.93);border:0;border-radius:999px;padding:8px 16px;font-weight:800;font-size:15px;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.pill.star{color:#8a6200}
.pin{position:fixed;left:0;top:0;transform:translate(-50%,-100%);border:0;background:rgba(255,255,255,.95);border-radius:16px;padding:8px 14px 9px;text-align:center;box-shadow:0 4px 14px rgba(10,40,60,.25);display:none;white-space:nowrap}
.pin b{display:block;font-size:16px;font-weight:900}
.pin small{display:block;font-size:12px;font-weight:700;color:#6b7a62;margin-top:1px}
.pin::after{content:"";position:absolute;left:50%;bottom:-8px;width:16px;height:16px;background:inherit;transform:translateX(-50%) rotate(45deg);border-radius:3px;z-index:-1}
.pin:hover,.pin.on{background:#fff7d6}
.pin.here b{color:#d9480f}
.pin.soon{opacity:.82}
.go{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);display:none;border:0;border-radius:999px;padding:18px 34px;font-size:21px;font-weight:900;color:#fff;background:linear-gradient(90deg,#ff7f50,#ffb347);box-shadow:0 10px 26px rgba(200,90,20,.4)}
.go small{display:block;font-size:14px;font-weight:700;opacity:.95;margin-top:2px}
.go:hover{filter:brightness(1.06)}
.card{position:fixed;right:22px;top:50%;transform:translate(120%,-50%);width:min(360px,calc(100vw - 32px));background:rgba(255,253,247,.97);border-radius:24px;padding:22px;box-shadow:0 14px 40px rgba(20,40,10,.28);transition:transform .45s cubic-bezier(.2,.9,.3,1)}
.card.show{transform:translate(0,-50%)}
.tag{display:inline-block;font-size:13px;font-weight:800;border-radius:999px;padding:4px 12px;margin-bottom:10px;background:#fdeeb9;color:#7a5600}
.tag.soon{background:#e8ebe4;color:#5f665a}
.card h2{font-size:24px;margin:0 0 8px}
.card p{font-size:16px;line-height:1.6;margin:0 0 16px;color:#4b5d40}
.col{display:flex;flex-direction:column;gap:9px}
.btn{border:0;border-radius:16px;padding:14px 18px;font-size:17px;font-weight:800;width:100%}
.btn.ok{background:linear-gradient(90deg,#ff8f5a,#ffb347);color:#fff}
.btn.go2{background:#2563eb;color:#fff}
.btn.sub{background:#eef2e8;color:#3d5230}
.btn:hover{filter:brightness(1.06)}
.intro{position:fixed;inset:0;display:flex;align-items:center;justify-content:flex-end;padding:24px 5vw 24px 24px}
.intro.hide{display:none}
.panel{width:min(460px,100%);background:rgba(255,253,247,.97);border-radius:26px;padding:24px;box-shadow:0 14px 40px rgba(20,40,10,.3)}
.panel small{color:#e0703f;font-weight:800;font-size:14px}
.panel h1{font-size:30px;margin:4px 0 6px}
.panel p{margin:0 0 14px;color:#4b5d40;font-size:15px;line-height:1.5}
.panel label{display:block;font-size:14px;font-weight:800;margin:12px 0 6px}
.panel input{width:100%;font:inherit;font-size:17px;padding:12px 14px;border-radius:14px;border:2px solid #dfe6d6;outline:0}
.panel input:focus{border-color:#ff9a5a}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw button{width:38px;height:38px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #dfe6d6}
.sw button.on{box-shadow:0 0 0 3px #22331b}
.hs{display:flex;gap:8px;flex-wrap:wrap}
.hs button{border:2px solid #dfe6d6;background:#fff;border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px}
.hs button.on{border-color:#ff8f5a;background:#fff1e8}
.err{color:#c92a2a;font-size:14px;font-weight:700;margin-top:6px;min-height:20px}
.fade{position:fixed;inset:0;background:#eef8f2;opacity:0;pointer-events:none;transition:opacity .6s;z-index:40}
.fade.on{opacity:1}
.toast{position:fixed;left:50%;top:76px;transform:translateX(-50%);background:rgba(30,45,22,.94);color:#fff;padding:12px 22px;border-radius:999px;font-size:15px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .25s;z-index:30}
.toast.show{opacity:1}
.nogl{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:24px;font-size:18px;line-height:1.7;background:#f4f8ec}
@media (max-width:720px){.intro{align-items:flex-end;justify-content:center}.card{right:16px;top:auto;bottom:16px;transform:translate(0,130%)}.card.show{transform:translate(0,0)}.logo{font-size:18px}}

/* 말풍선 스타일 시안 */
.pin i{display:none;font-style:normal}
body[data-ps="1"] .pin{background:none;box-shadow:none;padding:0;display:none;flex-direction:column;align-items:center}
body[data-ps="1"] .pin::after{display:none}
body[data-ps="1"] .pin i{display:grid;place-items:center;order:-1;width:54px;height:54px;border-radius:50%;background:var(--c);border:4px solid #fff;font-size:27px;box-shadow:0 5px 14px rgba(10,40,60,.35);transition:transform .15s}
body[data-ps="1"] .pin:hover i,body[data-ps="1"] .pin.on i{transform:scale(1.15)}
body[data-ps="1"] .pin b{font-size:13px;background:rgba(255,255,255,.96);border-radius:999px;padding:2px 10px;margin-top:5px;box-shadow:0 2px 6px rgba(10,40,60,.2)}
body[data-ps="1"] .pin small{display:none;background:var(--c);color:#fff;border-radius:999px;padding:1px 9px;margin-top:3px}
body[data-ps="1"] .pin:hover small,body[data-ps="1"] .pin.on small,body[data-ps="1"] .pin.here small{display:block}
body[data-ps="1"] .pin.here i{animation:pinBob 1.2s ease-in-out infinite}
body[data-ps="2"] .pin{background:linear-gradient(#c08a58,#a8754a);border:3px solid #7c5433;border-radius:9px;padding:7px 14px 8px 30px;box-shadow:0 5px 0 #5f3f25,0 9px 14px rgba(10,40,60,.3)}
body[data-ps="2"] .pin b{color:#fff8e7;text-shadow:0 1px 0 #5f3f25}
body[data-ps="2"] .pin small{color:#ffe3b8}
body[data-ps="2"] .pin::after{bottom:-21px;width:9px;height:17px;background:#7c5433;transform:translateX(-50%);border-radius:0 0 3px 3px}
body[data-ps="2"] .pin i{display:block;position:absolute;left:-15px;top:50%;transform:translateY(-50%);font-size:30px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
body[data-ps="2"] .pin:hover,body[data-ps="2"] .pin.on{background:linear-gradient(#d39a64,#b98252)}
body[data-ps="2"] .pin.here b{color:#ffe066}
body[data-ps="3"] .pin{display:none;grid-template-columns:auto auto;column-gap:9px;align-items:center;text-align:left;border-radius:14px;padding:7px 14px 7px 8px;border-bottom:4px solid var(--c)}
body[data-ps="3"] .pin i{display:grid;place-items:center;grid-row:1/3;grid-column:1;width:38px;height:38px;border-radius:11px;background:var(--c);font-size:21px}
body[data-ps="3"] .pin b,body[data-ps="3"] .pin small{grid-column:2}
body[data-ps="3"] .pin small{color:var(--c);filter:brightness(.8)}
body[data-ps="3"] .pin::after{background:var(--c);bottom:-10px}
body[data-ps="3"] .pin.here{animation:pinBob 1.2s ease-in-out infinite;box-shadow:0 0 0 4px #ffd23f,0 6px 16px rgba(10,40,60,.3)}
body[data-ps="4"] .pin{background:none;box-shadow:none;padding:0;display:none;flex-direction:column;align-items:center}
body[data-ps="4"] .pin i{display:grid;place-items:center;order:-1;width:54px;height:54px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#d9a56e,#a8754a);border:4px solid #7c5433;font-size:27px;box-shadow:0 4px 0 #5f3f25,0 8px 14px rgba(10,40,60,.35);transition:transform .15s}
body[data-ps="4"] .pin:hover i,body[data-ps="4"] .pin.on i{transform:scale(1.15)}
body[data-ps="4"] .pin b{font-size:13px;color:#fff8e7;text-shadow:0 1px 0 #5f3f25;background:linear-gradient(#c08a58,#a8754a);border:2px solid #7c5433;border-radius:7px;padding:2px 10px;margin-top:7px;box-shadow:0 3px 0 #5f3f25}
body[data-ps="4"] .pin small{display:none;color:#fff8e7;background:#7c5433;border-radius:0 0 7px 7px;padding:2px 9px 3px;margin-top:3px}
body[data-ps="4"] .pin:hover small,body[data-ps="4"] .pin.on small,body[data-ps="4"] .pin.here small{display:block}
body[data-ps="4"] .pin::after{display:none}
body[data-ps="4"] .pin.here i{border-color:#ffd23f;animation:pinBob 1.2s ease-in-out infinite}
body[data-ps="4"] .pin.here b{color:#ffe066}
@keyframes pinBob{0%,100%{translate:0 0}50%{translate:0 -6px}}
.psbar{position:fixed;left:14px;bottom:14px;z-index:60;background:rgba(20,28,40,.88);color:#fff;font:600 13px/1.4 sans-serif;padding:8px 12px;border-radius:14px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;max-width:calc(100vw - 28px)}
.psbar button{border:0;border-radius:999px;padding:5px 11px;font:700 13px sans-serif;background:#3a4558;color:#fff;cursor:pointer}
.psbar button.on{background:#ffd23f;color:#222}
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div class="hud" id="hud">
  <span class="logo">코딩 탐험대</span>
  <span class="pill" id="who"></span>
  <span class="pill star">★ <span id="stars">0</span></span>
  <button class="pill" id="editBtn">탐험가 바꾸기</button>
</div>
<div id="pins"></div>
<button class="go" id="goBtn">▶ 이어서 탐험하기<small id="goSub"></small></button>

<div class="card" id="card">
  <span class="tag" id="cTag"></span>
  <h2 id="cTitle"></h2>
  <p id="cDesc"></p>
  <div class="col" id="cBtns"></div>
</div>

<div class="intro" id="intro">
  <div class="panel">
    <small>코딩 탐험대</small>
    <h1 id="iTitle">탐험을 시작해요!</h1>
    <p id="iDesc">이름을 쓰고 나만의 탐험가를 만들어 보세요.</p>
    <label for="nm">탐험가 이름</label>
    <input id="nm" maxlength="8" placeholder="예: 하늘, 번개 코더">
    <div class="err" id="err"></div>
    <label>옷 색</label>
    <div class="sw" id="sw"></div>
    <label>머리 모양</label>
    <div class="hs" id="hs"></div>
    <button class="btn ok" id="startBtn" style="margin-top:18px">세계 지도로 가기</button>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="fade" id="fade"></div>
<div class="nogl" id="nogl">이 컴퓨터에서는 3D 화면을 띄울 수 없어요.<br>같은 폴더의 '모험지도_시안.html'을 열어 주세요.</div>

<script src="lib/three.min.js"></script>
<script>
(() => {
const $ = id => document.getElementById(id);
if (!window.THREE) { $('nogl').style.display = 'flex'; return; }
const T = THREE;
const REAL = 4, FOREST = '탐험_3D_시안.html';
const COLORS = ['#ff8a70', '#ffc94d', '#7fd39a', '#6cc4ee', '#8f9df2', '#c79bf2', '#f59ac4', '#f3f1ea'];
const HAIRS = ['짧은 머리', '단발', '묶은 머리', '양갈래'];
const KEY = 'studyhome_new_3d_demo';
let S = {name:'', color:0, hair:0, progress:0, sea:0, started:false, place:'forest'};
try { const v = JSON.parse(localStorage.getItem(KEY)); if (v && typeof v === 'object') S = Object.assign(S, v); } catch (e) {}
S.progress = Math.max(0, Math.min(REAL, S.progress | 0)); S.sea = Math.max(0, Math.min(REAL, S.sea | 0)); if (S.place !== 'sea' && S.place !== 'volcano') S.place = 'forest'; if (!S.py || typeof S.py !== 'object') S.py = {}; S.py.g = S.py.g | 0; S.py.t = S.py.t | 0; if (!Array.isArray(S.py.b)) S.py.b = [];
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

let rnd = (seed => () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; })(23);
const rr = (a, b) => a + (b - a) * rnd();
const smooth = (a, b, x) => { const t = Math.max(0, Math.min(1, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
const gauss = (x, z, cx, cz, r) => Math.exp(-((x - cx) * (x - cx) + (z - cz) * (z - cz)) / (r * r));

let renderer;
try { renderer = new T.WebGLRenderer({canvas: $('gl'), antialias: true}); } catch (e) { $('nogl').style.display = 'flex'; return; }
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = T.PCFSoftShadowMap;
renderer.toneMapping = T.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
const scene = new T.Scene(); scene.fog = new T.Fog(0xcfeaf7, 260, 900);
const camera = new T.PerspectiveCamera(40, 1, 1, 2500);

const sky = new T.Mesh(new T.SphereGeometry(1800, 24, 16), new T.ShaderMaterial({
  side: T.BackSide, depthWrite: false, fog: false,
  uniforms: {top: {value: new T.Color('#3f8fe4')}, bottom: {value: new T.Color('#e6f6ff')}},
  vertexShader: 'varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
  fragmentShader: 'uniform vec3 top; uniform vec3 bottom; varying vec3 vP; void main(){ float h = clamp(normalize(vP).y*1.4+0.2, 0.0, 1.0); gl_FragColor = vec4(mix(bottom, top, pow(h,0.8)), 1.0); }'
}));
scene.add(sky);
scene.add(new T.HemisphereLight(0xd8efff, 0x7fa860, 1.55));
const sun = new T.DirectionalLight(0xfff3da, 2.7); sun.position.set(110, 170, 90); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -0.0005; sun.shadow.normalBias = 0.3;
const sc = sun.shadow.camera; sc.left = -190; sc.right = 190; sc.top = 150; sc.bottom = -150; sc.near = 10; sc.far = 520;
scene.add(sun);

const lam = (c, o) => new T.MeshLambertMaterial(Object.assign({color: c}, o || {}));
const flat = (c, o) => new T.MeshStandardMaterial(Object.assign({color: c, flatShading: true, roughness: 0.95, metalness: 0}, o || {}));
const dummy = new T.Object3D(), tc = new T.Color();
function inst(geo, mat, list, shadow) {
  const m = new T.InstancedMesh(geo, mat, list.length);
  list.forEach((o, i) => { dummy.position.set(o.x, o.y, o.z); dummy.rotation.set(0, o.ry || 0, 0); dummy.scale.set(o.sx === undefined ? o.s : o.sx, o.sy === undefined ? o.s : o.sy, o.sz === undefined ? o.s : o.sz); dummy.updateMatrix(); m.setMatrixAt(i, dummy.matrix); if (o.c) m.setColorAt(i, tc.set(o.c)); });
  m.castShadow = shadow !== false; m.receiveShadow = true; scene.add(m); return m;
}

/* 장소 */
const P = {forest: [-52, 6], tower: [6, -40], cabin: [2, 26], sea: [78, 16], volcano: [118, -92], teacher: [-30, 58], maker: [50, -20], isle: [-134, -62]};
const ISLETS = [[-134, -62, 26]];
let PIN_DISPLAY = 'block';
const HOME = [30, 46];
const PATH = [[-92, 30], [-78, 16], [-62, 22], [-50, 8], [-36, 14], [-24, 2], [-10, 10], [2, 20]];
const curve = new T.CatmullRomCurve3(PATH.map(p => new T.Vector3(p[0], 0, p[1])));
const SAMP = curve.getSpacedPoints(120);
function pathDist(x, z) { let m = 1e9; for (const p of SAMP) { const d = (p.x - x) * (p.x - x) + (p.z - z) * (p.z - z); if (d < m) m = d; } return Math.sqrt(m); }
function landMask(x, z) {
  const a = Math.atan2(z, x), r = Math.hypot(x / 112, z / 76) / (1 + 0.1 * Math.sin(3 * a + 1) + 0.06 * Math.sin(7 * a + 2));
  let m = 1 - smooth(0.78, 1.02, r);
  m *= 1 - gauss(x, z, 96, 18, 26) * 0.95;
  return m;
}
function heightAt(x, z) {
  const m = landMask(x, z), pd = pathDist(x, z), flatK = smooth(2.5, 12, pd);
  let h = (Math.sin(x * 0.09 + 1) * Math.cos(z * 0.08) * 1.6 + Math.sin(x * 0.2 + z * 0.17) * 0.6 + 2) * flatK + 1.6;
  h += gauss(x, z, P.tower[0], P.tower[1], 20) * 13 * smooth(0, 9, Math.hypot(x - P.tower[0], z - P.tower[1])) + gauss(x, z, P.tower[0], P.tower[1], 9) * 9;
  h += gauss(x, z, -62, -42, 26) * 20 + gauss(x, z, -30, -52, 18) * 15 + gauss(x, z, -88, -22, 16) * 12;
  let y = h * smooth(0.0, 0.5, m) - (1 - smooth(0.0, 0.35, m)) * 5;
  const vd = Math.hypot(x - P.volcano[0], z - P.volcano[1]);
  y = Math.max(y, 42 * Math.max(0, 1 - vd / 40) + (vd < 46 ? 2.2 * smooth(46, 36, vd) - 1 : -5));
  const td = Math.hypot(x - P.teacher[0], z - (P.teacher[1] + 22));
  y = Math.max(y, 3.2 * smooth(13, 5, td) - 1.2);
  for (const il of ISLETS) y = Math.max(y, 5.2 * smooth(il[2], il[2] * 0.45, Math.hypot(x - il[0], z - il[1])) - 1.2);
  return y;
}
(() => {
  const g = new T.PlaneGeometry(420, 320, 210, 160); g.rotateX(-Math.PI / 2); g.translate(15, 0, -10);
  const pos = g.attributes.position, col = new Float32Array(pos.count * 3), c = new T.Color();
  const sand = new T.Color('#f3e2aa'), g1 = new T.Color('#86cf5c'), g2 = new T.Color('#62b34e'), rock = new T.Color('#9a8f86'), snow = new T.Color('#ffffff'), lava = new T.Color('#7a4a3a'), deep = new T.Color('#4a9a48');
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i), y = heightAt(x, z); pos.setY(i, y);
    const n = Math.sin(x * 0.3) * Math.cos(z * 0.27) * 0.5 + 0.5;
    c.copy(g1).lerp(g2, n).lerp(deep, gauss(x, z, P.forest[0], P.forest[1], 44) * 0.5);
    c.lerp(rock, smooth(10, 16, y)).lerp(snow, smooth(17, 21, y));
    const vd = Math.hypot(x - P.volcano[0], z - P.volcano[1]);
    if (vd < 46) c.copy(sand).lerp(lava, smooth(1.5, 9, y)).lerp(new T.Color('#ff6a2b'), smooth(35, 41, y));
    else c.lerp(sand, 1 - smooth(0.9, 2.3, y));
    col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b;
  }
  g.setAttribute('color', new T.BufferAttribute(col, 3)); g.computeVertexNormals();
  const m = new T.Mesh(g, flat(0xffffff, {vertexColors: true})); m.receiveShadow = true; scene.add(m);
})();
const water = new T.Mesh(new T.PlaneGeometry(900, 760, 60, 50).rotateX(-Math.PI / 2), new T.MeshStandardMaterial({color: '#2fb4e8', flatShading: true, roughness: 0.3, metalness: 0.1, transparent: true, opacity: 0.92}));
scene.add(water);
const far = new T.Mesh(new T.PlaneGeometry(4000, 4000).rotateX(-Math.PI / 2), new T.MeshLambertMaterial({color: '#39b3e3'})); far.position.y = -0.9; scene.add(far); const wBase = water.geometry.attributes.position.array.slice();

/* 숲길 */
(() => {
  const n = 140, v = [], idx = [];
  for (let i = 0; i <= n; i++) { const u = i / n, p = curve.getPointAt(u), t = curve.getTangentAt(u), rx = -t.z, rz = t.x, w = 2.5, y = heightAt(p.x, p.z) + 0.3; v.push(p.x - rx * w, y, p.z - rz * w, p.x + rx * w, y, p.z + rz * w); if (i < n) { const q = i * 2; idx.push(q, q + 2, q + 1, q + 1, q + 2, q + 3); } }
  const g = new T.BufferGeometry(); g.setAttribute('position', new T.Float32BufferAttribute(v, 3)); g.setIndex(idx); g.computeVertexNormals();
  const m = new T.Mesh(g, new T.MeshLambertMaterial({color: '#ecd49a', side: T.DoubleSide})); m.receiveShadow = true; scene.add(m);
})();

  flags.forEach((f, k) => f.material.color.set(k >= REAL ? '#a9b3a2' : k < S.progress ? '#2f9e6e' : k === S.progress ? '#f5b921' : '#a9b3a2'));
}

/* 화면 상태 */
let mode = 'intro', selected = null, leaving = false, time = 0, snap = true, viewShift = window.innerWidth > 720 ? 0.2 : 0;
const camPos = new T.Vector3(), camLook = new T.Vector3(), tp = new T.Vector3(), tl = new T.Vector3(), tmp = new T.Vector3();
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2400); }
function hud() {
  $('who').textContent = S.name; $('stars').textContent = S.progress + S.sea + S.py.g + S.py.t + S.py.b.length;
  const zn = S.place === 'sea' ? '스크래치 바다' : '엔트리 숲', zp = S.place === 'sea' ? S.sea : S.progress;
  $('goSub').textContent = S.place === 'volcano' ? '파이썬 화산섬 · 스킬 트리' : (zp >= REAL ? zn + ' · 다음 미션 준비 중' : zn + ' · 미션 ' + (zp + 1));
  pinText();
}
function button(cls, text, fn) { const b = document.createElement('button'); b.className = 'btn ' + cls; b.textContent = text; b.addEventListener('click', fn); return b; }
/* 스크래치 시험 연습 주소 — 시험은 2.0으로 보므로 기본은 v2.
   유사시 3.0으로 바꾸려면 아래 SCRATCH_EXAM_USE 를 'v3' 로 고치면 됩니다. */
const SCRATCH_EXAM = {
  v2: 'https://kssim00.github.io/coden_edu/cos_scratch2_lab/index.html',
  v3: 'https://kssim00.github.io/coden_edu/cos_scratch_lab/index.html'
};
const SCRATCH_EXAM_USE = 'v2';
const INFO = {
  forest: {desc: () => '숲길을 걸으며 엔트리 미션을 하나씩 해결해요. 지금까지 미션 ' + S.progress + '개를 끝냈어요.', btns: () => [button('ok', '숲으로 들어가기', () => enter('forest'))]},
  tower: {desc: () => 'COS 자격시험을 실제처럼 연습하는 곳이에요.', btns: () => [button('go2', '엔트리 시험 연습', () => window.open('https://kssim00.github.io/coden_edu/cos_entry_lab/index.html', '_blank')), button('go2', '스크래치 시험 연습', () => window.open(SCRATCH_EXAM[SCRATCH_EXAM_USE], '_blank'))]},
  cabin: {desc: () => 'COS Pro 문제를 AI 튜터와 함께 풀고, 실전 모의시험도 볼 수 있어요.', btns: () => [button('ok', '오두막으로 들어가기', () => enter('cabin'))]},
  sea: {desc: () => '바닷가를 걸으며 스크래치 미션을 해결해요. 지금까지 미션 ' + S.sea + '개를 끝냈어요.', btns: () => [button('ok', '바다로 들어가기', () => enter('sea'))]},
  volcano: {desc: () => '화산섬 속 연구소에서 파이썬을 배워요. 문법 트랙과 터틀 트랙, 두 갈래의 스킬 트리에 실전 프로젝트(Ursina 3D 게임) 트랙이 더해질 자리예요.', btns: () => [button('ok', '연구소로 들어가기', () => enter('volcano')), button('go2', '실전 프로젝트 교재 열기', openBook('python_ursina.html'))]},
  maker: {desc: () => '무언가를 직접 만들어 내는 마을이에요. 보라색 연구소에서는 앱인벤터로 앱을, 주황 지붕 공방에서는 틴커캐드로 3D 작품을 만들어요.', btns: () => [button('ok', '앱인벤터 교실 열기', openBook('앱인벤터_웹교재.html')), button('ok', '3D 모델링 교재 열기', openBook('틴커캐드_웹교재.html'))]},
  isle: {desc: () => '바다 건너 숨겨진 섬이에요. 마인크래프트를 파이썬으로 움직이고, 로블록스 점프맵을 직접 만들어요.', btns: () => [button('go2', '마인크래프트 파이썬', openBook('마인크래프트_파이썬_코딩_학습지.html')), button('go2', '로블록스 점프맵 · 기초', openBook('로블록스_점프맵_기초.html')), button('go2', '로블록스 점프맵 · 타워형', openBook('로블록스_점프맵_타워형.html')), button('go2', '로블록스 점프맵 · 구조물 꾸미기', openBook('로블록스_점프맵_구조물꾸미기.html'))]},
  teacher: {desc: () => '원장님 전용 공간이에요. 수업자료와 자주 쓰는 링크가 들어갈 자리예요.', btns: () => []}
};
function select(id) {
  if (leaving || mode !== 'map') return;
  if (selected === id) { closeCard(); return; }
  selected = id; const pl = PLACES.find(p => p.id === id), info = INFO[id], box = $('cBtns');
  PLACES.forEach(p => p.el.classList.toggle('on', p.id === id));
  $('cTag').className = 'tag' + (pl.soon || !info.btns().length ? ' soon' : ''); $('cTag').textContent = pl.soon ? '준비 중' : (info.btns().length ? '들어갈 수 있어요' : '연결 예정');
  $('cTitle').textContent = pl.name; $('cDesc').textContent = info.desc();
  box.innerHTML = ''; info.btns().forEach(b => box.appendChild(b)); box.appendChild(button('sub', '지도로 돌아가기', closeCard));
  $('card').classList.add('show'); $('goBtn').style.display = 'none';
}
function closeCard() { selected = null; PLACES.forEach(p => p.el.classList.remove('on')); $('card').classList.remove('show'); if (mode === 'map') $('goBtn').style.display = 'block'; }
function enter(zone) {
  if (leaving) return; leaving = true; selected = zone; $('card').classList.remove('show'); $('goBtn').style.display = 'none';
  setTimeout(() => $('fade').classList.add('on'), 700); setTimeout(() => { location.href = zone === 'cabin' ? '오두막.html' : zone === 'volcano' ? '화산섬.html' : FOREST + (zone === 'sea' ? '?zone=sea' : ''); }, 1350);
}
$('goBtn').addEventListener('click', () => enter(S.place));

/* 입장 화면 */
COLORS.forEach((c, i) => { const b = document.createElement('button'); b.style.background = c; b.setAttribute('aria-label', '옷 색 ' + (i + 1)); b.addEventListener('click', () => { S.color = i; introUI(); }); $('sw').appendChild(b); });
HAIRS.forEach((h, i) => { const b = document.createElement('button'); b.textContent = h; b.addEventListener('click', () => { S.hair = i; introUI(); }); $('hs').appendChild(b); });
function introUI() { [...$('sw').children].forEach((b, i) => b.classList.toggle('on', i === S.color)); [...$('hs').children].forEach((b, i) => b.classList.toggle('on', i === S.hair)); styleHero(); }
function showIntro(edit) {
  closeCard(); mode = 'intro'; placeHero(); snap = true; $('intro').classList.remove('hide'); $('hud').style.display = 'none'; $('goBtn').style.display = 'none';
  $('iTitle').textContent = edit ? '탐험가 바꾸기' : (S.started ? S.name + ', 다시 왔구나!' : '탐험을 시작해요!');
  $('iDesc').textContent = edit ? '이름과 모습을 바꿀 수 있어요.' : (S.started ? '이름을 확인하고 세계 지도로 가요.' : '이름을 쓰고 나만의 탐험가를 만들어 보세요.');
  $('nm').value = S.name; $('err').textContent = '';
}
function begin() {
  const name = $('nm').value.trim();
  if (!name) { $('err').textContent = '이름을 먼저 써 주세요.'; $('nm').focus(); return; }
  S.name = name; S.started = true; save();
  $('intro').classList.add('hide'); $('hud').style.display = 'flex'; $('goBtn').style.display = 'block'; mode = 'map'; placeHero(); hud();
}
$('startBtn').addEventListener('click', begin);
$('nm').addEventListener('input', () => { $('err').textContent = ''; });
$('nm').addEventListener('keydown', e => { if (e.key === 'Enter') begin(); });
$('editBtn').addEventListener('click', () => showIntro(true));

function resize() { const w = window.innerWidth, h = window.innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
window.addEventListener('resize', resize); resize();
const clock = new T.Clock();
function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.05); time += dt;
  const hp = hero.position, w = window.innerWidth, h = window.innerHeight, wide = w > 720;
  if (mode === 'intro') { const a = time * 0.3; tp.set(hp.x + 6 + Math.cos(a) * 2, hp.y + 9, hp.z + 30 + Math.sin(a) * 2); tl.set(hp.x, hp.y + 6, hp.z); hero.rotation.y = 0.2; }
  else {
    const k = Math.max(1, 1.55 / camera.aspect), sway = Math.sin(time * 0.16) * 0.09;
    let fx = 14, fz = -16, dist = 275 * k, hgt = 158 * k;
    if (selected) { const pl = PLACES.find(p => p.id === selected); fx = pl.focus[0]; fz = pl.focus[1]; dist = leaving ? 60 : 150 * k; hgt = leaving ? 34 : 86 * k; }
    tp.set(fx + Math.sin(sway) * dist, hgt, fz + Math.cos(sway) * dist); tl.set(fx, selected ? 6 : 0, fz);
    tmp.set(camera.position.x, hp.y, camera.position.z); hero.rotation.y = Math.atan2(tmp.x - hp.x, tmp.z - hp.z);
  }
  const kf = snap ? 1 : 1 - Math.exp(-dt * (leaving ? 2.2 : 2.6)); camPos.lerp(tp, kf); camLook.lerp(tl, kf); snap = false;
  camera.position.copy(camPos); camera.lookAt(camLook);
  const shiftT = wide && (mode === 'intro' || (selected && !leaving)) ? (mode === 'intro' ? 0.2 : 0.14) : 0;
  viewShift += (shiftT - viewShift) * Math.min(1, dt * 3);
  if (Math.abs(viewShift) > 0.002) camera.setViewOffset(w, h, w * viewShift, 0, w, h); else camera.clearViewOffset();
  camera.updateMatrixWorld(); sky.position.copy(camera.position);

  H.arms.forEach((a, i) => { a.rotation.x = Math.sin(time * 2 + i) * 0.08; });
  marker.visible = mode === 'map'; marker.position.set(hp.x, hp.y + HS * 2.25 + 4 + Math.sin(time * 3) * 1.2, hp.z); marker.rotation.y = time * 2;
  PLACES.forEach(pl => {
    if (mode !== 'map' || leaving) { pl.el.style.display = 'none'; return; }
    tmp.copy(pl.v).project(camera);
    if (tmp.z > 1 || tmp.x < -1.05 || tmp.x > 1.05) { pl.el.style.display = 'none'; return; }
    pl.el.style.display = PIN_DISPLAY; pl.el.style.left = ((tmp.x * 0.5 + 0.5) * w) + 'px'; pl.el.style.top = ((-tmp.y * 0.5 + 0.5) * h - 10) + 'px';
  });
  const wa = water.geometry.attributes.position.array;
  for (let i = 0; i < wa.length; i += 3) wa[i + 1] = Math.sin(wBase[i] * 0.05 + time * 1.1) * 0.5 + Math.cos(wBase[i + 2] * 0.06 + time * 0.8) * 0.4;
  water.geometry.attributes.position.needsUpdate = true; water.geometry.computeVertexNormals();
  boats.forEach((b, i) => { b.position.y = 0.3 + Math.sin(time * 1.2 + i) * 0.3; b.rotation.z = Math.sin(time * 0.9 + i) * 0.06; });
  smoke.forEach(s => { const t = (s.userData.t + time * 0.07) % 1; s.position.set(P.volcano[0] + t * 22, 44 + t * 46, P.volcano[1] + t * 6); s.scale.setScalar(0.6 + t * 1.9); s.material.opacity = 0.9 * (1 - t); });
  clouds.forEach(c => { c.position.x += c.userData.v * dt; if (c.position.x > 340) c.position.x = -340; });
  renderer.render(scene, camera);
}

(() => {
  const ICON = {forest: '🌲', tower: '🏰', cabin: '🏠', sea: '⛵', volcano: '🌋', teacher: '🗼', maker: '🛠️', isle: '🏝️'};
  const COL = {forest: '#2f9e6e', tower: '#6e5fb0', cabin: '#c74a3c', sea: '#3f8fe4', volcano: '#f97316', teacher: '#64748b', maker: '#8b5cf6', isle: '#be4bdb'};
  PLACES.forEach(pl => { const i = document.createElement('i'); i.textContent = ICON[pl.id] || '📍'; pl.el.appendChild(i); pl.el.style.setProperty('--c', COL[pl.id] || '#2f9e6e'); });
  const bar = document.createElement('div'); bar.className = 'psbar'; bar.innerHTML = '<span>체험용 시안 · 섞은 안 │ 말풍선:</span>';
  ['지금 모양', '① 아이콘 배지', '② 나무 표지판', '③ 색깔 이름표', '④ 나무 배지 (①+②)'].forEach((n, k) => { const b = document.createElement('button'); b.textContent = n; b.onclick = () => set(k); bar.appendChild(b); });
  function set(k) { document.body.dataset.ps = k; [...bar.querySelectorAll('button')].forEach((b, i) => b.classList.toggle('on', i === k)); const d = k === 1 || k === 4 ? 'flex' : k === 3 ? 'grid' : 'block'; PIN_DISPLAY = d; }
  document.body.appendChild(bar); set(0);
})();
introUI(); pinText(); showIntro(false);
frame();
})();
</script>
